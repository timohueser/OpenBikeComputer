# OBC weather bakery — the cadence table.
#
# ONE source of truth for "how often does the bakery run". `install.sh` generates one systemd
# timer per line (`obc-wx-bake@<name>.timer`, all firing the shared `obc-wx-bake@.service`
# template), and the runbook's cost table is computed from these rows.
#
# **One row, because the bakery publishes one dataset** (#1246). It used to be one row per
# adapter, on purpose: the baker published four independently selectable products, so a per-adapter
# timer meant one broken upstream cost exactly its own product's freshness while every other
# product was carried forward untouched. That arrangement is gone with the products. The mosaic
# needs every source's cells to paint a lattice cell, so there is nothing to isolate: a cycle
# either publishes a complete dataset or publishes nothing and leaves the previous generation
# standing, which is a whole-cycle property and not a per-source one.
#
# Columns are whitespace-separated:
#
#   name      the `obc-wx-bake <name>` subcommand. install.sh probes the installed binary and
#             skips (and disables) any row it does not know.
#   oncalendar  systemd OnCalendar= expression (see `systemd.time(7)`, `systemd-analyze calendar`).
#   delay     RandomizedDelaySec= — keeps every instance off the exact minute boundary, which is
#             both politeness to the upstream and how a poll avoids racing the publisher that is
#             still writing the run.
#   runs/day  how often a **new generation** is published — documentation, and a restatement of
#             the oncalendar column for a reader who does not want to expand a systemd calendar
#             expression in their head. **Nothing computes from it any more** (WXR8 #1247):
#             freshness_probe.py used to multiply it by the published set size to project a rolling
#             24 h bucket footprint, but retention is now the baker's own sweep — current plus two
#             generations, stated in the manifest — so the probe reads the footprint out of the
#             published document and never opens this file. install.sh still parses the column, and
#             still refuses a row where it is not a number, so it cannot rot into a lie unnoticed.
#             The cost it *does* still describe is Class A writes: one full object set per run, and
#             at 96 runs/day that is ~633 k of R2's 1 M free monthly operations. That is the
#             tightest line in the budget and the reason the probe carries a cadence guard.
#   note      free text to end of line.
#
# Cadence rationale: the dataset's own temporal resolution is 15 minutes and every generation is a
# complete re-bake, so polling faster buys nothing a rider can see and costs a full object set.
# What the sources publish underneath, for the record — the cycle samples whatever is current
# within `canonical::MAX_FRAME_SKEW_S` of each frame's validity, and falls through to the next
# priority row where a source has fallen out of the timeline:
#
#   dwd-rv        5-minute national radar nowcast (Germany), 9 leads
#   mrms          2-minute national radar observation (CONUS)
#   opera-cirrus  5-minute pan-European 1 km radar composite, ~4.1-minute publication lag
#   opera-nimbus  15-minute pan-European 2 km radar rain rate, ~10-minute lag
#   hrrr          hourly CONUS model run, 15-minute subhourly steps
#   icon-eu       4 runs/day pan-European model, ~3 h publication lag
#   gfs           4 runs/day global model floor, landing ~4.5-5 h late (WX1)
#
# **Applying this file is WXR8's cutover, not this file's edit.** The deployed VPS keeps running
# whatever `install.sh` last wrote until someone re-runs it; when they do, the per-adapter timers
# this table's predecessor installed are disabled by the same run that enables `cycle`.
#
# **Deploy the binary first.** `cycle` is also the name of a subcommand the PREVIOUS binary had —
# one that baked four v1 products — so `install.sh`'s skip-unknown-subcommand probe cannot tell a
# misordered run from a correct one: it would retire every per-adapter timer and schedule a v1
# multi-product cycle every 15 minutes. `install.sh` therefore refuses outright when the binary it
# is about to install units for still answers to `dwd-rv`. Do not remove that check to "unblock" a
# deploy; deploy the binary.
#
# name     oncalendar        delay  runs/day  note
cycle      *:0/15            60     96        the one dataset: every source, mosaicked onto the global lattice, 24 shards x 9 frames
