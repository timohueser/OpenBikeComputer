# OBC weather bakery — the adapter cadence table.
#
# ONE source of truth for "how often does each product get baked". `install.sh` generates one
# systemd timer per line (`obc-wx-bake@<name>.timer`, all firing the shared
# `obc-wx-bake@.service` template), and the runbook's cost table is computed from these rows.
#
# Per-adapter timers, not one `cycle` timer, on purpose: the baker fails a cycle closed, so a
# single `cycle` invocation lets a broken model upstream block fresh radar publications (the
# coupling PR #1215's review flagged). One timer per adapter means one broken upstream costs
# exactly its own product's freshness; every other product is carried forward untouched.
#
# Columns are whitespace-separated:
#
#   name      the `obc-wx-bake <name>` subcommand. install.sh probes the installed binary and
#             skips (and disables) any adapter it does not know — so the WX6 rows below are inert
#             until WX6 lands, and become live on the next `install.sh` run with no edit here.
#   oncalendar  systemd OnCalendar= expression (see `systemd.time(7)`, `systemd-analyze calendar`).
#   delay     RandomizedDelaySec= — keeps every instance off the exact minute boundary, which is
#             both politeness to the upstream and how a five-minute poll avoids racing the
#             publisher that is still writing the run.
#   runs/day  how often the *upstream* publishes a new run — not how often we poll. Polls that
#             find the same run cost nothing and store nothing; only a new run mints new immutable
#             objects. freshness_probe.py multiplies this by the product's current published size
#             to project the 48 h rolling bucket footprint against the budget.
#   note      free text to end of line.
#
# Cadence rationale: poll at the product's own native publication cadence. A poll that finds
# nothing new is nearly free — the DWD RV adapter short-circuits on the upstream ETag and the
# model adapters on run identity, so an unchanged poll moves zero upstream body bytes and
# republishes only the ~14 KB manifest (measured in #1215: 0.31 s, 0 bytes fetched).
#
# name     oncalendar        delay  runs/day  note
dwd-rv     *:0/5             25     288       DWD RV composite: 5-min native cadence, staleness run+30 min
icon-eu    *:0/15            90     4         ICON-EU: 4 runs/day, ~3 h publication lag; poll for a complete run
# ── WX6 (#1191) rows: inert until the binary grows these subcommands ─────────────────────────
# `us` is one composed product, not two: MRMS supplies the observation frame and HRRR the forward
# frames, so there is one timer and one manifest entry (PR #1223). It is the one row whose poll
# rate *is* its object-minting rate — every tick finds a newer two-minute MRMS observation and
# mints a fresh product reference — so the runs/day column below is the poll rate, not MRMS's 720.
# 15 minutes is a deliberate cadence decision, not the upstream's: the device draws 15-minute
# steps, so a tighter poll would only lower the radar frame's age (at most 15 min here) while
# multiplying re-uploads of forward frames whose data did not change.
us         *:0/15            60     96        MRMS+HRRR composed: 15-min bake, matching the display's own step
gfs        *:25              300    4         GFS 0.25° floor: 4 runs/day landing ~4.5-5 h late (WX1), so poll hourly
