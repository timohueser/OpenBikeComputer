# XcodeGen source of truth for OBCCompanion.
#
# Regenerate the .xcodeproj after editing this file:
#     cd companion-ios && xcodegen generate
#
# The generated OBCCompanion.xcodeproj is gitignored — `xcodegen generate` is
# a required first step after cloning. Edit this file, never the pbxproj.
# Policy rationale: companion-ios/CLAUDE.md.

name: OBCCompanion

# project.local.yml carries your personal signing team id — tracked with an
# empty default (so a fresh clone still builds for the simulator) but meant
# to be edited locally and marked skip-worktree so `xcodegen generate` never
# wipes it and it never shows up as a git diff. See companion-ios/CLAUDE.md
# → Signing.
include:
  - project.local.yml

options:
  bundleIdPrefix: com.openbikecomputer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Applied to every target unless overridden.
settings:
  base:
    SWIFT_VERSION: "6.0"                 # Swift 6 language mode (data-race safety built in)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # DEVELOPMENT_TEAM comes from project.local.yml (see the `include:` above).

packages:
  OBCKit:
    path: Packages/OBCKit

targets:
  # ─────────────────────────────────────────────────────── app (composition root)
  OBCCompanion:
    type: application
    platform: iOS
    sources:
      - path: OBCCompanion
    dependencies:
      - package: OBCKit
        product: OBCDomain
      - package: OBCKit
        product: OBCTransport
      # The file-format edge (RouteImporter + decoders) — the composition root
      # registers the concrete formats (B4: GPX; B6 adds TCX).
      - package: OBCKit
        product: OBCFormats
      - package: OBCKit
        product: OBCUI
      # OBCMock is fully behind #if DEBUG → an empty module in Release, and the
      # app references it only inside #if DEBUG. Linking it is harmless; the seam
      # is real (grep a Release build: the marker string is absent).
      - package: OBCKit
        product: OBCMock
    info:
      path: OBCCompanion/Info.plist
      properties:
        CFBundleDisplayName: OBC
        # H7 copy — do not reword without updating the design source.
        NSBluetoothAlwaysUsageDescription: "OBC uses Bluetooth to connect to your bike computer. It never leaves your phone."
        # Keep BLE alive with the screen off / app backgrounded (#754). Without
        # this iOS suspends the app seconds after backgrounding, CoreBluetooth
        # callbacks stop, and a multi-minute L2CAP transfer (a ~900 KB firmware
        # image, a route upload, a ride sync) dies when the phone locks. L2CAP
        # CoC streaming continues under bluetooth-central, so those transfers
        # genuinely keep running. This is background *continuation* only — no
        # state restoration (relaunch-after-termination is a separate concern).
        UIBackgroundModes:
          - bluetooth-central
          # The periodic "has firmware been published?" check (#773 U5). BGAppRefreshTask needs
          # this mode declared or the scheduler refuses the request; the wake itself does one
          # anonymous GET and, at most, posts a local notification — no BLE, no device read.
          - fetch
        # The identifiers BGTaskScheduler is allowed to register. iOS traps at launch on a
        # registration this list doesn't contain, so this must stay in step with
        # `BackgroundUpdateRefresh.identifier` (which SwiftUI's `.backgroundTask(.appRefresh:)`
        # registers for us).
        BGTaskSchedulerPermittedIdentifiers:
          - com.openbikecomputer.companion.updatecheck
        # Route-file registration (B6): puts OBC in the share sheet's app row
        # for .gpx/.tcx files (Komoot/Strava/Garmin exports) and lets Files
        # "open in" the app — delivery lands in RootView's onOpenURL. This IS
        # the share-sheet entry: a dedicated Share Extension target would only
        # add value for non-file shares (URLs/text), deliberately not built.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
          - CFBundleTypeName: TCX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.garmin.tcx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - tcx
              public.mime-type:
                - application/vnd.garmin.tcx+xml
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.companion
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only

  # ─────────────────────────────────────────────────────── UI tests (B1P home)
  OBCCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OBCCompanionUITests
    dependencies:
      - target: OBCCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.companion.uitests
        TEST_TARGET_NAME: OBCCompanion
        GENERATE_INFOPLIST_FILE: YES   # test bundle needs no custom Info.plist keys

schemes:
  OBCCompanion:
    build:
      targets:
        OBCCompanion: all
        OBCCompanionUITests: [test]
    run:
      config: Debug            # Debug default → MockTransport (no BLE in the sim)
    test:
      config: Debug
      targets:
        - OBCCompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Quick-launch scenario schemes (dev convenience) — pick one from Xcode's
  # scheme picker and hit Run instead of hand-editing "OBCCompanion"'s launch
  # arguments every time. Each sets OBC_SCENARIO, the env-var fallback
  # MockLaunchOptions.parse reads when no -OBCScenario argument is present
  # (see companion-ios/CLAUDE.md → Launch arguments); env vars are order-
  # independent, unlike a two-token "-OBCScenario noDevice" command-line pair.
  # One scheme per Scenario case (Scenario.swift) — add one here when you add
  # a case there.
  OBCCompanion (happyPath):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: happyPath
  OBCCompanion (emptyLibrary):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: emptyLibrary
  OBCCompanion (coldRead):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: coldRead
  OBCCompanion (readError):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: readError
  OBCCompanion (outOfRange):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: outOfRange
  OBCCompanion (noDevice):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: noDevice
  OBCCompanion (pairingTimeout):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: pairingTimeout
  OBCCompanion (pairingRejected):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: pairingRejected
  OBCCompanion (bluetoothOff):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: bluetoothOff
  OBCCompanion (permissionDenied):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: permissionDenied
  OBCCompanion (syncUpToDate):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: syncUpToDate
  OBCCompanion (syncDrop):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: syncDrop
  OBCCompanion (uploadDrop):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: uploadDrop
  OBCCompanion (unsupportedFile):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: unsupportedFile
