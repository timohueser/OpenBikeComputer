# XcodeGen source of truth for OBCCompanion.
#
# Regenerate the .xcodeproj after editing this file:
#     cd companion-ios && xcodegen generate
#
# The generated OBCCompanion.xcodeproj is gitignored — `xcodegen generate` is
# a required first step after cloning. Edit this file, never the pbxproj.
# Policy rationale: companion-ios/CLAUDE.md.

name: OBCCompanion

# project.local.yml carries your personal signing team id — tracked with an
# empty default (so a fresh clone still builds for the simulator) but meant
# to be edited locally and marked skip-worktree so `xcodegen generate` never
# wipes it and it never shows up as a git diff. See companion-ios/CLAUDE.md
# → Signing.
include:
  - project.local.yml

options:
  preGenCommand: npm ci --prefix ReplayAssets
  bundleIdPrefix: com.openbikecomputer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Applied to every target unless overridden.
settings:
  base:
    SWIFT_VERSION: "6.0"                 # Swift 6 language mode (data-race safety built in)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # DEVELOPMENT_TEAM comes from project.local.yml (see the `include:` above).

packages:
  OBCKit:
    path: Packages/OBCKit
  # Links the Rust core; `obc companion-core` packs it before the package resolves.
  OBCRouting:
    path: Packages/OBCRouting

targets:
  # ─────────────────────────────────────────────────────── app (composition root)
  OBCCompanion:
    type: application
    platform: iOS
    sources:
      - path: OBCCompanion
    dependencies:
      - package: OBCKit
        product: OBCDomain
      - package: OBCKit
        product: OBCTransport
      # The file-format edge (RouteImporter + decoders) — the composition root
      # registers the concrete formats (B4: GPX; B6 adds TCX).
      - package: OBCKit
        product: OBCFormats
      - package: OBCKit
        product: OBCUI
      # The device's router, linked from Rust. Nothing here repacks it after a Rust change.
      - package: OBCRouting
        product: OBCRouting
      # OBCMock is fully behind #if DEBUG → an empty module in Release, and the
      # app references it only inside #if DEBUG. Linking it is harmless; the seam
      # is real (grep a Release build: the marker string is absent).
      - package: OBCKit
        product: OBCMock
    info:
      path: OBCCompanion/Info.plist
      properties:
        CFBundleDisplayName: OBC
        # H7 copy — do not reword without updating the design source.
        NSBluetoothAlwaysUsageDescription: "OBC uses Bluetooth to connect to your bike computer. It never leaves your phone."
        NSPhotoLibraryUsageDescription: "OBC shows the photos you took during a ride on that ride. It does not change your library."
        # The ride's photo offer has its own "Choose more photos…", so iOS must not add its own prompt.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # Keep object transfers active when the phone locks or the app enters the background.
        UIBackgroundModes:
          - bluetooth-central
          # The periodic "has firmware been published?" check (#773 U5). BGAppRefreshTask needs
          # this mode declared or the scheduler refuses the request; the wake itself does one
          # anonymous GET and, at most, posts a local notification — no BLE, no device read.
          - fetch
        # The identifiers BGTaskScheduler is allowed to register. iOS traps at launch on a
        # registration this list doesn't contain, so this must stay in step with
        # `BackgroundUpdateRefresh.identifier` (which SwiftUI's `.backgroundTask(.appRefresh:)`
        # registers for us).
        BGTaskSchedulerPermittedIdentifiers:
          - com.openbikecomputer.companion.updatecheck
        # Route-file registration (B6): puts OBC in the share sheet's app row
        # for .gpx/.tcx files (Komoot/Strava/Garmin exports) and lets Files
        # "open in" the app — delivery lands in RootView's onOpenURL. This IS
        # the share-sheet entry: a dedicated Share Extension target would only
        # add value for non-file shares (URLs/text), deliberately not built.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
          - CFBundleTypeName: TCX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.garmin.tcx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - tcx
              public.mime-type:
                - application/vnd.garmin.tcx+xml
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.companion
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        # The companion core has no Intel simulator slice.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # ─────────────────────────────────────────────── device shell (the Rust host on a phone)
  #
  # A development tool, not a product: the shared firmware runs over a card in Application
  # Support, the phone's GPS/compass/barometer are the sensors, and four touch pads are the
  # buttons. It links OBCHost (apps/obc-ios-host) and nothing from OBCKit.
  OBCDevice:
    type: application
    platform: iOS
    sources:
      - path: OBCDevice
        # The README documents the target; it is not part of the app bundle.
        excludes:
          - README.md
      - path: OBCCompanion/Assets.xcassets
    dependencies:
      # A static-library XCFramework: linked, never embedded. Xcode resolves it while it plans
      # the build, before the pre-build script below can run, so `obc ios-host` has to have been
      # run once already. The script keeps it current from then on.
      - framework: ../target/OBCHost.xcframework
        embed: false
    preBuildScripts:
      - name: Rust host (OBCHost.xcframework)
        # Always: cargo decides what is stale, and the script is seconds when nothing changed.
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # cargo picks the SDK per Rust target; Xcode's SDKROOT is the one being built for and
          # would be the wrong one for the other slice.
          unset SDKROOT
          if [ "$PLATFORM_NAME" = iphonesimulator ]; then
            "$SRCROOT/../tools/build-ios-host.sh" --sim-only
          else
            "$SRCROOT/../tools/build-ios-host.sh"
          fi
    info:
      path: OBCDevice/Info.plist
      properties:
        CFBundleDisplayName: OBC Device
        NSLocationWhenInUseUsageDescription: "OBC Device puts your position, speed and heading on the device screens, exactly as the bike computer does."
        NSMotionUsageDescription: "OBC Device reads the barometer for altitude, exactly as the bike computer does."
        # Finder file sharing over USB, and Files can open a map in place: the two ways a map
        # or a route gets onto the phone without a download path.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: OBC map
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.openbikecomputer.obcm
          - CFBundleTypeName: OBC route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.openbikecomputer.obcr
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
        # Ours, so this app declares them rather than importing someone else's spelling.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.openbikecomputer.obcm
            UTTypeDescription: OBC map
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - obcm
          - UTTypeIdentifier: com.openbikecomputer.obcr
            UTTypeDescription: OBC route
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - obcr
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.device
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        # tools/build-ios-host.sh packs aarch64-apple-ios-sim, so there is no Intel simulator
        # slice to link. Every Mac that can run this today is Apple silicon.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # ─────────────────────────────────────────────────────── UI tests (B1P home)
  OBCCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OBCCompanionUITests
    dependencies:
      - target: OBCCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.companion.uitests
        TEST_TARGET_NAME: OBCCompanion
        GENERATE_INFOPLIST_FILE: YES   # test bundle needs no custom Info.plist keys

schemes:
  OBCCompanion:
    build:
      targets:
        OBCCompanion: all
        OBCCompanionUITests: [test]
    run:
      config: Debug            # Debug default → MockTransport (no BLE in the sim)
    test:
      config: Debug
      targets:
        - OBCCompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  OBCDevice:
    build:
      targets:
        OBCDevice: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Quick-launch scenario schemes (dev convenience) — pick one from Xcode's
  # scheme picker and hit Run instead of hand-editing "OBCCompanion"'s launch
  # arguments every time. Each sets OBC_SCENARIO, the env-var fallback
  # MockLaunchOptions.parse reads when no -OBCScenario argument is present
  # (see companion-ios/CLAUDE.md → Launch arguments); env vars are order-
  # independent, unlike a two-token "-OBCScenario noDevice" command-line pair.
  # One scheme per Scenario case (Scenario.swift) — add one here when you add
  # a case there.
  OBCCompanion (happyPath):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: happyPath
  OBCCompanion (emptyLibrary):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: emptyLibrary
  OBCCompanion (coldRead):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: coldRead
  OBCCompanion (readError):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: readError
  OBCCompanion (outOfRange):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: outOfRange
  OBCCompanion (noDevice):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: noDevice
  OBCCompanion (pairingTimeout):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: pairingTimeout
  OBCCompanion (pairingRejected):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: pairingRejected
  OBCCompanion (bluetoothOff):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: bluetoothOff
  OBCCompanion (permissionDenied):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: permissionDenied
  OBCCompanion (syncUpToDate):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: syncUpToDate
  OBCCompanion (syncDrop):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: syncDrop
  OBCCompanion (uploadDrop):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: uploadDrop
  OBCCompanion (unsupportedFile):
    build:
      targets:
        OBCCompanion: all
    run:
      config: Debug
      environmentVariables:
        OBC_SCENARIO: unsupportedFile
