# XcodeGen source of truth for OBCCompanion.
#
# Regenerate the .xcodeproj after editing this file:
#     cd companion-ios && xcodegen generate
#
# The generated OBCCompanion.xcodeproj IS committed (so a fresh clone builds
# without running XcodeGen), but project.yml is what you edit — never hand-edit
# the pbxproj. See companion-ios/CLAUDE.md.

name: OBCCompanion

# project.local.yml carries your personal signing team id — tracked with an
# empty default (so a fresh clone still builds for the simulator) but meant
# to be edited locally and marked skip-worktree so `xcodegen generate` never
# wipes it and it never shows up as a git diff. See companion-ios/CLAUDE.md
# → Signing.
include:
  - project.local.yml

options:
  bundleIdPrefix: com.openbikecomputer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Applied to every target unless overridden.
settings:
  base:
    SWIFT_VERSION: "5.0"                 # Swift 5 language mode (issue B0: 5.9+)
    SWIFT_STRICT_CONCURRENCY: complete   # strict concurrency ON
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # DEVELOPMENT_TEAM comes from project.local.yml (see the `include:` above).

packages:
  OBCKit:
    path: Packages/OBCKit

targets:
  # ─────────────────────────────────────────────────────── app (composition root)
  OBCCompanion:
    type: application
    platform: iOS
    sources:
      - path: OBCCompanion
    dependencies:
      - package: OBCKit
        product: OBCDomain
      - package: OBCKit
        product: OBCTransport
      # The file-format edge (RouteImporter + decoders) — the composition root
      # registers the concrete formats (B4: GPX; B6 adds TCX).
      - package: OBCKit
        product: OBCFormats
      - package: OBCKit
        product: OBCUI
      # OBCMock is fully behind #if DEBUG → an empty module in Release, and the
      # app references it only inside #if DEBUG. Linking it is harmless; the seam
      # is real (grep a Release build: the marker string is absent).
      - package: OBCKit
        product: OBCMock
    info:
      path: OBCCompanion/Info.plist
      properties:
        CFBundleDisplayName: OBC
        # H7 copy — do not reword without updating the design source.
        NSBluetoothAlwaysUsageDescription: "OBC uses Bluetooth to connect to your bike computer. It never leaves your phone."
        # Route-file registration: puts OBC in the share sheet's app row for
        # .gpx files (Komoot/Strava exports) and lets Files "open in" the app —
        # delivery lands in RootView's onOpenURL. TCX joins with B6's decoder;
        # a full Share Extension (if ever needed) also stays B6.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.companion
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only

  # ─────────────────────────────────────────────────────── UI tests (B1P home)
  OBCCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OBCCompanionUITests
    dependencies:
      - target: OBCCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.companion.uitests
        TEST_TARGET_NAME: OBCCompanion
        GENERATE_INFOPLIST_FILE: YES   # test bundle needs no custom Info.plist keys

schemes:
  OBCCompanion:
    build:
      targets:
        OBCCompanion: all
        OBCCompanionUITests: [test]
    run:
      config: Debug            # Debug default → MockTransport (no BLE in the sim)
    test:
      config: Debug
      targets:
        - OBCCompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
