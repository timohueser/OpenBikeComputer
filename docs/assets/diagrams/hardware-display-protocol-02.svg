<svg viewBox="0 0 720 280" role="img" aria-label="One pixel cell drawn as a three by three grid: R, G, B columns by three stacked bands — top MSB, middle LSB, bottom MSB. The top and bottom MSB bands are wired together and form two thirds of the area; the middle LSB band is one third." xmlns="http://www.w3.org/2000/svg" width="720" height="280" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <text class="d-tag" x="20" y="22" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">One pixel cell — three stacked bands</text>

  <!-- column headers -->
  <text class="d-label" x="300" y="52" text-anchor="middle" style="fill:#a9501c" fill="#1c1b14" font-size="14px">R</text>
  <text class="d-label" x="372" y="52" text-anchor="middle" style="fill:#3c6b39" fill="#1c1b14" font-size="14px">G</text>
  <text class="d-label" x="444" y="52" text-anchor="middle" style="fill:#33575b" fill="#1c1b14" font-size="14px">B</text>

  <!-- 3 columns x 3 rows; cell 72 wide; rows: 60/60/60 -->
  <!-- MSB top -->
  <rect x="264" y="62" width="72" height="60" style="fill:#e6c2b3;stroke:#3c6b39;stroke-width:1.2" />
  <rect x="336" y="62" width="72" height="60" style="fill:#cadcb6;stroke:#3c6b39;stroke-width:1.2" />
  <rect x="408" y="62" width="72" height="60" style="fill:#b6cdd3;stroke:#3c6b39;stroke-width:1.2" />
  <!-- LSB middle -->
  <rect x="264" y="122" width="72" height="60" style="fill:#eed6cc;stroke:#3c6b39;stroke-width:1.2" />
  <rect x="336" y="122" width="72" height="60" style="fill:#dde9cf;stroke:#3c6b39;stroke-width:1.2" />
  <rect x="408" y="122" width="72" height="60" style="fill:#cfdee2;stroke:#3c6b39;stroke-width:1.2" />
  <!-- MSB bottom -->
  <rect x="264" y="182" width="72" height="60" style="fill:#e6c2b3;stroke:#3c6b39;stroke-width:1.2" />
  <rect x="336" y="182" width="72" height="60" style="fill:#cadcb6;stroke:#3c6b39;stroke-width:1.2" />
  <rect x="408" y="182" width="72" height="60" style="fill:#b6cdd3;stroke:#3c6b39;stroke-width:1.2" />

  <!-- band labels inside -->
  <text class="d-sub" x="372" y="96" text-anchor="middle" fill="#5c5a2e" font-size="12px">MSB band</text>
  <text class="d-sub" x="372" y="156" text-anchor="middle" fill="#5c5a2e" font-size="12px">LSB band</text>
  <text class="d-sub" x="372" y="216" text-anchor="middle" fill="#5c5a2e" font-size="12px">MSB band</text>

  <!-- annotations: MSB (top + bottom) and LSB (middle) -->
  <line x1="480" y1="92" x2="500" y2="116" style="stroke:#9aa884;stroke-width:1.3" />
  <line x1="480" y1="212" x2="500" y2="116" style="stroke:#9aa884;stroke-width:1.3" />
  <text class="d-label" x="506" y="112" fill="#1c1b14" font-size="14px">MSB plane</text>
  <text class="d-sub" x="506" y="128" fill="#5c5a2e" font-size="12px">2/3 area · top + bottom</text>
  <line x1="480" y1="152" x2="500" y2="172" style="stroke:#cf6a2a;stroke-width:1.3" />
  <text class="d-label" x="506" y="174" style="fill:#a9501c" fill="#1c1b14" font-size="14px">LSB plane</text>
  <text class="d-sub" x="506" y="190" fill="#5c5a2e" font-size="12px">1/3 area · middle</text>
</svg>
