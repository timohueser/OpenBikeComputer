<svg viewBox="0 0 760 322" role="img" aria-label="Converting GPX track points to an OBCR route in one streaming pass after waypoint collection. Left panel, the shape: the stored line keeps only the corners (and one vertex at least every 1.2 km) — vertices within 1 metre of the line between their neighbours are dropped — Distance and climb are measured from the retained points; validity gaps stop the elevation integrator. Right panel, the climb: a raw elevation trace is integrated through a 3-metre dead-band; small wiggles inside the band book no ascent, and only once the trace leaves the band is the climb booked and the reference re-anchored. The same dead-band is shared by the elevation profile and the live barometric climb on the device." xmlns="http://www.w3.org/2000/svg" width="760" height="322" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <text class="d-tag" x="20" y="22" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">GPX → OBCR · bounded streaming conversion</text>
  <text class="d-sub" x="20" y="38" style="font-size:12px" fill="#5c5a2e" font-size="12px">retain shape and elevation changes, then measure distance + climb</text>
  <line x1="384" y1="58" x2="384" y2="300" stroke="#9aa884" stroke-opacity="0.45" stroke-width="1" />
  <text class="d-sub" x="26" y="62" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">① the shape — decimate, keep the corners</text>
  <polyline points="55,206 130,131 225,166 330,116" fill="none" stroke="#cf6a2a" stroke-width="2" />
  <circle cx="75" cy="187" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="92" cy="169" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="110" cy="150" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="155" cy="142" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="180" cy="151" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="200" cy="160" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="255" cy="156" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="285" cy="140" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="305" cy="129" r="3" fill="#ece8cf" stroke="#9aa884" stroke-width="1.2" />
  <circle cx="55" cy="206" r="3.6" fill="#cf6a2a" />
  <circle cx="130" cy="131" r="3.6" fill="#cf6a2a" />
  <circle cx="225" cy="166" r="3.6" fill="#cf6a2a" />
  <circle cx="330" cy="116" r="3.6" fill="#cf6a2a" />
  <line class="d-stroke" x1="92" y1="169" x2="92" y2="205" style="stroke-width:0.9;stroke:#9aa884;stroke-dasharray:2 2" fill="none" stroke="#1c1b14" stroke-width="1.6" />
  <text class="d-sub" x="86" y="220" style="font-size:12px" fill="#5c5a2e" font-size="12px">dropped — within 1 m of the line</text>
  <text x="130" y="121" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#a9501c" fill="#1c1b14">kept — a corner</text>
  <text class="d-sub" x="220" y="107" text-anchor="middle" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">keep a point at least every 1.2 km</text>
  <rect x="34" y="246" width="320" height="42" rx="7" style="fill:#eef2df;stroke:#9aa884;stroke-width:0.8" />
  <text x="194" y="263" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#3c6b39" fill="#1c1b14">totals use every original point</text>
  <text x="194" y="277" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#3c6b39" fill="#1c1b14">stored geometry is reduced</text>
  <text class="d-sub" x="402" y="62" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">② the climb — a ±3 m dead-band</text>
  <polyline points="430.0,232.0 444.5,237.0 459.0,227.0 473.5,229.5 488.0,222.0 502.5,212.0 517.0,202.0 531.5,192.0 546.0,187.0 560.5,189.5 575.0,197.0 589.5,187.0 604.0,172.0 618.5,157.0 633.0,147.0 647.5,152.0 662.0,137.0 676.5,122.0 691.0,112.0 705.5,117.0 720.0,107" fill="none" stroke="#9aa884" stroke-width="1.3" stroke-opacity="0.65" />
  <rect x="531.5" y="177" width="72.5" height="30" fill="#cf6a2a" fill-opacity="0.08" stroke="#cf6a2a" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="3 3" />
  <text x="608" y="195" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#a9501c" fill="#1c1b14">±3 m</text>
  <polyline points="430.0,232.0 502.5,232.0 502.5,212.0 531.5,212.0 531.5,192.0 604.0,192.0 604.0,172.0 618.5,172.0 618.5,157.0 662.0,157.0 662.0,137.0 676.5,137.0 676.5,122.0 720.0,122.0 720.0,107.0 720.0,107" fill="none" stroke="#cf6a2a" stroke-width="2" />
  <text class="d-sub" x="430" y="252" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">along the route →</text>
  <text class="d-sub" x="402" y="100" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">elev</text>
  <text class="d-sub" x="455" y="210" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">wiggle &lt; 3 m → ignored</text>
  <text x="592" y="120" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#a9501c" fill="#1c1b14">past ±3 m → book + re-anchor</text>
  <rect x="410" y="266" width="316" height="22" rx="7" style="fill:#eef2df;stroke:#9aa884;stroke-width:0.8" />
  <text x="568" y="281" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#3c6b39" fill="#1c1b14">shared 3 m dead band</text>
</svg>
