<svg viewBox="0 0 720 410" role="img" aria-label="Map tools prepare OBCM maps. The GPX converter prepares OBCR routes. Both feed the shared application on the device, simulator, and browser. Device sensors supply live readings." xmlns="http://www.w3.org/2000/svg" width="720" height="410" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs><marker id="index-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker></defs>
  <text class="d-tag" x="20" y="26" text-anchor="start" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Prepare data, then use it offline</text>
  <rect class="d-panel" x="20" y="55" width="200" height="70" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="120" y="80" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Map tools</text>
  <text class="d-sub" x="120" y="100" text-anchor="middle" fill="#5c5a2e" font-size="12px">OSM + terrain → OBCM</text>
  <rect class="d-panel" x="260" y="55" width="200" height="70" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="360" y="80" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Route converter</text>
  <text class="d-sub" x="360" y="100" text-anchor="middle" fill="#5c5a2e" font-size="12px">GPX → OBCR</text>
  <rect class="d-panel" x="500" y="55" width="200" height="70" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="600" y="80" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Live readings</text>
  <text class="d-sub" x="600" y="100" text-anchor="middle" fill="#5c5a2e" font-size="12px">GPS · barometer · compass</text>
  <path class="d-flow" d="M120 125 L120 160" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M360 125 L360 178" marker-end="url(#index-1)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M600 125 L600 160" fill="none" stroke="#a4501e" stroke-width="2" />
<path class="d-flow" d="M120 160 H600" fill="none" stroke="#a4501e" stroke-width="2" />
  <rect class="d-panel d-focus" x="170" y="180" width="380" height="76" rx="8" fill="#f9f0ee" stroke="#ae4825" stroke-width="2" />
  <text class="d-title" x="360" y="205" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Shared application</text>
  <text class="d-sub" x="360" y="225" text-anchor="middle" fill="#5c5a2e" font-size="12px">obc-app + readers + obc-render</text>
  <path class="d-flow" d="M360 256 L360 288" fill="none" stroke="#a4501e" stroke-width="2" />
<path class="d-flow" d="M120 288 H600" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M120 288 L120 316" marker-end="url(#index-1)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M360 288 L360 316" marker-end="url(#index-1)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M600 288 L600 316" marker-end="url(#index-1)" fill="none" stroke="#a4501e" stroke-width="2" />
  <rect class="d-panel" x="20" y="318" width="200" height="70" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="120" y="343" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Device</text>
  <text class="d-sub" x="120" y="363" text-anchor="middle" fill="#5c5a2e" font-size="12px">nRF54LM20</text>
  <rect class="d-panel" x="260" y="318" width="200" height="70" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="360" y="343" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Simulator</text>
  <text class="d-sub" x="360" y="363" text-anchor="middle" fill="#5c5a2e" font-size="12px">Desktop host</text>
  <rect class="d-panel" x="500" y="318" width="200" height="70" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="600" y="343" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Web demo</text>
  <text class="d-sub" x="600" y="363" text-anchor="middle" fill="#5c5a2e" font-size="12px">Browser host</text>
</svg>
