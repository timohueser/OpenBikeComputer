<svg viewBox="0 0 720 220" role="img" aria-label="Two side-by-side contexts. On the left, handle receives Ctx, the mutable half: app state, activity mode, Navigator route state, Recorder ride state, and settings. On the right, draw receives Render, the read-only half: the map reader, renderer, route guidance, route caches, breadcrumb, size, and hold-progress." xmlns="http://www.w3.org/2000/svg" width="720" height="220" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Two halves of the world, handed to two methods</text>

  <!-- Ctx -->
  <rect class="d-panel" x="36" y="44" width="300" height="150" rx="12" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-label" x="56" y="68" fill="#1c1b14" font-size="14px">handle(g, &amp;mut Ctx)</text>
  <text class="d-tag" x="56" y="84" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">mutable — change the world</text>
  <g font-family="var(--mono)">
    <text class="d-sub" x="56" y="104" fill="#5c5a2e" font-size="12px">state &#160;&#160;— camera · zoom · pan</text>
    <text class="d-sub" x="56" y="124" fill="#5c5a2e" font-size="12px">activity — ride mode · UI requests</text>
    <text class="d-sub" x="56" y="144" fill="#5c5a2e" font-size="12px">navigator — route · match · guidance</text>
    <text class="d-sub" x="56" y="164" fill="#5c5a2e" font-size="12px">recorder — ride totals · sensors</text>
    <text class="d-sub" x="56" y="184" fill="#5c5a2e" font-size="12px">settings — units · clock · intervals</text>
  </g>

  <!-- Render -->
  <rect class="d-panel-2" x="384" y="44" width="300" height="150" rx="12" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="404" y="68" fill="#1c1b14" font-size="14px">draw(target, &amp;Render)</text>
  <text class="d-tag" x="404" y="84" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">read-only — paint the world</text>
  <g font-family="var(--mono)">
    <text class="d-sub" x="404" y="106" fill="#5c5a2e" font-size="12px">reader · renderer — draw the map</text>
    <text class="d-sub" x="404" y="126" fill="#5c5a2e" font-size="12px">state · guidance · route caches · breadcrumb</text>
    <text class="d-sub" x="404" y="146" fill="#5c5a2e" font-size="12px">w · h &#160;— panel size</text>
    <text class="d-sub" x="404" y="166" fill="#5c5a2e" font-size="12px">hold_progress — the confirm ring</text>
  </g>
</svg>
