<svg viewBox="0 0 720 270" role="img" aria-label="A pool of features each tagged with a min-LOD flows into three tiers. The country tier takes only features with min-LOD 0 and simplifies them at 120 metres. The region tier adds min-LOD 1 features at 18 metres. The street tier adds everything at full detail. Each tier becomes its own quadtree." xmlns="http://www.w3.org/2000/svg" width="720" height="270" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="aP5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf6a2a" /></marker>
  </defs>
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">LOD construction · illustrative tiers</text>

  <!-- feature pool -->
  <rect class="d-panel-2" x="30" y="70" width="140" height="130" rx="10" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-tag" x="44" y="90" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">features</text>
  <g font-family="var(--mono)">
    <text class="d-sub" x="44" y="112" style="font-size:12px" fill="#5c5a2e" font-size="12px">coast · sea  min 0</text>
    <text class="d-sub" x="44" y="132" style="font-size:12px" fill="#5c5a2e" font-size="12px">motorway   min 0</text>
    <text class="d-sub" x="44" y="152" style="font-size:12px" fill="#5c5a2e" font-size="12px">forest     min 1</text>
    <text class="d-sub" x="44" y="172" style="font-size:12px" fill="#5c5a2e" font-size="12px">footway    min 2</text>
    <text class="d-sub" x="44" y="192" style="font-size:12px" fill="#5c5a2e" font-size="12px">building   min 2</text>
  </g>

  <!-- tiers -->
  <g>
    <line class="d-flow" x1="174" y1="100" x2="214" y2="92" marker-end="url(#aP5)" fill="none" stroke="#a4501e" stroke-width="2" />
    <rect class="d-panel" x="220" y="62" width="220" height="42" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
    <text class="d-label" x="234" y="80" fill="#1c1b14" font-size="14px">LOD 0 · country</text>
    <text class="d-sub" x="234" y="96" style="font-size:12px" fill="#5c5a2e" font-size="12px">min_lod ≤ 0 · simplify 120 m</text>

    <line class="d-flow" x1="174" y1="135" x2="214" y2="135" marker-end="url(#aP5)" fill="none" stroke="#a4501e" stroke-width="2" />
    <rect class="d-panel" x="220" y="114" width="220" height="42" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
    <text class="d-label" x="234" y="132" fill="#1c1b14" font-size="14px">LOD 1 · region</text>
    <text class="d-sub" x="234" y="148" style="font-size:12px" fill="#5c5a2e" font-size="12px">+ min_lod ≤ 1 · simplify 18 m</text>

    <line class="d-flow" x1="174" y1="170" x2="214" y2="178" marker-end="url(#aP5)" fill="none" stroke="#a4501e" stroke-width="2" />
    <rect class="d-panel" x="220" y="166" width="220" height="42" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
    <text class="d-label" x="234" y="184" fill="#1c1b14" font-size="14px">LOD 2 · street</text>
    <text class="d-sub" x="234" y="200" style="font-size:12px" fill="#5c5a2e" font-size="12px">+ everything · full detail</text>
  </g>

  <!-- each → quadtree -->
  <line class="d-flow" x1="444" y1="83"  x2="492" y2="83"  marker-end="url(#aP5)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="444" y1="135" x2="492" y2="135" marker-end="url(#aP5)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="444" y1="187" x2="492" y2="187" marker-end="url(#aP5)" fill="none" stroke="#a4501e" stroke-width="2" />
  <g>
    <rect x="500" y="64" width="56" height="38" rx="5" class="d-muted" fill="#d6d5c8" /><text class="d-sub" x="528" y="87" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">quadtree</text>
    <rect x="500" y="116" width="56" height="38" rx="5" class="d-muted" fill="#d6d5c8" /><text class="d-sub" x="528" y="139" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">quadtree</text>
    <rect x="500" y="168" width="56" height="38" rx="5" class="d-muted" fill="#d6d5c8" /><text class="d-sub" x="528" y="191" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">quadtree</text>
  </g>
  <text class="d-sub" x="600" y="120" style="font-size:12px" fill="#5c5a2e" font-size="12px">→ the LOD</text>
  <text class="d-sub" x="600" y="136" style="font-size:12px" fill="#5c5a2e" font-size="12px">pyramid in</text>
  <text class="d-sub" x="600" y="152" style="font-size:12px" fill="#5c5a2e" font-size="12px">the .obcm</text>
</svg>
