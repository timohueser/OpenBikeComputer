<svg viewBox="0 0 760 292" role="img" aria-label="The device waits for input, sensor data, an animation deadline, or the watchdog guard. It runs one cycle after a wake." xmlns="http://www.w3.org/2000/svg" width="760" height="292" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="lpF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
    <marker id="lpC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf6a2a" /></marker>
  </defs>
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">On the device: sleep until a real event</text>
  <text class="d-sub" x="26" y="58" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">three wake sources</text>
  <rect class="d-panel-2" x="24" y="72" width="156" height="38" rx="9" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="102" y="89" text-anchor="middle" style="font-size:12px" fill="#1c1b14" font-size="14px">button edge</text>
  <text class="d-sub" x="102" y="102" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">a gesture · a charging hold</text>
  <line class="d-flow" x1="180" y1="91" x2="214" y2="91" marker-end="url(#lpF)" fill="none" stroke="#a4501e" stroke-width="2" />
  <rect class="d-panel-2" x="24" y="120" width="156" height="38" rx="9" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="102" y="137" text-anchor="middle" style="font-size:12px" fill="#1c1b14" font-size="14px">sensor sample</text>
  <text class="d-sub" x="102" y="150" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">GPS fix · baro · heading</text>
  <line class="d-flow" x1="180" y1="139" x2="214" y2="139" marker-end="url(#lpF)" fill="none" stroke="#a4501e" stroke-width="2" />
  <rect class="d-panel-2" x="24" y="168" width="156" height="38" rx="9" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="102" y="185" text-anchor="middle" style="font-size:12px" fill="#1c1b14" font-size="14px">animation deadline</text>
  <text class="d-sub" x="102" y="198" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">next clock minute · cursor</text>
  <line class="d-flow" x1="180" y1="187" x2="214" y2="187" marker-end="url(#lpF)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path d="M218 86 C 230 86, 230 145, 242 145 C 230 145, 230 204, 218 204" fill="none" stroke="#6b7758" stroke-width="1.3" />
  <text class="d-sub" x="232" y="226" text-anchor="middle" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">wake on</text>
  <text class="d-sub" x="232" y="242" text-anchor="middle" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">first event</text>
  <rect class="d-panel" x="262" y="106" width="150" height="78" rx="14" style="fill:#f4f1e3" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="337" y="140" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">asleep · WFI</text>
  <text class="d-sub" x="337" y="158" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">CPU idle between events</text>
  <text x="382" y="122" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#9aa884" fill="#1c1b14">z z</text>
  <line class="d-flow" x1="246" y1="145" x2="260" y2="145" marker-end="url(#lpF)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line x1="412" y1="132" x2="476" y2="132" stroke="#cf6a2a" stroke-width="2.2" marker-end="url(#lpC)" />
  <text x="444" y="124" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#a9501c" fill="#1c1b14">wake</text>
  <rect class="d-hot" x="480" y="92" width="252" height="98" rx="14" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-title" x="606" y="116" text-anchor="middle" style="fill:#a9501c" fill="#1c1b14" font-weight="650" font-size="14px">run one iteration</text>
  <text class="d-sub" x="606" y="138" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">apply gestures · advance animations</text>
  <text class="d-sub" x="606" y="153" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">run_pass → render + effects</text>
  <text class="d-sub" x="606" y="168" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">→ render only what changed</text>
  <path class="d-flow" d="M540 190 C 500 224, 420 224, 360 200" marker-end="url(#lpF)" stroke-dasharray="4 4" fill="none" stroke="#a4501e" stroke-width="2" />
  <text class="d-sub" x="452" y="234" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">arm the next wake, sleep again</text>
  <rect x="240" y="252" width="500" height="26" rx="7" style="fill:#eef2df;stroke:#9aa884;stroke-width:0.8" />
  <text x="490" y="269" text-anchor="middle" style="font-family:var(--mono, 'Atkinson Mono', ui-monospace, monospace);font-size:12px;fill:#3c6b39" fill="#1c1b14">Idle (no animation · GNSS stopped): ~10 s watchdog-feed guard</text>
</svg>
