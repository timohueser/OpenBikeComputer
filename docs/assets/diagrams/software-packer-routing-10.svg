<svg viewBox="0 0 720 290" role="img" aria-label="A region with features being bucketed into a quadtree. A dense corner has been subdivided into four smaller cells, one of them subdivided again. A line feature crossing a cell boundary is clipped into two pieces, one per cell." xmlns="http://www.w3.org/2000/svg" width="720" height="290" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">A leaf splits when its chunk fills; straddlers are clipped</text>

  <!-- region -->
  <rect x="40" y="48" width="256" height="256" fill="none" stroke="#3c6b39" stroke-width="1.6" />
  <!-- root split -->
  <line x1="168" y1="48" x2="168" y2="304" stroke="#3c6b39" stroke-width="1.3" />
  <line x1="40" y1="176" x2="296" y2="176" stroke="#3c6b39" stroke-width="1.3" />
  <!-- NE subdivided (dense) -->
  <line x1="232" y1="48" x2="232" y2="176" stroke="#7c9a63" stroke-width="1" />
  <line x1="168" y1="112" x2="296" y2="112" stroke="#7c9a63" stroke-width="1" />
  <!-- one sub-cell subdivided again -->
  <line x1="264" y1="112" x2="264" y2="176" stroke="#9aa884" stroke-width="0.8" />
  <line x1="232" y1="144" x2="296" y2="144" stroke="#9aa884" stroke-width="0.8" />
  <!-- dense dots in NE -->
  <g fill="#3c6b39"><circle cx="248" cy="128" r="1.6"/><circle cx="256" cy="158" r="1.6"/><circle cx="276" cy="124" r="1.6"/><circle cx="284" cy="160" r="1.6"/><circle cx="240" cy="160" r="1.6"/><circle cx="272" cy="150" r="1.6"/></g>
  <text class="d-sub" x="232" y="70" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">dense → deeper</text>
  <!-- a polygon in SW -->
  <path d="M70 210 L130 205 L140 260 L80 270 Z" fill="#cfe0c2" stroke="#3c6b39" stroke-width="1.2" />
  <!-- a line straddling the vertical boundary -->
  <line x1="120" y1="120" x2="220" y2="150" stroke="#cf6a2a" stroke-width="2.5" />
  <circle cx="168" cy="134" r="3.5" class="d-hot-fill" fill="#ae4825" />
  <text class="d-sub" x="120" y="106" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">clipped at the boundary →</text>

  <!-- right notes -->
  <text class="d-label" x="330" y="84" fill="#1c1b14" font-size="14px">leaf fills:</text>
  <text class="d-sub" x="330" y="104" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">feature bytes + ring counts</text>
  <text class="d-sub" x="330" y="124" style="font-size:12px" fill="#5c5a2e" font-size="12px">&gt; chunk_size → split 4</text>
  <line class="d-stroke" x1="330" y1="140" x2="690" y2="140" style="stroke:#9aa884" fill="none" stroke="#1c1b14" stroke-width="1.6" />
  <text class="d-sub" x="330" y="164" style="font-size:12px" fill="#5c5a2e" font-size="12px">a straddling feature is clipped to</text>
  <text class="d-sub" x="330" y="180" style="font-size:12px" fill="#5c5a2e" font-size="12px">each child's box, so every leaf's</text>
  <text class="d-sub" x="330" y="196" style="font-size:12px" fill="#5c5a2e" font-size="12px">geometry is self-contained — which</text>
  <text class="d-sub" x="330" y="212" style="font-size:12px" fill="#5c5a2e" font-size="12px">is what lets the device decode one</text>
  <text class="d-sub" x="330" y="228" style="font-size:12px" fill="#5c5a2e" font-size="12px">chunk without touching its neighbours.</text>
  <text class="d-sub" x="330" y="258" style="font-size:12px;fill:#a9501c" fill="#5c5a2e" font-size="12px">this is the same tree the device walks to cull</text>
</svg>
