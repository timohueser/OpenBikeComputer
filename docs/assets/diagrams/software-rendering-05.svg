<svg viewBox="0 0 720 320" role="img" aria-label="A region split into four quadrants. The viewport straddles the boundary between the north-east and south-east quadrants, so the walk descends into both and prunes the north-west and south-west quadrants whole. Within north-east only the two lower sub-cells meet the view; within south-east only the two upper sub-cells do — four visited leaves in all. The tree on the right mirrors this: the root descends into the NE and SE branches, each with two visited and two pruned leaves, while NW and SW are pruned." xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Descend only where the view reaches</text>

  <!-- SPATIAL (left) -->
  <!-- pruned whole quadrants (NW, SW) -->
  <rect x="40" y="52" width="128" height="128" fill="#d6cda8" fill-opacity="0.45" />
  <rect x="40" y="180" width="128" height="128" fill="#d6cda8" fill-opacity="0.45" />
  <!-- pruned sub-cells: NE top row + SE bottom row -->
  <rect x="168" y="52" width="64" height="64" fill="#d6cda8" fill-opacity="0.45" />
  <rect x="232" y="52" width="64" height="64" fill="#d6cda8" fill-opacity="0.45" />
  <rect x="168" y="244" width="64" height="64" fill="#d6cda8" fill-opacity="0.45" />
  <rect x="232" y="244" width="64" height="64" fill="#d6cda8" fill-opacity="0.45" />
  <!-- visited sub-cells: NE lower row + SE upper row (the view straddles their shared edge) -->
  <rect x="168" y="116" width="64" height="64" fill="#cf6a2a" fill-opacity="0.20" />
  <rect x="232" y="116" width="64" height="64" fill="#cf6a2a" fill-opacity="0.20" />
  <rect x="168" y="180" width="64" height="64" fill="#cf6a2a" fill-opacity="0.20" />
  <rect x="232" y="180" width="64" height="64" fill="#cf6a2a" fill-opacity="0.20" />
  <!-- region outline + root split -->
  <rect x="40" y="52" width="256" height="256" fill="none" stroke="#3c6b39" stroke-width="1.6" />
  <line x1="168" y1="52" x2="168" y2="308" stroke="#3c6b39" stroke-width="1.4" />
  <line x1="40" y1="180" x2="296" y2="180" stroke="#3c6b39" stroke-width="1.4" />
  <!-- NE + SE subdivisions -->
  <line x1="232" y1="52" x2="232" y2="180" stroke="#7c9a63" stroke-width="1" />
  <line x1="168" y1="116" x2="296" y2="116" stroke="#7c9a63" stroke-width="1" />
  <line x1="232" y1="180" x2="232" y2="308" stroke="#7c9a63" stroke-width="1" />
  <line x1="168" y1="244" x2="296" y2="244" stroke="#7c9a63" stroke-width="1" />
  <!-- quadrant labels -->
  <text class="d-sub" x="104" y="116" text-anchor="middle" fill="#5c5a2e" font-size="12px">NW</text>
  <text class="d-sub" x="104" y="130" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">skipped</text>
  <text class="d-sub" x="104" y="244" text-anchor="middle" fill="#5c5a2e" font-size="12px">SW</text>
  <text class="d-sub" x="104" y="258" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">skipped</text>
  <text class="d-sub" x="290" y="64" text-anchor="end" style="font-size:12px" fill="#5c5a2e" font-size="12px">NE</text>
  <text class="d-sub" x="290" y="302" text-anchor="end" style="font-size:12px" fill="#5c5a2e" font-size="12px">SE</text>
  <!-- viewport (straddles the NE/SE boundary) -->
  <rect x="185" y="120" width="95" height="120" fill="none" stroke="#cf6a2a" stroke-width="2.4" />
  <text class="d-label" x="206" y="137" text-anchor="middle" style="fill:#a9501c" fill="#1c1b14" font-size="14px">view</text>

  <!-- TREE (right) -->
  <text class="d-sub" x="545" y="42" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">root</text>
  <circle cx="545" cy="56" r="11" class="d-forest" fill="#a4501e" />
  <!-- edges root -> children -->
  <g stroke="#9aa884" stroke-width="1.4" fill="none">
    <line x1="545" y1="61" x2="432" y2="101" />
    <line x1="545" y1="61" x2="585" y2="101" />
  </g>
  <g stroke="#cf6a2a" stroke-width="2" fill="none">
    <line x1="545" y1="61" x2="505" y2="101" />
    <line x1="545" y1="61" x2="658" y2="101" />
  </g>
  <!-- level-1 children: NW NE SW SE -->
  <circle cx="432" cy="110" r="9" class="d-muted" fill="#d6d5c8" />
  <circle cx="505" cy="110" r="10" class="d-hot-fill" fill="#ae4825" />
  <circle cx="585" cy="110" r="9" class="d-muted" fill="#d6d5c8" />
  <circle cx="658" cy="110" r="10" class="d-hot-fill" fill="#ae4825" />
  <text class="d-sub" x="432" y="132" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">NW</text>
  <text class="d-sub" x="505" y="132" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">NE</text>
  <text class="d-sub" x="585" y="132" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">SW</text>
  <text class="d-sub" x="658" y="132" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">SE</text>
  <!-- edges branch -> leaves -->
  <g stroke="#cf6a2a" stroke-width="1.6" fill="none">
    <line x1="505" y1="120" x2="485" y2="153" /><line x1="505" y1="120" x2="503" y2="153" /><line x1="505" y1="120" x2="521" y2="153" /><line x1="505" y1="120" x2="539" y2="153" />
    <line x1="658" y1="120" x2="638" y2="153" /><line x1="658" y1="120" x2="656" y2="153" /><line x1="658" y1="120" x2="674" y2="153" /><line x1="658" y1="120" x2="692" y2="153" />
  </g>
  <!-- NE leaves: skip · skip · visit · visit (lower row meets the view) -->
  <rect x="478" y="153" width="14" height="14" rx="3" class="d-muted" fill="#d6d5c8" />
  <rect x="496" y="153" width="14" height="14" rx="3" class="d-muted" fill="#d6d5c8" />
  <rect x="514" y="153" width="14" height="14" rx="3" class="d-hot-fill" fill="#ae4825" />
  <rect x="532" y="153" width="14" height="14" rx="3" class="d-hot-fill" fill="#ae4825" />
  <!-- SE leaves: visit · visit · skip · skip (upper row meets the view) -->
  <rect x="631" y="153" width="14" height="14" rx="3" class="d-hot-fill" fill="#ae4825" />
  <rect x="649" y="153" width="14" height="14" rx="3" class="d-hot-fill" fill="#ae4825" />
  <rect x="667" y="153" width="14" height="14" rx="3" class="d-muted" fill="#d6d5c8" />
  <rect x="685" y="153" width="14" height="14" rx="3" class="d-muted" fill="#d6d5c8" />
  <!-- legend -->
  <rect x="430" y="214" width="13" height="13" rx="3" class="d-hot-fill" fill="#ae4825" />
  <text class="d-sub" x="450" y="224" style="font-size:12px" fill="#5c5a2e" font-size="12px">visited leaf → a chunk to draw</text>
  <rect x="430" y="236" width="13" height="13" rx="3" class="d-muted" fill="#d6d5c8" />
  <text class="d-sub" x="450" y="246" style="font-size:12px" fill="#5c5a2e" font-size="12px">skipped — bbox misses the view</text>
  <text class="d-sub" x="430" y="278" style="font-size:12px" fill="#5c5a2e" font-size="12px">a high bit marks a branch;</text>
  <text class="d-sub" x="430" y="292" style="font-size:12px" fill="#5c5a2e" font-size="12px">a sentinel marks an empty leaf</text>
</svg>
