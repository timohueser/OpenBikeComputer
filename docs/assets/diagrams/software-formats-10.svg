<svg viewBox="0 0 720 461" role="img" aria-label="A spatial quadtree identifies the settled junction leaf. One pinned 512-byte chunk contains the junction and inline neighbor data. The algorithm updates three adjacent graph nodes using costs, coordinates, way kind and ascent, without fetching neighbor records or edge geometry." xmlns="http://www.w3.org/2000/svg" width="720" height="461" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
<defs><marker id="r17arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker></defs>
<text class="d-tag" x="20" y="26" text-anchor="start" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">One A* settle · a point lookup, one chunk, several neighbor updates</text>
<text class="d-title" x="20" y="60" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">1 · Locate the junction</text>
<rect x="28" y="83" width="164" height="164" fill="#eef2df" stroke="#3c6b39" stroke-width="1.2" />
<path d="M110 83 L110 247" fill="none" stroke="#9aa884" stroke-width="1.3" />
<path d="M28 165 L192 165" fill="none" stroke="#9aa884" stroke-width="1.3" />
<path d="M151 165 L151 247" fill="none" stroke="#9aa884" stroke-width="1.3" />
<path d="M110 206 L192 206" fill="none" stroke="#9aa884" stroke-width="1.3" />
<rect x="151" y="206" width="41" height="41" fill="#f1cfb4" stroke="#cf6a2a" stroke-width="1.2" />
<circle cx="174" cy="224" r="4" fill="#cf6a2a"/>
<text class="d-sub" x="40" y="276" text-anchor="start" fill="#5c5a2e" font-size="12px">Point query → one leaf</text>
<path d="M193 223 H244" fill="none" stroke="#3c6b39" stroke-width="1.5" marker-end="url(#r17arrow)"/>
<text class="d-sub" x="218" y="203" text-anchor="middle" fill="#5c5a2e" font-size="12px">read</text>
<text class="d-title" x="260" y="60" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">2 · Pin its 512-byte chunk</text>
<rect x="255" y="83" width="214" height="164" fill="#eae4cb" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-sub" x="267" y="108" text-anchor="start" fill="#5c5a2e" font-size="12px">Junction: lat · lon · id · degree</text>
<text class="d-sub" x="267" y="128" text-anchor="start" fill="#5c5a2e" font-size="12px">Each neighbor carries:</text>
<rect x="265" y="141" width="194" height="28" fill="#cbdadb" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-sub" x="274" y="159" text-anchor="start" fill="#5c5a2e" font-size="12px">A · coordinate · edge id</text>
<rect x="265" y="172" width="194" height="28" fill="#cbdadb" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-sub" x="274" y="190" text-anchor="start" fill="#5c5a2e" font-size="12px">B · coordinate · edge id</text>
<rect x="265" y="203" width="194" height="28" fill="#cbdadb" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-sub" x="274" y="221" text-anchor="start" fill="#5c5a2e" font-size="12px">C · coordinate · edge id</text>
<path d="M470 173 H508" fill="none" stroke="#3c6b39" stroke-width="1.5" marker-end="url(#r17arrow)"/>
<text class="d-title" x="524" y="60" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">3 · Relax neighbors</text>
<path d="M574 176 L547 113" fill="none" stroke="#9aa884" stroke-width="1.3" />
<circle cx="547" cy="113" r="7" fill="#3c6b39"/>
<text class="d-sub" x="559" y="117" text-anchor="start" fill="#5c5a2e" font-size="12px">A</text>
<path d="M574 176 L666 164" fill="none" stroke="#9aa884" stroke-width="1.3" />
<circle cx="666" cy="164" r="7" fill="#3c6b39"/>
<text class="d-sub" x="678" y="168" text-anchor="start" fill="#5c5a2e" font-size="12px">B</text>
<path d="M574 176 L551 237" fill="none" stroke="#9aa884" stroke-width="1.3" />
<circle cx="551" cy="237" r="7" fill="#3c6b39"/>
<text class="d-sub" x="563" y="241" text-anchor="start" fill="#5c5a2e" font-size="12px">C</text>
<circle cx="574" cy="176" r="8" fill="#cf6a2a"/>
<text class="d-sub" x="590" y="208" text-anchor="start" fill="#5c5a2e" font-size="12px">settled</text>
<text class="d-sub" x="520" y="276" text-anchor="start" fill="#5c5a2e" font-size="12px">No neighbor-record fetch</text>
<path d="M20 300 L700 300" fill="none" stroke="#9aa884" stroke-width="1.3" />
<text class="d-title" x="20" y="328" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">Use the bytes already in the chunk</text>
<text class="d-sub" x="20" y="357" text-anchor="start" fill="#5c5a2e" font-size="12px">g′ = g + distance × road weight + ascent × climb weight</text>
<text class="d-sub" x="20" y="382" text-anchor="start" fill="#5c5a2e" font-size="12px">h = distance from neighbor to goal</text>
<text class="d-sub" x="400" y="382" text-anchor="start" fill="#5c5a2e" font-size="12px">f = g′ + ε × h</text>
<text class="d-sub" x="20" y="416" text-anchor="start" fill="#5c5a2e" font-size="12px">The road profile supplies weights. Inline coordinates supply the heuristic.</text>
<text class="d-sub" x="20" y="438" text-anchor="start" fill="#5c5a2e" font-size="12px">Edge geometry is read for endpoint projection and final route output, not neighbor relaxation.</text>
<text class="d-sub" x="255" y="276" text-anchor="start" fill="#5c5a2e" font-size="12px">All entries also store cost, kind, ascent.</text></svg>
