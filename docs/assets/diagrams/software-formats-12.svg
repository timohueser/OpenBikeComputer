<text class="d-sub" x="269" y="348" text-anchor="start" fill="#5c5a2e" font-size="12px">The seam belongs to the east cell.</text>
<text class="d-sub" x="269" y="371" text-anchor="start" fill="#5c5a2e" font-size="12px">Each cell includes its minimum edges; maximum edges belong</text>
<text class="d-sub" x="269" y="391" text-anchor="start" fill="#5c5a2e" font-size="12px">to the next cell. Sampling can fetch corners across that seam.</text>
