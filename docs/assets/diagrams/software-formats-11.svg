<svg viewBox="0 0 720 258" role="img" aria-label="A recorded ride contains 20-byte samples. Finalization appends one fixed summary footer." xmlns="http://www.w3.org/2000/svg" width="720" height="258" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="rr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
  </defs>
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">The 20-byte ride sample — final bytes from the first write</text>

  <!-- field names -->
  <text class="d-sub" x="106" y="56" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">lon (i32)</text>
  <text class="d-sub" x="210" y="56" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">lat (i32)</text>
  <text class="d-sub" x="288" y="56" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">ele</text>
  <text class="d-sub" x="340" y="56" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">flags</text>
  <text class="d-sub" x="418" y="56" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">t_ms (u32)</text>
  <text class="d-sub" x="483" y="56" text-anchor="middle" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">hr</text>
  <text class="d-sub" x="509" y="56" text-anchor="middle" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">cad</text>
  <text class="d-sub" x="548" y="56" text-anchor="middle" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">pwr</text>

  <!-- ruler rects (26 px / byte, origin x=54) -->
  <g stroke="#20301d" stroke-width="1">
    <rect x="54"  y="64" width="104" height="34" class="d-water" fill="#33575b" />
    <rect x="158" y="64" width="104" height="34" class="d-water" fill="#33575b" />
    <rect x="262" y="64" width="52"  height="34" class="d-muted" fill="#d6d5c8" />
    <rect x="314" y="64" width="52"  height="34" class="d-amber" fill="#f4a81d" />
    <rect x="366" y="64" width="104" height="34" class="d-forest" fill="#a4501e" />
    <rect x="470" y="64" width="26"  height="34" class="d-hot-fill" fill="#ae4825" />
    <rect x="496" y="64" width="26"  height="34" class="d-hot-fill" fill="#ae4825" />
    <rect x="522" y="64" width="52"  height="34" class="d-hot-fill" fill="#ae4825" />
  </g>
  <!-- field values -->
  <text class="d-sub" x="340" y="85" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">bit 0</text>
  <text class="d-sub" x="418" y="85" text-anchor="middle" style="fill:#e7ead8;font-size:12px" fill="#5c5a2e" font-size="12px">millis</text>

  <!-- byte ranges -->
  <text class="d-sub" x="106" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">0–3</text>
  <text class="d-sub" x="210" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">4–7</text>
  <text class="d-sub" x="288" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">8–9</text>
  <text class="d-sub" x="340" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">10–11</text>
  <text class="d-sub" x="418" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">12–15</text>
  <text class="d-sub" x="483" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">16</text>
  <text class="d-sub" x="509" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">17</text>
  <text class="d-sub" x="548" y="112" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">18–19</text>
  <text class="d-sub" x="590" y="86" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">sensor tail</text>
  <text class="d-sub" x="590" y="104" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">0xFF/0xFFFF = absent</text>

  <!-- Finish append -->
  <rect class="d-panel-2" x="40" y="168" width="158" height="64" rx="10" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="119" y="192" text-anchor="middle" style="font-size:12px" fill="#1c1b14" font-size="14px">ride payload</text>
  <text class="d-sub" x="119" y="208" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">N × 20 B samples</text>
  <text class="d-sub" x="119" y="222" text-anchor="middle" style="font-size:12px;fill:#a9501c" fill="#5c5a2e" font-size="12px">written in place</text>

  <line class="d-flow" x1="198" y1="200" x2="302" y2="200" marker-end="url(#rr1)" fill="none" stroke="#a4501e" stroke-width="2" />
  <text class="d-sub" x="250" y="190" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">Finish</text>
  <text class="d-sub" x="250" y="216" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">append only</text>

  <rect class="d-panel" x="308" y="164" width="404" height="34" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="320" y="185" style="font-size:12px" fill="#5c5a2e" font-size="12px"><tspan class="d-label" font-size="14px" fill="#1c1b14">154-byte footer</tspan> — totals · sensors · name · bike · trip · limits</text>

  <rect class="d-hot" x="308" y="206" width="404" height="34" rx="8" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="320" y="227" style="font-size:12px" fill="#5c5a2e" font-size="12px"><tspan class="d-label" style="fill:#a9501c" font-size="14px" fill="#1c1b14">one commit</tspan> — final length + CRC, RECORDING cleared</text>
</svg>
