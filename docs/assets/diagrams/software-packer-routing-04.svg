<svg viewBox="0 0 720 230" role="img" aria-label="The global land-polygons dataset is clipped to the map bounding box and subtracted from it, producing the sea complement. On the device sea is drawn over a land-coloured backdrop." xmlns="http://www.w3.org/2000/svg" width="720" height="230" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="aP4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
  </defs>
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Sea is the clipped complement; land is the backdrop</text>

  <!-- world dataset -->
  <rect x="36" y="50" width="200" height="150" rx="8" style="fill:#bcd3da;stroke:#33575b;stroke-width:1.4" />
  <text class="d-tag" x="48" y="68" style="fill:#2c5230" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">global land polygons</text>
  <path d="M60 110 C 90 80, 130 90, 150 110 C 175 135, 140 175, 100 170 C 70 166, 48 140, 60 110 Z" fill="#cfe0c2" stroke="#3c6b39" stroke-width="1.2" />
  <path d="M170 150 C 190 135, 220 150, 214 175 C 208 192, 178 190, 170 175 Z" fill="#cfe0c2" stroke="#3c6b39" stroke-width="1.2" />
  <!-- bbox window -->
  <rect x="96" y="110" width="80" height="64" fill="none" stroke="#cf6a2a" stroke-width="2.2" />
  <text class="d-sub" x="136" y="105" text-anchor="middle" style="fill:#a9501c;font-size:12px" fill="#5c5a2e" font-size="12px">bbox</text>

  <line class="d-flow" x1="244" y1="125" x2="300" y2="125" marker-end="url(#aP4)" fill="none" stroke="#a4501e" stroke-width="2" />
  <text class="d-sub" x="272" y="115" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">bbox − land</text>

  <!-- result: sea over land -->
  <rect x="312" y="50" width="200" height="150" rx="8" style="fill:#cfe0c2;stroke:#3c6b39;stroke-width:1.4" />
  <text class="d-tag" x="324" y="68" style="fill:#2c5230" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">land backdrop</text>
  <path d="M312 120 C 340 96, 380 104, 400 120 C 430 144, 470 120, 512 132 L512 50 L312 50 Z" fill="#bcd3da" stroke="#33575b" stroke-width="1.4" />
  <text class="d-sub" x="362" y="92" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">sea complement</text>

  <!-- note -->
  <rect class="d-panel-2" x="540" y="74" width="160" height="100" rx="10" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="556" y="98" style="font-size:12px" fill="#5c5a2e" font-size="12px">land = the lowest-z</text>
  <text class="d-sub" x="556" y="114" style="font-size:12px" fill="#5c5a2e" font-size="12px">style; the screen is</text>
  <text class="d-sub" x="556" y="130" style="font-size:12px" fill="#5c5a2e" font-size="12px">cleared to it, then</text>
  <text class="d-sub" x="556" y="146" style="font-size:12px" fill="#5c5a2e" font-size="12px">sea + roads paint</text>
  <text class="d-sub" x="556" y="162" style="font-size:12px" fill="#5c5a2e" font-size="12px">over it.</text>
</svg>
