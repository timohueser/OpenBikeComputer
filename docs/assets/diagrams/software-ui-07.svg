<svg viewBox="0 0 720 278" role="img" aria-label="The guarded hold-to-delete. On the left, the Fields grid with a delete band that fills with a progress bar as you hold. On the right, its two states stacked: normal — hold to delete, and absent — an in-use route or recording ride simply shows no delete row." xmlns="http://www.w3.org/2000/svg" width="720" height="278" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">One guarded hold — the Fields footer, the Route overview + Ride detail rows</text>

  <!-- the one remaining footer screen: the Fields grid -->
  <rect class="d-panel" x="24" y="42" width="228" height="188" rx="11" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <rect x="32" y="50" width="212" height="18" rx="3" style="fill:#aa5500" /><text class="d-sub" x="42" y="63" style="fill:#fff;font-size:12px" fill="#5c5a2e" font-size="12px">FIELDS</text>
  <rect x="32" y="74" width="102" height="44" rx="4" class="d-amber" fill="#f4a81d" />
  <text class="d-sub" x="40" y="86" style="fill:#000;font-size:12px" fill="#5c5a2e" font-size="12px">SPEED</text><text class="d-sub" x="40" y="102" style="fill:#000;font-size:12px" fill="#5c5a2e" font-size="12px">24.3</text>
  <rect x="142" y="74" width="102" height="44" rx="4" class="d-muted" fill="#d6d5c8" />
  <text class="d-sub" x="150" y="86" style="font-size:12px" fill="#5c5a2e" font-size="12px">AVG KPH</text><text class="d-sub" x="150" y="102" style="font-size:12px" fill="#5c5a2e" font-size="12px">17.0</text>
  <rect x="32" y="126" width="102" height="44" rx="4" class="d-muted" fill="#d6d5c8" />
  <text class="d-sub" x="40" y="138" style="font-size:12px" fill="#5c5a2e" font-size="12px">KM DONE</text><text class="d-sub" x="40" y="154" style="font-size:12px" fill="#5c5a2e" font-size="12px">42.5</text>
  <rect x="142" y="126" width="102" height="44" rx="4" class="d-muted" fill="#d6d5c8" />
  <text class="d-sub" x="150" y="138" style="font-size:12px" fill="#5c5a2e" font-size="12px">CLIMBED</text><text class="d-sub" x="150" y="154" style="font-size:12px" fill="#5c5a2e" font-size="12px">▲810</text>
  <!-- footer band -->
  <line x1="36" y1="182" x2="240" y2="182" stroke="#aaaa55" stroke-width="1" />
  <rect x="36" y="190" width="120" height="30" rx="6" style="fill:#c0492e" />
  <rect x="156" y="190" width="84" height="30" rx="6" class="d-muted" fill="#d6d5c8" />
  <text class="d-sub" x="58" y="209" text-anchor="start" style="fill:#fff;font-size:12px" fill="#5c5a2e" font-size="12px">hold to delete</text>
  <text class="d-sub" x="138" y="257" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">bar fills on the live hold</text>

  <!-- the guarded hold's two states -->
  <text class="d-tag" x="292" y="60" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">the guarded hold, two states</text>
  <rect x="292" y="72" width="404" height="30" rx="6" class="d-muted" fill="#d6d5c8" />
  <text class="d-sub" x="308" y="91" style="font-size:12px" fill="#5c5a2e" font-size="12px">hold to delete</text>
  <text class="d-sub" x="470" y="91" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">— normal · a completed hold deletes</text>

  <rect x="292" y="110" width="404" height="30" rx="6" fill="none" stroke="#c9c7b8" stroke-width="1" stroke-dasharray="4 4" />
  <text class="d-sub" x="470" y="129" style="font-size:12px;fill:#4d5b3c" fill="#5c5a2e" font-size="12px">— hidden · item is active / recording</text>

</svg>
