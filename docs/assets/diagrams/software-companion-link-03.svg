<svg viewBox="0 0 720 300" role="img" aria-label="The client uses LIST to reconcile the catalog. LIST supplies StoreId, commit sequence, and entries. The client uses GET for required objects. Protocol v4 does not send a ride acknowledgment." xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="sy-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
    <marker id="sy-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa884" /></marker>
    <marker id="sy-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf6a2a" /></marker>
  </defs>
  <text class="d-tag" x="20" y="22" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Reconciliation — LIST identifies the store and catalog</text>

  <rect class="d-panel" x="16" y="70" width="150" height="72" rx="10" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="91" y="42" text-anchor="middle" style="fill:#6b7758" fill="#5c5a2e" font-size="12px">on the device</text>
  <text class="d-label" x="91" y="98" text-anchor="middle" fill="#1c1b14" font-size="14px">store changes</text>
  <text class="d-sub" x="91" y="116" text-anchor="middle" fill="#5c5a2e" font-size="12px">upload · ride</text>
  <text class="d-sub" x="91" y="132" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">device-side delete</text>

  <rect class="d-panel-2" x="192" y="70" width="162" height="72" rx="10" style="fill:#eef2df" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="273" y="98" text-anchor="middle" style="fill:#3c6b39" fill="#1c1b14" font-size="14px">catalog commit</text>
  <text class="d-sub" x="273" y="118" text-anchor="middle" style="font-size:9.5px" fill="#5c5a2e" font-size="12px">StoreId · sequence</text>
  <text class="d-sub" x="273" y="134" text-anchor="middle" fill="#5c5a2e" font-size="12px">LIST response</text>

  <rect class="d-panel" x="380" y="70" width="150" height="72" rx="10" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="455" y="42" text-anchor="middle" style="fill:#6b7758" fill="#5c5a2e" font-size="12px">on the phone</text>
  <text class="d-label" x="455" y="98" text-anchor="middle" fill="#1c1b14" font-size="14px">LIST changed →</text>
  <text class="d-sub" x="455" y="118" text-anchor="middle" fill="#5c5a2e" font-size="12px">download the list</text>
  <text class="d-sub" x="455" y="134" text-anchor="middle" fill="#5c5a2e" font-size="12px">paged LIST</text>

  <rect class="d-hot" x="562" y="70" width="142" height="72" rx="10" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-label" x="633" y="98" text-anchor="middle" style="fill:#a9501c" fill="#1c1b14" font-size="14px">GET required</text>
  <text class="d-sub" x="633" y="118" text-anchor="middle" fill="#5c5a2e" font-size="12px">objects, on</text>
  <text class="d-sub" x="633" y="134" text-anchor="middle" fill="#5c5a2e" font-size="12px">the stream</text>

  <line class="d-flow" x1="166" y1="106" x2="196" y2="106" marker-end="url(#sy-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="348" y1="106" x2="378" y2="106" marker-end="url(#sy-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="530" y1="106" x2="560" y2="106" marker-end="url(#sy-a)" fill="none" stroke="#a4501e" stroke-width="2" />

  <!-- loop back -->
  <path d="M633 142 C 633 190, 91 190, 91 144" fill="none" stroke="#9aa884" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#sy-m)" />
  <text class="d-sub" x="360" y="202" text-anchor="middle" style="fill:#6b7758" fill="#5c5a2e" font-size="12px">on the next audit</text>

  <!-- retired ackRides lane -->
  <line x1="20" y1="216" x2="700" y2="216" style="stroke:#d6cda8;stroke-width:1" />
  <text class="d-tag" x="20" y="242" style="fill:#a9501c" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Protocol v4 has no ride-acknowledgment mutation</text>
  <rect class="d-panel" x="380" y="252" width="150" height="34" rx="9" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="455" y="273" text-anchor="middle" fill="#5c5a2e" font-size="12px">phone stores verified ride</text>
  <line x1="378" y1="269" x2="168" y2="269" style="stroke:#cf6a2a;stroke-width:1.6" marker-end="url(#sy-k)" />
  <text class="d-sub" x="273" y="262" text-anchor="middle" style="fill:#a9501c;font-size:9px" fill="#5c5a2e" font-size="12px">ARCHIVE_RIDE</text>
  <rect class="d-hot" x="16" y="252" width="150" height="34" rx="9" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="91" y="273" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">device persists archive proof</text>
</svg>
