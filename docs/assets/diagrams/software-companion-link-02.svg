<svg viewBox="0 0 720 372" role="img" aria-label="A PUT has four stages. The client sends a PUT control frame. It sends stream frames on L2CAP CoC. The device verifies length and CRC. The PUT response reports the commit or an error." xmlns="http://www.w3.org/2000/svg" width="720" height="372" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="tf-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
    <marker id="tf-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf6a2a" /></marker>
  </defs>
  <text class="d-tag" x="20" y="22" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">One PUT — request · stream · commit</text>

  <!-- actors -->
  <rect class="d-panel" x="80" y="40" width="140" height="34" rx="9" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="150" y="62" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">companion app</text>
  <rect class="d-panel" x="500" y="40" width="140" height="34" rx="9" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="570" y="62" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">OBC device</text>

  <!-- lifelines -->
  <line x1="150" y1="74" x2="150" y2="352" style="stroke:#9aa884;stroke-width:1.2;stroke-dasharray:4 4" />
  <line x1="570" y1="74" x2="570" y2="352" style="stroke:#9aa884;stroke-width:1.2;stroke-dasharray:4 4" />

  <!-- 1: descriptor -->
  <text class="d-sub" x="360" y="104" text-anchor="middle" style="fill:#3c6b39" fill="#5c5a2e" font-size="12px">1 · PUT control frame — objectControl write</text>
  <text class="d-sub" x="360" y="120" text-anchor="middle" fill="#5c5a2e" font-size="12px">RequestId · kind · ObjectId · length · CRC-32</text>
  <line class="d-flow" x1="150" y1="130" x2="570" y2="130" marker-end="url(#tf-a)" fill="none" stroke="#a4501e" stroke-width="2" />

  <!-- 2: stream -->
  <text class="d-sub" x="360" y="164" text-anchor="middle" style="fill:#33575b" fill="#5c5a2e" font-size="12px">2 · stream frames — L2CAP CoC</text>
  <line x1="150" y1="176" x2="565" y2="176" style="stroke:#33575b;stroke-width:6;opacity:0.5" marker-end="url(#tf-a)" />

  <!-- device note -->
  <rect class="d-panel-2" x="404" y="196" width="230" height="46" rx="9" style="fill:#f7f4e6" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="519" y="216" text-anchor="middle" fill="#5c5a2e" font-size="12px">sink → storage, running CRC</text>
  <text class="d-sub" x="519" y="232" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">no whole-object buffer</text>

  <!-- 3: verify -->
  <rect class="d-hot" x="470" y="258" width="200" height="42" rx="9" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="570" y="278" text-anchor="middle" fill="#5c5a2e" font-size="12px">3 · final byte →</text>
  <text class="d-sub" x="570" y="294" text-anchor="middle" fill="#5c5a2e" font-size="12px">verify whole-object CRC-32</text>

  <!-- 4: result -->
  <line class="d-hot" x1="570" y1="322" x2="150" y2="322" marker-end="url(#tf-c)" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="360" y="342" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">4 · PUT response: committed or error</text>
</svg>
