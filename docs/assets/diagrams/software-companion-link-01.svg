<svg viewBox="0 0 720 414" role="img" aria-label="Protocol-v4 control and stream frames use GATT and L2CAP on BLE, or separate bulk endpoint pairs on USB. Both reach the same device transfer engine. BLE device controls are separate from object transfer." xmlns="http://www.w3.org/2000/svg" width="720" height="414" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs><marker id="software-companion-link-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker></defs>
  <text class="d-tag" x="20" y="26" text-anchor="start" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">One transfer protocol, two transport bindings</text>
  <text class="d-title" x="20" y="66" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">Binding</text>
  <text class="d-title" x="208" y="66" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">Control frames</text>
  <text class="d-title" x="461" y="66" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">Stream frames</text>
  <rect class="d-panel" x="20" y="86" width="145" height="78" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="92.5" y="111" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">BLE</text>
  <text class="d-sub" x="92.5" y="131" text-anchor="middle" fill="#5c5a2e" font-size="12px">Authenticated bond</text>
  <rect class="d-panel" x="190" y="86" width="240" height="78" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="310" y="111" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">GATT</text>
  <text class="d-sub" x="310" y="131" text-anchor="middle" fill="#5c5a2e" font-size="12px">objectControl</text>
  <rect class="d-panel" x="455" y="86" width="245" height="78" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="577.5" y="111" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">L2CAP CoC</text>
  <text class="d-sub" x="577.5" y="131" text-anchor="middle" fill="#5c5a2e" font-size="12px">PUT / GET payloads</text>
  <rect class="d-panel" x="20" y="184" width="145" height="78" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="92.5" y="209" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">USB v5</text>
  <text class="d-sub" x="92.5" y="229" text-anchor="middle" fill="#5c5a2e" font-size="12px">Cable access</text>
  <rect class="d-panel" x="190" y="184" width="240" height="78" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="310" y="209" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Control endpoints</text>
  <text class="d-sub" x="310" y="229" text-anchor="middle" fill="#5c5a2e" font-size="12px">Protocol-v4 records</text>
  <rect class="d-panel" x="455" y="184" width="245" height="78" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="577.5" y="209" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Stream endpoints</text>
  <text class="d-sub" x="577.5" y="229" text-anchor="middle" fill="#5c5a2e" font-size="12px">Protocol-v4 records</text>
  <path class="d-flow" d="M310 262 L310 292" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M578 262 L578 292" fill="none" stroke="#a4501e" stroke-width="2" />
<path class="d-flow" d="M310 292 H578" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M444 292 L444 320" marker-end="url(#software-companion-link-1)" fill="none" stroke="#a4501e" stroke-width="2" />
  <rect class="d-panel d-focus" x="190" y="322" width="510" height="70" rx="8" fill="#f9f0ee" stroke="#ae4825" stroke-width="2" />
  <text class="d-title" x="445" y="347" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Device transfer engine</text>
  <text class="d-sub" x="445" y="367" text-anchor="middle" fill="#5c5a2e" font-size="12px">A successful commit makes an upload durable</text>
</svg>
