<svg viewBox="0 0 720 570" role="img" aria-label="The 40-byte navigation directory addresses profiles, a node quadtree with junction chunks, an edge geometry pool, and a snap-anchor index. Search reads junctions; endpoint projection and route output also use geometry. Proportional rulers show a junction record and its 17-byte neighbor fields." xmlns="http://www.w3.org/2000/svg" width="720" height="570" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs><marker id="software-formats-9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker></defs>
  <text class="d-tag" x="20" y="26" text-anchor="start" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">Navigation data · four regions addressed by one directory</text>
  <rect class="d-panel" x="20" y="56" width="680" height="66" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="360" y="81" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Navigation directory · 40 bytes</text>
  <text class="d-sub" x="360" y="101" text-anchor="middle" fill="#5c5a2e" font-size="12px">Offsets, counts, chunk size, and profile count</text>
  <path class="d-flow" d="M360 122 L360 153" fill="none" stroke="#a4501e" stroke-width="2" />
<path class="d-flow" d="M100 153 H625" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M100 153 L100 183" marker-end="url(#software-formats-9)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M275 153 L275 183" marker-end="url(#software-formats-9)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M450 153 L450 183" marker-end="url(#software-formats-9)" fill="none" stroke="#a4501e" stroke-width="2" />
  <path class="d-flow" d="M625 153 L625 183" marker-end="url(#software-formats-9)" fill="none" stroke="#a4501e" stroke-width="2" />
  <rect class="d-panel" x="20" y="186" width="160" height="94" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="100" y="211" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Profiles</text>
  <text class="d-sub" x="100" y="231" text-anchor="middle" fill="#5c5a2e" font-size="12px">1–8 profiles</text>
  <text class="d-sub" x="100" y="248" text-anchor="middle" fill="#5c5a2e" font-size="12px">56 bytes each</text>
  <rect class="d-panel" x="195" y="186" width="160" height="94" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="275" y="211" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Node index</text>
  <text class="d-sub" x="275" y="231" text-anchor="middle" fill="#5c5a2e" font-size="12px">Quadtree + junctions</text>
  <text class="d-sub" x="275" y="248" text-anchor="middle" fill="#5c5a2e" font-size="12px">512-byte chunks</text>
  <rect class="d-panel" x="370" y="186" width="160" height="94" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="450" y="211" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Edge geometry</text>
  <text class="d-sub" x="450" y="231" text-anchor="middle" fill="#5c5a2e" font-size="12px">Stored road shapes</text>
  <text class="d-sub" x="450" y="248" text-anchor="middle" fill="#5c5a2e" font-size="12px">Exact projection</text>
  <rect class="d-panel" x="545" y="186" width="155" height="94" rx="8" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-title" x="622.5" y="211" text-anchor="middle" fill="#1c1b14" font-weight="650" font-size="14px">Snap anchors</text>
  <text class="d-sub" x="622.5" y="231" text-anchor="middle" fill="#5c5a2e" font-size="12px">Find long edges</text>
  <text class="d-sub" x="622.5" y="248" text-anchor="middle" fill="#5c5a2e" font-size="12px">Near the endpoint</text>

<text class="d-title" x="20" y="324" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">One junction · degree 3 example · 13 + 3 × 17 = 64 bytes</text>
