<svg viewBox="0 0 720 250" role="img" aria-label="The POI detail view. On the left, the screen: the POI name with its category icon at the top, a muted subtype subtitle beneath it, then a promoted distance row with the 8-way bearing arrow, a Today heading with an opening-hours range below, a green OPEN pill, and a full-width amber Preview route bar at the bottom. On the right, the three heading states for the hours block: Today with time ranges when open some hours today, Closed today when the schedule has no interval for this weekday, and Hours not listed when the POI has no schedule at all. Below, the open-now pill is derived from the live local clock." xmlns="http://www.w3.org/2000/svg" width="720" height="250" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="aPD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
  </defs>
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">The detail screen, and where "open now" comes from</text>

  <!-- the screen mock -->
  <rect class="d-panel" x="24" y="40" width="232" height="196" rx="10" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <rect x="42" y="54" width="196" height="18" rx="3" style="fill:#aa5500" /><text class="d-sub" x="52" y="67" style="fill:#fff;font-size:12px" fill="#5c5a2e" font-size="12px">POI</text>
  <!-- name row: category icon + name -->
  <circle cx="49" cy="93" r="6" fill="#3d3427" /><path d="M43 90 l6 -8 l6 8 z" fill="#3d3427" />
  <text class="d-sub" x="64" y="98" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">Stadtbaeckerei</text>
  <text class="d-sub" x="42" y="114" style="font-size:12px" fill="#5c5a2e" font-size="12px">Bakery</text>
  <!-- promoted distance + 8-way arrow row -->
  <path d="M52 136 l7 -7 l7 7 l-4 0 l0 9 l-6 0 l0 -9 z" fill="#cf6a2a" />
  <text class="d-sub" x="74" y="144" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">850m</text>
  <!-- hours -->
  <text class="d-sub" x="42" y="164" style="font-size:12px" fill="#5c5a2e" font-size="12px">Today</text>
  <text class="d-sub" x="42" y="182" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">08:00-18:00</text>
  <!-- badge pill -->
  <rect x="42" y="192" width="52" height="15" rx="3" style="fill:#3c6b39" />
  <text class="d-sub" x="68" y="203" text-anchor="middle" style="fill:#fff;font-size:12px" fill="#5c5a2e" font-size="12px">OPEN</text>
  <!-- footer action bar -->
  <rect x="38" y="214" width="204" height="16" rx="5" style="fill:#e3a52b" />
  <text class="d-sub" x="140" y="225" text-anchor="middle" style="fill:#3d3427;font-size:12px" fill="#5c5a2e" font-size="12px">&#9654; Preview route</text>

  <!-- the three heading states -->
  <text class="d-tag" x="292" y="60" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">the hours heading — three states</text>
  <rect class="d-panel-2" x="292" y="72" width="404" height="24" rx="6" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="304" y="88" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">Today</text>
  <text class="d-sub" x="380" y="88" style="font-size:12px" fill="#5c5a2e" font-size="12px">— open some hours today; ranges stacked below</text>
  <rect class="d-panel-2" x="292" y="100" width="404" height="24" rx="6" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="304" y="116" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">Closed today</text>
  <text class="d-sub" x="420" y="116" style="font-size:12px" fill="#5c5a2e" font-size="12px">— has hours, but none this weekday</text>
  <rect class="d-panel-2" x="292" y="128" width="404" height="24" rx="6" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="304" y="144" font-family="var(--mono)" style="font-size:12px" fill="#5c5a2e" font-size="12px">Hours not listed</text>
  <text class="d-sub" x="440" y="144" style="font-size:12px" fill="#5c5a2e" font-size="12px">— HoursRef was 0xFFFF, no badge</text>

  <!-- open-now derivation -->
  <text class="d-tag" x="292" y="178" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">the OPEN / CLOSED badge</text>
  <rect class="d-hot" x="292" y="188" width="404" height="48" rx="10" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="308" y="208" style="font-size:12px" fill="#5c5a2e" font-size="12px">local clock → weekday + minute-of-day</text>
  <line class="d-flow" x1="540" y1="204" x2="580" y2="204" marker-end="url(#aPD)" fill="none" stroke="#a4501e" stroke-width="2" />
  <text class="d-sub" x="590" y="208" style="font-size:12px;fill:#a9501c" fill="#5c5a2e" font-size="12px">is_open?</text>
  <text class="d-sub" x="308" y="226" style="font-size:12px" fill="#5c5a2e" font-size="12px">read live every frame — the one part that isn't frozen</text>
</svg>
