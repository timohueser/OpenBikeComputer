<text class="d-tag" x="20" y="26" text-anchor="start" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">POIs · category index to packed 64-byte records</text>
<text class="d-title" x="20" y="60" text-anchor="start" fill="#1c1b14" font-weight="650" font-size="14px">Category directory</text>
