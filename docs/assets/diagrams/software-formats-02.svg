<text class="d-sub" x="267.5" y="107" text-anchor="middle" fill="#5c5a2e" font-size="12px">coarsest</text>
<rect x="305" y="65" width="60" height="55" fill="#eae4cb" stroke="#3c6b39" stroke-width="1.2" />
