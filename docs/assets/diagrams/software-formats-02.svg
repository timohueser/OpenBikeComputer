<text class="d-sub" x="405.0" y="107" text-anchor="middle" fill="#5c5a2e" font-size="12px">finest</text>
<rect x="445" y="65" width="70" height="55" fill="#f1cfb4" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-label" x="480.0" y="87" text-anchor="middle" fill="#1c1b14" font-size="14px">POIs</text>
