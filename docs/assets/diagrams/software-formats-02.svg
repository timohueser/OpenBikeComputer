<text class="d-sub" x="350.0" y="242" text-anchor="middle" fill="#5c5a2e" font-size="12px">one scaled u32 each</text>
<rect x="430" y="199" width="130" height="57" fill="#cbdadb" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-label" x="495.0" y="222" text-anchor="middle" fill="#1c1b14" font-size="14px">Chunk 0</text>
<text class="d-sub" x="495.0" y="242" text-anchor="middle" fill="#5c5a2e" font-size="12px">geometry records</text>
<rect x="560" y="199" width="130" height="57" fill="#cbdadb" stroke="#3c6b39" stroke-width="1.2" />
<text class="d-label" x="625.0" y="222" text-anchor="middle" fill="#1c1b14" font-size="14px">… Chunk k</text>
<text class="d-sub" x="625.0" y="242" text-anchor="middle" fill="#5c5a2e" font-size="12px">aligned data</text>
<path d="M350 256 V282 H495 V258" fill="none" stroke="#3c6b39" stroke-width="1.5" marker-end="url(#r9arrow)"/>
<text class="d-sub" x="110" y="300" text-anchor="start" fill="#5c5a2e" font-size="12px">The offset table locates each geometry chunk. Global addresses use scaled units.</text>
