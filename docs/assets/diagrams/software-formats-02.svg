<text class="d-sub" x="190.0" y="107" text-anchor="middle" fill="#5c5a2e" font-size="12px">N × 18 B</text>
<rect x="230" y="65" width="75" height="55" fill="#eae4cb" stroke="#3c6b39" stroke-width="1.2" />
