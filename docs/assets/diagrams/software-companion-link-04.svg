<svg viewBox="0 0 720 400" role="img" aria-label="Pairing, reconnect, and rejection in three rows. Top row, first pairing, done once: the device shows a six-digit passkey on its screen; the rider reads it and types it into the phone; the two run an LESC elliptic-curve key exchange; both sides store the resulting bond keys. Middle row, every time after, silent: the device advertises with a stable address; the phone recognises that identity from the bond; the two re-encrypt with the stored long-term key and the phone's rotating address is resolved via the stored identity key; the result is a connected, encrypted link with no dialog. Bottom row, reject-when-bonded: a different phone tries to pair while a bond already exists; the device suppresses its passkey and drops the link; the other phone sees only a generic pairing failure; the only way through is to clear the bond on the device, with Forget phone or a factory reset." xmlns="http://www.w3.org/2000/svg" width="720" height="400" font-family="&#x27;Atkinson&#x27;, system-ui, sans-serif">
  <defs>
    <marker id="pk-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c6b39" /></marker>
  </defs>

  <!-- Row 1: first pairing -->
  <text class="d-tag" x="20" y="24" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">① First pairing — once</text>

  <rect class="d-panel" x="16" y="38" width="150" height="60" rx="10" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="91" y="60" text-anchor="middle" fill="#5c5a2e" font-size="12px">device shows</text>
  <text class="d-title" x="91" y="82" text-anchor="middle" style="fill:#a9501c" fill="#1c1b14" font-weight="650" font-size="14px">428 913</text>

  <rect class="d-panel-2" x="222" y="38" width="150" height="60" rx="10" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="297" y="64" text-anchor="middle" fill="#5c5a2e" font-size="12px">rider reads it,</text>
  <text class="d-sub" x="297" y="80" text-anchor="middle" fill="#5c5a2e" font-size="12px">types it on the phone</text>

  <rect class="d-panel-2" x="428" y="38" width="150" height="60" rx="10" style="fill:#eef2df" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-label" x="503" y="62" text-anchor="middle" style="fill:#3c6b39" fill="#1c1b14" font-size="14px">LESC ECDH</text>
  <text class="d-sub" x="503" y="80" text-anchor="middle" fill="#5c5a2e" font-size="12px">MITM-protected</text>

  <rect class="d-hot" x="622" y="38" width="82" height="60" rx="10" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="663" y="60" text-anchor="middle" fill="#5c5a2e" font-size="12px">bond</text>
  <text class="d-sub" x="663" y="78" text-anchor="middle" fill="#5c5a2e" font-size="12px">stored</text>

  <line class="d-flow" x1="166" y1="68" x2="220" y2="68" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="372" y1="68" x2="426" y2="68" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="578" y1="68" x2="620" y2="68" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />

  <!-- divider -->
  <line x1="20" y1="130" x2="700" y2="130" style="stroke:#d6cda8;stroke-width:1" />

  <!-- Row 2: reconnect -->
  <text class="d-tag" x="20" y="164" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">② Every time after — silent</text>

  <rect class="d-panel" x="16" y="180" width="150" height="66" rx="10" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="91" y="206" text-anchor="middle" fill="#5c5a2e" font-size="12px">device advertises</text>
  <text class="d-sub" x="91" y="224" text-anchor="middle" style="fill:#3c6b39" fill="#5c5a2e" font-size="12px">stable address</text>

  <rect class="d-panel-2" x="222" y="180" width="150" height="66" rx="10" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="297" y="206" text-anchor="middle" fill="#5c5a2e" font-size="12px">phone knows</text>
  <text class="d-sub" x="297" y="224" text-anchor="middle" fill="#5c5a2e" font-size="12px">this identity</text>

  <rect class="d-panel-2" x="424" y="180" width="158" height="66" rx="10" style="fill:#eef2df" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="503" y="202" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">re-encrypt · stored LTK</text>
  <text class="d-sub" x="503" y="220" text-anchor="middle" style="font-size:12px" fill="#5c5a2e" font-size="12px">resolve RPA · stored IRK</text>

  <rect class="d-hot" x="622" y="180" width="82" height="66" rx="10" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="663" y="204" text-anchor="middle" fill="#5c5a2e" font-size="12px">connected</text>
  <text class="d-sub" x="663" y="222" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">encrypted</text>
  <text class="d-sub" x="663" y="238" text-anchor="middle" fill="#5c5a2e" font-size="12px">no dialog</text>

  <line class="d-flow" x1="166" y1="213" x2="220" y2="213" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="372" y1="213" x2="426" y2="213" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="578" y1="213" x2="620" y2="213" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <text class="d-sub" x="360" y="266" text-anchor="middle" style="fill:#4d5b3c" fill="#5c5a2e" font-size="12px">bonded + powered + in range  ⇒  connected + encrypted, no interaction</text>

  <!-- divider -->
  <line x1="20" y1="290" x2="700" y2="290" style="stroke:#d6cda8;stroke-width:1" />

  <!-- Row 3: reject-when-bonded -->
  <text class="d-tag" x="20" y="322" style="fill:#a9501c" fill="#5c5a2e" font-size="11px" font-weight="650" letter-spacing="0.04em">③ Another phone, while bonded — rejected</text>

  <rect class="d-panel" x="16" y="336" width="150" height="52" rx="10" fill="#fff" stroke="#a4501e" stroke-width="1.5" />
  <text class="d-sub" x="91" y="358" text-anchor="middle" fill="#5c5a2e" font-size="12px">a different phone</text>
  <text class="d-sub" x="91" y="374" text-anchor="middle" fill="#5c5a2e" font-size="12px">tries to pair</text>

  <rect class="d-panel-2" x="222" y="336" width="184" height="52" rx="10" style="fill:#f4e7de" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="314" y="358" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">bond exists →</text>
  <text class="d-sub" x="314" y="374" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">no passkey, link dropped</text>

  <rect class="d-panel-2" x="462" y="336" width="120" height="52" rx="10" fill="#e7ecdf" stroke="rgba(92, 90, 46, 0.32)" stroke-width="1.2" />
  <text class="d-sub" x="522" y="358" text-anchor="middle" fill="#5c5a2e" font-size="12px">phone sees a</text>
  <text class="d-sub" x="522" y="374" text-anchor="middle" fill="#5c5a2e" font-size="12px">generic failure</text>

  <rect class="d-hot" x="606" y="336" width="98" height="52" rx="10" style="fill:#f8efe4" fill="none" stroke="#ae4825" stroke-width="2.4" />
  <text class="d-sub" x="655" y="350" text-anchor="middle" fill="#5c5a2e" font-size="12px">Forget phone</text>
  <text class="d-sub" x="655" y="365" text-anchor="middle" style="fill:#a9501c" fill="#5c5a2e" font-size="12px">or</text>
  <text class="d-sub" x="655" y="380" text-anchor="middle" fill="#5c5a2e" font-size="12px">Factory reset</text>

  <line class="d-flow" x1="166" y1="362" x2="220" y2="362" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
  <line class="d-flow" x1="406" y1="362" x2="460" y2="362" marker-end="url(#pk-a)" fill="none" stroke="#a4501e" stroke-width="2" />
</svg>
