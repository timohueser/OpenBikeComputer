<div id="obc-easier-route" aria-label="Easier route wireframe alternatives">
  <div class="text-small text-muted">240 × 320 · Fictional routes and costs · Up / Down to browse, Select to preview</div>
  <div class="er-options">
    <section aria-label="A: Goal first">
      <h3>A · Goal first</h3>
      <canvas width="240" height="320" role="img" aria-label="Goal first screen"></canvas>
      <div class="er-keys" aria-label="Controls for option A">
        <button type="button" data-key="up">Up</button><button type="button" data-key="down">Down</button><button type="button" data-key="select">Select</button><button type="button" data-key="back">Back</button>
      </div>
      <div class="sr-only" aria-live="polite"></div>
    </section>
    <section aria-label="B: Compare numbers">
      <h3>B · Compare numbers</h3>
      <canvas width="240" height="320" role="img" aria-label="Compare numbers screen"></canvas>
      <div class="er-keys" aria-label="Controls for option B">
        <button type="button" data-key="up">Up</button><button type="button" data-key="down">Down</button><button type="button" data-key="select">Select</button><button type="button" data-key="back">Back</button>
      </div>
      <div class="sr-only" aria-live="polite"></div>
    </section>
    <section aria-label="C: Map first">
      <h3>C · Map first</h3>
      <canvas width="240" height="320" role="img" aria-label="Map first screen"></canvas>
      <div class="er-keys" aria-label="Controls for option C">
        <button type="button" data-key="up">Up</button><button type="button" data-key="down">Down</button><button type="button" data-key="select">Select</button><button type="button" data-key="back">Back</button>
      </div>
      <div class="sr-only" aria-live="polite"></div>
    </section>
  </div>
</div>
<style>
#obc-easier-route .er-options { display:grid; grid-template-columns:repeat(3,240px); gap:8px; margin-top:12px; justify-content:center; }
#obc-easier-route section { min-width:0; }
#obc-easier-route h3 { margin-bottom:10px; }
#obc-easier-route canvas { display:block; width:240px; height:320px; image-rendering:pixelated; background:#fff; border-radius:4px; }
#obc-easier-route .er-keys { display:flex; gap:4px; margin-top:8px; }
#obc-easier-route .er-keys button { flex:1; padding:8px 0; border:1px solid light-dark(#c1bdb6,#69665f); border-radius:5px; background:light-dark(#f4f2ed,#33312e); color:light-dark(#171511,#fff); font:inherit; cursor:pointer; }
#obc-easier-route .er-keys button:active { background:#ffaa00; color:#000; }
@media(max-width:735px) { #obc-easier-route .er-options { grid-template-columns:240px; gap:24px; } }
@media(pointer:coarse) { #obc-easier-route .er-keys button { min-height:44px; } }
</style>
<script>
(() => {
  const root = document.getElementById('obc-easier-route');
  const font = Uint8Array.from(atob('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGYAAAAAAAABgAAAAAAAAAAAAAAAAAAAAGYAABgAAAABgAAAAAAAAAAAAAAAAAABgGYGYBgAADgBgAwGAAAAAAAAAAAAAAABgGYGYH4OMGwBgBgDAAAAAAAAAAAAMAABgGYGYNsbMMYBgDABgAAAAAAAAAAAMAABgAAGYZmbYMYAADABgYMBgAAAAAAAYAABgAAf+ZgOYMYAAGAAwMYBgAAAAAAAYAABgAAGYZgAwGwAAGAAwGwBgAAAAAAAwAABgAAGYNgAwDgAAGAAwDgBgAAAAAAAwAABgAAGYH4BgHmAAGAAw/+f+AAf+AABgAABgAAGYBsBgM2AAGAAwDgBgAAAAAABgAABgAAGYBmDAYcAAGAAwGwBgAAAAAADAAAAAAAf+BmDAYMAAGAAwMYBgAAAAAADAAAAAAAGYZmGcYMAADABgYMBgBgAAAAGAAABgAAGYNsG2YcAADABgAAAABgAABgGAAABgAAGYH4M2M2AABgDAAAAABgAABgMAAABgAAGYBgMcHmAAAwGAAAAABgAABgMAAAAAAAAABgAAAAAAAAAAAAAADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH4BgH4H4AGf+H8f+H4H4AAAAAMAAYAH4MMDgMMMMAOYAMAYGMMMMAAAAAYAAMAMMYGHgYGYGAeYAYAYGYGYGAAAAAwAAGAYGYGNgYGAGA2YAYAAGYGYGAAAABgAADAYGYGBgYGAGBmYAYAAMYGYGBgBgDAAABgYGYGBgAGAGDGYAYAAMYGYGBgBgGAf+AwAMYGBgAMAMGGf4f4AYMMYGBgBgMAAAAYAYYGBgAYD4MGAMYMAYH4MGAAAAYAAAAMAwYGBgAwAMYGAGYGAwMMH+AAAAMAAAAYBgYGBgBgAGYGAGYGAwYGAGAAAAGAAAAwBgYGBgDAAGYGAGYGBgYGAGAAAADAf+BgAAYGBgGAAGf+AGYGBgYGAGBgBgBgAADAAAYGBgMAYGAGYGYGBgYGAGBgBgAwAAGABgMMBgYAMMAGMMMMBgMMAMBgBgAYAAMABgH4P8f+H4AGH4H4BgH4P4AABgAMAAYABgAAAAAAAAAAAAAAAAAAAAAADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP4H4f4H4f4f+f+H4YGH4A/YGYAgCYGH4YMMMYMMMYMYAYAMMYGBgAMYMYAwGYGMMwGYGYGYGYGYAYAYGYGBgAMYYYA4OYGYGw+YGYGYGYGYAYAYGYGBgAMYwYA8eYGYGxmYGYGYAYGYAYAYAYGBgAMZgYA22cGYGzGYGYMYAYGYAYAYAYGBgAMbAYAzmeGYGzGYGf4YAYGYAYAYAYGBgAMeAYAxGbGYGzGYGYMYAYGf4f4Y+f+BgAMcAYAwGZmYGzGf+YGYAYGYAYAYGYGBgAMeAYAwGY2YGzGYGYGYAYGYAYAYGYGBgAMbAYAwGYeYGxmYGYGYAYGYAYAYGYGBgYMZgYAwGYOYGw+YGYGYGYGYAYAYGYGBgYMYwYAwGYGYGwAYGYGYGYGYAYAYGYGBgYMYYYAwGYGYGYAYGYMMMYMYAYAMMYGBgMYYMYAwGYGMMP+YGf4H4f4f+YAH4YGH4HwYGf+wGYGH4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwAAf4H4f4H4f+YGYGwGYGYGf+HwAAHwGYAAYMMMYMMMBgYGYGwGYGYGAGGAMAAwMMAAYGYGYGYGBgYGYGwGMMMMAGGAMAAwYGAAYGYGYGYABgYGYGwGMMMMAGGAGAAwAAAAYGYGYGYABgYGMMwGGYGYAMGAGAAwAAAAYGYGYGYABgYGMMwGGYGYAYGADAAwAAAAYMYGYMMABgYGMMwGDwDwAwGADAAwAAAAf4YGf4H4BgYGMMwGBgDwBgGABgAwAAAAYAYGeAAMBgYGGYxGDwBgDAGABgAwAAAAYAYGbAAGBgYGGYzmGYBgGAGAAwAwAAAAYAYGZgAGBgYGGY22GYBgMAGAAwAwAAAAYAYGYwAGBgYGDw8eMMBgYAGAAYAwAAAAYAZmYYYGBgYGDw4OMMBgYAGAAYAwAAAAYAM8YMMMBgMMBgwGYGBgYAGAAMAwAAAAYAH4YGH4BgH4BggCYGBgf+HwAMHwAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAAAAAAAAAAAAAAf+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAGAAA+AAYABgAMMAHgAAAAAAAAAAYAAAAGAABgAAYABgAMMABgAAAAAAAAAAYAAAAGAABgAAYABgAMMABgAAAAAAAAAAYAAAAGAABgAAYAAAAAMABgAAAAAAAAP4f4H4H+H4P8H+f4HgA8MGBgf4f4H4AAAMYMMMMGMMBgMGYMBgAMMMBgZsYMMMAAAGYGYGYGYGBgYGYGBgAMMYBgZmYGYGAAAGYGYAYGYGBgYGYGBgAMMwBgZmYGYGAAH+YGYAYGYGBgYGYGBgAMNgBgZmYGYGAAMGYGYAYGf+BgYGYGBgAMPABgZmYGYGAAYGYGYAYGYABgYGYGBgAMNgBgZmYGYGAAYGYGYAYGYABgYGYGBgAMMwBgZmYGYGAAYGYGYGYGYABgYGYGBgAMMYBgZmYGYGAAMGYMMMMGMGBgMOYGBgAMMMBgZmYGMMAAH+f4H4H+H8BgH+YGH4AMMGH4ZmYGH4AAAAAAAAAAAAAAAGAAAAMMAAAAAAAAAAAAAAAAAAAAAAAAAGAAAAMMAAAAAAAAAAAAAAAAAAAAAAAAAMAAAAGYAAAAAAAAAAAAAAAAAAAAAAAAP4AAAADwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAZmAAAAAAAAAADAAAAAAAAAAAAAA4BgOAZmAAAAAAAAAADAAAAAAAAAAAAABgBgDAY8AAAAAAAAAADAAAAAAAAAAAAADABgBgAAAAAAAAAAAADAAAAAAAAAAAAADABgBgAAAAf4H+Z+P8f4YGYGYGYGYGf+DABgBgAAAAYMMGbAYGDAYGYGYGYGYGAGDABgBgAAAAYGYGeAYADAYGYGYGMMYGAMDABgBgAAAAYGYGcAYADAYGMMYGGYYGAYOABgA4AAAAYGYGYAYADAYGMMZmDwYGAwDABgBgAAAAYGYGYAP8DAYGGYZmBgYGBgDABgBgAAAAYGYGYAAGDAYGGYZmDwYGDADABgBgAAAAYGYGYAAGDAYGDwZmGYYGGADABgBgAAAAYGYGYAAGDAYGDwZmMMYGMADABgBgAAAAYMMGYAYGDAMGBgZmYGMOYABgBgDAAAAAf4H+YAP8B8H+BgP8YGH+f+A4BgOAAAAAYAAGAAAAAAAAAAAAAAAGAAAAAAAAAAAAYAAGAAAAAAAAAAAAAAAGAAAAAAAAAAAAYAAGAAAAAAAAAAAAAAAMAAAAAAAAAAAAYAAGAAAAAAAAAAAAAAP4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'), c => c.charCodeAt(0));
  const design = { time: false };
  const routes = [
    { name:'Less climbing', km:45, up:440, rough:6, mins:190, delta:'-420m up  +3km', gain:'420m less ascent', cost:'3km longer' },
    { name:'Smoother surface', km:47, up:980, rough:2, mins:195, delta:'-4km rough +5km', gain:'4km less rough', cost:'5km / 120m more' },
    { name:'Shorter ride', km:36, up:1110, rough:6, mins:150, delta:'-6km  +250m up', gain:'6km shorter', cost:'250m more ascent' }
  ];
  const states = [...root.querySelectorAll('section')].map((section, i) => ({section, variant:i, selected:0, page:'choices'}));
  const white='#ffffff', ink='#000000', muted='#555500', amber='#ffaa00', brown='#aa5500';
  function draw(state) {
    const canvas=state.section.querySelector('canvas'), c=canvas.getContext('2d'), r=routes[state.selected];
    c.fillStyle=white; c.fillRect(0,0,240,320);
    function rect(x,y,w,h,color,radius=0) { c.fillStyle=color; c.beginPath(); c.roundRect(x,y,w,h,radius); c.fill(); }
    function txt(s,x,y,color=ink) {
      if (x+s.length*12>240 || y+24>320) throw new Error('Text outside screen: '+s);
      c.fillStyle=color;
      for(let k=0;k<s.length;k++) {
        const code=s.charCodeAt(k)-32;
        if(code<0 || code>=96) continue;
        const gx=(code%16)*12, gy=Math.floor(code/16)*24;
        for(let yy=0;yy<24;yy++) for(let xx=0;xx<12;xx++) {
          if(font[(gy+yy)*24+Math.floor((gx+xx)/8)] & (128 >> ((gx+xx)%8))) c.fillRect(x+k*12+xx,y+yy,1,1);
        }
      }
    }
    function button(label) { rect(12,280,216,32,amber,6); txt(label,120-label.length*6,284); }
    function head(label) { rect(4,4,232,34,brown,6); txt(label,12,9,white); }
    function line(points,color,dash=[]) { c.beginPath(); c.strokeStyle=color; c.lineWidth=3; c.setLineDash(dash); points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y)); c.stroke(); c.setLineDash([]); }
    function routeSketch() {
      txt('Schematic',12,43,muted);
      const old=[[25,156],[57,148],[80,111],[118,118],[142,84],[175,95],[212,73]];
      const alternatives=[[[25,156],[57,148],[86,164],[127,154],[173,125],[175,95],[212,73]],[[25,156],[52,172],[114,169],[174,137],[206,102],[212,73]],[[25,156],[57,148],[113,135],[162,95],[212,73]]];
      line(old,muted,[4,3]); line(alternatives[state.selected],amber);
      rect(22,153,7,7,ink); rect(209,70,7,7,ink);
      txt('You',12,177); txt('Finish',156,45);
      line([[82,184],[102,184]],muted,[4,3]); txt('Now',108,174,muted);
      line([[160,184],[180,184]],amber); txt('New',188,174);
    }
    function table(top, includeDelta=false) {
      txt('Now',96,top,muted); txt('New',168,top,brown);
      const rows=[['Ride','42km',r.km+'km'],['Up','860m',r.up+'m'],['Rough','6km',r.rough+'km']];
      if(design.time) rows.push(['Time','~2:55','~'+Math.floor(r.mins/60)+':'+String(r.mins%60).padStart(2,'0')]);
      rows.forEach(([label,now,next],i)=>{
        const y=top+30+i*31; txt(label,12,y); txt(now,150-now.length*12,y,muted); txt(next,228-next.length*12,y);
      });
    }
    if(state.page==='accepted') {
      head('Route changed'); txt(r.name,12,58); txt('Same destination',12,94);
      txt(r.km+'km remaining',12,140); txt(r.up+'m ascent',12,172);
      txt('Demo only',12,231,muted); button('Back to choices');
    } else if(state.page==='preview') {
      head('Review route'); txt(r.name,12,43); txt('Same destination',12,69,muted);
      table(104);
      if(!design.time) txt(r.cost,12,239,brown);
      button('Use this route');
    } else if(state.variant===0) {
      head('Easier route'); txt('To destination',12,44,muted); txt('42km   860m up',12,68);
      routes.forEach((route,i)=>{
        const y=101+i*56; if(i===state.selected) rect(8,y,224,53,amber,6);
        txt(route.name,12,y+1); txt(route.delta,12,y+25);
      });
      button('Preview route');
    } else if(state.variant===1) {
      head('Easier route'); txt(r.name,12,45); txt((state.selected+1)+'/3 to destination',12,71,muted);
      table(110);
      if(!design.time) txt(r.gain,12,245,brown);
      button('Preview route');
    } else {
      head('Easier route'); routeSketch();
      rect(8,202,224,70,amber,6); txt(r.name,12,200); txt(r.gain,12,224); txt(r.cost,12,248);
      button('Preview route');
    }
    const overview=state.page==='choices' ? 'Current remaining route: 42 kilometres, 860 metres ascent, 6 kilometres rough surface. ' : '';
    const label=state.page==='accepted' ? 'Demo route accepted. '+r.name+'. Same destination.' : overview+r.name+'. '+r.gain+'. '+r.cost+'. '+(state.page==='preview'?'Select Use this route to accept.':'Up and Down change the alternative. Select opens the review.');
    canvas.setAttribute('aria-label',label); state.section.querySelector('[aria-live]').textContent=label;
  }
  function render() { states.forEach(draw); }
  states.forEach(state=>state.section.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
    const key=button.dataset.key;
    if(key==='back') state.page='choices';
    else if(key==='select') state.page=state.page==='choices'?'preview':state.page==='preview'?'accepted':'choices';
    else if(state.page==='choices') state.selected=(state.selected+(key==='down'?1:2))%3;
    draw(state);
  })));
  render();
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:render});
    tweak.addToggle(design,'time',{label:'Include approximate ride times'});
  }
})();
</script>
