# Trunk configuration for the site (apps/obc-web-demo — the thin wasm host around
# the shared firmware crates — is built to wasm as the live device demo; index.html
# references its Cargo.toml via the data-trunk rust link). Paths are resolved relative
# to this file's directory, so `trunk` can be invoked from anywhere via
# `--config docs/Trunk.toml`.

[build]
target = "index.html"
dist = "dist"

# Render the documentation (content/*.md -> docs/) before every build and serve, so
# the `copy-dir href="docs"` in index.html always ships current HTML. build_docs.py is
# stdlib-only Python, so CI needs nothing beyond the python3 already on the runner.
# Trunk runs hooks from this file's directory, so the script path is relative to docs/.
[[hooks]]
stage = "pre_build"
command = "python3"
command_arguments = ["build_docs.py"]

[watch]
# build_docs.py regenerates docs/ and blog/ (rendered HTML) on every pre_build hook
# run; without ignoring them, trunk watches its own hook's output and rebuilds forever.
ignore = ["docs", "blog"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
