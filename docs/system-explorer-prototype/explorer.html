:root {
  color-scheme: light;
  --parchment: #f4f2eb;
  --parchment-2: #e7ecdf;
  --parchment-3: #d6d5c8;
  --panel: #fff;
  --line: rgba(92, 90, 46, 0.16);
  --line-strong: rgba(92, 90, 46, 0.32);
  --ink: #1c1b14;
  --ink-soft: #5c5a2e;
  --ink-faint: #676443;
  --wood: #757047;
  --amber: #f4a81d;
  --on-amber: #1c1b14;
  --forest: #a4501e;
  --forest-deep: #803b13;
  --coral: #ae4825;
  --water: #33575b;
  --route: #cc2a93;
  --sans: "Atkinson", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Atkinson Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Explorer roles. Each one names a site token, so the dark theme follows. */
  --edge: var(--wood);
  --bad: var(--coral);
  --bad-soft: color-mix(in srgb, var(--coral) 12%, var(--panel));
  --cycle: var(--amber);
  --cycle-ink: color-mix(in srgb, var(--amber) 38%, var(--ink));
  --cycle-soft: color-mix(in srgb, var(--amber) 20%, var(--panel));
  --uses: var(--water);
  --uses-soft: color-mix(in srgb, var(--water) 12%, var(--panel));
  --usedby: var(--route);
  --usedby-soft: color-mix(in srgb, var(--route) 10%, var(--panel));
  --ok: var(--water);
  --ok-soft: color-mix(in srgb, var(--water) 12%, var(--panel));
  --sel: color-mix(in srgb, var(--forest) 8%, var(--panel));
  --hl: var(--parchment-2);
}
/* The site sets data-theme from theme.js; a standalone preview falls back to the OS setting. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --parchment: #16150f;
    --parchment-2: #232820;
    --parchment-3: #414233;
    --panel: #201f17;
    --line: rgba(189, 180, 126, 0.15);
    --line-strong: rgba(189, 180, 126, 0.3);
    --ink: #f2efe3;
    --ink-soft: #bdb47e;
    --ink-faint: #aaa383;
    --wood: #bdb47e;
    --amber: #f2a93a;
    --forest: #f2a93a;
    --forest-deep: #ffc76d;
    --coral: #ef996f;
    --water: #8bb9bd;
    --route: #f175c5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --parchment: #16150f;
  --parchment-2: #232820;
  --parchment-3: #414233;
  --panel: #201f17;
  --line: rgba(189, 180, 126, 0.15);
  --line-strong: rgba(189, 180, 126, 0.3);
  --ink: #f2efe3;
  --ink-soft: #bdb47e;
  --ink-faint: #aaa383;
  --wood: #bdb47e;
  --amber: #f2a93a;
  --forest: #f2a93a;
  --forest-deep: #ffc76d;
  --coral: #ef996f;
  --water: #8bb9bd;
  --route: #f175c5;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--parchment);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
a { color: var(--forest); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--forest-deep); }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
::selection { background: var(--amber); color: var(--on-amber); }
.wrap { max-width: 1340px; margin: 0 auto; padding: 36px 28px 48px; }
.name, code { font-family: var(--mono); }
/* Small mono capitals: the site's section label (.nav-section, .toc-title). */
.label, .filters legend, .focus .col h3, .problems h3, .ov-col h3 {
  font: 400 11px/1.4 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint);
}

/* Header */
header.top { margin-bottom: 20px; }
header.top h1 { font: 700 clamp(30px, 4vw, 41px)/1.12 var(--sans); letter-spacing: -0.01em; margin: 0 0 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.note { color: var(--ink-soft); font-size: 17px; line-height: 1.5; margin: 0; }
.stats { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 700; }
.stats .bad { color: var(--bad); }
.stats .warn { color: var(--cycle-ink); }

/* Toolbar */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
}
.tabs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.tabs button {
  border: 0; background: var(--panel); padding: 7px 16px; cursor: pointer; color: var(--ink-soft);
  border-right: 1px solid var(--line-strong);
}
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--parchment-2); color: var(--forest-deep); font-weight: 700; }
.tabs button:not([aria-selected="true"]):hover { background: var(--parchment); color: var(--ink); }
.tabs button:focus-visible { outline-offset: -2px; }
.search input {
  width: 240px; max-width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--parchment); color: var(--ink); font: 13px var(--mono);
}
.search input::placeholder { color: var(--ink-faint); }
.search input:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
.filters { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; }
.filters fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.filters legend { float: left; margin-right: 4px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.filters input { accent-color: var(--forest); margin: 0; }
.sep { width: 1px; align-self: stretch; background: var(--line); }

/* Trail and legend */
.subbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin: 14px 0 18px; }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font: 13px var(--mono); }
.trail .back {
  font: 13px var(--sans); border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-right: 6px;
}
.trail .back:hover:not(:disabled) { border-color: var(--forest); }
.trail .back:disabled { color: var(--ink-faint); opacity: .6; cursor: default; }
.trail .crumb { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--forest); border-radius: 4px; }
.trail .crumb:hover { background: var(--parchment-2); color: var(--forest-deep); }
.trail .crumb.cur { color: var(--ink); font-weight: 700; cursor: default; background: none; }
.trail .gt { color: var(--ink-faint); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { overflow: visible; }
.sw-vio, .chip .vio { font: 700 10.5px/1 var(--mono); font-style: normal; padding: 2px 5px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
.ring { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--cycle); }

/* Shared edge styles */
.wire { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.wire.test { stroke-dasharray: 5 4; }
.wire.cycle { stroke: var(--cycle); stroke-width: 3.5; }
.wire.undecl { stroke: var(--bad); }
.wire.uses { stroke: var(--uses); stroke-width: 1.75; }
.wire.usedby { stroke: var(--usedby); stroke-width: 1.75; }
.ah-edge { fill: var(--edge); }
.ah-bad { fill: var(--bad); }
.ah-warn { fill: var(--cycle); }
.ah-uses { fill: var(--uses); }
.ah-usedby { fill: var(--usedby); }

.view[hidden] { display: none; }

/* Focus view */
.focus {
  position: relative; display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 380px) minmax(0, 1fr);
  grid-template-rows: minmax(360px, auto) auto;
  column-gap: 72px;
  --col-head: 26px;
  --panel-gap: 14px;
}
.focus > svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.focus .col { display: flex; flex-direction: column; min-width: 0; position: relative; }
.focus .col h3 { margin: 0 0 10px; line-height: calc(var(--col-head) - 10px); }
.focus .col h3 .n, .problems h3 .n { color: var(--ink-soft); letter-spacing: 0; }
.focus .stack { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: 1; }
.focus .col.usedby h3 { text-align: right; }
.focus .empty { color: var(--ink-faint); font-size: 14px; padding: 14px; border: 1px dashed var(--line-strong); border-radius: 8px; text-align: center; }
.focus .col.uses { grid-area: 1 / 1; }
.focus .col.usedby { grid-area: 1 / 3; }
/* The card is centred on the neighbour stacks, which start below their column heading. */
.focus > .center-card { grid-area: 1 / 2; align-self: center; margin-top: var(--col-head); }
.focus > .problems { grid-area: 2 / 2; align-self: start; }
.focus.hovering .wire { opacity: .2; }
.focus.hovering .wire.hot { opacity: 1; }

.nb {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center;
  text-align: left; cursor: pointer; padding: 9px 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
.nb:hover { border-color: var(--forest); }
.nb .glyph { display: none; grid-row: span 3; }
.nb .nb-name { font: 600 13.5px/1.3 var(--mono); overflow-wrap: anywhere; }
.nb .nb-meta { font-size: 12.5px; color: var(--ink-soft); }
.nb .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.nb .tags:empty { display: none; }
.nb > :not(.glyph) { grid-column: 2; }
.pdot, .nb.problem .nb-name::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); margin-left: 6px; vertical-align: middle; }

/* Tags follow the site's .pill. */
.tag, .badge {
  display: inline-block; font: 11px/1.3 var(--mono); letter-spacing: 0.04em; padding: 1px 8px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.tag.test { border-color: var(--line-strong); border-style: dashed; color: var(--ink-soft); }
.tag.undecl { background: var(--bad-soft); color: var(--bad); }
.tag.cycle { background: var(--cycle-soft); color: var(--cycle-ink); }
.badge.approved { background: var(--ok-soft); color: var(--ok); }
.badge.draft { background: var(--parchment-3); color: var(--ink-soft); }
.badge.kind { border-color: var(--line-strong); color: var(--ink-soft); }

.center-card { background: var(--panel); border: 2px solid var(--forest); border-radius: 12px; padding: 18px 20px; }
.center-card .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.center-card .area { margin-left: auto; font-size: 13px; color: var(--ink-soft); }
.center-card h2 { font: 600 22px/1.25 var(--mono); margin: 12px 0 6px; overflow-wrap: anywhere; }
.center-card p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; }
.doc-link { display: inline-block; margin: 0 0 14px; font-size: 14px; font-weight: 600; }
.facts { display: flex; gap: 28px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); }
.facts dt { font: 11px/1.4 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
.facts dd { margin: 2px 0 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.facts dd.bad { color: var(--bad); }

/* Problems: one quiet panel, grouped by rule. */
.problems { margin-top: 14px; padding: 14px 18px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.problems h3 { margin: 0 0 4px; }
.pgroup { padding: 10px 0; border-top: 1px solid var(--line); }
.problems h3 + .pgroup { border-top: 0; padding-top: 6px; }
.pgroup h4 { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--bad); }
.pgroup.cycle h4 { color: var(--cycle-ink); }
.pgroup h4 .n { margin-left: 4px; font-weight: 400; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.pgroup .with { margin: 0 0 6px; font-size: 13.5px; color: var(--ink-soft); }
.pgroup .with button {
  border: 0; background: none; padding: 0; color: var(--forest); font: 600 13px var(--mono);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; cursor: pointer;
}
.pgroup .with button:hover { color: var(--forest-deep); }
.pgroup > ul { list-style: none; margin: 0; padding: 0; }
.pgroup > ul > li { padding: 5px 0; font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.pgroup .dup { margin-left: 4px; font: 11px var(--mono); color: var(--ink-faint); }
.prow { display: flex; align-items: baseline; gap: 10px; }
.prow .pair { flex: 1; min-width: 0; font: 13px/1.45 var(--mono); color: var(--ink); }
.prow .nm { white-space: nowrap; }
.prow .cnt { margin-left: auto; flex: none; font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.problems summary { list-style: none; cursor: pointer; border-radius: 4px; }
.problems summary::-webkit-details-marker { display: none; }
.problems summary .cnt { color: var(--forest); }
.problems summary .cnt::after {
  content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 7px; vertical-align: 2px;
  border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
}
.problems details[open] summary .cnt::after { transform: rotate(-135deg); vertical-align: -1px; }
.problems summary:hover .pair { color: var(--forest-deep); }
.crates { list-style: none; margin: 4px 0 2px; padding: 0 0 0 10px; border-left: 1px solid var(--line-strong); font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); }
.crates li { padding: 1px 0; }
.crates code { white-space: nowrap; color: var(--ink); }
.crates .t { font: 10.5px var(--mono); color: var(--ink-faint); padding: 0 5px; border: 1px dashed var(--line-strong); border-radius: 999px; white-space: nowrap; }

@media (max-width: 760px) {
  .focus { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; row-gap: 24px; }
  .focus .col.uses, .focus .col.usedby, .focus > .center-card, .focus > .problems { grid-area: auto; }
  .focus > .center-card { order: -2; margin-top: 0; }
  .focus > .problems { order: -1; margin-top: -10px; }
  .focus .col.usedby h3 { text-align: left; }
  .focus > svg.wires { display: none; }
  .nb .glyph { display: block; }
}

/* Matrix view */
.mx-wrap { overflow: auto; max-height: 76vh; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table.mx { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.mx th, .mx td { padding: 0; background: var(--panel); }
.mx thead th { position: sticky; z-index: 2; }
.mx thead tr:first-child th { top: 0; height: 26px; }
.mx thead tr:nth-child(2) th { top: 26px; }
.mx .corner {
  left: 0; z-index: 4 !important; text-align: left; vertical-align: bottom; padding: 8px 12px;
  color: var(--ink-faint); font-weight: 400; border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong);
}
.mx .ag, .mx tr.grp th { font: 400 11px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); text-align: left; }
.mx .ag {
  padding: 0 6px; border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0;
}
.mx .cl {
  height: 156px; width: 20px; min-width: 20px; vertical-align: bottom; padding: 6px 0; cursor: pointer;
  border-bottom: 1px solid var(--line-strong); font-weight: 400; color: var(--ink-soft);
}
.mx .cl span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-family: var(--mono); display: inline-block; }
.mx .cl:hover, .mx .rl:hover { color: var(--forest); }
.mx .rl {
  position: sticky; left: 0; z-index: 1; text-align: left; font: 400 12px var(--mono); color: var(--ink);
  padding: 0 12px; height: 20px; white-space: nowrap; cursor: pointer; border-right: 1px solid var(--line-strong);
}
.mx tr.grp th { position: sticky; left: 0; z-index: 1; padding: 10px 12px 3px; border-right: 1px solid var(--line-strong); }
.mx tr.grp td { border-bottom: 1px solid var(--line); }
.mx td { width: 20px; min-width: 20px; height: 20px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--line); }
.mx .gs { border-left: 1px solid var(--line-strong); }
.mx td.diag { background: var(--parchment-2); }
.mx .selr, .mx .selc { background: var(--sel); }
.mx .rl.selr, .mx .cl.selc { color: var(--forest-deep); font-weight: 700; }
.mx .hr, .mx .hc { background: var(--hl); }
.mx .hr.rl, .mx .hc.cl { color: var(--forest); }
.m { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; background: var(--edge); }
.m.test { background: transparent; border: 2px dashed var(--edge); }
.m.undecl { background: var(--bad); }
.m.test.undecl { background: transparent; border-color: var(--bad); }
.m.cycle { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--cycle); }
.tip {
  position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--parchment);
  font-size: 12.5px; padding: 5px 9px; border-radius: 6px; max-width: 320px;
}
.tip[hidden] { display: none; }
.tip .name { font-weight: 600; }

/* Overview */
.ov { position: relative; }
.ov > svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.ov-grid { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px 24px; align-items: start; }
.ov-col h3 { margin: 0 0 10px; }
.ov-col h3 .n { color: var(--ink-soft); letter-spacing: 0; }
.ov-col .chips { display: flex; flex-direction: column; gap: 6px; }
.chip {
  position: relative; display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; cursor: pointer;
  padding: 5px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  font: 12px/1.3 var(--mono); letter-spacing: -0.01em;
}
.chip .cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .ok { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.chip:hover { border-color: var(--ink-soft); }
.ov.active .chip { opacity: .35; }
.ov.active .chip.on, .ov.active .chip.uses, .ov.active .chip.usedby { opacity: 1; }
.chip.on { border-color: var(--forest); box-shadow: 0 0 0 1px var(--forest); }
.chip.uses { background: var(--uses-soft); border-color: var(--uses); }
.chip.usedby { background: var(--usedby-soft); border-color: var(--usedby); }
.chip.uses.usedby { background: linear-gradient(90deg, var(--uses-soft) 50%, var(--usedby-soft) 50%); }
.ov-hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }
.empty-view { color: var(--ink-soft); padding: 24px; text-align: center; }

@media (max-width: 520px) {
  .wrap { padding: 24px 16px 40px; }
  .note { font-size: 16px; }
  .toolbar { padding: 10px; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; }
  .search, .search input { width: 100%; }
  .sep { display: none; }
  .center-card { padding: 16px; }
  .problems { padding: 12px 14px 4px; }
}
</style>

<script>
(function () {
  "use strict";
  const MAP = JSON.parse(document.getElementById("system-map").textContent);
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => Number(n).toLocaleString("en-US");
  // The docs site replaces this with its own rendered page for a system.
  const DOC_URL = "https://github.com/timohueser/openbikecomputer/blob/develop/docs/design/{name}.md";
  const docUrl = (name) => DOC_URL.replace("{name}", encodeURIComponent(name));
  const RULE_LABELS = {
    cycle: "Cycle",
    R1: "Crate shared with another system",
    R2: "Code in two places",
    R3: "Shell too large",
    R4: "Outside the tooling folder",
    ownership: "Ownership",
    dependency: "Undeclared dependency",
  };

  // ---- Model -------------------------------------------------------------
  const cycleOf = new Map();
  MAP.cycles.forEach((c, i) => c.forEach((n) => cycleOf.set(n, i)));
  const sameCycle = (a, b) => cycleOf.has(a) && cycleOf.get(a) === cycleOf.get(b);
  const edges = MAP.edges.map((e) => Object.assign({}, e, { cycle: !e.test && sameCycle(e.from, e.to) }));

  // Areas whose members are all shells sort last; the rest sort by name.
  const shellArea = (a) => MAP.systems.filter((s) => s.area === a).every((s) => s.kind === "shell") ? 1 : 0;
  const areas = [...new Set(MAP.systems.map((s) => s.area))].sort((a, b) => shellArea(a) - shellArea(b) || a.localeCompare(b));
  const areaIdx = new Map(areas.map((a, i) => [a, i]));
  const systems = MAP.systems.slice().sort((a, b) => areaIdx.get(a.area) - areaIdx.get(b.area) || a.name.localeCompare(b.name));
  const byName = new Map(systems.map((s) => [s.name, s]));
  const isProblem = (s) => s.violations > 0 || cycleOf.has(s.name) || edges.some((e) => e.undeclared && (e.from === s.name || e.to === s.name));

  const defaultName = (systems.find((s) => s.status === "approved") || systems[0]).name;
  const state = {
    selected: null,
    view: "focus",
    includeTest: true,
    problemsOnly: false,
    areas: new Set(areas),
    hover: null,
    trail: [],
  };

  const liveEdges = () => edges.filter((e) => state.includeTest || !e.test);
  const visible = (s) => state.areas.has(s.area) && (!state.problemsOnly || isProblem(s));
  const visibleSystems = () => systems.filter(visible);
  const kinds = (e) => [e.test && "test", e.undeclared && "undecl", e.cycle && "cycle"].filter(Boolean).join(" ");
  const marker = (e) => e.undeclared ? "ah-bad" : e.cycle ? "ah-warn" : "ah-edge";
  const describe = (e) => {
    const bits = [`<span class="name">${esc(e.from)}</span> uses <span class="name">${esc(e.to)}</span>`];
    if (e.test) bits.push("test only");
    if (e.undeclared) bits.push("undeclared");
    if (e.cycle) bits.push("in a cycle");
    return bits.join(", ");
  };
  const curve = (sx, sy, ex, ey) => {
    const dx = (ex - sx) / 2;
    return `M${sx.toFixed(1)},${sy.toFixed(1)} C${(sx + dx).toFixed(1)},${sy.toFixed(1)} ${(ex - dx).toFixed(1)},${ey.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
  };
  const sizeSvg = (svg, root) => {
    const w = root.clientWidth, h = root.clientHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    return root.getBoundingClientRect();
  };

  // ---- Selection ---------------------------------------------------------
  function select(name, opts) {
    if (!byName.has(name)) return;
    const o = opts || {};
    if (!o.keepTrail) {
      state.trail = state.trail.filter((n) => n !== name);
      state.trail.push(name);
      if (state.trail.length > 8) state.trail.shift();
    }
    state.selected = name;
    if (o.view) state.view = o.view;
    if (decodeURIComponent(location.hash.slice(1)) !== name) {
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch (_) { location.hash = name; }
    }
    render();
  }
  window.addEventListener("hashchange", () => select(decodeURIComponent(location.hash.slice(1))));

  // ---- Controls ----------------------------------------------------------
  function initControls() {
    const undecl = edges.filter((e) => e.undeclared).length;
    $("#stats").innerHTML = `<b>${systems.length}</b> systems · <b>${edges.length}</b> edges · ` +
      `<b class="bad">${undecl}</b> undeclared · <b class="warn">${MAP.cycles.length}</b> cycles`;
    $("#names").innerHTML = systems.map((s) => `<option value="${esc(s.name)}">`).join("");
    $("#areas").insertAdjacentHTML("beforeend", areas.map((a) =>
      `<label><input type="checkbox" value="${esc(a)}" checked> ${esc(a)}</label>`).join(""));

    document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
      state.view = b.dataset.view;
      render();
    }));
    const q = $("#q");
    const best = (v) => {
      v = v.trim().toLowerCase();
      if (!v) return null;
      return (systems.find((s) => s.name === v) || systems.find((s) => s.name.startsWith(v)) || systems.find((s) => s.name.includes(v)) || {}).name;
    };
    q.addEventListener("input", () => { if (byName.has(q.value.trim())) select(q.value.trim()); });
    q.addEventListener("keydown", (ev) => {
      if (ev.key !== "Enter") return;
      const n = best(q.value);
      if (n) { q.value = n; select(n); }
    });
    $("#areas").addEventListener("change", (ev) => {
      ev.target.checked ? state.areas.add(ev.target.value) : state.areas.delete(ev.target.value);
      render();
    });
    $("#opt-test").addEventListener("change", (ev) => { state.includeTest = ev.target.checked; render(); });
    $("#opt-problems").addEventListener("change", (ev) => { state.problemsOnly = ev.target.checked; render(); });

    $("#trail").addEventListener("click", (ev) => {
      const b = ev.target.closest("button");
      if (!b || b.disabled) return;
      if (b.classList.contains("back")) {
        state.trail.pop();
        select(state.trail[state.trail.length - 1], { keepTrail: true });
      } else if (!b.classList.contains("cur")) {
        state.trail = state.trail.slice(0, state.trail.indexOf(b.dataset.name) + 1);
        select(b.dataset.name, { keepTrail: true });
      }
    });

    // One delegated click handler for every element that names a system.
    document.querySelector("main").addEventListener("click", (ev) => {
      const t = ev.target.closest("[data-name]");
      if (!t) return;
      // A click re-renders the overview, so a dblclick event would reach a detached chip; use the click count.
      const toFocus = t.matches(".rl, .cl") || (t.matches(".chip") && ev.detail > 1);
      select(t.dataset.name, toFocus ? { view: "focus" } : undefined);
    });

    const ro = new ResizeObserver(() => drawWires());
    ro.observe(document.querySelector("main"));
  }

  function renderTrail() {
    const t = state.trail;
    let h = `<button class="back" ${t.length < 2 ? "disabled" : ""} title="Previous selection">Back</button>`;
    h += t.map((n, i) => (i ? '<span class="gt">›</span>' : "") +
      `<button class="crumb${i === t.length - 1 ? " cur" : ""}" data-name="${esc(n)}">${esc(n)}</button>`).join("");
    $("#trail").innerHTML = h;
  }

  function lineSwatch(cls, mk) {
    return `<svg width="34" height="10"><path class="wire ${cls}" d="M1,5 L31,5" marker-end="url(#${mk})"/></svg>`;
  }
  function renderLegend() {
    let items;
    if (state.view === "matrix") {
      items = [["", "declared"], ["test", "test only"], ["undecl", "undeclared"], ["undecl cycle", "in a cycle"]]
        .map(([c, l]) => `<span><i class="m ${c}"></i>${l}</span>`);
      items.push('<span><i class="pdot" style="margin:0"></i>has problems</span>');
    } else if (state.view === "overview") {
      items = [
        `<span>${lineSwatch("uses", "ah-uses")}uses</span>`,
        `<span>${lineSwatch("usedby", "ah-usedby")}used by</span>`,
        `<span>${lineSwatch("uses test", "ah-uses")}test only</span>`,
        '<span><i class="ring"></i>in a cycle</span>',
        '<span><i class="sw-vio">3</i>violations</span>',
      ];
    } else {
      items = [
        `<span>${lineSwatch("", "ah-edge")}declared</span>`,
        `<span>${lineSwatch("test", "ah-edge")}test only</span>`,
        `<span>${lineSwatch("undecl", "ah-bad")}undeclared</span>`,
        `<span>${lineSwatch("cycle", "ah-warn")}in a cycle</span>`,
        '<span><i class="pdot" style="margin:0"></i>has problems</span>',
      ];
    }
    $("#legend").innerHTML = items.join("");
  }

  // ---- Focus view --------------------------------------------------------
  let focusModel = null;

  function nbCard(s, e, side) {
    const tags = [
      e.test && '<span class="tag test">test only</span>',
      e.undeclared && '<span class="tag undecl">undeclared</span>',
      e.cycle && '<span class="tag cycle">cycle</span>',
    ].filter(Boolean).join("");
    const glyph = side === "uses"
      ? `<svg class="glyph" width="30" height="10"><path class="wire ${kinds(e)}" d="M29,5 L2,5" marker-end="url(#${marker(e)})"/></svg>`
      : `<svg class="glyph" width="30" height="10"><path class="wire ${kinds(e)}" d="M1,5 L28,5" marker-end="url(#${marker(e)})"/></svg>`;
    return `<button class="nb${isProblem(s) ? " problem" : ""}" data-name="${esc(s.name)}">${glyph}` +
      `<span class="nb-name">${esc(s.name)}</span>` +
      `<span class="nb-meta">${esc(s.area)} · ${fmt(s.lines)} lines</span><span class="tags">${tags}</span></button>`;
  }

  function column(side, title, items, hidden, emptyText) {
    const n = `<span class="n">${items.length}${hidden ? ` (${hidden} hidden)` : ""}</span>`;
    const body = items.length ? items.map((x) => nbCard(x.s, x.e, side)).join("") : `<div class="empty">${emptyText}</div>`;
    return `<section class="col ${side}"><h3>${title} ${n}</h3><div class="stack">${body}</div></section>`;
  }

  // "a -> b closes a cycle: x -> y, x -> z (test)"; null when the message has another shape.
  function parseCycle(msg) {
    const m = /^(\S+) -> (\S+) closes a cycle: (.+)$/.exec(msg);
    if (!m) return null;
    const pairs = m[3].split(", ").map((p) => /^(\S+) -> (\S+?)( \(test\))?$/.exec(p));
    if (pairs.some((p) => !p)) return null;
    return { from: m[1], to: m[2], pairs: pairs.map((p) => ({ from: p[1], to: p[2], test: !!p[3] })) };
  }

  // Groups crate links on the side that repeats more, so a long chain reads as a few lines.
  function crateLines(pairs) {
    const by = (key) => pairs.reduce((g, p) => g.set(p[key], (g.get(p[key]) || []).concat(p)), new Map());
    const crate = (n, test) => `<code>${esc(n)}</code>${test ? ' <span class="t">test</span>' : ""}`;
    const src = by("from"), dst = by("to");
    const lines = dst.size < src.size
      ? [...dst].map(([to, ps]) => `${ps.map((p) => crate(p.from, p.test)).join(", ")} → ${crate(to)}`)
      : [...src].map(([from, ps]) => `${crate(from)} → ${ps.map((p) => crate(p.to, p.test)).join(", ")}`);
    return `<ul class="crates">${lines.map((l) => `<li>${l}</li>`).join("")}</ul>`;
  }

  function cycleRow(p) {
    const c = parseCycle(p.message);
    if (!c) return `<li>${esc(p.message)}</li>`;
    const n = c.pairs.length;
    const row = (tag) => `<${tag} class="prow"><span class="pair"><span class="nm">${esc(c.from)}</span> → <span class="nm">${esc(c.to)}</span></span>` +
      `<span class="cnt">${n} crate link${n === 1 ? "" : "s"}</span></${tag}>`;
    return n <= 3 ? `<li>${row("div")}${crateLines(c.pairs)}</li>`
      : `<li><details>${row("summary")}${crateLines(c.pairs)}</details></li>`;
  }

  function problemList(sel) {
    const list = sel.problems || [];
    const peers = cycleOf.has(sel.name) ? MAP.cycles[cycleOf.get(sel.name)].filter((n) => n !== sel.name) : [];
    if (!list.length && !peers.length) return "";
    const groups = new Map(Object.keys(RULE_LABELS).map((r) => [r, []]));
    list.forEach((p) => groups.set(p.rule, (groups.get(p.rule) || []).concat(p)));
    let h = "";
    for (const [rule, items] of groups) {
      if (rule === "cycle" ? !items.length && !peers.length : !items.length) continue;
      let body;
      if (rule === "cycle") {
        const with_ = peers.length
          ? `<p class="with">With ${peers.map((n) => `<button data-name="${esc(n)}">${esc(n)}</button>`).join(", ")}</p>` : "";
        body = with_ + `<ul>${items.map(cycleRow).join("")}</ul>`;
      } else {
        // The checker can report one finding more than once; show it once with its count.
        const seen = items.reduce((m, p) => m.set(p.message, (m.get(p.message) || 0) + 1), new Map());
        body = `<ul>${[...seen].map(([msg, k]) =>
          `<li>${esc(msg)}${k > 1 ? `<span class="dup" title="Reported ${k} times">×${k}</span>` : ""}</li>`).join("")}</ul>`;
      }
      const n = items.length ? `<span class="n">${items.length}</span>` : "";
      h += `<div class="pgroup ${rule === "cycle" ? "cycle" : ""}"><h4>${esc(RULE_LABELS[rule] || rule)}${n}</h4>${body}</div>`;
    }
    return `<section class="problems" aria-label="Problems"><h3>Problems <span class="n">${list.length}</span></h3>${h}</section>`;
  }

  function renderFocus() {
    const sel = byName.get(state.selected);
    const live = liveEdges();
    const pick = (list, key) => {
      const all = list.map((e) => ({ s: byName.get(e[key]), e }));
      const shown = all.filter((x) => visible(x.s))
        .sort((a, b) => areaIdx.get(a.s.area) - areaIdx.get(b.s.area) || a.s.name.localeCompare(b.s.name));
      return { shown, hidden: all.length - shown.length };
    };
    const uses = pick(live.filter((e) => e.from === sel.name), "to");
    const usedBy = pick(live.filter((e) => e.to === sel.name), "from");
    focusModel = { uses: uses.shown, usedby: usedBy.shown };

    const center = `<article class="center-card">
      <div class="top"><span class="badge ${sel.status === "approved" ? "approved" : "draft"}">${esc(sel.status)}</span>
        <span class="badge kind">${esc(sel.kind)}</span><span class="area">${esc(sel.area)}</span></div>
      <h2>${esc(sel.name)}</h2>
      <p>${esc(sel.purpose)}</p>
      <a class="doc-link" href="${esc(docUrl(sel.name))}" target="_blank" rel="noopener">Design doc</a>
      <dl class="facts"><div><dt>Lines</dt><dd>${fmt(sel.lines)}</dd></div>
        <div><dt>Violations</dt><dd class="${sel.violations ? "bad" : ""}">${fmt(sel.violations)}</dd></div></dl>
      </article>${problemList(sel)}`;

    $("#view-focus").innerHTML = `<div class="focus" id="focus"><svg class="wires" aria-hidden="true"></svg>` +
      column("uses", "Uses", uses.shown, uses.hidden, "Uses no other system.") + center +
      column("usedby", "Used by", usedBy.shown, usedBy.hidden, "No system uses it.") + "</div>";

    const root = $("#focus");
    root.addEventListener("mouseover", (ev) => {
      const card = ev.target.closest(".nb");
      root.classList.toggle("hovering", !!card);
      root.querySelectorAll(".wire.hot").forEach((w) => w.classList.remove("hot"));
      if (card) root.querySelectorAll(`svg.wires .wire[data-key="${card.closest(".col").classList[1]}:${card.dataset.name}"]`)
        .forEach((w) => w.classList.add("hot"));
    });
    root.addEventListener("mouseleave", () => root.classList.remove("hovering"));
  }

  function drawFocusWires() {
    const root = $("#focus");
    if (!root || !focusModel) return;
    const svg = $("svg.wires", root);
    const problems = $(".problems", root);
    if (getComputedStyle(svg).display === "none") {
      if (problems) problems.style.marginTop = "";
      svg.innerHTML = "";
      return;
    }
    // The panel sits in the row below the neighbours; pull it up under the card so it never moves the card.
    // Set it before sizing the SVG: it changes the height of the focus grid.
    if (problems) {
      const gap = $(".center-card", root).getBoundingClientRect().bottom - $(".col.uses", root).getBoundingClientRect().bottom;
      problems.style.marginTop = `calc(${gap}px + var(--panel-gap))`;
    }
    const base = sizeSvg(svg, root);
    const c = $(".center-card", root).getBoundingClientRect();
    const cTop = c.top - base.top;
    let out = "";
    for (const side of ["uses", "usedby"]) {
      const cards = root.querySelectorAll(`.col.${side} .nb`);
      cards.forEach((el, i) => {
        const r = el.getBoundingClientRect();
        const e = focusModel[side][i].e;
        const anchor = cTop + c.height * (0.2 + 0.6 * (i + 0.5) / cards.length);
        const mid = r.top - base.top + r.height / 2;
        const d = side === "uses"
          ? curve(c.left - base.left, anchor, r.right - base.left + 1, mid)
          : curve(r.left - base.left, mid, c.right - base.left + 1, anchor);
        out += `<path class="wire ${kinds(e)}" data-key="${side}:${esc(el.dataset.name)}" d="${d}" marker-end="url(#${marker(e)})"/>`;
      });
    }
    svg.innerHTML = out;
  }

  // ---- Matrix view -------------------------------------------------------
  function groupByArea(list) {
    return areas.map((a) => ({ area: a, items: list.filter((s) => s.area === a) })).filter((g) => g.items.length);
  }

  function renderMatrix() {
    const vis = visibleSystems();
    const host = $("#view-matrix");
    if (!vis.length) { host.innerHTML = '<p class="empty-view">No system matches the filters.</p>'; return; }
    const em = new Map(liveEdges().map((e) => [e.from + "\u0000" + e.to, e]));
    const groups = groupByArea(vis);
    const starts = new Set();
    let k = 0;
    groups.forEach((g) => { starts.add(k); k += g.items.length; });
    const sel = state.selected;

    let h = '<table class="mx"><thead><tr><th class="corner" rowspan="2">row uses column</th>';
    h += groups.map((g) => `<th class="ag" colspan="${g.items.length}" title="${esc(g.area)}">${esc(g.area)}</th>`).join("");
    h += "</tr><tr>";
    h += vis.map((s, j) => `<th class="cl${starts.has(j) ? " gs" : ""}${s.name === sel ? " selc" : ""}" data-c="${j}" data-name="${esc(s.name)}" title="${esc(s.name)}"><span>${esc(s.name)}</span></th>`).join("");
    h += "</tr></thead><tbody>";
    let i = 0;
    for (const g of groups) {
      h += `<tr class="grp"><th>${esc(g.area)}</th><td colspan="${vis.length}"></td></tr>`;
      for (const r of g.items) {
        const rs = r.name === sel ? " selr" : "";
        h += `<tr data-r="${i}"><th class="rl${rs}" data-name="${esc(r.name)}">${esc(r.name)}${isProblem(r) ? '<i class="pdot" title="Has problems"></i>' : ""}</th>`;
        vis.forEach((c, j) => {
          const e = em.get(r.name + "\u0000" + c.name);
          const cls = [starts.has(j) && "gs", i === j && "diag", rs && "selr", c.name === sel && "selc"].filter(Boolean).join(" ");
          h += `<td data-c="${j}"${cls ? ` class="${cls}"` : ""}>${e ? `<i class="m ${kinds(e)}"></i>` : ""}</td>`;
        });
        h += "</tr>";
        i++;
      }
    }
    h += "</tbody></table>";
    host.innerHTML = `<div class="mx-wrap">${h}</div>`;

    const table = $("table.mx", host);
    const rowsEls = [...table.querySelectorAll("tbody tr[data-r]")];
    const cols = vis.map(() => []);
    table.querySelectorAll("[data-c]").forEach((el) => cols[+el.dataset.c].push(el));
    const tip = $("#tip");
    let cur = null;
    const clear = () => {
      if (!cur) return;
      cur.row && cur.row.querySelectorAll("th, td").forEach((x) => x.classList.remove("hr"));
      cur.col && cur.col.forEach((x) => x.classList.remove("hc"));
      cur = null;
      tip.hidden = true;
    };
    table.addEventListener("mousemove", (ev) => {
      const cell = ev.target.closest("td[data-c], th.rl, th.cl");
      const tr = cell && cell.closest("tr[data-r]");
      const r = tr ? +tr.dataset.r : null;
      const c = cell && cell.dataset.c !== undefined ? +cell.dataset.c : null;
      if (!cur || cur.r !== r || cur.c !== c) {
        clear();
        cur = { r, c, row: r !== null ? rowsEls[r] : null, col: c !== null ? cols[c] : null };
        cur.row && cur.row.querySelectorAll("th, td").forEach((x) => x.classList.add("hr"));
        cur.col && cur.col.forEach((x) => x.classList.add("hc"));
      }
      const e = r !== null && c !== null && em.get(vis[r].name + "\u0000" + vis[c].name);
      if (!e || cell.tagName !== "TD") { tip.hidden = true; return; }
      tip.innerHTML = describe(e);
      tip.hidden = false;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.min(ev.clientX + 14, innerWidth - tw - 8) + "px";
      tip.style.top = (ev.clientY + 16 + th > innerHeight ? ev.clientY - th - 10 : ev.clientY + 16) + "px";
    });
    table.addEventListener("mouseleave", clear);
  }

  // ---- Overview ----------------------------------------------------------
  function renderOverview() {
    const vis = visibleSystems();
    const host = $("#view-overview");
    if (!vis.length) { host.innerHTML = '<p class="empty-view">No system matches the filters.</p>'; return; }
    const cols = groupByArea(vis).map((g) => `<div class="ov-col"><h3>${esc(g.area)} <span class="n">${g.items.length}</span></h3><div class="chips">` +
      g.items.map((s) => `<button class="chip" data-name="${esc(s.name)}" title="${esc(s.name)}: ${esc(s.purpose)}">` +
        `<span class="cname">${esc(s.name)}</span>${cycleOf.has(s.name) ? '<i class="ring" title="in a cycle"></i>' : ""}` +
        `${s.status === "approved" ? '<i class="ok" title="approved"></i>' : ""}` +
        `${s.violations ? `<i class="vio" title="${s.violations} violations">${s.violations}</i>` : ""}</button>`).join("") +
      "</div></div>").join("");
    host.innerHTML = '<p class="ov-hint">Hover a system to see its edges. Click to select it, double-click to open it.</p>' +
      `<div class="ov" id="ov"><svg class="wires" aria-hidden="true"></svg><div class="ov-grid">${cols}</div></div>`;
    const root = $("#ov");
    root.addEventListener("mouseover", (ev) => {
      const chip = ev.target.closest(".chip");
      const n = chip ? chip.dataset.name : null;
      if (n !== state.hover) { state.hover = n; drawOverviewWires(); }
    });
    root.addEventListener("mouseleave", () => { state.hover = null; drawOverviewWires(); });
  }

  function drawOverviewWires() {
    const root = $("#ov");
    if (!root) return;
    const svg = $("svg.wires", root);
    const active = state.hover || state.selected;
    const chips = new Map([...root.querySelectorAll(".chip")].map((el) => [el.dataset.name, el]));
    chips.forEach((el) => el.classList.remove("on", "uses", "usedby"));
    const base = sizeSvg(svg, root);
    const on = chips.get(active);
    root.classList.toggle("active", !!on);
    if (!on) { svg.innerHTML = ""; return; }
    on.classList.add("on");
    const box = (el) => {
      const r = el.getBoundingClientRect();
      return { l: r.left - base.left, r: r.right - base.left, y: r.top - base.top + r.height / 2 };
    };
    let out = "";
    for (const e of liveEdges()) {
      const dir = e.from === active ? "uses" : e.to === active ? "usedby" : null;
      const other = dir === "uses" ? e.to : e.from;
      if (!dir || !chips.has(other) || other === active) continue;
      chips.get(other).classList.add(dir);
      const a = box(chips.get(e.from)), b = box(chips.get(e.to));
      let d;
      if (Math.abs(a.l - b.l) < 4) {
        const x = a.r, bulge = 18 + Math.min(40, Math.abs(a.y - b.y) / 6);
        d = `M${x},${a.y} C${x + bulge},${a.y} ${x + bulge},${b.y} ${x + 1},${b.y}`;
      } else if (b.l > a.l) {
        d = curve(a.r, a.y, b.l - 1, b.y);
      } else {
        d = curve(a.l, a.y, b.r + 1, b.y);
      }
      out += `<path class="wire ${dir}${e.test ? " test" : ""}" d="${d}" marker-end="url(#ah-${dir})"/>`;
    }
    svg.innerHTML = out;
  }

  // ---- Render ------------------------------------------------------------
  function drawWires() {
    if (state.view === "focus") drawFocusWires();
    else if (state.view === "overview") drawOverviewWires();
  }

  function render() {
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
    for (const v of ["focus", "matrix", "overview"]) $("#view-" + v).hidden = v !== state.view;
    $("#tip").hidden = true;
    state.hover = null;
    renderTrail();
    renderLegend();
    if (state.view === "focus") renderFocus();
    else if (state.view === "matrix") renderMatrix();
    else renderOverview();
    drawWires();
  }

  initControls();
  const fromHash = decodeURIComponent(location.hash.slice(1));
  select(byName.has(fromHash) ? fromHash : defaultName);
})();
</script>
</body>
</html>
