<!DOCTYPE html>
<!-- The OG/Twitter share card (docs/assets/og-card.png), as a browser compose.
     The device is drawn with the same housing CSS as docs/index.html (keep the
     two in sync if the industrial design changes) around the committed
     device-poster.png sim frame — so the card's screen stays a real render.

     Regenerate after changing the tagline, the housing, or the poster:

       google-chrome --headless=new --disable-gpu --window-size=1200,630 \
         --force-device-scale-factor=1 \
         --screenshot=../assets/og-card.png og_card.html

     (run from docs/tools/). Serif is P052 (URW Palladio, urw-base35), the
     Linux stand-in for the site's Palatino stack — Chrome falls back through
     the stack if it's missing, so check the render before committing. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* 1200x630 card — colourway + housing CSS lifted from docs/index.html. */
  :root {
    --parchment: #ece8cf;
    --ink: #24331c;
    --ink-soft: #4d5b3c;
    --forest: #3c6b39;
    --coral: #cf6a2a;
    --device-body: #488781;
    --device-accent: #8be3bc;
    --serif: "P052", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Noto Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "Noto Sans Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--parchment);
    font-family: var(--sans);
    display: flex; align-items: center;
  }
  .topo { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.75; }

  .text {
    position: relative; z-index: 1;
    padding-left: 76px; width: 660px; flex: none;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; margin-bottom: 40px; }
  .brand .mark {
    font-family: var(--mono); font-weight: 700; letter-spacing: 0.06em;
    font-size: 22px; color: var(--parchment); background: var(--forest);
    padding: 6px 12px; border-radius: 10px;
  }
  .brand .name { font-family: var(--serif); font-size: 27px; font-weight: 700; color: var(--ink); }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 0.26em; font-size: 17px;
    font-weight: 700; color: var(--forest); margin: 0 0 18px;
  }
  h1 {
    font-family: var(--serif); font-weight: 700; color: var(--ink);
    font-size: 82px; line-height: 1.04; letter-spacing: -0.01em; margin: 0 0 26px;
  }
  h1 em { font-style: italic; color: var(--coral); }
  .sub { font-size: 26px; color: var(--ink-soft); margin: 0; }
  .sub b { color: var(--ink); font-weight: 700; }

  /* ---- the device housing, lifted from docs/index.html ---- */
  .device-col { position: relative; z-index: 1; flex: none; margin-left: 30px; transform: rotate(-5deg); }
    .device {
      --device-size: 360px;
      position: relative;
      width: var(--device-size);
      padding: calc(var(--device-size) * .05) calc(var(--device-size) * .055) 0;
      border-radius: calc(var(--device-size) * .13);
      background: linear-gradient(145deg, #55938d, var(--device-body) 38%, #346762);
      box-shadow: inset 0 1px 2px #a7cec580, inset 0 -3px 4px #163f3b60,
        0 18px 28px -9px #24331c50, 0 3px 5px #24331c20;
    }
    /* The lower shell shows at the heel, with a narrow seam along the sides. */
    .device::before {
      content: ""; position: absolute; z-index: -1;
      inset: 5px -2px -7px;
      border-radius: inherit;
      background: linear-gradient(170deg, #619e8d 60%, var(--device-accent));
      box-shadow: inset 0 -2px 2px #2c67524d, 0 8px 12px #24331c18;
    }
    .side {
      position: absolute; z-index: -1; width: 9px; height: 12%;
      background: repeating-linear-gradient(0deg, #234f49 0 2px, #2e5d55 2px 4px);
      box-shadow: inset 0 0 0 1px #163b3580, 0 2px 2px #183d3530;
      transition: transform .08s ease;
    }
    .side-l { left: -8px; border-radius: 5px 0 0 5px; }
    .side-r { right: -8px; border-radius: 0 5px 5px 0; }
    .side-up, .side-select { top: 32%; }
    .side-down, .side-back { top: 49%; }
    .side-l.pressed { transform: translateX(3px); }
    .side-l.held { transform: translateX(4px); }
    .side-r.pressed { transform: translateX(-3px); }
    .side-r.held { transform: translateX(-4px); }
    .bezel {
      position: relative; padding: 10% 8% 9%;
      border-radius: calc(var(--device-size) * .085);
      background: linear-gradient(150deg, #242b29, #151c1a 65%);
      box-shadow: inset 0 1px 1px #ffffff25, 0 0 0 1px #1b4d4780, 0 2px 1px #9ac8b550;
    }
    .panel { position: relative; aspect-ratio: 3 / 4; box-shadow: 0 0 0 2px #0b1412, 0 1px 2px 3px #00000025; }
    .chin { display: flex; align-items: center; justify-content: center; padding: 10% 0 12%; }
    .wordmark {
      font-family: var(--mono); font-size: calc(var(--device-size) * .058); font-weight: 700;
      letter-spacing: 0.16em; text-indent: 0.16em; /* re-centre the tracked glyphs */
      color: #2d645d;
      text-shadow: 0 1px 0 #a1c9bb70, 0 -1px 0 #1b4c4540;
    }

  .panel img { display: block; width: 100%; height: 100%; border-radius: 2px; image-rendering: pixelated; }
</style>
</head>
<body>
  <svg class="topo" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#2c5e54" stroke-width="1.1" stroke-opacity="0.17">
      <path d="M-50 150 C 240 92, 420 222, 700 172 S 1180 82, 1500 192" />
      <path d="M-50 220 C 240 165, 430 290, 710 240 S 1180 155, 1500 265" />
      <path d="M-50 300 C 260 250, 440 370, 720 315 S 1190 235, 1500 350" />
      <path d="M-50 388 C 250 342, 450 452, 740 402 S 1190 322, 1500 438" />
      <path d="M-50 470 C 250 426, 470 532, 760 486 S 1200 408, 1500 520" />
      <path d="M-50 620 C 250 570, 470 690, 760 630 S 1200 545, 1500 665" />
      <path d="M-50 690 C 250 640, 470 760, 760 700 S 1200 615, 1500 735" />
      <path d="M-50 760 C 250 712, 470 832, 760 772 S 1200 690, 1500 808" />
    </g>
  </svg>

  <div class="text">
    <div class="brand">
      <span class="mark">OBC</span>
      <span class="name">OpenBikeComputer</span>
    </div>
    <p class="eyebrow">Open-source bikepacking computer</p>
    <h1>Own your<br><em>adventure.</em></h1>
    <p class="sub"><b>Try the real firmware live</b> — in your browser.</p>
  </div>

  <div class="device-col">
    <div class="device">
      <span class="side side-l side-up"></span>
      <span class="side side-l side-down"></span>
      <span class="side side-r side-select"></span>
      <span class="side side-r side-back"></span>
      <div class="bezel">
        <div class="panel">
          <img src="../assets/device-poster.png" width="240" height="320" alt="" />
        </div>
      </div>
      <div class="chin"><span class="wordmark">OBC</span></div>
    </div>
  </div>
</body>
</html>
