<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs — OpenBikeComputer</title>
  <meta name="description" content="Documentation for OpenBikeComputer — coming soon." />

  <style>
    :root {
      --parchment: #ece8cf;
      --parchment-2: #e4dec0;
      --parchment-3: #d6cda8;
      --ink: #24331c;
      --ink-soft: #4d5b3c;
      --wood: #5f7d3d;
      --forest: #3c6b39;
      --coral: #cf6a2a;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background-color: var(--parchment);
      font-family: var(--sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .topo { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.75; }

    .card {
      position: relative;
      z-index: 1;
      width: min(560px, 90vw);
      text-align: center;
      padding: 8px 24px;
    }

    .mark {
      display: inline-block;
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 15px;
      color: var(--parchment);
      background: var(--forest);
      padding: 4px 8px;
      border-radius: 7px;
      margin-bottom: 26px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.26em;
      font-size: 12px;
      font-weight: 700;
      color: var(--forest);
      margin: 0 0 14px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.05;
      margin: 0 0 16px;
    }
    h1 em { font-style: italic; color: var(--coral); }

    p.lede { font-size: 17px; color: var(--ink-soft); max-width: 32rem; margin: 0 auto 30px; }

    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      padding: 12px 20px; border-radius: 11px;
      text-decoration: none; cursor: pointer; border: 1.5px solid transparent;
      background: var(--ink); color: var(--parchment);
      box-shadow: 0 6px 16px rgba(36, 51, 28, 0.22);
      transition: transform .08s ease, background .15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:hover { background: #16210f; }
    .btn svg { width: 18px; height: 18px; }

    .hint { margin: 22px 0 0; font-size: 13.5px; color: var(--ink-soft); }
    .hint a { color: var(--forest); }
  </style>
</head>

<body>
  <svg class="topo" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#2c5e54" stroke-width="1.1" stroke-opacity="0.17">
      <path d="M-50 150 C 240 92, 420 222, 700 172 S 1180 82, 1500 192" />
      <path d="M-50 220 C 240 165, 430 290, 710 240 S 1180 155, 1500 265" />
      <path d="M-50 300 C 260 250, 440 370, 720 315 S 1190 235, 1500 350" />
      <path d="M-50 388 C 250 342, 450 452, 740 402 S 1190 322, 1500 438" />
      <path d="M-50 470 C 250 426, 470 532, 760 486 S 1200 408, 1500 520" />
      <path d="M-50 620 C 250 570, 470 690, 760 630 S 1200 545, 1500 665" />
      <path d="M-50 690 C 250 640, 470 760, 760 700 S 1200 615, 1500 735" />
      <path d="M-50 760 C 250 712, 470 832, 760 772 S 1200 690, 1500 808" />
    </g>
  </svg>

  <main class="card">
    <span class="mark">OBC</span>
    <p class="eyebrow">Documentation</p>
    <h1>Out mapping the trail.<br><em>Docs are on the way.</em></h1>
    <p class="lede">
      The OpenBikeComputer docs — building maps, flashing firmware, and the OBCM/OBCR
      formats — aren't written yet. In the meantime, the source and the format specs
      live on GitHub.
    </p>
    <a class="btn" href="https://github.com/timohueser/OpenBikeComputer" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      Browse the repo
    </a>
    <p class="hint"><a href="../">← Back to the live demo</a></p>
  </main>
</body>

</html>
