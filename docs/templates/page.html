<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} — OpenBikeComputer docs</title>
  <meta name="description" content="{{description}}" />
  <link rel="stylesheet" href="{{css}}" />
</head>

<body class="{{has_toc}}">
  <svg class="topo" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#2c5e54" stroke-width="1.1" stroke-opacity="0.13">
      <path d="M-50 150 C 240 92, 420 222, 700 172 S 1180 82, 1500 192" />
      <path d="M-50 220 C 240 165, 430 290, 710 240 S 1180 155, 1500 265" />
      <path d="M-50 300 C 260 250, 440 370, 720 315 S 1190 235, 1500 350" />
      <path d="M-50 388 C 250 342, 450 452, 740 402 S 1190 322, 1500 438" />
      <path d="M-50 470 C 250 426, 470 532, 760 486 S 1200 408, 1500 520" />
      <path d="M-50 620 C 250 570, 470 690, 760 630 S 1200 545, 1500 665" />
      <path d="M-50 690 C 250 640, 470 760, 760 700 S 1200 615, 1500 735" />
      <path d="M-50 760 C 250 712, 470 832, 760 772 S 1200 690, 1500 808" />
    </g>
  </svg>

  <header class="site-head">
    <div class="head-inner">
      <a class="brand" href="{{site_root}}">
        <span class="mark">OBC</span>
        <span class="name">OpenBikeComputer</span>
        <span class="crumb">/ docs</span>
      </a>
      <nav class="head-links">
        <a href="{{site_root}}">Home</a>
        <a class="gh" href="https://github.com/timohueser/OpenBikeComputer" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          GitHub
        </a>
      </nav>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      {{nav}}
    </aside>

    <main class="content">
      <article class="prose">
        {{content}}
      </article>
      <footer class="doc-foot">
        <a class="edit" href="https://github.com/timohueser/OpenBikeComputer/tree/main/docs/content" target="_blank" rel="noopener">Improve these docs on GitHub →</a>
        <span class="foot-trail">Headed for the trail.</span>
      </footer>
    </main>

    {{toc}}
  </div>

  <script>
    // Mobile nav toggle.
    (function () {
      var btn = document.querySelector('.nav-toggle');
      var sb = document.querySelector('.sidebar');
      if (!btn || !sb) return;
      btn.addEventListener('click', function () {
        var open = sb.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
    // Highlight the current TOC entry while scrolling.
    (function () {
      var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
      if (!links.length || !('IntersectionObserver' in window)) return;
      var map = {};
      links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
      var seen = new Set();
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) seen.add(e.target.id); else seen.delete(e.target.id);
        });
        links.forEach(function (a) { a.classList.remove('active'); });
        for (var i = 0; i < links.length; i++) {
          var id = links[i].getAttribute('href').slice(1);
          if (seen.has(id)) { links[i].classList.add('active'); break; }
        }
      }, { rootMargin: '0px 0px -75% 0px' });
      Object.keys(map).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) obs.observe(el);
      });
    })();
  </script>
</body>

</html>
