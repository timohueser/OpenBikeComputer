<!DOCTYPE html>
<html lang="{{lang}}">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} — OpenBikeComputer docs</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#A4501E" />
  <script src="{{theme_js}}"></script>
  <link rel="stylesheet" href="{{css}}" />
</head>

<body class="{{has_toc}}">
  {{site_head}}

  <div class="layout">
    <aside class="sidebar" id="docs-navigation">
      {{nav}}
    </aside>

    <main class="content" id="main" tabindex="-1">
      {{mobile_toc}}
      <article class="prose">
        {{copy_notice}}
        {{content}}
      </article>
      <footer class="doc-foot">
        <a class="edit" href="https://github.com/timohueser/OpenBikeComputer/tree/main/docs/content" target="_blank" rel="noopener">Improve these docs on GitHub →</a>
        <!-- Same pair in blog_post.html, blog_index.html, index.html and the builder's
             own footer: the Impressum has to be reachable from every page. -->
        <nav class="foot-legal" aria-label="Rechtliches">
          <a href="{{base}}impressum/">Impressum</a>
          <a href="{{base}}datenschutz/">Datenschutz</a>
        </nav>

        <!-- ODbL § 4.3 (#1149): every map on this site is drawn from OpenStreetMap, so the
             credit and the licence pointer belong on every page. Same line in blog_post.html,
             blog_index.html, index.html and the builder's own footer. -->
        <span class="foot-credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, under the <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>.</span>
      </footer>
    </main>

    {{toc}}
  </div>

  <script>
    (function () {
      var button = document.querySelector('.nav-toggle');
      var sidebar = document.querySelector('.sidebar');
      var mobile = matchMedia('(max-width: 820px)');
      function close(focus) {
        sidebar.classList.remove('open');
        button.setAttribute('aria-expanded', 'false');
        sidebar.inert = mobile.matches;
        if (focus) button.focus();
      }
      close(false);
      mobile.addEventListener('change', function () { close(false); });
      button.addEventListener('click', function () {
        if (sidebar.classList.contains('open')) return close(true);
        sidebar.inert = false;
        sidebar.classList.add('open');
        button.setAttribute('aria-expanded', 'true');
        sidebar.querySelector('[aria-current="page"]').focus();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && sidebar.classList.contains('open')) close(true);
      });
      document.addEventListener('click', function (event) {
        if (!sidebar.contains(event.target) && !button.contains(event.target)) close(false);
      });
      document.addEventListener('focusin', function (event) {
        if (!sidebar.contains(event.target) && !button.contains(event.target)) close(false);
      });
      sidebar.addEventListener('click', function (event) {
        if (event.target.closest('a') && mobile.matches) close(false);
      });
      document.querySelector('.toc-mobile')?.addEventListener('click', function (event) {
        if (event.target.closest('a')) this.open = false;
      });
    })();
    // Highlight the current TOC entry while scrolling.
    (function () {
      var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
      if (!links.length || !('IntersectionObserver' in window)) return;
      var map = {};
      links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
      var seen = new Set();
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) seen.add(e.target.id); else seen.delete(e.target.id);
        });
        links.forEach(function (a) { a.classList.remove('active'); });
        for (var i = 0; i < links.length; i++) {
          var id = links[i].getAttribute('href').slice(1);
          if (seen.has(id)) { links[i].classList.add('active'); break; }
        }
      }, { rootMargin: '0px 0px -75% 0px' });
      Object.keys(map).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) obs.observe(el);
      });
    })();
  </script>
</body>

</html>
