<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} — OpenBikeComputer log</title>
  <meta name="description" content="{{description}}" />
  <link rel="stylesheet" href="{{css}}" />
  <link rel="stylesheet" href="{{blog_css}}" />
  <link rel="alternate" type="application/atom+xml" title="OpenBikeComputer log" href="{{base}}feed.xml" />
</head>

<body class="blog">
  {{site_head}}

  <main class="post-wrap">
    <article class="prose post">
      <header class="post-head">
        <a class="back" href="{{base}}">&#8592; Expedition log</a>
        <h1>{{title}}</h1>
        <p class="post-meta">
          <time datetime="{{date_iso}}">{{date_human}}</time>
          <span class="dot-sep">&#183;</span> {{minutes}} min read
        </p>
      </header>
      {{copy_notice}}
      {{content}}
    </article>

    {{prevnext}}

    <footer class="doc-foot">
      <a class="edit" href="https://github.com/timohueser/OpenBikeComputer/tree/main/docs/content/blog" target="_blank" rel="noopener">Read the source of this entry →</a>
      <nav class="foot-legal" aria-label="Rechtliches">
        <a href="{{site_root}}docs/impressum/">Impressum</a>
        <a href="{{site_root}}docs/datenschutz/">Datenschutz</a>
      </nav>
      <span class="foot-trail">Headed for the trail.</span>
      <span class="foot-credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, under the <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>.</span>
    </footer>
  </main>

  <script src="{{base}}assets/blog.js" defer></script>
  <script src="{{base}}assets/glb-viewer.js" defer></script>
</body>

</html>
