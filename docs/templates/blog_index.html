<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} — OpenBikeComputer</title>
  <meta name="description" content="{{description}}" />
  <link rel="icon" type="image/svg+xml" href="{{site_root}}brand/signpost.svg" />
  <link rel="apple-touch-icon" href="{{site_root}}brand/apple-touch-icon.png" />
  <meta name="theme-color" content="#A4501E" />
  <script src="{{theme_js}}"></script>
  <link rel="stylesheet" href="{{css}}" />
  <link rel="stylesheet" href="{{blog_css}}" />
  <link rel="alternate" type="application/atom+xml" title="OpenBikeComputer log" href="feed.xml" />
</head>

<body class="blog">
  {{site_head}}

  <main class="log-wrap" id="main" tabindex="-1">
    <header class="log-head">
      <h1>Expedition log</h1>
      <p class="log-lede">Notes on building an open-source bikepacking computer.</p>
      <a class="feed-link" href="feed.xml" title="Atom feed">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.18 17.82a2.18 2.18 0 1 1-4.36 0 2.18 2.18 0 0 1 4.36 0zM1.82 8.91v3.05c5.65 0 10.22 4.57 10.22 10.22h3.05c0-7.33-5.94-13.27-13.27-13.27zm0-6.09v3.05c9.01 0 16.31 7.3 16.31 16.31h3.05C21.18 11.5 12.5 2.82 1.82 2.82z"/></svg>
        Subscribe via Atom
      </a>
    </header>
    {{content}}

    <footer class="doc-foot">
      <a class="edit" href="https://github.com/timohueser/OpenBikeComputer/tree/main/docs/content/blog" target="_blank" rel="noopener">These entries live in the repo →</a>
      <nav class="foot-legal" aria-label="Rechtliches">
        <a href="{{site_root}}docs/impressum/">Impressum</a>
        <a href="{{site_root}}docs/datenschutz/">Datenschutz</a>
      </nav>

      <span class="foot-credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, under the <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>.</span>
    </footer>
  </main>
</body>

</html>
