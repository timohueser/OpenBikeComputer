<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="{{site_root}}" aria-label="OpenBikeComputer home">
      <img class="mark" src="{{site_root}}brand/app-icon.svg" width="32" height="32" alt="" />
      <span class="name">OpenBikeComputer</span>
      <span class="short-name" aria-hidden="true">OBC</span>
    </a>
    <button class="site-menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false">Menu</button>
    <nav class="head-links" id="site-navigation" aria-label="Main navigation">
      <a href="{{site_root}}docs/"{{docs_current}}>Docs</a>
      <a href="{{site_root}}blog/"{{blog_current}}>Blog</a>
      {{builder_link}}
      <a href="https://github.com/timohueser/OpenBikeComputer">GitHub</a>
    </nav>
    <button class="theme-toggle" id="theme_toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="moon" d="M20.5 13.2A8.6 8.6 0 0 1 10.8 3.5 8.6 8.6 0 1 0 20.5 13.2Z" />
        <g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
      </svg>
    </button>
  </div>
</header>
{{nav_toggle}}
<script type="module">
  import { setupSiteNavigation } from '{{site_root}}docs/assets/site-navigation.js';
  setupSiteNavigation(document.querySelector('.site-head'));
</script>
