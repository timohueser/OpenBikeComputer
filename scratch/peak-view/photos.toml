# Ground-truth photographs for Peak View, with the numbers the harness needs to reproduce each
# frame. The owner took all of them near Engelberg, Switzerland, and gave the positions; the EXIF
# was stripped in transit, so the lens and the capture time are not recorded in the files.
#
# `ground_m` is swissALTI3D (2 m) at the position, which is the best figure available and the one
# the comparison treats as truth. `heading_deg` and `pitch_deg` come from `tools/sidebyside.py
# refine`: the landmark bearings give the hint and the photo's own skyline settles the two free
# numbers against the LiDAR. `lens_mm` is the 35 mm equivalent. `sky_floor` is the one knob in
# `fit.sky_mask` that has to be set per photo.

[[photo]]
file = "hahnen.jpg"
lat = 46.80966
lon = 8.42112
ground_m = 1022.6
subject = "Hahnen (2606 m) from the Brunni side, the first defect the owner reported"

