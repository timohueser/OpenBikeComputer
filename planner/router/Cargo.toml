[package]
name = "planner-router"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Turn-aware regional routing with immutable prepared profiles"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
flate2 = { workspace = true }
sha2 = "0.10"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9.11"
# The installer of format 10. The Rust decoder keeps `cargo check` for iOS working on Linux.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# `posix_fadvise` of the installer.
libc = "0.2"
