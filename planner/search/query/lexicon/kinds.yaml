# Kind id (schema.KINDS) -> iD tagging schema presets, dropped iD terms and hand-written terms.
# `lexicon.py build` turns this and lexicon/src/ into kinds.json. A preset gives its name and its
# terms; `names_only` keeps only the name (for presets with long, loose term lists). A term that
# two kinds claim goes to the kind that writes it by hand, else the kind whose preset name it is,
# else nowhere. Drops are compared after folding and apply to every language.

