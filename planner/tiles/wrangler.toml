name = "obc-planner-tiles"
main = "src/worker.mjs"
compatibility_date = "2026-09-30"
workers_dev = false
preview_urls = false
routes = [{ pattern = "tiles.openbikecomputer.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "obc-maps"
[observability]
enabled = true
head_sampling_rate = 0.1
[observability.traces]
enabled = true
head_sampling_rate = 0.1
# Per client address and data centre, on cache misses only, because a miss reads the bucket. Half of the
# zone's rate rule of 1,000 requests per 10 s; a TrailView open is about 350 requests.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 3000
period = 60
