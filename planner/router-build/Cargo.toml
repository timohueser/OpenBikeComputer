[package]
name = "planner-router-build"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "planner-router-build"
license = "GPL-3.0-only"

[dependencies]
planner-router = { path = "../router" }
osmpbfreader = "0.19"
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
# The credits the routing and terrain packages carry come from data/sources.toml.
obc-data = { path = "../../host/obc-data" }
# The heights of the roads, and the planner routing step of `obc data`.
obc-dem = { path = "../../host/obc-dem", default-features = false, features = ["geotiff", "fetch"] }
