[package]
name = "planner-router-build"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
planner-router = { path = "../router" }
osmpbfreader = "0.19"
country-boundaries = "1.2"
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
memmap2 = "0.9.11"
# The parallel passes of the bake.
rayon = "1"
# The request of the planner routing step.
obc-data = { path = "../../host/obc-data" }
# The canopy tiles of the route facts.
image = { workspace = true, features = ["webp"] }
# The heights of the roads, and the planner routing step of `obc data`.
obc-dem = { path = "../../host/obc-dem", default-features = false, features = ["geotiff", "fetch"] }

[dev-dependencies]
# The test PBF of the extract reader: the message types of osmpbfreader.
protobuf = "3"
