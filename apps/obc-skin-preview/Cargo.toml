[package]
name = "obc-skin-preview"
version = "0.1.0"
edition = "2021"
publish = false
description = "The builder skin editor's production-rendered Teningen preview"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obc-formats = { workspace = true }
obc-map-scene = { workspace = true }
obc-reader = { workspace = true, features = ["alloc"] }
obc-render = { workspace = true }
obc-host-core = { workspace = true }
obcm-assemble = { workspace = true }

[dev-dependencies]
obc-pack = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']
