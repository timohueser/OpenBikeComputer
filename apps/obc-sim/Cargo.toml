[package]
name = "obc-sim"
default-run = "obc-sim"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Desktop simulator for OBCM maps using embedded-graphics (same rendering path as the nRF54L firmware). Native-only — the landing page's wasm host is the sibling obc-web-demo crate; the host logic they share lives in obc-host-core."

[features]
external-fixtures = []

[dependencies]
obc-reader = { path = "../../firmware/obc-reader" }
# `alloc` gives us `NavScratch::new_boxed` — a zeroed heap allocation with no giant stack temporary
# (the headless one-shot planner builds its own scratch; the stepped NavPlan lives in obc-host-core).
obc-route = { path = "../../firmware/obc-route", features = ["alloc"] }
obc-formats = { path = "../../firmware/obc-formats" } # the byte-I/O seam (ByteSource/ByteSink/SliceSource/Error) — the authority, not via obc-route
# Shared production OBCW reader/cache + A/B generation selector. WX7 adds only the file-backed
# seam/tests here; WX14 owns simulator controls and companion behavior.
obc-weather = { path = "../../firmware/obc-weather" }
# `--weather live` (WX14): the host weather client — manifest + OBCG corridor Range reads + MET,
# assembled into the same OBCW bundle the phone uploads. Fixtures and CI never reach the network;
# the flag is the only thing that does.
obc-wx-client = { path = "../../host/obc-wx-client" }
# The frozen §11 weather request semantics (WX3/WX8): the sim's companion drives the *real*
# `DueScheduler` and `classify_upload`, so the device-side lifecycle is exercised truthfully.
obc-ble = { path = "../../firmware/obc-ble" }
chrono = { version = "0.4.34", default-features = false, features = ["std", "clock"] }
obc-render = { path = "../../firmware/obc-render" }
obc-app = { path = "../../firmware/obc-app" }
# Semantic sensor/input/track/settings ports implemented by the simulator host.
obc-ports = { path = "../../firmware/obc-ports" }
# The DFU byte formats (epic #615 S5, #620): the sim stages a synthetic OBCU `UPDATE.BIN` with
# `obc-dfu`'s encoder and runs the *real* `armer::scan` over it, so the "Install update from card"
# confirm/progress/error screens render off the same validation the board runs.
obc-dfu = { path = "../../firmware/obc-dfu" }
# The host glue shared with the landing page's wasm host (obc-web-demo): replay stepping, the
# frame-interleaved NavPlan + its commit tail, the in-memory byte sink.
obc-host-core = { path = "../../host/obc-host-core" }
# The board-agnostic self-diffing present core (epic #199 / issue #200): `diff_rows` + `row_hash` +
# the `spans_missed_changes` oracle. The sim drives the exact same row-diff the device present path
# adopts in D2, under an exact full-frame diff oracle — so a systematic hash-diff bug fails here in
# CI. The display seam (frame/presentation contracts + `ls021` rowdiff) lives in obc-display (#807).
obc-display = { path = "../../firmware/obc-display" }
# Shared host GPX replay (the GpxPlayer / BaroSensor the control panel drives) — the same
# crate the USB feeder (obc-usb-host) uses, so a recorded ride plays back identically here.
obc-replay = { path = "../../host/obc-replay" }
embedded-graphics = "0.8"
# GUI host: the device-screen window + control panel (pure-Rust window stack, no SDL).
eframe = "0.29"
# PNG output for headless `--png` renders.
image = { version = "0.25", default-features = false, features = ["png"] }
# Native "open file" dialog for selecting a GPX track to replay.
rfd = "0.14"

[dev-dependencies]
obc-fixtures = { path = "../../host/obc-fixtures" }
# The presenter suite in `present.rs` runs obc-display's reusable contract checks; the
# `conformance` feature exists so that scaffolding stays out of the device image, and this
# dev-dep turns it on for the sim's test builds only.
obc-display = { path = "../../firmware/obc-display", features = ["conformance"] }

# Minimal block-on to drive the `obc_platform::DisplayDriver` seam's async methods, which the sim
# backend completes synchronously on the host — only the `present` conformance tests await them.
# Already in the tree (eframe → wgpu pull it), so this reuses the resolved 0.3 rather than adding a
# new executor dep.
pollster = "0.3"
# Hand-built OBCM / OBCA fixtures for the `--set` loader tests. An independent oracle that calls no
# production serializer, so a set the simulator mounts was not built by the code under test.
obcm-testkit = { path = "../../host/obcm-testkit" }
