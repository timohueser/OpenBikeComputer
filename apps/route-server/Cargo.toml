[package]
name = "route-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
route-engine = { path = "../../host/route-engine" }
serde = "1"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors"] }

[dev-dependencies]
route-build = { path = "../../host/route-build" }

tower = { version = "0.5", features = ["util"] }
