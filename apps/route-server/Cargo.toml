[package]
name = "route-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "route-server"
required-features = ["http"]

[[test]]
name = "http"
required-features = ["http"]

[features]
default = ["http"]
# The HTTP service. The phone's static library builds without it.
http = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dependencies]
route-engine = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"], optional = true }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors"], optional = true }

[dev-dependencies]
route-build = { workspace = true }

tower = { version = "0.5", features = ["util"] }
