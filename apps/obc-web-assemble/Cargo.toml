[package]
name = "obc-web-assemble"
version = "0.1.0"
edition = "2021"
publish = false # internal bridge crate — not published to crates.io
description = "The hosted builder's wasm assembly bridge (epic #1016, P4b): downloaded OBCA cells → one .obcm or a volume set, in the browser, through the exact obcm-assemble engine the CLI runs."

# `cdylib` is what wasm-bindgen links; `rlib` keeps the crate a normal workspace library so
# `cargo test`/`clippy` exercise the assembly driver on the host target too — which is how the
# determinism pin (`tests/determinism.rs`) runs at all.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The assembly engine itself (#1024/P3). `default-features = false` drops the `cli` feature, which
# is where every `std::fs` call in that crate lives — the same surface CI's `wasm` job compiles for
# wasm32. This bridge adds no format knowledge: it is a byte-buffer adapter, a progress/abort seam
# over the engine's own `Clock` + `ShardStore` traits, and an error vocabulary.
obcm-assemble = { path = "../../host/obcm-assemble", default-features = false }
# The byte-I/O seam (`ByteSource`/`Error`) the engine reads through — imported directly rather than
# through the engine, because the abort path constructs one of its errors.
obc-formats = { path = "../../firmware/obc-formats" }
# The summary crosses to JS as JSON in the same shape `obcm-assemble --json` prints, so the CLI's
# output and the browser's are one document to learn. serde_json is already in the engine's graph
# (it parses the schema and the skin), so this costs the bundle nothing.
serde_json = "1"

# --- Web (wasm32) surface — the only target this crate actually ships on. The driver above stays
# target-independent so `cargo test` exercises it natively, exactly like obc-web-convert's core.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `js_sys::Error` + `Reflect::set`: a failure crosses to JS as a real `Error` instance carrying a
# stable `code` property, so callers can branch on the cause without matching on message text.
# `js_sys::Date` is the wasm clock — `std::time::Instant` panics on wasm32-unknown-unknown.
js-sys = "0.3"
# Surface Rust panics in the browser console instead of an opaque trap.
console_error_panic_hook = "0.1"

[dev-dependencies]
# The fixture regenerator (`tests/fixture.rs`, `#[ignore]`d) drives the **real cutter** to write the
# checked-in cell tree, exactly as `obcm-assemble`'s own oracle does. A dev-dep only: obc-pack
# carries libGEOS and must never enter this bridge's build graph, let alone the wasm one.
obc-pack = { path = "../../host/obc-pack" }

# wasm-pack drives wasm-opt over the release artifact; `-Oz` is the size-first setting, and the
# bundle-size budget CI enforces (firmware/tools/wasm_size_guard.py) is measured on its output.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']
