name = "obc-planner-tiles"
main = "src/worker.mjs"
compatibility_date = "2026-09-30"
workers_dev = false
preview_urls = false
routes = [{ pattern = "tiles.openbikecomputer.com", custom_domain = true }]
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "obc-maps"
[observability]
enabled = true
head_sampling_rate = 0.1
[observability.traces]
enabled = true
head_sampling_rate = 0.1
[limits]
cpu_ms = 50
# Per client address and data centre. Deliberately loose: the largest honest burst is about 100
# basemap and terrain tiles in a few seconds of zooming, and a places corridor is about 26 requests.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 12000
period = 60
