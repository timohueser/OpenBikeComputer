[package]
name = "obc-web-preview"
version = "0.1.0"
edition = "2021"
publish = false
description = "The builder skin editor's production-rendered Teningen preview"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obc-formats = { path = "../../firmware/obc-formats" }
obc-reader = { path = "../../firmware/obc-reader", features = ["alloc"] }
obc-render = { path = "../../firmware/obc-render" }
obc-host-core = { path = "../../host/obc-host-core" }
obcm-assemble = { path = "../../host/obcm-assemble", default-features = false }
embedded-graphics = "0.8"

[dev-dependencies]
obc-pack = { path = "../../host/obc-pack" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']
