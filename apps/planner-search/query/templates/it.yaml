  tue: {sg: [martedì, martedi], art: [il martedì]}
  wed: {sg: [mercoledì, mercoledi], art: [il mercoledì]}
  thu: {sg: [giovedì, giovedi], art: [il giovedì]}
  fri: {sg: [venerdì, venerdi], art: [il venerdì]}
  sat: {sg: [sabato], art: [il sabato]}
  sun: {sg: [domenica, domenica], art: [la domenica]}

