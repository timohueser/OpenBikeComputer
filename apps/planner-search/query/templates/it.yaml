      - ["al <chilometro {km}>", {ref: km, at: {value: $km, unit: km}}]
      - ["<dopo {km} km>", {ref: start, at: {value: $km, unit: km}}]
      - ["<dopo {hh} ore>", {ref: start, at: {value: $hh, unit: h}}]
      - ["<dopo un'ora>", {ref: start, at: {value: 1, unit: h}}]
      - ["<tra {km} km>", {ref: here, at: {value: $km, unit: km}}]
    range:
      - ["dal <km {k1} al km {k2}>", {ref: km, from: {value: $k1, unit: km}, to: {value: $k2, unit: km}}]
      - ["<tra il km {k1} e il km {k2}>", {ref: km, from: {value: $k1, unit: km}, to: {value: $k2, unit: km}}]
      - ["(nei|per i) <primi {km} km>", {ref: start, to: {value: $km, unit: km}}]
      - ["(negli|per gli) <ultimi {km} km>", {ref: end, to: {value: $km, unit: km}}]
      - ["(nei|per i) <prossimi {km} km>", {ref: here, to: {value: $km, unit: km}}]
      - ["(nelle|per le) <prossime {hh} ore>", {ref: here, to: {value: $hh, unit: h}}]
    rel:
      - ["(nei|per i) <primi {ks} km>", {ref: start, to: {value: $ks, unit: km}}]
      - ["(negli|per gli) <ultimi {ks} km>", {ref: end, to: {value: $ks, unit: km}}]
      - ["<dopo {km} km>", {ref: start, at: {value: $km, unit: km}}]
      - ["<dopo {hh} ore>", {ref: start, at: {value: $hh, unit: h}}]
      - ["nelle <prime {hh} ore>", {ref: start, to: {value: $hh, unit: h}}]
    here:
      - ["(nei|entro i) <prossimi {km} km>", {ref: here, to: {value: $km, unit: km}}]
      - ["nelle <prossime {hh} ore>", {ref: here, to: {value: $hh, unit: h}}]
      - ["nella <prossima ora>", {ref: here, to: {value: 1, unit: h}}]
      - ["<tra {km} km>", {ref: here, at: {value: $km, unit: km}}]
      - ["<tra {hh} ore>", {ref: here, at: {value: $hh, unit: h}}]

  RADIUS:
    pre:
      - ["<entro {r} km>", {value: $r, unit: km}]
      - ["<entro {m} metri>", {value: $m/1000, unit: km}]
      - ["<a meno di {r} km>", {value: $r, unit: km}]
      - ["<a massimo {r} km>", {value: $r, unit: km}]
    default:
      - ["<entro {r} km>", {value: $r, unit: km}]
      - ["<nel raggio di {r} km>", {value: $r, unit: km}]
      - ["<a meno di {r} km>", {value: $r, unit: km}]
      - ["<a massimo {r} km>", {value: $r, unit: km}]
      - ["<non oltre {r} km>", {value: $r, unit: km}]
      - ["<entro {m} metri>", {value: $m/1000, unit: km}]
      - ["<entro {x} km>", {value: $x, unit: km}]
      - ["<nel giro di {r} km>", {value: $r, unit: km}]

  OPEN:
    default:
      - ["(che sono |)<~(aperti|aperte|aperti) {wd:art}>", {weekday: $wd}]
      - ["(che sono |)<~(aperti|aperte|aperti) (di |)({wd:sg})>", {weekday: $wd}]
      - ["(che sono |)<~(aperti|aperte|aperti) (adesso|ora|in questo momento)>", {now: true}]
      - ["(che sono |)<ancora ~(aperti|aperte|aperti)>", {now: true}]
    wd:
      - ["(che sono |)<~(aperti|aperte|aperti) {wd:art}>", {weekday: $wd}]
      - ["<~(aperti|aperte|aperti) (di |)({wd:sg})>", {weekday: $wd}]
    wd_sg:
      - ["<~(aperto|aperta|aperto) ({wd:sg}|{wd:art})>", {weekday: $wd}]
    now:
      - ["(che sono |)<~(aperti|aperte|aperti) (adesso|ora)>", {now: true}]
      - ["<ancora ~(aperti|aperte|aperti)>", {now: true}]
    bare:
      - ["(che sono |)<~(aperti|aperte|aperti)>", bare]

  BIKE:
    default:
      - ["(bici da corsa|bdc|bici da strada)", road]
      - ["(gravel|bici gravel)", gravel]
      - ["(mtb|MTB|mountain bike)", mtb]
      - ["(bici da turismo|bici da viaggio|bici da trekking)", touring]

  GOAL:
    adj:
      - ["(più breve|più corto|più diretto|più veloce)", shortest]
      - ["(più piatto|più facile)", least_climbing]
      - ["<tutto asfaltato>", least_unpaved]
      - ["(più impegnativo|più duro)", most_climbing]
      - ["(equilibrato|normale|standard)", balanced]
    post:
      - ["<evitando le salite>", least_climbing]
      - ["con <(poco|meno) dislivello>", least_climbing]
      - ["<il più piatto possibile>", least_climbing]
      - ["<senza (grandi |)salite>", least_climbing]
      - ["<solo asfalto>", least_unpaved]
      - ["<senza sterrato>", least_unpaved]
      - ["<evitando (lo sterrato|la ghiaia|le strade bianche)>", least_unpaved]
      - ["su <strade asfaltate>", least_unpaved]
      - ["per la <strada più breve>", shortest]
      - ["<il più breve possibile>", shortest]
      - ["con <(tanto dislivello|più dislivello|il massimo di dislivello)>", most_climbing]
      - ["con <tante salite>", most_climbing]
      - ["<equilibrato>", balanced]
    cmp:
      - ["(più piatto|più facile|meno duro)", least_climbing]
      - ["(più breve|più corto|più diretto)", shortest]
      - ["(più impegnativo|più duro|più collinare)", most_climbing]
    cmp_n:
      - ["meno (dislivello|salite)", least_climbing]
      - ["meno (sterrato|ghiaia)", least_unpaved]
      - ["più (dislivello|salite)", most_climbing]

  DAYS:
    default:
      - ["<{d} giorni>", $d]
      - ["<{d:word} giorni>", $d]
      - ["<{d} tappe>", $d]
    in:
      - ["in <{d} giorni>", $d]
      - ["in <{d:word} giorni>", $d]
      - ["in <una settimana>", 7]
      - ["in <due settimane>", 14]
      - ["in <{d} tappe>", $d]

  PER_DAY:
    default:
      - ["<{km} km al giorno>", {value: $km, unit: km}]
      - ["<{km} km/giorno>", {value: $km, unit: km}]
      - ["<{km} km a tappa>", {value: $km, unit: km}]
      - ["<(massimo|circa|più o meno) {km} km al giorno>", {value: $km, unit: km}]
      - ["<{km} chilometri al giorno>", {value: $km, unit: km}]
      - ["<{hh} ore al giorno>", {value: $hh, unit: h}]
      - ["<{x} ore al giorno>", {value: $x, unit: h}]
    filler:
      - ["<al massimo {hh} ore di pedalata al giorno>", {value: $hh, unit: h}]
      - ["<non più di {km} km al giorno>", {value: $km, unit: km}]
      - ["<fino a {km} km al giorno>", {value: $km, unit: km}]
      - ["<massimo {hh} ore in sella al giorno>", {value: $hh, unit: h}]
    stages:
      - ["<tappe (da|di) {km} km>", {value: $km, unit: km}]

  EVERY:
    default:
      - ["<ogni {km} km>", {value: $km, unit: km}]
      - ["<ogni {km} chilometri>", {value: $km, unit: km}]
      - ["<ogni {hh} ore>", {value: $hh, unit: h}]
      - ["<ogni ora>", {value: 1, unit: h}]
      - ["<ogni {min} minuti>", {value: $min/60, unit: h}]
      - ["<ogni {x} ore>", {value: $x, unit: h}]

  MIN:
    default:
      - ["<~(più lunghi|più lunghe|più lunghi) di {ks} km>", {value: $ks, unit: km}]
      - ["<oltre {ks} km>", {value: $ks, unit: km}]
      - ["<di almeno {ks} km>", {value: $ks, unit: km}]
      - ["<da {ks} km o più>", {value: $ks, unit: km}]
      - ["<~(più lunghi|più lunghe|più lunghi) di {m} metri>", {value: $m/1000, unit: km}]
    gap:
      - ["<di oltre {km} km>", {value: $km, unit: km}]
      - ["<per più di {km} km>", {value: $km, unit: km}]
      - ["<oltre {km} km>", {value: $km, unit: km}]
    elev:
      - ["<oltre {e} m di dislivello>", {value: $e, unit: m}]
      - ["con <più di {e} m di dislivello>", {value: $e, unit: m}]
      - ["<oltre {e} metri>", {value: $e, unit: m}]
      - ["<di più di {e} m D+>", {value: $e, unit: m}]
    pct:
      - ["<oltre il {p} %>", {value: $p, unit: "%"}]
      - ["<sopra il {p}%>", {value: $p, unit: "%"}]
      - ["<oltre il {p} per cento>", {value: $p, unit: "%"}]
      - ["<di più del {p} %>", {value: $p, unit: "%"}]
    than_pct:
      - ["<del {p} %>", {value: $p, unit: "%"}]
      - ["<del {p}%>", {value: $p, unit: "%"}]

  IGNORED:
    filter:
      - "(con piscina|con wifi|con il wifi|che accettano carte|con vista|con elettricità|con docce calde|con cibo vegano|con parcheggio|con terrazza|con colazione|con deposito bici|con cucina|che accettano cani|con posti liberi|con buone recensioni|con vista lago)"
    post:
      - "(economici|economiche|tranquilli|tranquille|ben recensiti|gratuiti|carini|per famiglie|di lusso|più economici)"
    nested:
      - "(vicino a|accanto a|non lontano da) {art:indef} {kind:sg}"
      - "(con|che hanno) {art:indef} {kind:sg} vicino"
      - "entro {r} km da {art:indef} {kind:sg}"
      - "vicino {art:a} {kind:sg} più ~(vicino|vicina|vicino)"
    route:
      - "(evitando|senza) (le strade principali|le statali|le gallerie|il traffico|l'autostrada|i traghetti)"
      - "(con bei panorami|per strade secondarie|lungo il fiume|nel bosco|su piste ciclabili|con poco traffico|tra le vigne|lungo la costa)"
      - "(prima di sera|prima del tramonto|entro mezzogiorno|prima delle 17)"
    route_post:
      - "(tranquillo|panoramico|bello|sicuro|senza auto|poco trafficato)"
    stretch:
      - "(all'ombra|con vista|al sole|pericolosi|pericolose|con semafori|di più di un'ora|pedalabili)"

points:
  default:
    name: ["{name}"]
    kind: ["<{art:def} {kind:sg} più ~(vicino|vicina|vicino)>", "<{art:indef} {kind:sg}>", "<~(il prossimo|la prossima|il prossimo) {kind:sg}>"]
    here: ["<(qui|la mia posizione|dove sono)>"]
    along:
      - ["<km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["<chilometro {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # route destination
  a:
    name: ["a <{name:town}>", "verso <{name}>", "fino a <{name}>", "al <{name:peak}>", "per <{name}>"]
    kind: ["{art:a} <{kind:sg} più ~(vicino|vicina|vicino)>", "{art:a} <~(prossimo|prossima|prossimo) {kind:sg}>", "fino a <{art:indef} {kind:sg}>"]
    plan:
      - ["(alla|dalla) <partenza>", {plan: start}]
      - ["al <punto di partenza>", {plan: start}]
      - ["<all'arrivo>", {plan: end}]
      - ["alla <fine del percorso>", {plan: end}]
    day:
      - ["fino alla <fine del giorno {n}>", {day: $n, part: end}]
      - ["<all'arrivo del giorno {n}>", {day: $n, part: end}]
    along:
      - ["(al|fino al) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # route origin
  da:
    name: ["da <{name}>", "partendo da <{name}>", "in partenza da <{name}>"]
    day:
      - ["dalla <fine del giorno {n}>", {day: $n, part: end}]
      - ["dalla <fine della tappa {n}>", {day: $n, part: end}]
      - ["<dall'inizio del giorno {n}>", {day: $n, part: start}]
    along:
      - ["(dal|partendo dal) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
    here: ["da <qui>", "dalla <mia posizione>", "partendo da <qui>"]
    kind: ["{art:da} <{kind:sg} più ~(vicino|vicina|vicino)>"]
    plan:
      - ["dalla <partenza>", {plan: start}]
  via:
    name: ["passando per <{name}>", "via <{name}>", "per <{name:town}>"]
    kind: ["passando per <{art:indef} {kind:sg}>"]
  # a point with its preposition: end_day, add_point
  at:
    name: ["a <{name:town}>", "a <{name}>", "al <{name:peak}>", "presso <{name}>"]
    kind: ["{art:a} <{kind:sg} più ~(vicino|vicina|vicino)>", "in <{art:indef} {kind:sg}>", "{art:a} <~(prossimo|prossima|prossimo) {kind:sg}>"]
    here: ["<qui>", "<proprio qui>", "alla <mia posizione>"]
    along:
      - ["al <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["<dopo {km} km>", {along: {ref: start, at: {value: $km, unit: km}}}]
      - ["<dopo {hh} ore>", {along: {ref: start, at: {value: $hh, unit: h}}}]
      - ["<tra {km} km>", {along: {ref: here, at: {value: $km, unit: km}}}]
  vicino:
    name: ["vicino a <{name}>", "nei pressi di <{name}>", "intorno a <{name}>", "a <{name:town}>", "presso <{name}>", "zona <{name}>"]
    here: ["vicino a <me>", "<qui vicino>", "<vicino a me>"]
  prima:
    name: ["prima di <{name}>", "prima del <{name:peak}>"]
    day:
      - ["prima della <fine del giorno {n}>", {day: $n, part: end}]
      - ["prima <dell'inizio del giorno {n}>", {day: $n, part: start}]
      - ["prima della <metà del giorno {n}>", {day: $n, part: middle}]
      - ["prima <dell'arrivo del giorno {n}>", {day: $n, part: end}]
    along:
      - ["prima del <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["prima del <chilometro {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  dopo:
    name: ["dopo <{name}>", "dopo il <{name:peak}>", "oltre <{name}>"]
    day:
      - ["dopo <l'inizio del giorno {n}>", {day: $n, part: start}]
      - ["dopo la <metà del giorno {n}>", {day: $n, part: middle}]
      - ["dopo la <fine del giorno {n}>", {day: $n, part: end}]
    along:
      - ["dopo il <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["oltre il <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["passato il <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  obj:
    name: ["{name}"]
    kind: ["<{art:indef} {kind:sg}>"]
  mod:
    kind: ["{kind:mod}"]
  up:
    name: ["in cima al <{name:peak}>", "al <{name:peak}>", "a <{name:town}>", "fino in cima al <{name:peak}>", "su al <{name:peak}>"]
  intown:
    name: ["a <{name:town}>", "a <{name:kt}>", "a <{name:kt}>"]
  biz_town:
    name: ["{name:biz} {name:town}"]

