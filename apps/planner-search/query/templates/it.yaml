# Italian templates for gen/generate.py. The format is in the docstring of gen/generate.py.
# Written the way an Italian rider types: articulated prepositions (al, dello, all'ostello),
# "dove dormire stasera?", adjectives after the noun, infinitive questions and "c'è".
lang: it
decimal: ","

numbers:
  word: [zero, uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci, undici, dodici, tredici, quattordici]
  ordm: [null, primo, secondo, terzo, quarto, quinto, sesto, settimo, ottavo, nono, decimo, undicesimo, dodicesimo]
  ordf: [null, prima, seconda, terza, quarta, quinta, sesta, settima, ottava, nona, decima, undicesima, dodicesima]

weekdays:
