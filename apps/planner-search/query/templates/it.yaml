      - ["dal <km {k1} al km {k2}>", {ref: km, from: {value: $k1, unit: km}, to: {value: $k2, unit: km}}]
      - ["<tra il km {k1} e il km {k2}>", {ref: km, from: {value: $k1, unit: km}, to: {value: $k2, unit: km}}]
      - ["(al|verso il) <km {km}>", {ref: km, at: {value: $km, unit: km}}]
