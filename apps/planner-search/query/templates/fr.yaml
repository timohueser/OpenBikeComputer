points:
  default:
    name: ["{name}"]
    kind: ["<{art:def} {kind:sg} ~(le plus proche|la plus proche|le plus proche)>", "<{art:indef} {kind:sg}>", "<~(le prochain|la prochaine|le prochain) {kind:sg}>"]
    here: ["<(ici|ma position|là où je suis)>"]
    along:
      - ["<km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["<kilomètre {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # route destination
  vers:
    name: ["à <{name:town}>", "vers <{name}>", "jusqu'à <{name}>", "au <{name:peak}>", "pour <{name}>"]
    kind: ["{art:a} <{kind:sg} ~(le plus proche|la plus proche|le plus proche)>", "{art:a} <~(prochain|prochaine|prochain) {kind:sg}>", "jusqu'à <{art:indef} {kind:sg}>"]
    plan:
      - ["au <(départ|point de départ)>", {plan: start}]
      - ["(à|jusqu'à) <l'arrivée>", {plan: end}]
      - ["à la <fin du parcours>", {plan: end}]
    day:
      - ["jusqu'à la <fin du jour {n}>", {day: $n, part: end}]
      - ["à <l'arrivée du jour {n}>", {day: $n, part: end}]
    along:
      - ["(au|jusqu'au) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # route origin
  depuis:
    name: ["depuis <{name}>", "{art:prep_de} <{name}>", "au départ {art:prep_de} <{name}>", "en partant {art:prep_de} <{name}>"]
    day:
      - ["de la <fin du jour {n}>", {day: $n, part: end}]
      - ["de la <fin de l'étape {n}>", {day: $n, part: end}]
      - ["du <début du jour {n}>", {day: $n, part: start}]
    along:
      - ["(du|depuis le) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
    here: ["<d'ici>", "depuis <ici>", "de <ma position>", "en partant <d'ici>", "à partir <d'ici>"]
    kind: ["{art:de} <{kind:sg} ~(le plus proche|la plus proche|le plus proche)>"]
    plan:
      - ["du <départ>", {plan: start}]
  via:
    name: ["par <{name}>", "via <{name}>", "en passant par <{name}>"]
    kind: ["par <{art:indef} {kind:sg}>", "en passant par <{art:indef} {kind:sg}>"]
  # a point with its preposition: end_day, add_point
  a:
    name: ["à <{name:town}>", "à <{name}>", "au <{name:peak}>", "près {art:prep_de} <{name}>"]
    kind: ["{art:a} <{kind:sg} ~(le plus proche|la plus proche|le plus proche)>", "dans <{art:indef} {kind:sg}>", "{art:a} <~(prochain|prochaine|prochain) {kind:sg}>"]
    here: ["<ici>", "<juste ici>", "à <ma position>"]
    along:
      - ["au <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["<(après|au bout de) {km} km>", {along: {ref: start, at: {value: $km, unit: km}}}]
      - ["<après {hh} heures>", {along: {ref: start, at: {value: $hh, unit: h}}}]
      - ["<dans {km} km>", {along: {ref: here, at: {value: $km, unit: km}}}]
  pres:
    name: ["près {art:prep_de} <{name}>", "autour {art:prep_de} <{name}>", "à côté {art:prep_de} <{name}>", "vers <{name}>", "à <{name:town}>", "dans le coin {art:prep_de} <{name}>"]
    here: ["près de <moi>", "<près d'ici>", "<autour de moi>"]
  avant:
    name: ["avant <{name}>", "avant le <{name:peak}>"]
    day:
      - ["avant la <fin du jour {n}>", {day: $n, part: end}]
      - ["avant le <début du jour {n}>", {day: $n, part: start}]
      - ["avant le <milieu du jour {n}>", {day: $n, part: middle}]
      - ["avant <l'arrivée du jour {n}>", {day: $n, part: end}]
    along:
      - ["avant le <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["avant le <kilomètre {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  apres:
    name: ["après <{name}>", "après le <{name:peak}>", "au-delà {art:prep_de} <{name}>"]
    day:
      - ["après le <début du jour {n}>", {day: $n, part: start}]
      - ["après le <milieu du jour {n}>", {day: $n, part: middle}]
      - ["après la <fin du jour {n}>", {day: $n, part: end}]
    along:
      - ["après le <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["au-delà du <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["passé le <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  obj:
    name: ["{name}"]
    kind: ["<{art:indef} {kind:sg}>"]
  mod:
    kind: ["{kind:mod}"]
  up:
    name: ["au sommet du <{name:peak}>", "en haut du <{name:peak}>", "au <{name:peak}>", "à <{name:town}>"]
  intown:
    name: ["à <{name:town}>", "à <{name:kt}>", "à <{name:kt}>"]
  biz_town:
    name: ["{name:biz} {name:town}"]

