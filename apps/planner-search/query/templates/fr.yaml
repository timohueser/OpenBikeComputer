# French templates for gen/generate.py. The format is in the docstring of gen/generate.py.
# Written the way a French rider types: elisions (l'hôtel, d'Annecy), contractions (au, du),
# adjectives after the noun, "où camper ?", and the space before "?" that some riders keep.
lang: fr
decimal: ","

numbers:
  word: [zéro, un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, onze, douze, treize, quatorze]
  ordm: [null, premier, deuxième, troisième, quatrième, cinquième, sixième, septième, huitième, neuvième, dixième, onzième, douzième]
  ordf: [null, première, deuxième, troisième, quatrième, cinquième, sixième, septième, huitième, neuvième, dixième, onzième, douzième]
  ord: [null, 1er, 2e, 3e, 4e, 5e, 6e, 7e, 8e, 9e, 10e, 11e, 12e, 13e, 14e]

