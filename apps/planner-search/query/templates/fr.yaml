      - ["<{km} km par jour>", {value: $km, unit: km}]
      - ["<{km} km/jour>", {value: $km, unit: km}]
      - ["<{km} km par étape>", {value: $km, unit: km}]
      - ["<(max|maximum|environ|à peu près) {km} km par jour>", {value: $km, unit: km}]
      - ["<{km} kilomètres par jour>", {value: $km, unit: km}]
      - ["<{hh} heures par jour>", {value: $hh, unit: h}]
      - ["<{x} heures par jour>", {value: $x, unit: h}]
    filler:
      - ["<pas plus de {km} km par jour>", {value: $km, unit: km}]
      - ["<au maximum {hh} heures de vélo par jour>", {value: $hh, unit: h}]
      - ["<jusqu'à {km} km par jour>", {value: $km, unit: km}]
      - ["<{hh} heures de selle par jour>", {value: $hh, unit: h}]
      - ["<maximum {hh} heures de pédalage par jour>", {value: $hh, unit: h}]
