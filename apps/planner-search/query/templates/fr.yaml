      - ["<au-dessus de {p} %>", {value: $p, unit: "%"}]
      - ["<à plus de {p} pour cent>", {value: $p, unit: "%"}]
    than_pct:
      - ["<que {p} %>", {value: $p, unit: "%"}]
      - ["<que {p}%>", {value: $p, unit: "%"}]

  IGNORED:
