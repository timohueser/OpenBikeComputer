      - ["<journées de {km} km>", {value: $km, unit: km}]

  EVERY:
    default:
      - ["<tous les {km} km>", {value: $km, unit: km}]
      - ["<tous les {km} kilomètres>", {value: $km, unit: km}]
      - ["<toutes les {hh} heures>", {value: $hh, unit: h}]
      - ["<(toutes les heures|chaque heure)>", {value: 1, unit: h}]
      - ["<toutes les {min} minutes>", {value: $min/60, unit: h}]
      - ["<toutes les {x} heures>", {value: $x, unit: h}]

  MIN:
    default:
      - ["<de plus de {ks} km>", {value: $ks, unit: km}]
      - ["<~(plus longs|plus longues|plus longs) que {ks} km>", {value: $ks, unit: km}]
      - ["<d'au moins {ks} km>", {value: $ks, unit: km}]
      - ["<de {ks} km ou plus>", {value: $ks, unit: km}]
      - ["<~(plus longs|plus longues|plus longs) que {m} m>", {value: $m/1000, unit: km}]
    gap:
      - ["<de plus de {km} km>", {value: $km, unit: km}]
      - ["<sur plus de {km} km>", {value: $km, unit: km}]
      - ["<pendant plus de {km} km>", {value: $km, unit: km}]
    elev:
      - ["<de plus de {e} m de dénivelé>", {value: $e, unit: m}]
      - ["<avec plus de {e} m de D+>", {value: $e, unit: m}]
      - ["<de plus de {e} m>", {value: $e, unit: m}]
