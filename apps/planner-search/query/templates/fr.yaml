      - ["<dans un rayon de {r} km>", {value: $r, unit: km}]
      - ["<à {r} km> (max|maximum|au plus|maxi)", {value: $r, unit: km}]
      - ["<pas à plus de {r} km>", {value: $r, unit: km}]
