      - ["<tout goudronné>", least_unpaved]
      - ["(le plus vallonné|le plus montagneux|le plus dur)", most_climbing]
      - ["(équilibré|normal|standard)", balanced]
    post:
      - ["en <évitant les (côtes|montées|bosses)>", least_climbing]
      - ["avec <(peu de|le moins de) dénivelé>", least_climbing]
      - ["<le plus plat possible>", least_climbing]
      - ["<sans (grosses |)(côtes|montées)>", least_climbing]
      - ["<que du goudron>", least_unpaved]
      - ["<sans (chemins|pistes|gravier)>", least_unpaved]
      - ["en <évitant (le gravier|les chemins|les pistes)>", least_unpaved]
      - ["sur <route goudronnée>", least_unpaved]
      - ["par le <(plus court|plus direct) chemin>", shortest]
      - ["<au plus court>", shortest]
      - ["avec <(un max de|beaucoup de|le plus de) dénivelé>", most_climbing]
      - ["<le plus vallonné possible>", most_climbing]
      - ["<équilibré>", balanced]
    cmp:
      - ["(plus plat|plus facile|moins dur)", least_climbing]
      - ["(plus court|plus direct)", shortest]
      - ["(plus vallonné|plus dur|plus sportif)", most_climbing]
    cmp_n:
      - ["moins de (dénivelé|côtes|montées)", least_climbing]
      - ["moins de (gravier|chemins|pistes)", least_unpaved]
      - ["plus de (dénivelé|côtes)", most_climbing]

  DAYS:
