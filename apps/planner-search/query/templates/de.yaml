points:
  default:
    name: ["{name}"]
    kind: ["~(der|die|das) <nächste {kind:sg}>", "<~(ein|eine|ein) {kind:sg}>"]
    here: ["<hier>"]
    along:
      - ["<km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # route destination
  nach:
    name: ["nach <{name:town}>", "nach <{name}>", "zum <{name:biz}>", "zum <{name:peak}>", "auf den <{name:peak}>", "zur <{name:hut}>", "bis <{name}>"]
    kind: ["~(zum|zur|zum) <nächsten {kind:sg}>", "~(zum|zur|zum) <{kind:sg}>", "zu <~(einem|einer|einem) {kind:sg}>"]
    plan:
      - ["zurück zum <Start>", {plan: start}]
      - ["zum <(Start|Ausgangspunkt)> (zurück|)", {plan: start}]
      - ["zum <(Ziel|Endpunkt)>", {plan: end}]
      - ["ans <Ende der (Route|Tour)>", {plan: end}]
    day:
      - ["bis zum <Ende von Tag {n}>", {day: $n, part: end}]
      - ["bis <Ende Tag {n}>", {day: $n, part: end}]
    along:
      - ["(auf|zu) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # route origin
  von:
    name: ["von <{name}>", "ab <{name}>", "aus <{name:town}>", "vom <{name:biz}>", "vom <{name:peak}>"]
    day:
      - ["vom <Ende von Tag {n}>", {day: $n, part: end}]
      - ["vom <Start von Tag {n}>", {day: $n, part: start}]
      - ["ab <Ende Tag {n}>", {day: $n, part: end}]
      - ["vom <Etappenziel von Tag {n}>", {day: $n, part: end}]
    along:
      - ["(ab|von) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["ab <Kilometer {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
    here: ["(von|ab) <hier>", "von <(meinem Standort|meiner Position)>", "<hier>"]
    kind: ["~(vom|von der|vom) <nächsten {kind:sg}>"]
    plan:
      - ["(vom|ab) <Start>", {plan: start}]
  # route via
  ueber:
    name: ["über <{name}>", "via <{name}>", "durch <{name:town}>", "über den <{name:peak}>"]
    kind: ["über <~(einen|eine|ein) {kind:sg}>", "an <~(einem|einer|einem) {kind:sg}> vorbei"]
  # a point with its preposition: end_day, add_point
  bei:
    name: ["in <{name:town}>", "bei <{name}>", "am <{name:peak}>", "beim <{name:biz}>", "auf der <{name:hut}>", "in <{name}>"]
    kind: ["~(beim|bei der|beim) <nächsten {kind:sg}>", "~(am|an der|am) <nächsten {kind:sg}>", "bei <~(einem|einer|einem) {kind:sg}>", "an <~(einem|einer|einem) {kind:sg}>", "~(im|in der|im) <nächsten {kind:sg}>"]
    here: ["<hier>", "<genau hier>", "an <meinem Standort>"]
    along:
      - ["bei <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["bei <Kilometer {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["<nach {km} km>", {along: {ref: start, at: {value: $km, unit: km}}}]
      - ["<nach {hh} Stunden>", {along: {ref: start, at: {value: $hh, unit: h}}}]
      - ["<in {km} km>", {along: {ref: here, at: {value: $km, unit: km}}}]
  # near, in places and place
  nahe:
    name: ["in der Nähe von <{name}>", "bei <{name}>", "um <{name:town}>", "nahe <{name}>", "rund um <{name:town}>", "in <{name:town}>", "Nähe <{name}>"]
    here: ["bei <mir>", "<in meiner Nähe>", "<hier in der Nähe>"]
  vor:
    name: ["vor <{name}>", "vor dem <{name:peak}>", "vor der <{name:hut}>"]
    day:
      - ["vor dem <Ende von Tag {n}>", {day: $n, part: end}]
      - ["vor der <Mitte von Tag {n}>", {day: $n, part: middle}]
      - ["vor dem <Start von Tag {n}>", {day: $n, part: start}]
      - ["vor <Ende Tag {n}>", {day: $n, part: end}]
    along:
      - ["vor <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["vor <Kilometer {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  nach_after:
    name: ["nach <{name}>", "hinter <{name:town}>", "nach dem <{name:peak}>"]
    day:
      - ["nach dem <Start von Tag {n}>", {day: $n, part: start}]
      - ["nach der <Mitte von Tag {n}>", {day: $n, part: middle}]
      - ["nach dem <Ende von Tag {n}>", {day: $n, part: end}]
    along:
      - ["nach <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["(hinter|ab) <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
      - ["nach <Kilometer {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  # the object of add_point verbs ("einen Bäcker einbauen")
  akk:
    name: ["{name}"]
    kind: ["<~(einen|eine|ein) {kind:sg}>"]
  rm:
    name: ["{name}", "{name}"]
    kind: ["den Stopp ~(beim|bei der|beim) <{kind:sg}>"]
    along:
      - ["den Punkt bei <km {km}>", {along: {ref: km, at: {value: $km, unit: km}}}]
  stop:
    kind: ["{kind:stop}"]
  up:
    name: ["auf den <{name:peak}>", "zum <{name:peak}>", "hoch zum <{name:peak}>", "rauf auf den <{name:peak}>", "ganz nach oben auf den <{name:peak}>"]
  intown:
    name: ["in <{name:town}>", "in <{name:kt}>", "in <{name:kt}>"]
  mod:
    kind: ["{kind:mod}"]
  biz_town:
    name: ["{name:biz} {name:town}"]

