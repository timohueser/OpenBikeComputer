# German templates for gen/generate.py. The format is in the docstring of gen/generate.py.
# Written the way a German rider types: verb at the end, fused prepositions (zum, beim, am),
# compounds (Kaffeepause, Rennradroute) and telegraphic style.
lang: de
decimal: ","

numbers:
