<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            let theme;
            try { theme = localStorage.getItem("obc-theme"); } catch {}
            document.documentElement.dataset.theme = theme === "light" || theme === "dark"
                ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        </script>
        <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/signpost.svg" />
        <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
        <title>OpenBikeComputer · Maps</title>
        <meta
            name="description"
            content="Get .obcm maps for the OpenBikeComputer: download a ready-made region, or build your own from OpenStreetMap data."
        />
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
