[package]
name = "obc-trailview-parts-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The TrailView tunnel parts in the browser: the builder of obc-trailview-parts behind wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obc-trailview-parts = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }

# The stamp worker builds the parts of each node it stamps: speed comes before size.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3']
