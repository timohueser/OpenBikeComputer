[package]
name = "obc-ground-plan-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The TrailView ground plan in the browser: the cell build of obc-ground-plan behind wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obc-ground-plan = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }

# The cell build time on a phone is the first risk of the ground plan; the file loads once and stays
# in the cache, so speed comes before size.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3']

[dev-dependencies]
serde_json = { workspace = true }
