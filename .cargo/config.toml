# Repo-root cargo config.
#
# Wasm shadow stack for the web demo (firmware/obc-web-demo). The **release** build —
# what the site ships — runs fine on rustc's default 1 MiB stack (verified in-browser
# through the full POI-reroute flow; the big values are heap-boxed: Demo, App, MapCache,
# NavScratch). The **debug** build (`trunk serve`, CI's `wasm` job) still traps at 1 MiB:
# without optimizations, `MapCache::new()`'s ~278 KB `MaybeUninit::zeroed()` interior
# crosses the stack several un-elided-copy times before landing in its `Box`. Measured
# passing end-to-end at 2 MiB; 4 MiB = 2× headroom. (The egui-era value here was 16 MiB —
# a ~15 MiB linear-memory reservation the demo never needed.)
#
# Rustflags can't be profile-scoped on stable, so the flag covers release too — cost
# there is only a ~3 MiB larger initial linear-memory reservation, not transfer size.
# It can go entirely once a `MapCache::new_boxed()` (zeroed straight on the heap, like
# `NavScratch::new_boxed`) replaces the by-value construction in obc-web-demo.
#
# This lives at the repo root (not under firmware/) so cargo discovers it no matter
# which directory Trunk runs the build from — the site's Trunk config lives in docs/,
# outside the firmware/ tree where the crate sits.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=4194304"]
