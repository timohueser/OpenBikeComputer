[package]
name = "obc-storage"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Board-agnostic no_std storage adapters from an embedded-sdmmc SD card to the OBC format/port seams: FatFs ByteSource/ByteSink/TrackSink adapters (map/route/track on SD) and the FAT-extent fast path that resolves the map file's chain once into direct-block reads (#500). Generic over BlockDevice/TimeSource — no board bus types, no renderer/UI."

[dependencies]
# The byte-I/O seam the adapters implement (`ByteSource`/`ByteSink`/`Error`) plus the fixed-record
# track codec — both owned by the format authority, so `SdByteSource` drops into
# `RouteReader`/`RouteSummary::read` (which consume the same `obc_formats::io` traits) and
# `SdTrackSink` encodes `obc_ports::TrackPoint`s without a dependency on the `obc-route` algorithms
# (#807/#812 severed `obc-storage -> obc-route`).
obc-formats = { path = "../obc-formats" }

# Shared OBCW reader + pure A/B generation selector. This is a downward platform -> core edge;
# byte layout remains owned solely by obc-formats.
obc-weather = { path = "../obc-weather" }
obc-crc = { path = "../obc-crc" }

# The `TrackSink`/`TrackPoint`/`TrackError` semantic seam the track adapter fulfils — the foundation
# port contract, never an upward renderer/UI dependency.
obc-ports = { path = "../obc-ports" }

# The FatFs/SD-card stack the adapters wrap. The adapters are generic over its `BlockDevice` +
# `TimeSource`, so they carry no board/bus types — a board crate picks the concrete
# `SdCard<SpiDevice, _>`. `default-features = false` drops the `log` facade (the board logs over
# defmt/RTT itself); the adapters add no logging of their own.
embedded-sdmmc = { version = "0.9", default-features = false }

# The bounded `Vec<Run, N>` a FAT-extent table stores the resolved map chain in, and the bounded
# region tables of the OBC2 catalog projection.
# Same 0.8 the rest of the OBC stack uses.
heapless = "0.8"

# The Device Object System v2 identity types (`obc_link::ids`) and the wire opcode registry an OBC2
# active-operation row is validated against (`OBC2_Storage_Format.md` §5.3). A platform -> foundation
# edge, the same direction `obc-storage -> obc-formats` already runs: `obc-link` is a transport-free
# codec, so no adapter, session or framing comes with it.
obc-link = { path = "../obc-link" }

# Host-only, and optional so the device image never links it: the storage fixture producer digests
# each vector file with SHA-256 for the suite manifest. Same 0.11 the rest of the workspace resolves.
sha2 = { version = "0.11", default-features = false, optional = true }

[dev-dependencies]
# The same digest, for `cfg(test)` runs that do not enable the `std` feature.
sha2 = { version = "0.11", default-features = false }

# The wire crate's host-only fake-link harness and its published scenario suite, which the
# kernel-backed transaction is held to. It is a dev-dependency so the device image never sees
# `std`: `cargo build -p obc-storage` still resolves `obc-link` without it.
obc-link = { path = "../obc-link", features = ["std"] }

[features]
default = []
# Host-only: the deterministic faulting-media harness (`obc2::media`) and the spec-derived storage
# fixture producer (`obc2::vectors`) that writes `specs/vectors/device-object-v2/storage/`. Neither
# is reachable from the device image. `cfg(test)` enables both implicitly, so `cargo test -p
# obc-storage` and a workspace `--all-features` run agree.
std = ["dep:sha2", "obc-link/std"]
