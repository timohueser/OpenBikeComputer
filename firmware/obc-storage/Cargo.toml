[package]
name = "obc-storage"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Board-agnostic no_std flat-store mechanics over a generic block device."

[dependencies]
# Shared object codecs and byte-source traits used by flat-store readers and metadata.
obc-formats = { path = "../obc-formats" }

obc-crc = { path = "../obc-crc" }

# Bounded mutation batches for the flat-store wire adapter.
heapless = "0.8"

# The transport-free v4 store seam implemented by `flat::wire`.
obc-link = { path = "../obc-link" }

[dev-dependencies]
# The read cutover's pin (FS7.5-c2, #1420): `flat::map_read` commits a real OBCM map into a flat
# store and drives the renderer's own `MapTables`/`Reader` over it through `StoreSource`, against a
# `SliceSource` over the same bytes as the oracle. Dev-only, and deliberately upward — the device
# image resolves `obc-storage` without either, and the alternative (asserting field values instead
# of comparing two paths over one array of bytes) would be a weaker check that still needed the
# reader to write.
obc-reader = { path = "../obc-reader" }
obcm-testkit = { path = "../../host/obcm-testkit" }

[features]
default = []
# Host-only deterministic faulting card and reference model (`flat::sim`, `flat::model`).
# Tests enable both implicitly; the device image uses neither.
std = []
