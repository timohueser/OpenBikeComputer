[package]
name = "obc-app"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBC device application and compatibility facade (no_std) — shared by the desktop simulator and the nRF54L firmware"

[dependencies]
# Dependency-light semantic hardware/host ports. obc-app re-exports these names during the staged
# migration so existing board and simulator imports remain source-compatible.
obc-ports = { path = "../obc-ports" }
# The persistent-format authority: OBCM/ride format constants, the POI category/subtype table, and
# its lookups (`poi_label_of` / `poi_category_of`). no_std foundation crate — a downward edge.
obc-formats = { path = "../obc-formats" }
# default-features = false keeps `std` OUT of the shared app layer, so this crate
# (and everything it pulls) compiles for the nRF54L's bare-metal target. The host
# simulator re-enables std on `obc-reader` through its own dependency edge. `render`
# brings the `Viewport` + `MapRenderer` the app drives; it's no_std.
obc-reader = { path = "../obc-reader" }
obc-map-scene = { path = "../obc-map-scene" }
obc-render = { path = "../obc-render" }
# The route format + reader (RouteSummary for the menu catalog, RouteReader the Map
# draws). no_std, shared with the firmware exactly like the map reader.
obc-route = { path = "../obc-route" }
# Needed only to name the `DrawTarget` bound on `App::render_frame`. no_std.
embedded-graphics = "0.8"
# Fixed-capacity screen stack (no_std, zero-alloc) — same crate the renderer uses.
heapless = "0.8"
# sin/cos for the Menu compass needle at arbitrary sweep angles — the same no_std math
# shim the renderer and route crates use.
libm = { version = "0.2", default-features = false } # no arch asm: identical correctly-rounded results, keeps the suite Miri-runnable (the #501 alignment-UB tripwire)

[dev-dependencies]
# The hand-written OBCM v6 byte builder shared by the reader/renderer tests — the POIs-browser
# integration tests (#425) use `build_poi_map` to synthesise a v6 map with real POIs to snapshot.
obcm-testkit = { path = "../../host/obcm-testkit" }
