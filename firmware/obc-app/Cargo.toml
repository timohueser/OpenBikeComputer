[package]
name = "obc-app"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBC device application + hardware-abstraction traits (no_std) — shared by the desktop simulator and the nRF54L firmware"

[features]
# Constrained on-device memory profile (issue #124). Forwards to the renderer + reader + route
# crates so the board firmware enables just `obc-app/nrf-mem` to trim every resident buffer
# `App` embeds (renderer scratch) and the caches it pairs with. See `obc-reader`'s `nrf-mem`.
# Off by default (full sizes on host/sim/tests).
nrf-mem = ["obc-render/nrf-mem", "obc-reader/nrf-mem", "obc-route/nrf-mem"]

[dependencies]
# default-features = false keeps `std` OUT of the shared app layer, so this crate
# (and everything it pulls) compiles for the nRF54L's bare-metal target. The host
# simulator re-enables std on `obc-reader` through its own dependency edge. `render`
# brings the `Viewport` + `MapRenderer` the app drives; it's no_std.
obc-reader = { path = "../obc-reader" }
obc-render = { path = "../obc-render" }
# The route format + reader (RouteSummary for the menu catalog, RouteReader the Map
# draws). no_std, shared with the firmware exactly like the map reader.
obc-route = { path = "../obc-route" }
# Needed only to name the `DrawTarget` bound on `App::render_frame`. no_std.
embedded-graphics = "0.8"
# Fixed-capacity screen stack (no_std, zero-alloc) — same crate the renderer uses.
heapless = "0.8"
# sin/cos for the Menu compass needle at arbitrary sweep angles — the same no_std math
# shim the renderer and route crates use.
libm = "0.2"
