# OpenBikeComputer UI translation catalog — ENGLISH (canonical key set).
#
# This file defines the *universe* of message keys (epic #602). Every key present
# here MUST be present in de.toml / fr.toml / es.toml too, or the build fails
# (see obc-app/build.rs — the completeness check). de/fr/es may still be English
# stubs at this stage; real translations land in L4 (#606).
#
# Naming convention (key -> `Msg` variant):
#   * Keys are grouped in `[section]` tables (a section is a screen or domain).
#   * The generated `Msg` variant is PascalCase(section) + PascalCase(key), e.g.
#         [menu] routes = "Routes"   ->   Msg::MenuRoutes
#     Underscores in a key are word breaks:  `off_route = "..."` -> `Msg::…OffRoute`.
#   * A bare top-level key (no section, discouraged) maps to PascalCase(key) alone.
#   * Values are TOML basic strings (double-quoted). Keep them within the #601 font
#     repertoire (Latin-1 + Latin Extended-A); no curly quotes / em-dash / ellipsis.
#
# Sections are grouped by screen/domain and kept in the SAME order across en/de/fr/es
# so L4's translation diff stays legible. Unit symbols (KPH/MI/m/ft/%/km) and the
# language endonyms (English/Deutsch/…) are deliberately NOT catalogued — they are
# language-independent (see the epic's locked decisions).

