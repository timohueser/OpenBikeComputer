# OpenBikeComputer UI translation catalog - SPANISH.
#
# Real Spanish content (epic #602, L4 #606). Every key in en.toml appears here in the
# SAME order (the build enforces presence); see en.toml for the key->Msg naming
# convention and the #601 font repertoire (Latin-1 + Latin Extended-A) rule.
# Fixed-width layouts (stat-tile captions, settings values, the waypoint panel) are
# abbreviated to fit; format glue (leading/trailing spaces, \n) is preserved verbatim.

