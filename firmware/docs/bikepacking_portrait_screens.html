<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.bpwrap{padding:1rem 0;display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.bpcol{flex:1 1 250px;max-width:290px}
.bpstand{aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:3px solid #241f1a}
.bpstand svg{display:block;width:100%;height:100%}
.bpcap{font-size:13px;color:var(--color-text-secondary);text-align:center;margin:10px 0 0}
</style>
