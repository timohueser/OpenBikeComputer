[package]
name = "obc-render"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBCM map rendering path using embedded-graphics"

[dependencies]
obc-map-scene = { path = "../obc-map-scene" }
embedded-graphics = "0.8"
heapless = "0.8"
libm = { version = "0.2", default-features = false } # no arch asm: identical correctly-rounded results, keeps the suite Miri-runnable (the #501 alignment-UB tripwire)

[dev-dependencies]
# Real OBCM fixtures exercise the production adapter, while the seam test below uses only a static
# `obc-map-scene` implementation.
obc-reader = { path = "../obc-reader" }
# The persistent-format authority — the error tests reach the byte-I/O `Error` and OBCM flags here
# (dev-only; not a production edge).
obc-formats = { path = "../obc-formats" }
# Shared OBCM byte builder for the priority-saturation test (same source the reader's
# format tests use, so a format bump edits one place).
obcm-testkit = { path = "../../host/obcm-testkit" }
