[package]
name = "obc-ble"
version = "0.1.0"
edition = "2021"
publish = false # device firmware support crate — not published to crates.io
description = "Radio-free no_std codecs for the live BLE config, command/status and sensor surfaces."

# no_std, no alloc, no radio types. Kept a workspace member so `cargo test` exercises the shared
# codecs on the host, exactly like obc-route / obc-reader.
[dev-dependencies]
# The shared S0 fixtures the vector tests read from ../../specs/vectors/ go through
# obc-vectors' spec-derived builders so a drift fails on both crates at once.
obc-vectors = { workspace = true }
