[package]
name = "obc-ble"
version = "0.1.0"
edition = "2021"
publish = false # device firmware support crate — not published to crates.io
description = "no_std S0 BLE data-plane core (obc-ble-interface-spec.md): the transferControl / status descriptor codecs, CRC-32/IEEE, and the whole-object transfer state machine (Receiver / StreamSender). Radio-free and host-tested; the nRF54L board crate drives the CoC bytes through it, and the shared protocol-vectors/ fixtures pin it to the Swift side."

# no_std, no alloc, no radio types — a pure codec + state-machine core the board crate
# (obc-fw-nrf54l, behind its `ble` feature) links against. Kept a workspace member so
# `cargo test` exercises it on the host, exactly like obc-route / obc-reader.
[dependencies]

[dev-dependencies]
# The shared S0 fixtures the vector tests read from ../../protocol-vectors/ go through
# obc-vectors' spec-derived builders so a drift fails on both crates at once.
obc-vectors = { path = "../../host/obc-vectors" }
# Dev-only, and deliberately not a real dependency: the wire codec must not link the map-format
# crate (same rule that keeps obc-dfu's size ceiling out of it). The *test* asserts that the
# identity read's `obcm_version` fixture is the version the reader actually reads (E1, #911).
obc-formats = { path = "../obc-formats" }
