[package]
name = "obc-ble"
version = "0.1.0"
edition = "2021"
publish = false # device firmware support crate — not published to crates.io
description = "Radio-free no_std codecs for the live BLE config, command/status and sensor surfaces, plus the persisted-settings CRC seam."

# no_std, no alloc, no radio types. Kept a workspace member so `cargo test` exercises the shared
# codecs on the host, exactly like obc-route / obc-reader.
[dependencies]
# The one exception to this crate's dependency-freedom, and only because it gives nothing up:
# obc-crc is a leaf with no dependencies of its own (one table, one hasher). What the rule was
# protecting — never linking the map or DFU stacks into this codec crate — still holds.
obc-crc = { path = "../obc-crc" }

[dev-dependencies]
# The shared S0 fixtures the vector tests read from ../../specs/vectors/ go through
# obc-vectors' spec-derived builders so a drift fails on both crates at once.
obc-vectors = { path = "../../host/obc-vectors" }
# Dev-only, and deliberately not a real dependency: the wire codec must not link the map-format
# crate (same rule that keeps obc-dfu's size ceiling out of it). The *test* asserts that the
# identity read's `obcm_version` fixture is the version the reader actually reads (E1, #911).
obc-formats = { path = "../obc-formats" }
