[package]
name = "obc-usb-host"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Desktop USB feeder for the OBC prototype (issue #38): replays a recorded .gpx out over the device's USB-CDC debug link as fake GPS + altimeter samples, with a compass slider for the stopped-heading and a live telemetry readout. The bench stand-in for real sensors — native only (serial port + window)."

[dependencies]
# The `Fix` the player emits + the trait methods used to poll it (`LocationSource`/`AltimeterSource`).
obc-app = { path = "../obc-app" }
# The canonical debug-link wire codec (`Telemetry`/`parse_telemetry`/`format_fix`), authored once on
# the device side and reused here so the two halves can't drift (issue #71). DEFAULT features only — the
# pure codec is always compiled, so this pulls NO embassy-sync (that lives behind `debug-link`).
obc-platform = { path = "../obc-platform" }
# The shared GPX replay core — the same GpxPlayer/BaroSensor the simulator drives, so a recorded
# ride plays back over USB exactly as it does in the sim.
obc-replay = { path = "../obc-replay" }
# GUI: the same egui/eframe stack the simulator's control panel uses.
eframe = "0.29"
# Cross-platform serial port access for the USB-CDC link.
serialport = "4"
# Native "open file" dialog for picking a .gpx (same crate the sim uses).
rfd = "0.14"
