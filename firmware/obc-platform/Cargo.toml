[package]
name = "obc-platform"
version = "0.1.0"
edition = "2021"
description = "Board-agnostic no_std firmware glue between obc-app and a concrete board — written once, reused by every OBC board crate. For now: the SDRAM/framebuffer DrawTarget. Later: FatFs ByteSource/Sink adapters, the input debouncer, the USB-CDC debug protocol."

[dependencies]
# The `DrawTarget` / `Rgb565` the framebuffer implements — pinned to the same 0.8
# the renderer and app use so the target type unifies across the path deps.
embedded-graphics = "0.8"

# The shared HAL the button debouncer speaks: it emits `obc_app::InputEvent`s and
# implements `obc_app::InputSource`, so a board drops it straight into
# `App::handle_input`. obc-app is no_std, so this stays a clean no_std dep.
obc-app = { path = "../obc-app" }

# The GPIO trait the debouncer is generic over (`InputPin`). 1.0 — embassy-stm32's
# `gpio::Input` (and the future nRF board's pins) implement this, so `ButtonInput`
# is board-agnostic.
embedded-hal = "1.0"

# The small event ring the debouncer buffers between `update` and the app's drain.
# Same 0.8 the rest of the OBC stack uses.
heapless = "0.8"

# The OBCR byte I/O the SD adapters implement (`ByteSource`/`ByteSink`/`Error`) plus the
# track record codec — so `SdByteSource` drops into `RouteReader`/`RouteSummary::read` and
# `SdTrackSink` encodes `obc_app::TrackPoint`s exactly like the simulator's host store.
obc-route = { path = "../obc-route" }

# The FatFs/SD-card stack the adapters wrap. The adapters are generic over its
# `BlockDevice` + `TimeSource`, so they carry no board/bus types — a board crate picks the
# concrete `SdCard<SpiDevice, _>`. `default-features = false` drops the `log` facade (the
# board logs over defmt/RTT itself); the adapters add no logging of their own.
embedded-sdmmc = { version = "0.9", default-features = false }
