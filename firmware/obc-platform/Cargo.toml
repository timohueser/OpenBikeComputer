[package]
name = "obc-platform"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Board-agnostic no_std firmware adapters over obc-ports — written once, reused by every OBC board crate: the framebuffer DrawTargets, the banded Panel seam, FatFs ByteSource/Sink adapters, the input debouncer, the synthetic GPS, and the transport-agnostic debug protocol."

[features]
# Transport-agnostic fake-sensor debug protocol (issue #38). The pure codec in `debug_link` (line
# parser, `Telemetry`/fix encoders, `LineReader`) is always compiled — board-agnostic and
# dependency-light (only `obc_ports` types + heapless) — so the host feeder reuses one canonical wire
# format with default features. This feature adds only the embassy-sync `Signal`/`Channel` hand-off
# plus the LocationSource/AltimeterSource/CompassSource impls that bridge parsed samples to the app
# poll (the fresh-fix latch); the board crate owns the actual transport driver (the nRF runs it over
# UART/VCOM). Off by default so the host workspace build never pulls embassy-sync; the board firmware
# turns it on in its own default features.
debug-link = ["dep:embassy-sync"]

# Real-sensor cross-task hand-off (issue #218). Like `debug-link`, the pure decode (`ubx`, `bmp581`)
# is always compiled — board-agnostic, dependency-light — so it host-tests with default features.
# This feature adds only the embassy-sync `Signal` plumbing + the LocationSource/AltimeterSource/
# TemperatureSource impls (`sensor_link`) that bridge the board's I²C sensor task to the app poll.
# The board firmware turns it on in its default features; the host workspace never pulls embassy-sync.
sensor-link = ["dep:embassy-sync"]

# Async button edge-wake (issue #219). Adds `ButtonInput::wait_for_any_press` — the input plane
# `await`s a falling edge on any button instead of polling at the loop rate, so an idle device sleeps
# until a press. Pulls only the `embedded-hal-async` `Wait` trait (which `embassy_nrf::gpio::Input`
# implements) + `embassy-futures` for the 4-way `select`. Off by default so the host/sim build never
# pulls async input machinery (`is_idle` is plain and always compiled); the board firmware turns it on.
input-wait = ["dep:embedded-hal-async", "dep:embassy-futures"]

[dependencies]
# The `DrawTarget` / `Rgb565` the framebuffer implements — pinned to the same 0.8
# the renderer and app use so the target type unifies across the path deps.
embedded-graphics = "0.8"

# The dependency-light semantic HAL the button debouncer and sensor/storage adapters speak.
# Adapters depend on the port contract directly, never upward on application/UI policy.
obc-ports = { path = "../obc-ports" }

# The GPIO trait the debouncer is generic over (`InputPin`). 1.0 — embassy-nrf's
# `gpio::Input` implements this, so `ButtonInput` is board-agnostic.
embedded-hal = "1.0"

# The async `Wait` trait the `input-wait` edge-wake speaks (issue #219), board-agnostic like
# `embedded-hal`'s `InputPin`: `embassy_nrf::gpio::Input` implements it, so `wait_for_any_press` stays
# generic. Optional — only the `input-wait` feature pulls it.
embedded-hal-async = { version = "1.0", optional = true }

# `select` over the four buttons' edge-wait futures for `input-wait` (issue #219). Optional — only
# that feature pulls it; pinned to the 0.1 the nRF board crate already resolves.
embassy-futures = { version = "0.1", optional = true }

# The small event ring the debouncer buffers between `update` and the app's drain.
# Same 0.8 the rest of the OBC stack uses.
heapless = "0.8"

# `powf` for the BMP581 barometric pressure→altitude formula (issue #218): no `std` in this no_std
# crate, so transcendental math goes through libm — the same 0.2 obc-render/obc-route already use.
libm = { version = "0.2", default-features = false } # no arch asm — see the obc-reader edge (Miri tripwire)

# The OBCR byte I/O the SD adapters implement (`ByteSource`/`ByteSink`/`Error`) plus the
# track record codec — so `SdByteSource` drops into `RouteReader`/`RouteSummary::read` and
# `SdTrackSink` encodes `obc_ports::TrackPoint`s exactly like the simulator's host store.
obc-route = { path = "../obc-route" }

# The FatFs/SD-card stack the adapters wrap. The adapters are generic over its
# `BlockDevice` + `TimeSource`, so they carry no board/bus types — a board crate picks the
# concrete `SdCard<SpiDevice, _>`. `default-features = false` drops the `log` facade (the
# board logs over defmt/RTT itself); the adapters add no logging of their own.
embedded-sdmmc = { version = "0.9", default-features = false }

# `Signal` for the `debug-link` fresh-fix hand-off (transport task → app poll). Pinned to the 0.8 the
# nRF board crate already resolves so the board build shares one embassy-sync. Optional — only
# the `debug-link` feature pulls it.
embassy-sync = { version = "0.8", optional = true }

# `Instant`/`Duration` for the `time::SaturatingElapsed` fix (issue #51) and the `synth`
# stand-in GPS's wall-clock cadence. Pinned to the same 0.5.1 the nRF board resolves so
# `Instant` unifies across the two crates (the trait impl applies to the board's `Instant`).
# `default-features = false` here; the board adds `defmt` itself and cargo unions the features.
# NB: no time-*driver* is selected — the MCU build links embassy-nrf's, and the host *test*
# build links the `std` driver from the dev-dependency below.
embassy-time = { version = "0.5.1", default-features = false }

[dev-dependencies]
# `cargo test --features debug-link` compiles the Signal-based sources, which reference
# `critical_section::with`; the std impl satisfies the link on the host. Dev-only — it never
# reaches the firmware build (which provides cortex-m's single-core impl), so no double impl.
critical-section = { version = "1.1", features = ["std"] }

# The host time-driver for tests: `embassy_time::Instant::now()` (reached by `SaturatingElapsed`
# and `SynthLocation`) needs a *linked* time driver or the test binary fails to link. `std`
# registers `driver_std` on the host. Dev-only, so the MCU lib build never pulls it — there the
# board's embassy-nrf driver is the one linked.
embassy-time = { version = "0.5.1", features = ["std"] }

# The reader's RGB565→device-64 quantizer, so the framebuffer test can pin the panel-plane pack
# against it exhaustively (the two implement the same quantization and must never drift).
obc-reader = { path = "../obc-reader" }
