[package]
name = "obc-link"
version = "0.1.0"
edition = "2021"
publish = false # internal firmware crate — not published to crates.io
description = "Protocol-v4 codec and transfer engine for the flat card store. no_std, allocation-free, transport-free."

[dependencies]
obc-crc = { path = "../obc-crc" }
# The host-only vector producer hashes its manifest entries.
sha2 = { version = "0.11", default-features = false, optional = true }

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }
# The flat store, host-only, for the tests that hold the engine to a real card: the sim-backed
# `FlatStore` and its deterministic faulting device. It is a **dev**-dependency because the
# production edge runs the other way — `obc-storage` is a platform adapter and this crate is a
# foundation crate, so `firmware/tools/dependency_rules.json` forbids `obc-link -> obc-storage` for
# anything the device image links. The engine declares its own store seam (`flat::store`) and the
# store binds it (`obc_storage::flat::wire`), which is what lets these tests run the real thing.
obc-storage = { path = "../obc-storage", features = ["std"] }
# The shared device: the same engine-over-a-real-card assembly the browser tests run on, so a
# behaviour proved here is proved against the thing the phone and the builder talk to. A
# **dev**-dependency for the same reason obc-storage is one, and it carries that store edge with it.
obc-flat-device = { path = "../../host/obc-flat-device" }

[features]
default = []
# Host-only fixture producer for specs/vectors/flat-store-v4/.
# Unit tests also enable the producer through cfg(test).
std = ["dep:sha2"]
# Board-only performance profile; forwards to the wide CRC tables without changing compact users.
fast-crc = ["obc-crc/slice-by-8"]

[[example]]
name = "flat_vectors"
required-features = ["std"]
test = false
