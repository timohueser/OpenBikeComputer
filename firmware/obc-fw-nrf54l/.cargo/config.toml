# Build for the nRF54LM20's Cortex-M33 (ARMv8-M Mainline, hard-float ABI), and on
# `cargo run` flash + stream defmt/RTT over the DK's onboard SEGGER J-Link via probe-rs.
[build]
target = "thumbv8m.main-none-eabihf"

# The nRF54LM20A M33 application core; the FLPR is managed by the firmware.
[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# `+strict-align` — forbid the backend from emitting ANY alignment-assuming memory access for
# under-aligned data. **Hardening, NOT the fix for the #501 on-glass HardFault** (the fault
# reproduced with this flag active — its root cause is upstream state corruption, still under
# investigation; see PR #501). What the flag does fix is a real latent hazard found during that
# hunt: the OBCM §8 nav records are variable-length (13 + 20·degree bytes), so their multi-byte
# fields sit at odd offsets inside a chunk *by design*; the reader decodes them with portable
# byte-wise `from_le_bytes` on `&[u8]` (UB-free, audited + Miri-clean), but with unaligned loads
# allowed (the thumbv8m default) the backend's load-combining fused those decodes into word
# `ldr`s and paired adjacent ones into `ldrd` (observed in the shipped #501 binary at the nav
# decode) — and LDRD/LDM/VLDR always require word alignment regardless of CCR.UNALIGN_TRP.
# `+strict-align` removes that class at the ISA level: align-1 IR loads lower to byte loads
# (disassembly-verified: the record decode is `ldrb`+`orr` chains on both nav-closure
# monomorphizations). Cost: parsing paths (SD-bound anyway) assemble fields from byte loads —
# noise next to ~100 ms SD ops; aligned struct/framebuffer access is unaffected. rustc prints
# "unknown and unstable feature … still passed through" for this spelling on thumbv8m —
# expected; the flag verifiably reaches LLVM.
rustflags = ["-C", "target-feature=+strict-align"]
# Shared runner: verified, single-buffered programming and one host session at a time.
runner = "python3 ../../tools/board.py run"

# Cargo may rebuild before attaching. For no rebuild, use `obc rtt [EXACT_ELF]`.
# An attach never programs the chip; the ELF must match the running firmware.
[alias]
rtt = ["run", "--release", "--config", "target.'cfg(all(target_arch = \"arm\", target_os = \"none\"))'.runner = 'python3 ../../tools/board.py attach'"]

[env]
DEFMT_LOG = "info"
