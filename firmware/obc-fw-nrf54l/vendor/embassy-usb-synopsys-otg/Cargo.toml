[package]
name = "embassy-usb-synopsys-otg"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "`embassy-usb-driver` implementation for Synopsys OTG USB controllers"
keywords = ["embedded", "async", "usb", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-usb-synopsys-otg"
# No `publish = false`, deliberately, and it is not because anything here is publishable: this
# crate is reached only through `[patch.crates-io]` and `cargo publish` is never run on it. It is
# because `about.toml` sets `private.ignore = true`, which keys on exactly that field — marking the
# crate private would drop it out of THIRD-PARTY.md, and embassy's MIT/Apache-2.0 code ships inside
# `UPDATE.BIN` and must be attributed there like every other third-party crate in the image.

# Its own workspace root, so the board crate's `[workspace]` does not adopt it as a member (it is
# reached only through `[patch.crates-io]`, and a patched path dep that is also a member would make
# every board build resolve it twice).
[workspace]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-usb-synopsys-otg-v$VERSION/embassy-usb-synopsys-otg/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-usb-synopsys-otg/src/"
features = ["defmt"]
target = "thumbv7em-none-eabi"

[dependencies]
critical-section = "1.1"
portable-atomic = { version = "1" }

embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1" }
embassy-usb-driver = { version = "0.2.2" }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

[features]
default = []
defmt = ["dep:defmt", "embassy-usb-driver/defmt"]
log = ["dep:log"]
host = []
