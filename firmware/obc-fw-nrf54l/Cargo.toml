[package]
name = "obc-fw-nrf54l"
version = "0.1.0"
edition = "2021"
publish = false  # board firmware — not published to crates.io
description = "nRF54L15-DK board firmware for OpenBikeComputer — the real hardware target (Cortex-M33 + ST7789 EYESPI). Brings the shared obc-app up on glass to STM32F429-prototype parity; board-agnostic glue stays in obc-platform / obc-app. N0 (#121) is the embassy bring-up skeleton: blinky + RTT + the peripheral plan."

# Standalone crate with its own (empty) workspace table so the firmware/ host
# workspace — which builds its members for the host target — ignores this crate.
# Built for thumbv8m.main-none-eabihf via the crate-local .cargo/config.toml, exactly
# like the sibling obc-fw-stm32f429 board crate. Its own Cargo.lock is committed.
[workspace]

[features]
# Default build = the **N4 full map on glass** (issue #125): mount the SD card, stream the `.obcm`,
# render it into the resident RGB222 framebuffer through the shared `obc-app`, and push it to the
# ST7789 band by band. This is the real target path; it grows buttons (#126) and sensors/GPX (#127)
# in place.
#
# `glass-demo` swaps that for the panel-only bring-up screen — the font ladder + the device's
# 64-colour gamut, drawn band-by-band through the `Panel` seam (issue #122), no SD and no full
# framebuffer. The nRF analog of the STM32's `glass-demo` and the simulator's `--text-demo`. Kept
# so the panel/colour/text path can be verified in isolation; build it with
# `--no-default-features --features glass-demo`.
default = []
glass-demo = []

# `ls021-bringup` is the **LS021 panel bring-up** bench firmware (epic #139) — a standalone
# `[[bin]]` (below), *not* a mode of the map/ride `main.rs`. It evolves one bring-up stage at a
# time, sharing primitives from `src/ls021.rs`: **L0** (#140) held the panel in its boot-safe
# all-`Lo` state and walked LA test signals; **L1** (#141) adds the free-running COM driver
# (`VCOM`/`VB`/`VA` ~60 Hz — a GPIO square wave on a high-priority timer task; PWM20 won't
# route to the P2 COM pins); **L2** (#142) adds the gate/source primitives (`PanelBus`) and
# runs the datasheet power-on init → uniform-black frame. Build with
# `--bin ls021_bringup --features ls021-bringup`. See `firmware/docs/ls021-bringup.md`.
ls021-bringup = []

# `ls021-flpr` is the **LS021 FLPR bring-up** (epic #149): the successor to the M33-direct
# bring-up that moves the panel waveform generation onto the nRF54L15's FLPR (the VPR RISC-V
# coprocessor). The feature gates the standalone `ls021_flpr_bringup` bin (below) **and** the
# `build.rs` work it needs: a *carved* `memory.x` reserving the top 32 KB of SRAM for the FLPR
# image + a cross-core control-block page, plus cross-compiling the freestanding C blob in
# `src/flpr/` with a RISC-V gcc (`brew install riscv64-elf-gcc`). Off by default so `main.rs`
# keeps the full 256 KB and needs no RISC-V toolchain. F0 (#150) proved the build/boot path
# (M33 starts the FLPR; it blinks LED0 + answers a one-word handshake); F1 (#151) is the
# bidirectional comms channel — a shared control block + a doorbell each way (shared-RAM sequence
# M33→FLPR, EGU interrupt FLPR→M33; VEVIF is walled on bare metal), round-trip verified over RTT.
# **F2 (#152)** drives the inner data-shift loop on the FLPR: one source sub-line (BSP + 124 BCK +
# the 6 data lines) drained from a SHARED-page write buffer the M33 hands over via the F1 descriptor,
# bring-up-slow and LA-diffed against the M33 PanelBus. Build with `--bin ls021_flpr_bringup
# --features ls021-flpr`. See `firmware/docs/ls021-flpr.md`.
ls021-flpr = []

# Stream fake GPS / altimeter / compass from a host over the **VCOM UART** (issue #127) — the nRF
# analog of the STM32's `debug-usb`. The nRF54L15 has no USB peripheral, so the debug-sensor /
# telemetry stream rides the DK's onboard J-Link USB-CDC **VCOM** (UARTE20, TX P1_04 / RX P1_05);
# defmt logs share the same cable over RTT. Brings up a `BufferedUarte` (interrupt-fed RX ring so a
# long map render never drops bytes) and feeds `obc-platform`'s transport-agnostic debug codec +
# fresh-fix sources into the app, replacing the always-on `SynthLocation` stand-in. Off by default
# — a plain `cargo run` rides the synthetic square-loop GPS (no host needed); enable with
# `--features debug-uart` to drive the board from a recorded ride via `obc-usb-host --port <VCOM
# tty>`. Enables the protocol + sources in obc-platform (`debug-usb` is the transport-agnostic
# handoff gate there; the board crate owns the concrete UARTE driver).
debug-uart = ["obc-platform/debug-usb"]

# The LS021 panel bring-up bench firmware (epic #139). `required-features` keeps it out of every
# normal build — it only compiles when explicitly asked (`--bin ls021_bringup --features
# ls021-bringup`), so it can never be pulled into the default map/ride `src/main.rs` path (which
# never references `src/ls021.rs`). `src/main.rs` stays the auto-discovered default binary.
[[bin]]
name = "ls021_bringup"
path = "src/bin/ls021_bringup.rs"
required-features = ["ls021-bringup"]

# The LS021 **FLPR** bring-up F0 bin (epic #149 / issue #150). Same pattern as `ls021_bringup`:
# `required-features` keeps it out of every normal build — it only compiles when explicitly
# asked (`--bin ls021_flpr_bringup --features ls021-flpr`), so the FLPR carve-out + RISC-V
# blob build in `build.rs` never touch the default `src/main.rs` map/ride path.
[[bin]]
name = "ls021_flpr_bringup"
path = "src/bin/ls021_flpr_bringup.rs"
required-features = ["ls021-flpr"]

[dependencies]
# embassy HAL for the nRF54L15 app core. `nrf54l15-app-s` selects the secure-app die
# (the only partition we use — no TF-M split, BLE deferred); `time-driver-grtc` backs
# embassy-time with the GRTC (the nRF54L has no legacy RTC time-driver); `gpiote` is the
# GPIO task/event peripheral the button input path (#126) needs; `time` pulls the
# embassy-time integration. Pinned to embassy-nrf 0.11.0 (first release with nRF54L15).
embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf54l15-app-s", "time-driver-grtc", "gpiote", "time"] }
# embassy-executor 0.10 (same major the obc-fw-stm32f429 crate resolves). `executor-thread`
# is the thread-mode executor `#[embassy_executor::main]` runs on; `executor-interrupt` adds the
# high-priority `InterruptExecutor` the two-plane input/overlay plane runs on (#126 — pended from
# the SWI00 vector, see the module doc). `platform-cortex-m` for the Cortex-M arch backend.
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
# Cross-executor sync (#126): the lock-free `Channel` carrying recognised gestures from the
# high-priority input plane to the thread-mode map plane, the async `Mutex` guarding the shared
# ST7789/framebuffer bus, and the blocking `Mutex` over the `InputPlane`. ^0.8.0 is what the
# embassy-nrf 0.11 ecosystem (and the sibling STM32 crate) resolves.
embassy-sync = { version = "0.8.0", features = ["defmt"] }
# `Timer` + the embassy-time backend (driven by `time-driver-grtc` above). `defmt-timestamp-uptime`
# prefixes each RTT log line with the uptime — handy during bring-up.
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

# defmt logging over RTT via the DK's onboard J-Link (`cargo run` flashes + streams).
# embassy-nrf 0.11 is on the defmt 1.x ecosystem. The shared `obc-*` + `obc-platform` crates
# carry **no defmt dependency at all** (board crates do their own logging), so they coexist with
# defmt 1.0 here with no version clash — wiring them in needs no defmt bump.
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# Single-core critical-section impl (defmt + embassy need critical-section 1.0; like
# embassy-stm32, embassy-nrf does not bundle one). `inline-asm` for cortex-m 0.7's asm.
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

# embedded-hal 1.0 traits (SpiBus / OutputPin / DelayNs) the hand-rolled ST7789 panel
# backend is generic over; embassy-nrf's `Spim` + `Output` and embassy-time's `Delay`
# implement them. (#122)
embedded-hal = "1.0"

# The board-agnostic glue: the `Panel` banded-display seam + the `Band` frame-absolute draw view
# the ST7789 backend implements, and `Framebuffer565`'s `RawFb`/`Pack` the band reuses (issue
# #122). Pulls obc-app/route/reader transitively — all no_std, all defmt-free. `debug-usb` stays
# off (no embassy-sync) until the sensor stream at N6.
obc-platform = { path = "../obc-platform" }
# The shared text renderer — `draw_text` + the Terminus `Font` tiers the glass-demo's font ladder
# draws (the same path every on-device screen uses). (#122)
obc-render = { path = "../obc-render" }
# `Rgb565` / `DrawTarget` / `Point` / `Rectangle` for the map path's `color_fn` + the glass-demo's
# `Band` target; pinned to the same 0.8 obc-platform/obc-render resolve so the colour + target types
# unify across the path.
embedded-graphics = "0.8"

# microSD map storage (issue #123). The card stores the map/routes/tracks; the board-agnostic FatFs
# byte adapters live in obc-platform (`SdByteSource`/`SdByteSink`/`SdTrackSink`) and the format
# parsers in obc-reader/obc-route — only the concrete SPIM bus type is board-specific here (the
# STM32 analog is `obc-fw-stm32f429/src/sd.rs`).
# `nrf-mem` (issue #124) is the constrained memory profile and forwards to obc-render/reader/route,
# so this single edge trims every shared crate's resident buffers for the 256 KB part; Cargo's
# feature unification then applies it to the obc-render/obc-reader/obc-route edges below (and
# obc-platform's transitive ones) too. The board crate is the nRF, so it's always on.
obc-app = { path = "../obc-app", features = ["nrf-mem"] } # App/init_map + render_map (#125); MAX_ROUTES / TrackAction / TrackSink for the SD `Storage`; the budget assert's App/cache sizes
obc-reader = { path = "../obc-reader" } # the streamed `Reader` + `.bss` `MapCache` the N4 map path renders from (#125)
obc-route = { path = "../obc-route" } # RouteSummary / RouteIndex / track_to_gpx for the `/routes` catalog + GPX (SD `Storage`)
# FatFs over SPI. `default-features = false` (no `log`/`defmt-log`): embedded-sdmmc 0.9 pins
# `defmt = "0.3"`, which would clash with this crate's defmt 1.0 — so its internal logging stays
# the no-op fallback and card/FS errors are surfaced via this crate's `defmt::Debug2Format`.
# Matches obc-platform's own `embedded-sdmmc` resolve so the `VolumeManager` types unify.
embedded-sdmmc = { version = "0.9", default-features = false }
# `ExclusiveDevice` turns the embassy-nrf `Spim` bus + a GPIO CS into the `SpiDevice` `SdCard` wants.
embedded-hal-bus = "0.3"
# `SetConfig` — embassy-nrf's `Spim` re-clock seam (no inherent `set_config`, unlike embassy-stm32):
# init the card ≤400 kHz then bump to bulk speed. Pinned to the 0.6 embassy-nrf 0.11 resolves.
embassy-embedded-hal = { version = "0.6.0", default-features = false }
# `String` / `Vec` for the route catalog + GPX 8.3 names the SD `Storage` builds. Same 0.8 the
# shared crates use, so heapless types unify.
heapless = "0.8"
# (The runtime-built `'static` shared state the two planes split — the bus `Mutex<Display>`, the
# `InputPlane` mutex, the VCOM ring buffers — is parked in `.bss` via an in-place `MaybeUninit` +
# `ptr::write`, the same warm-reset-safe pattern as APP/MAP_CACHE/ROUTE_CACHE, so no `static_cell`.)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
