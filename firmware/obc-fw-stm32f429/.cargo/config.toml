# Build for the F429's Cortex-M4F (hard-float ABI), and on `cargo run` flash +
# stream defmt/RTT over the onboard ST-LINK via probe-rs.
[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# --connect-under-reset asserts the hardware NRST during attach. The onboard
# ILI9341's reset is tied to the MCU NRST, so this hardware-resets the panel on every
# `cargo run` (a plain soft reset leaves the panel in its previous state across reflashes).
runner = "probe-rs run --chip STM32F429ZITx --connect-under-reset"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",     # cortex-m-rt; pulls in our memory.x
  "-C", "link-arg=-Tdefmt.x",    # defmt's interned-string section
]

[env]
DEFMT_LOG = "info"
