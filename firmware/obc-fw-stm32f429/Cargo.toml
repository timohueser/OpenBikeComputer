[package]
name = "obc-fw-stm32f429"
version = "0.1.0"
edition = "2021"
description = "STM32F429I-DISC1 board firmware for the OpenBikeComputer hardware prototype: FMC SDRAM + onboard ILI9341 via LTDC. The LTDC display path is a stand-in; the real target is the nRF54L with a MIP panel, so the board-agnostic glue stays in obc-platform / obc-app."

# Standalone crate with its own (empty) workspace table so the firmware/ host
# workspace — which builds its members for the host target — ignores this crate.
# Built for thumbv7em-none-eabihf via the crate-local .cargo/config.toml, exactly
# like the mcu-render-bench bench crates.
[workspace]

[features]
default = ["baked-tile", "debug-usb"]

# Boot the font/palette bring-up demo (the device analog of the simulator's
# `--text-demo`) instead of the real app: draws the Terminus font ladder + the
# explorer palette through the SDRAM `DrawTarget` and halts. A reusable way to
# re-verify the text + RGB565 colour path on glass in isolation. Off by default —
# the firmware boots `obc-app` (Home → Map).
glass-demo = []

# Embed the ~1.4 MB fallback OBCM tile in flash (`include_bytes!`) so the Map still
# works with no SD card. On by default. Building `--no-default-features` drops it,
# shrinking the image from ~1.5 MB to ~150 KB so a flash takes a few seconds instead of
# ~80 s — handy while iterating on hardware. Without it, a missing SD map halts after
# logging (rather than falling back to the tile).
baked-tile = []

# Single-executor fallback (issue #48): run input + the map + the overlay all on the one
# thread-mode executor (`App::handle_input` + `render_frame`-style split), instead of the
# default two-plane split that runs input + overlay on a *high-priority interrupt executor*
# preempting the map render. Off by default — the default build is the preemptive two-plane
# architecture; this proves the `InputPlane`/`apply_gesture` seam composes back into one loop.
single-executor = []

# Stream fake GPS / altimeter / compass from a host over USB-CDC (issue #38): brings up the OTG
# CDC-ACM device on the DISC1 USER port (PB14/PB15) and feeds `obc-platform`'s debug sources into
# the app, replacing the `SynthLocation` stand-in. On by default so a plain flash is benchable from
# a recorded ride; `--no-default-features --features baked-tile` compiles the fake sources out
# (proving the seam to real drivers). Enables the protocol + sources in obc-platform.
debug-usb = ["obc-platform/debug-usb", "dep:embassy-usb", "dep:embassy-futures", "dep:static_cell"]

[dependencies]
# The shared OBC stack (all no_std, no global allocator — heapless throughout).
# Path deps to the host workspace's crates; this standalone crate builds them for
# thumbv7em-none-eabihf via its own Cargo.lock.
obc-app = { path = "../obc-app" }       # App + HAL traits + render_frame
obc-render = { path = "../obc-render" } # zoom_for_mpp + the text demo
obc-reader = { path = "../obc-reader" } # Reader over the resident OBCM tile
obc-route = { path = "../obc-route" }   # RouteReader / RouteSummary / track_to_gpx (SD routes + tracks)
obc-platform = { path = "../obc-platform" } # framebuffer DrawTarget + SD FatFs byte adapters
# Names the `DrawTarget` / `Rgb565` / `RawU16` the app + framebuffer speak. Pinned
# to the same 0.8 the shared crates use so the target type unifies.
embedded-graphics = "0.8"
# For the one stub `RouteSummary` the Route menu lists (so SELECT can open the Map on
# the baked tile before SD/USB land). Same 0.8 the shared crates use.
heapless = "0.8"


# embassy HAL for the STM32F429ZI. `fmc` and `ltdc` are auto-enabled cfgs for this
# die (driven by the chip feature, not a Cargo feature); `time-driver-any` provides
# the embassy-time backend. Pinned to the published 0.6.0 (brings the ltdc driver).
embassy-stm32 = { version = "0.6.0", features = ["stm32f429zi", "time-driver-any", "defmt"] }
# embassy-stm32 0.6.0 pulls executor 0.10 / time 0.5 — newer than the bench's
# 0.7/0.4, so match them here (0.10 dropped the task arena; no arena feature).
# `executor-interrupt` adds the `InterruptExecutor` the two-plane architecture (issue #48)
# runs the high-priority input/overlay task on; the thread executor still runs the map plane.
embassy-executor = { version = "0.10.0", features = ["executor-thread", "executor-interrupt", "platform-cortex-m", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
# Lock-free SPSC channel carrying recognised gestures from the high-priority input plane to
# the map plane (issue #48). `CriticalSectionRawMutex` since the two ends run on different
# executor priorities. Pinned to the 0.8.0 embassy-stm32 0.6.0 already resolves.
embassy-sync = { version = "0.8.0", features = ["defmt"] }

# USB-CDC fake-sensor link (issue #38, behind `debug-usb`). embassy-usb 0.6.0 is the version
# whose `embassy-usb-driver` (^0.2.0) unifies with embassy-stm32 0.6.0's OTG `Driver`, and whose
# embassy-sync (^0.8.0) matches the pin above — so the CDC `Builder`/`CdcAcmClass` accept the OTG
# driver and share one sync crate. `embassy-futures` for `select` (RX vs TX on the split class);
# `static-cell` for the 'static USB descriptor/EP buffers the device + class borrow.
embassy-usb = { version = "0.6.0", features = ["defmt"], optional = true }
embassy-futures = { version = "0.1", optional = true }
static_cell = { version = "2", optional = true }

# SDRAM chip driver: the IS42S16400J device + the SdramChip trait that
# embassy_stm32::fmc's `sdram_*` constructors take. Same 0.4.0 embassy-stm32 uses.
stm32-fmc = "0.4.0"

# microSD over SPI (issue #36): the FatFs stack + the `embedded-hal` SPI bus/CS glue.
# `embedded-sdmmc` reads/writes the card's `.obcm` map, `.obcr` routes and `.obct`/`.gpx`
# tracks (obc-platform's adapters wrap its `VolumeManager`); `embedded-hal-bus`'s
# `ExclusiveDevice` turns embassy's SPI bus + a GPIO CS into the `SpiDevice` the `SdCard`
# wants. `defmt` features so card/FS errors print over RTT like the rest of bring-up.
embedded-sdmmc = { version = "0.9", default-features = false, features = ["defmt-log"] }
embedded-hal-bus = "0.3"
embedded-hal = "1.0"

# Direct PAC access for the one register poke embassy doesn't expose publicly:
# pointing the LTDC layer at the SDRAM framebuffer + an immediate shadow reload
# (`embassy_stm32::pac` is pub(crate)). Pinned to the 21.0.0 embassy-stm32 0.6.0
# resolves, so the dependency graph has a single shared metapac.
stm32-metapac = { version = "21.0.0", features = ["stm32f429zi"] }

# Single-core critical-section impl (defmt + embassy need critical-section 1.0;
# unlike embassy-rp, embassy-stm32 does not bundle it).
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# Used directly to guard the shared LTDC `SRCR` reload across the two planes' framebuffer
# flips (issue #48) — the per-layer CFBAR is independent, but the one VBR bit is shared, so
# its read-modify-write must not tear across a preemption. `cortex-m` provides the impl above.
critical-section = "1.1"
cortex-m-rt = "0.7"

# defmt logging over RTT via the onboard ST-LINK (`cargo run` flashes + streams).
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
