# --- Settings ------------------------------------------------------------------------------------
# System — so every settings screen sits two levels down. The shape of every script below is:
# B u p        open the Menu, one Up step to the Settings station, press -> the Settings list
# 5 System)
# p            press into the group
# d × R  [p]   step to row R inside it, and press if that row opens a page / cycles a value
[[frame]]
name = "settings"
map = "{grimsel}"
script = "B u p w"
expect = "Settings"

# Ride settings: the Data fields door and three value rows (Auto-flip, Climb panel, Waypoints),
# each stating its value under the label.
[[frame]]
name = "ride-settings"
map = "{grimsel}"
script = "B u p p w"
expect = "Ride"

# A value row pressed: the drawer's editor rises as a sheet over the page, on the committed choice.
