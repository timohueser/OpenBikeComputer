map = "{peaks}"
script = "{peak_article} u f C p f"
expect = "LandmarkSources"
args = ["--center", "7961000,46585000", "--heading", "141.25"]
boot = false

[[frame]]
name = "peak-article-back"
map = "{peaks}"
script = "{peak_article} u f b b f"
expect = "PeakView"
args = ["--center", "7961000,46585000", "--heading", "141.25"]
