map = "{grimsel}"
script = "B u p p p d*6 p d*5 p"
expect = "StatFields"

# The six `Next: <category>` fields (epic #946, U5). `B u p p p` is Home -> Settings -> Ride ->
# Data fields (the Fields grid). (a) the Add-field picker scrolled onto the new group: six rows
