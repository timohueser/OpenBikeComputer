name = "map-display-sheet"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p C u p"
expect = "ContextDrawer"
args = ["--clock", "2025-06-29T14:40", "--gpx", "{gpx}", "--at", "30"]
langs = ["de", "fr", "es"]

# The Up-ahead sheet (#1515 D4a): its two row labels, then the nested editor's title + the choice
# it stages. `Campingplatz` / `Alojamiento` are the width constraint on the editor line.
[[frame]]
name = "up-ahead-context"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p A d p f p f C"
expect = "ContextDrawer"
args = ["--clock", "2025-06-29T14:40", "--gpx", "{gpx}", "--at", "30"]
langs = ["de", "fr", "es"]

