map = "{grimsel}"
script = "{peak} u u u"
expect = "PeakView"
args = ["--peak-view", "gornergrat", "--heading", "90"]

# Down enters Browse from the left edge and steps right. Generic labels stay in place.
[[frame]]
name = "peak-view-matterhorn"
map = "{grimsel}"
script = "{peak} d d"
expect = "PeakView"
args = ["--peak-view", "gornergrat"]

# Installed summit identity, shared reading/photo/Sources, and restored Browse panorama.
[[frame]]
name = "peak-article-indicator"
map = "{peaks}"
script = "{peak} p f"
expect = "PeakView"
args = ["--center", "7961000,46585000", "--heading", "141.25"]
