# Every frame of the UI snapshot sweep, as data. `obc shot` reads this table, stages the
# environment a frame names, renders it through the headless simulator, and compares the result
# against `ui-snapshots.sha256` — one digest row for each frame.
#
#   obc shot --list                     the frames and the screen each one reaches
#   obc shot routemenu                  render one frame
#   obc shot 'statistics*'              render a family
#   obc shot map --vs origin/develop    render the frame here and there, and compare
#   obc shot --all [DIR]                the full sweep
#   obc shot --check [DIR]              compare a sweep against the digest manifest
#
# A frame row:
#
#   name    the PNG basename, and the name `obc shot` knows the frame by
#   map     the map the simulator opens, from [paths]
#   env     one or more staging recipes from firmware/tools/ui_frames/environments.py
#   script  the gesture script (the simulator README lists the tokens)
#   expect  the `screens!` variant the script must reach, or the render fails
#   args    further simulator arguments
#   boot    `false` opens the map directly instead of the device's power-on state
#   langs   render one frame for each language, named `<name>-<lang>`
#
# A script can use a `{name}` fragment from [script] and a `t*n` repetition (`f*8` is eight `f`
# tokens). Every frame states `expect`, because a scripted recipe is a hostage to the menus it
# walks: insert one station and `B u p d d d d p` quietly snapshots a different screen under the
# old name. A frame is only in the net if `ui-snapshots.sha256` has its digest row, which
# `obc shot --check` and `obc suites check` both hold you to.

[paths]
grimsel = "{fixtures}/sim-grimsel/grimsel.obcm"
gpx = "{fixtures}/sim-grimsel/tracks/grimsel-climb.gpx"
monaco = "{fixtures}/sim-monaco/monaco.obcm"
upgpx = "{fixtures}/sim-monaco/tracks/monaco-upahead.gpx"
cork = "{fixtures}/sim-assistant-west-cork/west-cork.obcm"
freiburg = "{fixtures}/sim-freiburg/freiburg.obcm"
peaks = "{repo}/apps/obc-sim/assets/grimsel-demo.obcm"
# A tiny replay that lies *on* specs/vectors' `route-waypoints.obcr` ("Vector Loop") — the Grimsel
# climb GPX is far off it, so it cannot drive the waypoint chip and ticks. It stops ~300 m short of
# the "Pass Summit" waypoint; its provenance is pinned in the assets README.
wptgpx = "{repo}/fixtures/sources/vector/vector-loop-replay.gpx"

[script]
# Menu navigation: Home's press (and back-hold) opens the compass Menu — the single door into the
# app — so the Route menu is `p p` from boot (open Menu, then press the Routes station, which the
# menu starts on). The compass menu is Routes / Rides / Map / Peaks / Settings, so Settings is one
# Up step (`u`, wrapping) from the Routes start, Rides is one down (`d`), Map two down (`d d`). `w`
# settles the needle sweep after a step — and the back-hold charge indicator (a half-disc at the
# right screen edge) decays over a few frames, so a script that snapshots within ~3 tokens of a `B`
# ends in `w` too, or the residue bakes into the PNG.
peak = "B d d d p f"
peak_article = "{peak} p f p f"
place_detail = "A p d d d p u p f p f"
landmarks = "A d d d d d p f"
detour_pre = "p p p p T"
dfu_pre = "B u p d d d d p d d d p p"
up_base = "p p p p T A d p f p f*8"
# Open the timeline's context sheet, press its Filter row into the nested editor, stage the Water
# choice and commit, then close the sheet — so the list comes back filtered. Every `p` that starts
# a page slide is followed by `w`, because the sheet owns its input while a slide runs.
up_filter_water = "C p w d p w b f*8"
# The same idiom on the Sources row, staging one and two steps round the
# Both → Waypoints → Map POIs ring.
up_scope_waypoints = "C d p w d p w b f*8"
up_scope_pois = "C d p w d d p w b f*8"
# Turn the Auto climb panel off (open the Climb row's editor, one step wraps Auto -> Off, commit),
# then climb back to Home.
u5_climb_off = "B u p p d d p d p b b b"

[[frame]]
name = "home"
map = "{grimsel}"
expect = "Home"
args = ["--clock", "2025-07-10T09:41", "--battery", "45"]

# The Route list: arrow-less, column-aligned two-line rows (distance under the name, the climb group
# at a fixed second column) with no footer — hold-to-delete moved to the Route overview (T3, #681).
[[frame]]
name = "routemenu"
map = "{grimsel}"
env = "routes"
script = "p p"
expect = "RouteMenu"

# The Route menu with a trip (the `trips` env): the "Alpen Traverse" row, its full name over
# "Day 1 next · 3 days", above the loose grimsel route. `p p p` opens the trip's day list: the trip
# name as the title, one row per resolvable day ("Day 1 Andermatt" over "Mon · 2 km ▲76 m"), the
# cursor on the next day. No progress record reaches the app, so no day is ticked and the trip is
# never done in these frames.
[[frame]]
name = "routemenu-trips"
map = "{grimsel}"
env = "trips"
script = "p p"
expect = "RouteMenu"

[[frame]]
name = "trip-stage-list"
map = "{grimsel}"
env = "trips"
script = "p p p"
expect = "RouteMenu"

# A seven-day day list scrolls: the title bar cuts the trip name clear of the "1 / 7" counter.
[[frame]]
name = "trip-days-week"
map = "{grimsel}"
env = "trip-week"
script = "p p p"
expect = "RouteMenu"

# The trip cascade-delete confirm (TR3): long-press the folder (`h` fires the completed hold) → the
# warning-red hold-guarded "Delete all" + "Cancel" card, naming the trip. Entry selects Cancel.
[[frame]]
name = "trip-delete-confirm"
map = "{grimsel}"
env = "trips"
script = "p p h"
expect = "TripDelete"

[[frame]]
name = "menu"
map = "{grimsel}"
script = "B w"
expect = "Menu"
args = ["--battery", "45"]

# Peak View's geographic fixture: Live follows the preset's stopped-compass heading;
# Select freezes that panorama and selects its most prominent visible summit.
# Geographic fixture files are independent from the map. `f` finishes the full panorama before
# capture or Browse input.
[[frame]]
name = "peak-view"
map = "{grimsel}"
script = "{peak}"
expect = "PeakView"
args = ["--peak-view", "gornergrat"]

[[frame]]
name = "peak-view-scheidegg"
