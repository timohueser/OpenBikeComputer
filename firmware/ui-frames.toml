# The Language pick list (epic #602): the four languages by flag and endonym, the tick on the
# committed one. The cursor opens on it; two steps down park it on Français — pinning the ç glyph
# the Latin font (#601) adds.
[[frame]]
name = "language"
map = "{grimsel}"
script = "B u p d*4 p d d p"
expect = "Language"

[[frame]]
name = "language-french"
map = "{grimsel}"
script = "B u p d*4 p d d p d d"
expect = "Language"

# The About page (#1149) — System row 4, above Reset: the read-only credits page.
[[frame]]
name = "about"
map = "{grimsel}"
script = "B u p d*4 p d*4 p"
expect = "About"

# Factory Reset is the group's last row: five steps in, press to open, arm (press), then a
# partial-hold to fill the bar. (Four steps stopped on About until this recipe was corrected.)
[[frame]]
name = "reset-hold"
map = "{grimsel}"
script = "B u p d*4 p d*5 p p H"
expect = "Reset"

# The Firmware page (epic #615 S5, #620) — System row 3, the SD-sideload action ("Install update")
# over the read-only device-info rows.
[[frame]]
name = "firmware"
map = "{grimsel}"
script = "B u p d*4 p d d d p"
expect = "Firmware"

# The row inert while a ride records: ride route 0 (`p p p p`, GPX-driven so the session is live),
# out to the Menu with the global escape (`B`), then Settings -> System -> Firmware. The row draws
# recessed with the "Recording" cue under it.
[[frame]]
name = "firmware-recording"
map = "{grimsel}"
env = ["routes", "tracks"]
script = "p*4 f d p B u p d*4 p d d d p"
expect = "Firmware"
args = ["--gpx", "{gpx}", "--at", "30"]

# The SD-sideload update flow (epic #615 S5, #620). The scan/arm runs board-side; the script leaves
# the "Checking card..." wait on top (Firmware -> Install), and --dfu scan/error answer it
# through the real notify_dfu_scan_result seam (the sim stages a synthetic package and runs the
# real obc-dfu scan). --dfu progress then presses Install so the "Preparing update..." spinner shows.
[[frame]]
name = "dfu-check"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuCheck"

[[frame]]
name = "dfu-confirm"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuConfirm"
args = ["--dfu", "scan=normal"]

[[frame]]
name = "dfu-confirm-same"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuConfirm"
args = ["--dfu", "scan=same"]

[[frame]]
name = "dfu-confirm-first"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuConfirm"
args = ["--dfu", "scan=first"]

[[frame]]
name = "dfu-progress"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuProgress"
args = ["--dfu", "progress=normal"]

# The terminal "Installing update" card — the static pre-reset frame the MIP panel holds through
# the whole bootloader install (no spinner by design: the frame freezes at the reset, and the LED
# is named as the liveness signal). --dfu installing runs the board drain's show_dfu_installing swap.
[[frame]]
name = "dfu-installing"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuInstalling"
args = ["--dfu", "installing=normal"]

[[frame]]
name = "dfu-error-notfound"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuError"
args = ["--dfu", "error=notfound"]

[[frame]]
name = "dfu-error-unreadable"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuError"
args = ["--dfu", "error=unreadable"]

[[frame]]
name = "dfu-error-damaged"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuError"
args = ["--dfu", "error=damaged"]

[[frame]]
name = "dfu-error-toolarge"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuError"
args = ["--dfu", "error=toolarge"]

[[frame]]
name = "dfu-error-fragmented"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuError"
args = ["--dfu", "error=fragmented"]

# OBCU v2 (#997): the file is intact but not signed by us — its own card, not "damaged".
[[frame]]
name = "dfu-error-untrusted"
map = "{grimsel}"
script = "{dfu_pre}"
expect = "DfuError"
args = ["--dfu", "error=untrusted"]

# The one-time post-update toast, raised through the real notify_update_confirmed seam. A
# deliberately long git-describe tag exercises the version wrap to a second centred line.
[[frame]]
name = "dfu-updated"
map = "{grimsel}"
expect = "DfuUpdated"
args = ["--dfu", "confirmed=v1.0.0-14-g0a1b2c3-dirty"]

# Its failure twin, raised through the real notify_update_failed seam: the boot-outcome reconcile
# found the armed update is not what is running. Both verdicts — the bootloader consumed the arm and
# rolled back (with the staged version named), and an arm the bootloader never consumed (no version
# to name, so the card is the sentence alone). The reverted frame reuses the long git-describe tag
# from the toast above: this card centres the version on ONE line, so the tag runs off both edges —
# the toast's wrap has no counterpart here. Recorded, not fixed, by the verification baseline.
[[frame]]
name = "dfu-failed-reverted"
map = "{grimsel}"
expect = "DfuFailed"
args = ["--dfu", "failed=reverted:v1.0.0-14-g0a1b2c3-dirty"]

[[frame]]
name = "dfu-failed-notstarted"
map = "{grimsel}"
expect = "DfuFailed"
args = ["--dfu", "failed=notstarted"]

# Riding flows: Home press → Menu → Routes (p) → Route menu → pick (p) → overview → START (p) → Map.
# The overview also carries the guarded Delete-route row (T3 #681, reordered by owner review round
# 1): the bottommost element, below the START RIDE row. Since owner review round 3 the two action
# rows are the Pause-menu (ride_control) family — entry selects START (the standard amber-selected
# row), a step moves onto the Delete row (its shaded base draws only while selected), and only then
# does a hold charge the delete. While the route is the active ride's the row is hidden entirely (no
# greyed face); that state is unreachable by gesture (the active route's overview never opens from
# the menu), so it has no frame — the route_overview guard tests pin it.
# Entry shows page 1: the Grimsel climb on the device map with its bike-type chip, over DISTANCE,
# CLIMB and EST TIME.
[[frame]]
name = "routeoverview"
map = "{grimsel}"
env = "eta-route"
script = "p p p"
expect = "RouteOverview"

# Page 2 after the 5 s dwell (each `w` elapses ~800 ms; seven cross the flip): the full-height
# profile with its peak, over one climb and descent line. START stays in its slot.
[[frame]]
name = "routeoverview-elevation"
map = "{grimsel}"
env = "eta-route"
script = "p p p w*7"
expect = "RouteOverview"

# Page 1 for a route outside the loaded map (the vector loop near Freiburg on the Grimsel map):
# the same path as no map at all, so the track draws on the plain page in the same box.
[[frame]]
name = "routeoverview-nomap"
map = "{grimsel}"
env = "routes"
script = "p p p"
expect = "RouteOverview"

# Page 1 for a day of about 80 km: the fit is past the band's map scale ceiling, so the track draws
# on the plain page, as it does without a map.
[[frame]]
name = "routeoverview-long"
map = "{grimsel}"
env = "long-route"
script = "p p p"
expect = "RouteOverview"

# The cursor on the Delete row (idle): `d` moves the selection onto it, nothing charging.
[[frame]]
name = "routeoverview-delete-selected"
map = "{grimsel}"
env = "routes"
script = "p p p d"
expect = "RouteOverview"

# The Delete row charging: `p p p d H` selects it, then partial-holds Select, so the
# warning-red row fill draws under the "Delete route" label, below the map band. On the board a
# hold step repaints only this row.
[[frame]]
name = "routeoverview-delete"
map = "{grimsel}"
env = "eta-route"
script = "p p p d H"
expect = "RouteOverview"

# START RIDE more than 200 m from the route's first point asks first: Ride to start (the cursor),
# Join nearest and Cancel. The fix stands 3.2 km from the start of the Grimsel climb, under a
# trip-day name. `f` draws the frame whose preparation projects the fix onto the route.
[[frame]]
name = "start-away"
map = "{grimsel}"
env = "day-route"
script = "p p p p f"
expect = "StartAway"
args = ["--center", "8298495,46625396", "--heading", "0"]

# Ride to start on its way: the shared planning spinner, held.
[[frame]]
name = "start-away-planning"
map = "{grimsel}"
env = "day-route"
script = "p p p p f p"
expect = "NavPlanning"
args = ["--center", "8298495,46625396", "--heading", "0", "--hold", "detour"]

# No way to the start: Join nearest (the cursor) and Cancel. This fix is 4.1 km east of km 12.
[[frame]]
name = "start-away-noroute"
map = "{grimsel}"
env = "day-route"
script = "p p p p f p w"
expect = "StartAway"
args = ["--center", "8377267,46608103", "--heading", "0", "--inject", "detour-fail=exhausted"]

# The Map's chrome overlays land here: the floating top-centre clock digits (pinned time via
# --clock; bumped one font step up in #688 so the time reads at a glance), the bottom-left scale bar
# (corner normally, stepped above the chip band while a chip is up), and — priority order unchanged —
# the bottom-centre one-slot warning chip.
[[frame]]
name = "map"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--gpx", "{gpx}", "--at", "30"]

# Settlement names (#1900). The Grimsel map is high alpine and holds almost no place records, so
# these three use the Freiburg package: 44 settlements over 20 km, one city, three towns, 26
# villages and 14 hamlets. `--zoom` multiplies the bbox-fit zoom of *that* package, and the three
# multipliers below put the camera at about 100, 30 and 15 metres per pixel; repacking the package
# moves them, which the digest catches.
# 100 m/px over Freiburg: the city and the town of Denzlingen. The villages and the hamlets are
# past their bands and stay quiet, which is the whole point of the bands.
[[frame]]
name = "map-settlements"
map = "{freiburg}"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--center", "7850000,47995000", "--zoom", "1.49"]
boot = false

# The same camera with the `Clock on map` switch off — `C u p p` flips it, `b` closes the sheet. The
# top of the panel reserves what the frame really inks, so with no digits Emmendingen takes the band
# the clock holds it out of above.
[[frame]]
name = "map-settlements-clock-off"
map = "{freiburg}"
script = "C u p p b"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--center", "7850000,47995000", "--zoom", "1.49"]
boot = false

# 30 m/px, with the camera east of Emmendingen so the town sits ~40 px from the left edge. A name is
# pinned to its place, so both it and Mundingen hang over the left edge and the panel clips them. At
# the `Caption` face the town's box is narrow enough to leave Maleck — the village of 400 that the
# frame below is centred on — its own name, so this frame draws four names and only the margin holds
# them apart.
[[frame]]
name = "map-settlements-dense"
map = "{freiburg}"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--center", "7881900,48121100", "--zoom", "4.9668"]
boot = false

# 15 m/px over Maleck: village and hamlet names, no city name anywhere, and the 14-character cut
# ("Vordere Zais..").
[[frame]]
name = "map-settlements-village"
map = "{freiburg}"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--center", "7889400,48123600", "--zoom", "9.9336"]
boot = false

# The same 100 m/px camera in pan mode, with Freiburg placed right under the bottom Up/Down cue.
# Pan suppresses every bottom pill, so this cue is the only thing holding that corner: the city's
# name is correctly absent here, and a regression that stopped reserving the cue would draw it over
# the chevron. The other three pan frames use Grimsel, which holds almost no place records.
[[frame]]
name = "map-settlements-pan"
map = "{freiburg}"
script = "h w"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--center", "7849401,48114690", "--zoom", "1.49"]
boot = false

# The map icons, at 5 m/px over Monaco's harbour: haloed service glyphs with the chrome and the
# panel edges the shared point placer holds them off. The Freiburg and Grimsel cameras hold no
# icon, so this is the one frame that pins icon placement.
[[frame]]
name = "map-icons"
map = "{monaco}"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--center", "7416969,43730798", "--zoom", "20"]
boot = false

[[frame]]
name = "statistics"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p b"
expect = "Statistics"
args = ["--gpx", "{gpx}", "--at", "30"]

# Elevation-profile Inspect mirrors the Map: hold enters Pan, Select tap toggles Zoom, and another
# Select tap returns to Pan without discarding the magnification. `w` clears the entry hold bulge.
[[frame]]
name = "statistics-pan"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p b h w"
expect = "Statistics"
args = ["--gpx", "{gpx}", "--at", "30"]

[[frame]]
name = "statistics-zoom"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p b h p d d d w"
expect = "Statistics"
args = ["--gpx", "{gpx}", "--at", "30"]

[[frame]]
name = "statistics-pan-zoomed"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p b h p d d d p d d w"
expect = "Statistics"
args = ["--gpx", "{gpx}", "--at", "30"]

# The live BLE-sensor stat tiles (epic #707, SE5): the Statistics grid pinned to HR / PWR / RPM (the
# three new single-column raw-int tiles) alongside a couple of live neighbours. `--sensors demo` seeds
# that grid and feeds a fixed synthetic HR/power/cadence through SE2's HAL traits for one tick, so the
# tiles read live values (152 bpm / 210 W / 88 rpm) rather than `--`. A minimal stub until SE8 wires
# the sim control-panel sliders; this frame pins the new tiles' captions + value formatting.
[[frame]]
name = "statistics-sensors"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p b"
expect = "Statistics"
args = ["--gpx", "{gpx}", "--at", "30", "--sensors", "demo"]

# The EL9 time tiles (#1077): TIME TO GO (`h TO GO`) and ETA on the Statistics grid, beside the
# DIST TO GO / TO CLIMB pair they are derived from, at a pinned 14:40 wall clock. The A/B is the
# point — the two frames ride the *same* replay over the *same* 19 km of geometry, and differ only
# in whether the loaded route carries elevation:
# * `-grimsel`: the real climb route — 18.6 km and 1083 m still to go → 1:19, arriving 16:00;
# * `-flat`:    its zero-elevation twin — the same 18.6 km, 0 m → 0:50, arriving 15:31.
# The 29-minute gap is the model's climb term (1083 m × 1.6 s/m on the Road profile); the flat frame
# is also the "no elevation" degradation, which must read as a plain distance ÷ speed answer rather
# than a `--` or a special case.
[[frame]]
name = "statistics-eta"
map = "{grimsel}"
env = "eta-route"
script = "p*4 b"
expect = "Statistics"
args = ["--clock", "2025-06-29T14:40", "--stat-fields", "time-to-go,eta,dist-to-go,to-climb,speed,ride-time", "--gpx", "{gpx}", "--at", "30"]

[[frame]]
name = "statistics-eta-flat"
map = "{grimsel}"
env = "eta-flat"
script = "p*4 b"
expect = "Statistics"
args = ["--clock", "2025-06-29T14:40", "--stat-fields", "time-to-go,eta,dist-to-go,to-climb,speed,ride-time", "--gpx", "{gpx}", "--at", "30"]

# The Route overview's EST TIME row for the zero-elevation twin: the whole-route estimate before
# the ride starts, with no climb term. The Grimsel climb's own figure is on `routeoverview`.
[[frame]]
name = "routeoverview-est-time-flat"
map = "{grimsel}"
env = "eta-flat"
script = "p p p"
expect = "RouteOverview"

# The low-battery cue (issue: < 10 %): a warning-red battery glyph in the map's top-left corner.
[[frame]]
name = "map-lowbatt"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p"
expect = "Map"
args = ["--clock", "2025-06-29T14:40", "--battery", "5", "--gpx", "{gpx}", "--at", "30"]

# Waypoint UI (epic #523). specs/vectors holds two routes in filename order: id 0 = route-plain,
# id 1 = route-waypoints ("Vector Loop": named waypoints Brunnen @ ~0 m and Pass Summit @ ~1.70 km on
# a 2.20 km track). The default `p p p p` rides id 0, so the extra `d` after the Route-menu press
# (`p p r p p`) picks id 1 — the *only* route these shots use. `--gpx $WPTGPX` is the committed replay
# that lies on that track, so the matcher locks on and progress drives the chip/tick countdowns; the
# Grimsel basemap doesn't reach 48°N, which is fine — these frames pin the waypoint chrome, not the map.
# (a) Map diamonds: at the start (--at 5 ⇒ ~30 m in) the black Brunnen diamond sits on the route by
# the marker — waypoints render as always-on ink furniture on the route line.
[[frame]]
name = "map-waypoints"
map = "{grimsel}"
env = "routes"
script = "p p d p p"
expect = "Map"
args = ["--clock", "2025-06-29T14:00", "--gpx", "{wptgpx}", "--at", "5"]

# (b) The Approach chip: replayed to ~300 m short of Pass Summit (inside the 500 m approach radius),
# default `Approach` mode → the calm `◆ Pass Summit  299m` pill counts down at bottom-centre with the
# full name visible (#688 widened the name allocation), the scale bar stepped up above the chip band.
[[frame]]
name = "map-wpt-chip"
map = "{grimsel}"
env = "routes"
script = "p p d p p f d p"
expect = "Map"
args = ["--clock", "2025-06-29T14:03", "--gpx", "{wptgpx}", "--at", "233"]

# (c) Stats mid-route: the amber live-fraction progress bar carries a black tick per named waypoint
# (Brunnen at the left edge, Pass Summit at its ~0.77 fraction) with the fill sweeping between them.
[[frame]]
name = "stats-wpt"
map = "{grimsel}"
env = "routes"
script = "p p d p p f d p b"
expect = "Statistics"
args = ["--gpx", "{wptgpx}", "--at", "233"]

# Easier compares the imported Grimsel climb with plans measured on the same terrain. The script runs
# at the replay endpoint, so the rider holds still and the result stays current.
[[frame]]
name = "easier-route"
env = ["elevation", "eta-route"]
script = "p*4 b T A d d p f"
expect = "Easier"
args = ["--gpx", "{gpx}", "--script-at", "30", "--at", "30"]

[[frame]]
name = "ridecontrol"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p p"
expect = "RideControl"
args = ["--gpx", "{gpx}", "--at", "30"]

# The **map context** (#1515 D3, extended by D4c): a Down+Back squeeze (`C`) on the riding Map
# raises the bottom sheet carrying the ride's secondary actions — Up ahead / Detour / POIs / Routes
# — plus the fifth row only the Map declares, Map display. It replaced the compass RIDE menu, whose
# own fifth station (Main menu) is now the global Back-hold escape. Same base as the quick-drawer
# frames — a real map under the device-64 dim LUT — so the two sheets can be judged against each
# other.
#
# Grimsel carries a routing graph, but at this replay point the rider reads off the route, so this
# frame is also the inert-row case: Detour draws recessed with no chevron and a press does nothing.
# The drawer's dim means inert, unlike the compass dial's, which dimmed a station a press still
# opened. The all-live arrangement is `map-context-live.png`, shot on the Monaco graph down in the
# detour block.
[[frame]]
name = "map-context"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p C"
expect = "ContextDrawer"
args = ["--gpx", "{gpx}", "--at", "30"]

# The **map display sheet** (#1515 D4c): the fifth row swaps the five-row sheet for the three
# switches that are the only home the map's clock pill, scale bar and terrain layer have. `u` wraps
# the cursor to the last row; there is **no settle token after the press**, because the swap is
# instantaneous by design — a frame that needed one would be evidence the swap re-ran the open.
[[frame]]
name = "map-display-sheet"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p C u p"
expect = "ContextDrawer"
args = ["--gpx", "{gpx}", "--at", "30"]

# …and the Clock row flipped off, which is the pair that shows the switch working. The `HH:MM` pill
# is gone from the map too, and that is the **headless** path being honest rather than the frozen
# base failing: `--png` composes the whole frame from nothing, so it never claims a resident frame
# and draws the base as always. On the device the map keeps the pill until the sheet closes, which
# is the one repaint the rider pays for however many switches they flip.
[[frame]]
name = "map-display-clock-off"
map = "{grimsel}"
env = "routes"
script = "p*4 f d p C u p p"
expect = "ContextDrawer"
args = ["--gpx", "{gpx}", "--at", "30"]

# The **ride context** the other three riding views share — the unchanged four-row table, shot over
# Statistics (`p p p p b C`), which is what keeps it covered at all now that the Map declares its own.
[[frame]]
name = "ride-context"
map = "{grimsel}"
env = "eta-route"
script = "p*4 b C"
expect = "ContextDrawer"
args = ["--gpx", "{gpx}", "--at", "30"]

# The Climb view (epic #506, C4/C5): the current climb's grade-striped profile + cursor + the four
# climb-scoped tiles. Reached with **no gesture at all** — `climb_mode` defaults to Auto, so riding
# into a climb replaces the riding view with this screen on the entry edge. The `eta-route`
# environment holds the Grimsel climb alone, so `p p p p` rides it and the replay (well inside the
# pass road at --at 1500)
# crosses the entry the auto-switch fires on. That is also what makes this frame the C5 regression
# surface: if the auto-switch stops firing, the sweep fails here rather than quietly saving a Map.
[[frame]]
name = "climb"
map = "{grimsel}"
env = "eta-route"
script = "p*4 f d p"
expect = "Climb"
args = ["--gpx", "{gpx}", "--at", "1500"]

# (a) The merged list: map-POI rows (muted icons) and custom-waypoint rows (AMBER icon + diamond pip)
# on one along-route axis, each with distance-to-go, climb-to-go and — past 50 m — the side arrow.
[[frame]]
name = "up-ahead"
map = "{monaco}"
env = "monaco-route"
script = "{up_base}"
expect = "WhatsNext"
args = ["--gpx", "{upgpx}", "--at", "25"]

# The timeline's own **context sheet** (#1515 D4a) and the two controls it is the only home for.
# (b) Water from authored and mapped sources. Finish the page load after advancing the list.
[[frame]]
name = "up-ahead-water"
map = "{monaco}"
env = "monaco-route"
script = "{up_base} {up_filter_water} d*9 f*8"
expect = "WhatsNext"
args = ["--gpx", "{upgpx}", "--at", "25"]

# (c1) The context sheet itself: two value rows, Filter and Sources, each a door into its editor.
# This frame replaces the Hold picker's — the filter is a sheet row now, not a mode on the list.
[[frame]]
name = "up-ahead-context"
map = "{monaco}"
env = "monaco-route"
script = "{up_base} C"
expect = "ContextDrawer"
args = ["--gpx", "{upgpx}", "--at", "25"]

# (c2) The nested value editor, on the row the rider is browsing (Campsite) with the committed
# choice (Everything) still ticked under the first notch — the mark the grammar promises.
[[frame]]
name = "up-ahead-filter-editor"
map = "{monaco}"
env = "monaco-route"
script = "{up_base} C p w d d"
expect = "ContextDrawer"
args = ["--gpx", "{upgpx}", "--at", "25"]

# (c3) The Sources editor, where the choices carry no icon of their own — the other shape the one
# generic editor draws.
[[frame]]
name = "up-ahead-sources-editor"
map = "{monaco}"
env = "monaco-route"
script = "{up_base} C d p w d"
expect = "ContextDrawer"
args = ["--gpx", "{upgpx}", "--at", "25"]

# (d) A POI row's detail, now carrying the signed off-route offset with the side spelled out.
[[frame]]
name = "up-ahead-poi-detail"
map = "{monaco}"
env = "monaco-route"
