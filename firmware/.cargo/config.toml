# Host workspace cargo config.
#
# The wasm build of obc-sim (the web simulator) assembles large fixed-capacity
# values (the shared app's heapless buffers + the device framebuffer) as stack
# temporaries during construction. wasm32 defaults to a 1 MiB stack, which those
# overflow — a shadow-stack overflow on wasm is a silent trap, not a Rust panic.
# Give the web build a roomier stack.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]
