[package]
name = "obc-route"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBCR route format reader + GPX converter (no_std) — shared by the desktop simulator and nRF firmware"

[features]
# Pull in `alloc` for the heap-boxed nav constructors (`NavScratch::new_boxed`). A std host — the
# simulator — enables this to build a zeroed `NavScratch` straight on the heap; the device never
# does (its scratch is a `.bss` static), so `alloc` stays off by default.
alloc = []
external-fixtures = []

[dependencies]
heapless = { workspace = true }
libm = { workspace = true } # no arch asm: identical correctly-rounded results, keeps the suite Miri-runnable (the #501 alignment-UB tripwire)
obc-crc = { workspace = true } # the stored checksum of a candidate measured while it is composed
obc-elevation = { workspace = true } # the shared elevation dead-band + (from EL7) the OBCT sampler
obc-formats = { workspace = true }
obc-map-scene = { workspace = true }
obc-ports = { workspace = true }
obc-reader = { workspace = true }

[dev-dependencies]
# Host tests compose real maps and parse them with the device reader.
# Dev-dependencies do not enter the no_std build.
obc-bake = { workspace = true }
obc-draw = { workspace = true }
obc-map-core = { workspace = true }
obc-network = { workspace = true }
# Shared OBCM byte builder — the corridor tests need a real packed POI quadtree to query.
obcm-testkit = { workspace = true }
obc-fixtures = { workspace = true }

[[test]]
name = "nav_fixtures"
required-features = ["external-fixtures"]
