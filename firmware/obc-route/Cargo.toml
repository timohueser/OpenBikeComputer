[package]
name = "obc-route"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBCR route format reader + GPX converter (no_std) — shared by the desktop simulator and nRF firmware"

[features]
# Pull in `alloc` for the heap-boxed nav constructors (`NavScratch::new_boxed`). A std host — the
# simulator — enables this to build a zeroed `NavScratch` straight on the heap; the device never
# does (its scratch is a `.bss` static), so `alloc` stays off by default.
alloc = []

[dependencies]
heapless = "0.8"
libm = { version = "0.2", default-features = false } # no arch asm: identical correctly-rounded results, keeps the suite Miri-runnable (the #501 alignment-UB tripwire)
obc-elevation = { path = "../obc-elevation" } # the shared elevation dead-band + (from EL7) the OBCT sampler
obc-formats = { path = "../obc-formats" }
obc-map-scene = { path = "../obc-map-scene" }
obc-ports = { path = "../obc-ports" }
obc-reader = { path = "../obc-reader" }

[dev-dependencies]
# The nav-router tests build real §8 maps with the actual packer serializer (the same
# writer↔reader loop obc-pack's nav_round_trip pins) and parse them with the real
# obc-reader. Host-only: dev-dependencies never touch the crate's no_std build.
obc-pack = { path = "../../host/obc-pack" }
# Shared OBCM byte builder — the corridor tests need a real packed POI quadtree to query.
obcm-testkit = { path = "../../host/obcm-testkit" }
