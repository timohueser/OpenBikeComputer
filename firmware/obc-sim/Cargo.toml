[package]
name = "obc-sim"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Desktop simulator for OBCM maps using embedded-graphics (same rendering path as the nRF54L firmware)"

[dependencies]
obc-reader = { path = "../obc-reader" }
# `alloc` gives us `NavScratch::new_boxed` — a zeroed heap allocation with no giant stack temporary
# (the ~39 KB A* table would overflow the wasm build's small stack via a plain `Box::new`).
obc-route = { path = "../obc-route", features = ["alloc"] }
obc-render = { path = "../obc-render" }
obc-app = { path = "../obc-app" }
# The board-agnostic self-diffing present core (epic #199 / issue #200): `diff_rows` + `row_hash` +
# the `spans_missed_changes` oracle. The sim drives the exact same row-diff the device present path
# adopts in D2, under an exact full-frame diff oracle — so a systematic hash-diff bug fails here in
# CI. Only the pure-math `rowdiff` module is used; the crate's embassy/SD glue is dead-stripped.
obc-platform = { path = "../obc-platform" }
# Shared host GPX replay (the GpxPlayer / BaroSensor the control panel drives) — the same
# crate the USB feeder (obc-usb-host) uses, so a recorded ride plays back identically here.
obc-replay = { path = "../obc-replay" }
embedded-graphics = "0.8"
# The fixed-cap string type `RideSummary.name` carries (same 0.8 the shared crates pin) — the
# wasm demo `RideStore` constructs summaries directly, so the crate needs its own dep (the
# native store only ever parses them out of ORD files via obc-route).
heapless = "0.8"
# GUI host: the device-screen window + control panel. Pure-Rust window stack
# (native) and a WebGL canvas (wasm) — the same eframe app drives both, so the
# web demo is the firmware-identical render path, never a stale screenshot.
eframe = "0.29"
# PNG output for headless `--png` renders.
image = { version = "0.25", default-features = false, features = ["png"] }
# Monotonic clock that works on both native (re-exports std) and wasm (JS perf
# clock) — std::time::Instant::now() panics in the browser.
web-time = "1"
# Minimal block-on to drive the `obc_platform::DisplayDriver` seam's async methods, which the sim
# backend completes synchronously on the host. Already in the tree (eframe → wgpu pull it), so this
# reuses the resolved 0.3 rather than adding a new executor dep.
pollster = "0.3"

# --- Native-only host concerns (file picker, etc.) ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native "open file" dialog for selecting a GPX track to replay (the firmware /
# web build obviously has no native file picker).
rfd = "0.14"

# --- Web (wasm32) build: the embedded simulator that runs on the project site ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
log = "0.4"
console_error_panic_hook = "0.1"
# egui/ahash pull getrandom; the wasm32-unknown-unknown target needs the `js`
# backend explicitly or it fails to build.
getrandom = { version = "0.2", features = ["js"] }
