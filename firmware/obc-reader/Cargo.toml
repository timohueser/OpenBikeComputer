[package]
name = "obc-reader"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBCM map format reader (no_std + alloc) — pure-parse logic for the desktop simulator and nRF54L firmware"

[features]
# Constrained on-device memory profile (issue #124). The nRF54L15 has 256 KB RAM and no
# external RAM, so the board firmware enables this to shrink the resident `MapCache`
# (fewer geometry-chunk slots) — and, via the sibling crates that forward it, the renderer
# scratch and the `RouteCache` — to fit alongside the 75 KB RGB222 framebuffer. Off by
# default, so host / sim / tests keep the generous full-fidelity sizes.
nrf-mem = []
# Pull in `alloc` for the heap-boxed cache constructor (`MapCache::new_boxed`). A small-stack
# host — the wasm web demo — enables this to build the zeroed ≈277 KB `MapCache` straight on
# the heap; the device never does (it `ptr::write`s its cache into a reserved region), so
# `alloc` stays off by default. Mirrors `obc-route`'s `alloc` / `NavScratch::new_boxed`.
alloc = []

[dependencies]
heapless = "0.8"
obc-formats = { path = "../obc-formats" }
# `no_std` float math for the `geo` distance core (`cosf`/`sqrtf` on the M33's f32 FPU).
libm = { version = "0.2", default-features = false } # no arch asm: identical correctly-rounded results, keeps the suite Miri-runnable (the #501 alignment-UB tripwire)

[dev-dependencies]
# Shared OBCM byte builder for the format-contract tests (one source of the layout,
# also used by obc-render's priority test).
obcm-testkit = { path = "../obcm-testkit" }
