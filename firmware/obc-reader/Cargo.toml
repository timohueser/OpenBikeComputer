[package]
name = "obc-reader"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBCM map format reader (no_std + alloc) — pure-parse logic for the desktop simulator and nRF54L firmware"

[features]
# Pull in `alloc` for the heap-boxed cache constructor (`MapCache::new_boxed`). A small-stack
# host — the wasm web demo — enables this to build the zeroed 37 KB `MapCache` straight on
# the heap; the device never does (it `ptr::write`s its cache into a reserved region), so
# `alloc` stays off by default. Mirrors `obc-route`'s `alloc` / `NavScratch::new_boxed`.
alloc = []
external-fixtures = []

[dependencies]
heapless = { workspace = true }
obc-formats = { workspace = true }
obc-map-scene = { workspace = true }
# `no_std` float math for the `geo` distance core (`cosf`/`sqrtf` on the M33's f32 FPU).
libm = { workspace = true } # no arch asm: identical correctly-rounded results, keeps the suite Miri-runnable (the #501 alignment-UB tripwire)
miniz_oxide = { workspace = true }

[dev-dependencies]
# Shared OBCM byte builder for the format-contract tests (one source of the layout,
# also used by obc-render's priority test).
obcm-testkit = { workspace = true }
obc-fixtures = { workspace = true }
# The one definition of the device glyph repertoire, read off the real font strip: the fixture
# sweep asserts that a baked map holds no name the face cannot draw.
obc-render = { workspace = true }
zlib-rs = { workspace = true }

[[test]]
name = "poi_fixtures"
required-features = ["external-fixtures"]
