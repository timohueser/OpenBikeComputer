[package]
name = "route-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Turn-aware regional routing with immutable prepared profiles"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
