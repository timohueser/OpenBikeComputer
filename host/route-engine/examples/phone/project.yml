name: PlannerBenchmark
options:
  bundleIdPrefix: com.openbikecomputer
  deploymentTarget:
    iOS: "17.0"
targets:
  PlannerBenchmark:
    type: application
    platform: iOS
    sources:
      - Benchmark.swift
      - SearchBenchmark.swift
      - path: ../../../../apps/planner-search/native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.PlannerBenchmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../../../../target/aarch64-apple-ios/release/examples"]
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv", "-liconv"]
    dependencies:
      - framework: ../../../../target/aarch64-apple-ios/release/examples/libphone_benchmark.a
        embed: false
      - framework: ../../../../target/aarch64-apple-ios/release/examples/libphone_overlay_benchmark.a
        embed: false
