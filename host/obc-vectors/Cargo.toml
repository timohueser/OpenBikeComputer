[package]
name = "obc-vectors"
version = "0.1.0"
edition = "2021"
publish = false # test-only: builds + verifies the shared specs/vectors/ fixtures
description = "S0 wire-protocol shared test vectors (obc-ble-interface-spec.md): builders and contract tests for the binary fixtures in specs/vectors/, consumed by both cargo test and the companion app's swift test"

[dependencies]
obc-formats = { path = "../../firmware/obc-formats" }
obc-route = { path = "../../firmware/obc-route" }
# Only for the OBCU v2 fixture's Ed25519 signature (#997). The container's *header* is still
# hand-built from the spec's field table like every other fixture here — a signature is the one
# thing a builder cannot transcribe from prose.
obc-dfu = { path = "../../firmware/obc-dfu" }

[dev-dependencies]
heapless = "0.8"
