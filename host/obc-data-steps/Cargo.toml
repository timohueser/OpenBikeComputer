[package]
name = "obc-data-steps"
version = "0.1.0"
edition = "2021"
publish = false
# It links the GPL step code of the products into the MIT library obc-data.
license = "GPL-3.0-only"
description = "The `obc data` binary: the commands of obc-data with the steps of each product"

[[bin]]
name = "obc-data"
path = "src/main.rs"

[features]
external-fixtures = []

[dependencies]
obc-data = { path = "../obc-data" }
# The step list of the device maps: the outline of a region and its cells.
obc-bake = { path = "../obc-bake" }
obc-pack = { path = "../obc-pack" }
# The terrain steps.
obc-dem = { path = "../obc-dem", features = ["terrarium"] }
# The planner routing step.
route-build = { path = "../route-build" }
# The planner search dump step.
obc-search-bake = { path = "../obc-search-bake" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
# A stand-in for the Nominatim archive in the planner build test.
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
obc-elevation = { path = "../../firmware/obc-elevation" }
obc-fixtures = { path = "../obc-fixtures" }
obc-formats = { path = "../../firmware/obc-formats" }
route-engine = { path = "../route-engine" }
# Reads the search databases of the planner build test.
rusqlite = { version = "0.38", features = ["bundled"] }

[[test]]
name = "terrain_fixture"
required-features = ["external-fixtures"]
