[package]
name = "obc-ground-plan"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The TrailView ground plan of one cell: integer geometry, terrain heights and cross-sections from the feature tiles, the terrain pages and the rule tables"

# The storeys over the ground (decks): their faces, records, meshes and shells. The crate's tests and its debug tool
# build them; a dependent turns it on to link them (the bridge's own feature `storeys`).
[features]
default = ["storeys"]
storeys = []

[dependencies]
# Integer polygon slices. No `allow_multithreading`: the crate runs on one thread.
i_overlay = { version = "9.1.0", default-features = false }
libm = { workspace = true }
# The mesh's constrained Delaunay triangulation. Pinned: its exact predicates and its insertion
# order decide the triangles.
spade = { version = "=2.15.1", default-features = false }
# Every build parses the tables the same: the row order is the rank, and floats round-trip.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
flate2 = { workspace = true }
image = { workspace = true, features = ["png", "webp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[[example]]
name = "debug"
path = "examples/debug/main.rs"
