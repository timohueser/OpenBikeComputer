[package]
name = "obc-ground-plan"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The TrailView ground plan of one cell: integer geometry, terrain heights and cross-sections from the feature tiles, the terrain pages and the rule tables"

# The storeys over the ground (decks): their faces, records, meshes and shells; and the storey under it (bores), with
# the ground over a bore and the portals. The crate's tests and its debug tool build them; a dependent turns them on
# to link them (the bridge's own features `storeys` and `bores`).
[features]
default = ["storeys", "bores"]
storeys = []
bores = ["storeys"]

[dependencies]
# Integer polygon slices. No `allow_multithreading`: the crate runs on one thread.
i_overlay = { version = "9.1.0", default-features = false }
libm = { workspace = true }
# The mesh's constrained Delaunay triangulation. Pinned: its exact predicates and its insertion
# order decide the triangles.
spade = { version = "=2.15.1", default-features = false }
# Every build parses the tables the same: the row order is the rank, and floats round-trip.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
# The tunnel parts: which ends are built, so the ground reaches their openings and widens to them.
obc-trailview-parts = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }
image = { workspace = true, features = ["png", "webp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[[example]]
name = "debug"
path = "examples/debug/main.rs"
