[package]
name = "obc-wx-client"
version = "0.1.0"
edition = "2021"
publish = false # internal host tool — never on the device
description = "The host weather client (WX14): manifest + OBCG corridor Range reads + MET hourly -> one OBCW bundle. A second, independent implementation of the same client contract the iOS companion implements; the phone stays the reference."

[dependencies]
# The OBCG/OBCW byte authorities and the shared WX2 intensity codec. The client never re-derives
# a byte layout: every fetched page/tile is validated by the same code the device and the vectors
# run, and the bundle it emits is encoded by `obc_formats::obcw`.
obc-formats = { path = "../../firmware/obc-formats", features = ["obcg-deflate"] } # OBCG codec 2 (host side only)
# The device's own OBCW reader. `--dump` prints what the *firmware* would sample, not what this
# crate's encoder thinks it wrote — the difference is the whole value of the check.
obc-weather = { path = "../../firmware/obc-weather" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.34", default-features = false, features = ["std", "clock"] }
# The same blocking rustls client the rest of host/ uses; no second TLS stack.
ureq = "3"

[dev-dependencies]
# Parity oracle: the client's independent manifest model must read a document the *baker* wrote.
# A dev-dep only, so the release build never pulls the baker's GRIB/HDF5 stack.
obc-wx-bake = { path = "../obc-wx-bake" }
