[package]
name = "obc-trailview-features"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The height solvers of the TrailView feature tiles: roads by area, water by network"

[[bin]]
name = "trailview-heights"
path = "src/main.rs"

[dependencies]
# The sparse Cholesky factorization of the road solver's normal equations.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
flate2 = { workspace = true }
image = { workspace = true, features = ["webp"] }
rayon = "1"
rstar = "0.12"
rusqlite = { workspace = true, features = ["bundled"] }
# The options of the step keep the order of their keys, and coordinates parse exactly.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
# The request of the step and its function.
obc-data = { workspace = true }
# The cut of the OSM of a bake.
tempfile = { workspace = true }
