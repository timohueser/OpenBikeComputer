[package]
name = "obc-inspect"
version = "0.1.0"
edition = "2021"
publish = false # internal host tool — not published to crates.io
description = "Reads a binary artefact through the crate that owns its format and prints a summary: maps, routes, trips, terrain containers, card images and the settings blob. Read-only, and never a second parser."

[dependencies]
# The magic bytes, the versions and the byte-I/O seam every reader below is built on.
obc-formats = { workspace = true }
# The one file adapter onto that seam, shared with the packer, the bakery and the assembler.
obc-file-source = { workspace = true }
# OBCM: header, style table, LOD ladder, POI directory, landmark and peak sections. `alloc` gives
# `MapCache::new_boxed` — the ~277 KB cache belongs on the heap, not on this binary's stack.
obc-reader = { workspace = true, features = ["alloc"] }
# OBCR routes and the trip object.
obc-route = { workspace = true }
# OBCT terrain containers, both the embedded region and a standalone shard.
obc-elevation = { workspace = true }
# The flat store a card image holds. `std` is the host mount.
obc-storage = { workspace = true, features = ["std"] }
# The settings blob's one decoder, beside the table that declares the field names.
obc-app = { workspace = true }
# `--json`. The text report and the JSON report render from one tree, so they cannot disagree.
serde_json = { workspace = true }

[dev-dependencies]
obcm-testkit = { workspace = true }
