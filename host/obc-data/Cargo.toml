[package]
name = "obc-data"
version = "0.1.0"
edition = "2021"
publish = false
# The one crate outside GPL-3.0-only. It must not depend on a GPL crate:
# tools/check_obc_data_licence.py enforces that in CI.
license = "MIT OR Apache-2.0"
description = "The data registry: sources, regions and environments; the store, its fetchers and the engine that builds layers; and the `obc data` commands"

[dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# The child process of a Rust step parses the floats of its options exactly, as the key reads them.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "0.9"
ureq = "3"
# `obc data serve`: the files of a target and the API of its planner releases.
axum = "0.8"
flate2 = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dev-dependencies]
boon = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
