[package]
name = "obc-data"
version = "0.1.0"
edition = "2021"
publish = false
# The one crate outside GPL-3.0-only. It must not depend on a GPL crate:
# tools/check_obc_data_licence.py enforces that in CI.
license = "MIT OR Apache-2.0"
description = "The data registry: sources, regions and pins, and the `obc data` commands that read them"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
