[package]
name = "obc-data"
version = "0.1.0"
edition = "2021"
publish = false
# The one crate outside GPL-3.0-only. It must not depend on a GPL crate:
# tools/check_obc_data_licence.py enforces that in CI.
license = "MIT OR Apache-2.0"
description = "The data registry: sources, regions and environments; the store, its fetchers and the engine that builds layers; and the `obc data` commands"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
