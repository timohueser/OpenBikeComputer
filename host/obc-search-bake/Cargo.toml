[package]
name = "obc-search-bake"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "OSM enrichment for planner search and place tiles"

[[bin]]
name = "search-bake"
path = "src/main.rs"

[dependencies]
obc-places = { path = "../obc-places" }
clap = { version = "4", features = ["derive"] }
osmpbfreader = "0.19"
serde_json = "1"
sha2 = "0.10"
geo = { version = "0.31", default-features = false }
rstar = "0.12"
zstd = "0.13"
unicode-normalization = "0.1"
flate2 = "1"
regex = "1"
tempfile = "3"

[dev-dependencies]
obc-pack = { path = "../obc-pack" }
