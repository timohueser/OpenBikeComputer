[package]
name = "route-build"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[features]
obc-terrain = ["dep:obc-dem"]

[dependencies]
route-engine = { path = "../route-engine" }
fast_paths = "=1.0.0"
osmpbfreader = "0.19"
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
obc-dem = { path = "../obc-dem", default-features = false, features = ["geotiff"], optional = true }
