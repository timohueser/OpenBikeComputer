[package]
name = "obc-wx-source-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-only WX1 source contract validator; not a production weather adapter"

[dependencies]
bzip2-rs = "0.1.2"
chrono = "0.4.34"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
grib = { version = "0.17", default-features = false, features = ["ccsds-unpack-with-rust-aec", "png-unpack-with-png-crate", "time-calculation"] }
hdf5-pure = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
