[package]
name = "obcm-testkit"
version = "0.1.0"
edition = "2021"
publish = false # test-only helper crate — never shipped or published
description = "Hand-written OBCM byte builder shared by obc-reader and obc-render integration tests"

[dependencies]
# Import normative constants only. Byte assembly remains deliberately independent of production
# serializers/parsers so this crate stays a meaningful oracle.
obc-formats = { path = "../../firmware/obc-formats" }
# Resident quadtree BFS numbering shared with both production writers. The fixture's
# tree construction and byte packing remain deliberately independent.
obc-tree-walk = { path = "../obc-tree-walk" }
