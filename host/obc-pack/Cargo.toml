[package]
name = "obc-pack"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "OBCM map packer (OSM .osm.pbf -> .obcm)"

[features]
external-fixtures = []

[dependencies]
obc-pbf = { workspace = true }
obc-map-core = { workspace = true }
obc-places = { workspace = true }
# Normative OBCM constants and primitive codecs shared with every producer/consumer.
obc-formats = { workspace = true }
# The one file adapter onto that crate's read seam — `--terrain` opens its containers through it.
obc-file-source = { workspace = true }
# Resident quadtree BFS numbering shared with the assembler and byte-fixture oracle.
obc-tree-walk = { workspace = true }
# High-level reader algorithms used for round-trip comparison, geometry capacity, POI distance,
# and the obcm_diff tool. Format facts come from obc-formats, not this consumer.
#
# `alloc` is on because this crate's own examples build the ~277 KB `MapCache` on the heap
# (`MapCache::new_boxed`, host-only). Without it `cargo build -p obc-pack` fails while a
# workspace build succeeds — the web demo enables the feature and cargo unifies it — so the
# per-crate command in firmware/README.md silently stopped working.
obc-reader = { workspace = true, features = ["alloc"] }
obc-map-scene = { workspace = true }
# The one sampling truth (epic #1068): the packer integrates per-edge ascent from **baked OBCT
# tiles** through the same `no_std` reader, bilinear sampler and dead-banded integrator the device
# runs, so a climb-aware route costs the number the rider is later shown. Never a DEM library —
# rasters are `obc-dem`'s business, one step earlier in the pipeline.
obc-elevation = { workspace = true }
# The data registry: the credits the catalog and the contour log carry come from data/sources.toml.
obc-data = { workspace = true }
# `preserve_order` is load-bearing: the config assigns style IDs 1-based in
# config.json document order, so the parsed map must keep insertion order.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
# Structural config schema comes from the same serde model the parser uses.
# This is a host-only packer dependency and never enters a firmware crate.
schemars = { workspace = true, features = ["preserve_order"] }
heapless = { workspace = true }
# `v3_14_0` unlocks the area-assembly API (`build_area`, the even-odd multipolygon
# primitive) used for relation polygons, and pins the minimum libGEOS to 3.14.
#
# Deliberately not `static`: the operator-facing CLI and host tests use the system
# libGEOS a developer already has. Product builders consume published cells and do
# not link this crate.
geos = { version = "11.1.1", features = ["v3_14_0"] }
osmpbf = "0.3.8"
# Speed: parallelize the per-feature simplify. Safe because the `geos` crate keeps
# a thread-local GEOS context (each worker has its own) and `Geometry` is `!Send`
# (never crosses threads); rayon's `collect` preserves order, so output stays
# deterministic.
rayon = "1"
# Catalog manifest digests. Consumers verify a downloaded artifact against the
# `sha256` this crate publishes, so the digest is a contract, not a convenience —
# use the reviewed implementation rather than hand-rolling one.
sha2 = { workspace = true, default-features = true }
# The live catalog that the bakery's version guard reads (`net::get_text`). `ureq` is
# blocking and rustls-by-default, so no OpenSSL system dependency follows it onto macOS
# or Windows.
ureq = { workspace = true }
# Reading one deflate archive. Default features are off on purpose: they would drag
# in bzip2 and zstd, both C libraries, and the whole point of #907 is that libGEOS
# is the *last* native dependency in the tree. `deflate-flate2` is flate2 on its
# default miniz_oxide backend — pure Rust.
zip = { workspace = true, features = ["deflate-flate2"] }
scraper = { version = "0.27", default-features = false }
image = { workspace = true, features = ["jpeg", "png"] }
obc-render = { version = "0.1.0", path = "../../firmware/obc-render" }
percent-encoding = "2"
sha1 = "0.10.6"
zlib-rs = { workspace = true }
url = "2"

[dev-dependencies]
obc-fixtures = { workspace = true }
# The shared scratch-path helper the CLI/oracle tests build their throwaway trees with.
obcm-testkit = { workspace = true }
# Validate generated manifests against the checked-in JSON Schema the hosted site
# will use, so "it validates" is a test result and not an assumption. Draft 2020-12,
# offline (no remote `$ref` resolution), test-only.
boon = "0.6"
# The OBCT container builder the §8.3 ascent tests bake their synthetic terrain with. It is the
# spec-fixture crate, so the test input is written from OBCT_Spec.md's field tables rather than by
# the reader that has to parse it back.
obc-vectors = { workspace = true }
# The surface converter a catalog test reads a terrain cell back with. `default-features = false`
# leaves the GeoTIFF decoder and the HTTP client out.
obc-dem = { workspace = true }
