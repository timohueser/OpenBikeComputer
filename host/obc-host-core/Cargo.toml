[package]
name = "obc-host-core"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Shared std host glue for the three rendering hosts (obc-sim desktop, obc-web-demo browser, obc-ios-host iPhone): the whole-frame render, GPX replay stepping, the frame-interleaved resumable NavPlan, the in-memory byte sink, and the card and in-memory route/ride/track stores. No GUI dependencies — this is exactly the host logic every shell drives the shared no_std core with."

[features]
external-fixtures = []
# Exposes `test_support` (the counted byte source) to a dependent's `[dev-dependencies]`.
test-support = []

[dependencies]
obc-app = { workspace = true }
# Semantic replay and track ports shared by both desktop and browser hosts.
obc-ports = { workspace = true }
obc-map-scene = { workspace = true }
obc-reader = { workspace = true, features = ["alloc"] }
obc-storage = { workspace = true }
obc-crc = { workspace = true }
getrandom = "0.2"
unicode-normalization = "0.1.25"
# `alloc` gives us `NavScratch::new_boxed` — a zeroed heap allocation with no giant stack temporary
# (the ~39 KB A* table would overflow the wasm build's stack via a plain `Box::new`).
obc-route = { workspace = true, features = ["alloc"] }
obc-formats = { workspace = true } # the byte-I/O seam (ByteSource/ByteSink/SliceSource/Error) — the authority, not via obc-route
# The OBCT reader and bounded cache sample terrain inside the retained map object.
obc-elevation = { workspace = true }
# Shared host GPX replay (the GpxPlayer / BaroSensor `replay_step` advances) — the same crate the
# USB feeder (obc-usb-host) uses, so a recorded ride plays back identically on every host.
obc-replay = { workspace = true }
# The render scratch every host lends to `frame::render`, its `Clock` seam and its `RenderStats`.
obc-render = { workspace = true }
# The `DrawTarget` seam `frame::render` draws every host's frame through, and the pixel writes
# behind `RgbaFrame`. Same 0.8 the render path pins.
embedded-graphics = { workspace = true }

[dev-dependencies]
obc-link = { workspace = true }
obc-pack = { workspace = true }
obc-storage = { workspace = true, features = ["std"] }
obcm-testkit = { workspace = true }
obc-fixtures = { workspace = true }
heapless = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }
# The shared file adapter the native map snapshot is read through. Native only: a browser host's
# map is bytes in memory, and this crate's wasm build must acquire no filesystem.
obc-file-source = { workspace = true }

# `MoveFileExW`: the write-through, no-clobber move that publishes a new card name.
# Windows has no directory sync, so this call is the whole name barrier.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[[test]]
name = "altitude_fusion"
required-features = ["external-fixtures"]
