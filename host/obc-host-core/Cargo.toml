[package]
name = "obc-host-core"
version = "0.1.0"
edition = "2021"
publish = false  # internal firmware crate — not published to crates.io
description = "Shared std host glue for the two simulator hosts (obc-sim desktop, obc-web-demo browser): GPX replay stepping, the frame-interleaved resumable NavPlan, the in-memory byte sink, and in-memory route/ride/track stores. No GUI dependencies — this is exactly the host logic both shells drive the shared no_std core with."

[features]
external-fixtures = []

[dependencies]
obc-app = { path = "../../firmware/obc-app" }
# Semantic replay and track ports shared by both desktop and browser hosts.
obc-ports = { path = "../../firmware/obc-ports" }
obc-map-scene = { path = "../../firmware/obc-map-scene" }
obc-reader = { path = "../../firmware/obc-reader" }
# `alloc` gives us `NavScratch::new_boxed` — a zeroed heap allocation with no giant stack temporary
# (the ~39 KB A* table would overflow the wasm build's stack via a plain `Box::new`).
obc-route = { path = "../../firmware/obc-route", features = ["alloc"] }
obc-formats = { path = "../../firmware/obc-formats" } # the byte-I/O seam (ByteSource/ByteSink/SliceSource/Error) — the authority, not via obc-route
# The OBCT terrain reader + tile cache behind `terrain::mount` (EL7): the host mounts a map's
# `.obcd` sidecar into the same `ElevationSource` seam the device fills routes from.
obc-elevation = { path = "../../firmware/obc-elevation" }
# Shared host GPX replay (the GpxPlayer / BaroSensor `replay_step` advances) — the same crate the
# USB feeder (obc-usb-host) uses, so a recorded ride plays back identically on every host.
obc-replay = { path = "../obc-replay" }
# `DrawTarget` for `RgbaFrame` — the shared browser framebuffer. Same 0.8 the render path pins;
# this crate adds no drawing of its own, only the buffer both wasm hosts draw into.
embedded-graphics = "0.8"

[dev-dependencies]
obc-fixtures = { path = "../obc-fixtures" }
