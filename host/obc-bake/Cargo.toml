[package]
name = "obc-bake"
version = "0.1.0"
edition = "2021"
publish = false  # internal host tool — not published to crates.io
description = "The bakery: bake the curated region list into a catalog tree and publish it"

[dependencies]
obc-pbf = { workspace = true }
obc-map-core = { workspace = true }
obc-osm = { workspace = true }
# The packer, linked rather than spawned: `pipeline::pack` is the one code path
# both hosts already share (#906), and it hands back the byte count and a cancel
# token instead of a subprocess whose stdout would have to be scraped. It also
# brings the catalog generator (`obc_pack::catalog`), so the bakery adds no second
# manifest writer to the tree.
obc-pack = { workspace = true }
# The shared file adapter the verifier reads an artifact through, never resident.
obc-file-source = { workspace = true }
# Verification opens the artifact with the *real* reader — the same crate the
# device runs — rather than sniffing the header. `alloc` is for `MapCache::new_boxed`:
# the cache is ~277 KB and must not be built on the stack.
obc-reader = { workspace = true, features = ["alloc"] }
obc-map-scene = { workspace = true }
# The normative OBCM version the bake and the published-catalog guard compare against, and the
# OBCT facts the terrain stage validates a pairing with.
obc-formats = { workspace = true }
# The data registry and the one R2 client: the regions a bake reads, the credits a catalog carries,
# and `obc bake publish --target r2`. A GPL crate may depend on this MIT crate; never the reverse.
obc-data = { workspace = true }
# The terrain stage (#1071) drives `obc-dem` as a library rather than as a subprocess: `bake_cell`
# is already a pure function of (mosaic, cell) and `write_cell_file` already writes the one
# container OBCT defines, so shelling out would only insert a second naming scheme between the
# rasteriser and the catalog's object layout.
# `fetch` too, not just `geotiff`: since the terrain stage runs itself (a248a4c3) the bakery
# fetches missing GLO-30 tiles into its cache, so the HTTP client legitimately follows `obc-dem`
# into this tree. Declared here rather than inherited by workspace feature unification, so a
# standalone `cargo check -p obc-bake` matches what the workspace builds.
obc-dem = { workspace = true, features = ["geotiff", "fetch"] }
# Skin previews are not screenshots of a second renderer. The bakery restamps a
# canonical tiny OBCM through the assembly engine's production skin resolver and
# renders it through the same `RenderScratch` the device runs.
obcm-assemble = { workspace = true }
obc-render = { workspace = true }
embedded-graphics = { workspace = true }
# Deterministic RGB PNG encoding for the catalog's square skin previews.
image = { workspace = true, features = ["png"] }
# The reader decodes into caller-owned fixed-capacity scratch; verification has to
# supply it in exactly the shape the device does.
heapless = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
# Content hashes: the idempotency key over the extract, and the artifact digests the
# sidecar records. Same implementation the catalog generator publishes with.
sha2 = { workspace = true, default-features = true }

[dev-dependencies]
obc-places = { workspace = true }
# The shared scratch-path helper the CLI tests build their throwaway paths with.
obcm-testkit = { workspace = true }
