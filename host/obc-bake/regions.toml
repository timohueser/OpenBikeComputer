# The curated region list — what the bakery bakes, and therefore what the hosted
# builder offers. Reviewable, in-repo, and **one line per region** on purpose:
# adding coverage is a one-line PR, and removing it is a one-line revert.
#
# `id` is both the catalog's `region_id` (OBCC_Spec.md §6 — "slash-separated,
# mirroring the Geofabrik hierarchy") and the Geofabrik download path: the extract
# URL is `<base>/<id>-latest.osm.pbf`. One string, so a region cannot be listed
# under a name Geofabrik does not serve, and the manifest's ids cannot drift from
# the source tree they came from. `name` is what a human sees in the picker.
#
# `id` and `name` are the only fields. Every region uses the one schema in
# `builder/presets/schema.json`; presentation skins are stamped at assembly time.
# Unknown fields fail the parse instead of silently changing what gets baked.
#
# ── Curation policy ────────────────────────────────────────────────────────────
#
# DACH first (locked 2026-07-29, #898): Germany with all sixteen Bundesländer,
# Austria, Switzerland, plus the Freiburg government-region test excerpt. With no
# region arguments, `obc-bake bake` processes every line. Positional ids select a
# subset. `--all` bakes the planet instead; these same entries then become named
# selection presets, derived from their polygons without baking regional extracts.
#
# Germany is listed **alongside** its Bundesländer, not instead of them: they are
# convenient named selections over the same shared cells, so overlap costs no
# duplicate cell storage.
#
# Every path below was verified against download.geofabrik.de on 2026-07-29;
# `freiburg-regbez` was verified on 2026-07-31.

regions = [
  # Germany — the whole country, then each Bundesland.
  { id = "europe/germany", name = "Germany" },
  { id = "europe/germany/baden-wuerttemberg", name = "Baden-Württemberg" },
  { id = "europe/germany/baden-wuerttemberg/freiburg-regbez", name = "Regierungsbezirk Freiburg" },
  { id = "europe/germany/bayern", name = "Bayern" },
  { id = "europe/germany/berlin", name = "Berlin" },
  { id = "europe/germany/brandenburg", name = "Brandenburg" },
  { id = "europe/germany/bremen", name = "Bremen" },
  { id = "europe/germany/hamburg", name = "Hamburg" },
  { id = "europe/germany/hessen", name = "Hessen" },
  { id = "europe/germany/mecklenburg-vorpommern", name = "Mecklenburg-Vorpommern" },
  { id = "europe/germany/niedersachsen", name = "Niedersachsen" },
  { id = "europe/germany/nordrhein-westfalen", name = "Nordrhein-Westfalen" },
  { id = "europe/germany/rheinland-pfalz", name = "Rheinland-Pfalz" },
  { id = "europe/germany/saarland", name = "Saarland" },
  { id = "europe/germany/sachsen", name = "Sachsen" },
  { id = "europe/germany/sachsen-anhalt", name = "Sachsen-Anhalt" },
  { id = "europe/germany/schleswig-holstein", name = "Schleswig-Holstein" },
  { id = "europe/germany/thueringen", name = "Thüringen" },
  # Austria and Switzerland — whole countries; Geofabrik's sub-extracts for them
  # are not offered until someone asks.
  { id = "europe/austria", name = "Austria" },
  { id = "europe/switzerland", name = "Switzerland" },
]
