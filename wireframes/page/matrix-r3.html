<style>
/* Direction P1 · one sheet, clear states. Prefix p1-.
   The map and one sheet. Each detent has one job. Low: the box and one line. Medium: one block,
   the profile, or the compact answer while an answer is open. High: one list, the days, or the full
   answer. Focusing the box takes the sheet to full height and hides the map. The navigation bar
   holds Back, the plan name, Undo and "···"; an answer's action is one row at the bottom of the
   sheet and exists only while a row is selected. */

/* day colours (the brief's), on the profile and the days list */

/* navigation bar */
.p1-nav { position: absolute; z-index: 20; left: 0; right: 0; top: 0; height: 98px; padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border-bottom: 1px solid var(--line); }
.p1-nb { display: inline-flex; align-items: center; gap: 2px; height: 44px; min-width: 44px; padding: 0 6px; font-size: 17px; color: var(--ink); }
.p1-nb svg { width: 22px; height: 22px; }

.p1-nr { display: flex; }
.p1-title { position: absolute; left: 92px; right: 92px; top: 54px; height: 44px; line-height: 44px; text-align: center; font-weight: 600; font-size: 17px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* map marks: label text and the route stroke widths per zoom (map units per pixel) */
.p1-mt { font: 600 13px var(--ios); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.p1-mt.b { fill: var(--ink); font-weight: 700; }
.p1-mt.rt { fill: var(--route); }
.p1-z15 .rt-casing { stroke-width: 12; } .p1-z15 .rt-line { stroke-width: 6; }
.p1-z18 .rt-casing { stroke-width: 14; } .p1-z18 .rt-line { stroke-width: 7; }
.p1-z18 .rt-alt-casing { stroke-width: 13; } .p1-z18 .rt-alt { stroke-width: 6.5; }
.p1-attr { bottom: 22px; left: 6px; right: auto; }

/* the sheet: grab, box, one line, then one block */
.p1-sheet { padding: 0 16px 34px; display: flex; flex-direction: column; overflow: hidden; }
.p1-sheet > .qbox { margin-top: 10px; flex: none; }
.p1-x { width: 44px; height: 44px; margin-right: -14px; display: grid; place-items: center; color: var(--ink-faint); flex: none; }
.p1-x svg { width: 18px; height: 18px; }
.p1-one { margin-top: 12px; flex: none; }
.p1-one > b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p1-one > .cap { display: block; font-size: 15px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* search: the sheet at full height, the box and Cancel at its top, the keyboard below */
.p1-scrim { position: absolute; inset: 0; background: var(--panel); opacity: .55; }
.p1-full { top: 54px; }
.p1-full > .p1-qrow { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex: none; }
.p1-qrow > .qbox { flex: 1; min-width: 0; }
.p1-cancel { height: 44px; padding: 0 6px; font-size: 17px; color: var(--ink); flex: none; }
.p1-kb { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; height: 258px; padding: 8px 3px 0; background: var(--parchment-2); display: grid; grid-auto-rows: 42px; gap: 12px; align-content: start; }

/* understood chips and their picker (as approved in round 2) */

.p1-sheet .chip svg { width: 15px; height: 15px; }

.p1-sheet .chip svg.p1-chev { width: 12px; height: 12px; color: var(--ink-faint); margin: 0 -3px 0 -2px; }
.p1-sheet .chip.p1-on { background: var(--ink); color: var(--panel); }
.p1-sheet .chip.p1-on .k { color: var(--parchment-3); }

.p1-pick::before { content: ""; position: absolute; top: -6px; left: var(--ax, 40px); width: 12px; height: 12px; margin-left: -6px; background: var(--parchment-2); transform: rotate(45deg); border-radius: 2px; }

/* lists: two lines per row, no buttons in rows */
.p1-list { flex: 1; min-height: 0; overflow: hidden; margin: 0 -10px; padding: 0 10px; }
.mk-phone .row.p1-row { grid-template-columns: 32px 1fr; padding: 10px 0; min-height: 62px; }
.mk-phone .row.p1-row > * { min-width: 0; }

.mk-phone .row.p1-opt .ic { grid-row: 1 / 3; background: transparent; }
.mk-phone .row.p1-opt .t { font-size: 17px; font-weight: 600; }
.mk-phone .row.p1-opt .win { font-size: 15px; font-weight: 600; white-space: nowrap; }
.mk-phone .row.p1-opt .m { grid-column: 2 / 4; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p1-act { flex: none; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.p1-act .btn { height: 50px; flex: 1; font-size: 17px; }
.p1-act .btn.ghost { flex: none; }

/* the days, each with its length bar in its day colour */
.p1-day { position: relative; display: grid; grid-template-columns: 32px 1fr auto; column-gap: 10px; align-items: center; padding: 10px 0 14px; min-height: 66px; border-bottom: 1px solid var(--line); --dc: var(--ink); }
.p1-day .n { grid-row: 1 / 3; width: 26px; height: 26px; border-radius: 50%; background: var(--dc); color: var(--panel); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.p1-day .n.rest { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.p1-day .t { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.p1-day .m { grid-column: 2 / 4; font-size: 15px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the profile: full width, the days as coloured areas, a scrubber, the day ends on the baseline */

</style>
