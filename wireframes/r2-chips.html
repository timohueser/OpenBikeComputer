<style>
/* Editable chips and their pickers (round 2). Cropped panels: the phone sheet over a short map strip (390),
   the website's left panel (380). Only shared primitives plus these scoped rules. Prefix rc-. */
.rc-panel { height: auto; border-radius: 22px; box-shadow: none; border: 1px solid var(--line-strong); display: flex; flex-direction: column; }
.rc-panel::before { display: none; }
.rc-panel > .map { position: relative; inset: auto; flex: none; height: 64px; }
.rc-panel > .sheet { position: relative; margin-top: -14px; flex: 1; display: flex; flex-direction: column; padding: 0 16px 14px; }
.rc-panel .sheet > .qbox { margin-top: 10px; }
.rc-x { margin-left: auto; }
.rc-edited .typed { color: var(--ink-faint); }            /* the sentence is history once a chip was edited */

/* phone chips: neutral, 36 pt tall with an 8 pt gap = a 44 pt tap area; a chevron marks an editable chip */
.rc-panel .understood { gap: 8px; margin-top: 10px; }
.rc-panel .understood > .lbl { font-size: 13px; }
.rc-panel .chip { height: 36px; font-size: 15px; padding: 0 12px; border-radius: 18px; gap: 6px; }
.rc-panel .chip svg { width: 15px; height: 15px; }
.rc-panel .chip.what, .rc-panel .chip.where, .rc-panel .chip.filter { background: var(--parchment-2); color: var(--ink); border-color: transparent; }
.rc-panel .chip.off { background: transparent; }
.chip svg.rc-chev { width: 12px; height: 12px; color: var(--ink-faint); margin: 0 -3px 0 -2px; }
.rc-panel .chip.rc-on, .rc-web .chip.rc-on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip.rc-on .k { color: var(--parchment-3); }
.chip.rc-on svg.rc-chev { color: var(--parchment-3); transform: rotate(180deg); }

/* the picker: an inline block under the chip row, its arrow under the open chip (--ax = the chip's centre) */
.rc-pick { position: relative; margin-top: 10px; padding: 8px; border-radius: 14px; background: var(--parchment-2); display: grid; gap: 6px; }
.rc-pick::before { content: ""; position: absolute; top: -6px; left: var(--ax, 40px); width: 12px; height: 12px; margin-left: -6px;
  background: var(--parchment-2); transform: rotate(45deg); border-radius: 2px; }
.rc-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.rc-seg.two { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
.rc-seg > * { min-height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ink); border: 1px solid transparent; white-space: nowrap; }
.rc-seg > * > small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.rc-seg > .on { background: var(--panel); border-color: var(--line-strong); }
.rc-seg.rc-days { display: flex; overflow: hidden; }          /* scrolls sideways; the cut cell shows it */
.rc-days > * { flex: none; width: 60px; }
.rc-tg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.rc-tg > * { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
.rc-tg > * > i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: var(--panel); }
.rc-tg > .on > i { background: var(--ink); border-color: var(--ink); }
.rc-tg > * > small { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.rc-ck { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.rc-prow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); margin-top: 2px; }
.rc-prow > svg { width: 18px; height: 18px; color: var(--ink-soft); flex: none; }
.rc-prow > svg:last-child { margin-left: auto; color: var(--ink-faint); }
.rc-note { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 6px 0; font-size: 15px; line-height: 1.3; color: var(--ink-soft); border-top: 1px solid var(--line); margin-top: 2px; }
.rc-note > .btn { margin-left: auto; flex: none; }

/* the answer under the picker */
.rc-ans { margin-top: 12px; }
.rc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 0 6px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
.rc-head b { font-size: 15px; color: var(--ink); font-weight: 700; }
.rc-panel .row .t { font-size: 17px; }
.rc-panel .row .m { font-size: 15px; }
.rc-panel .row > *, .rc-web .row > * { min-width: 0; }              /* two lines per row at most: long names truncate */
.rc-panel .row .t, .rc-panel .row .m, .rc-web .row .t, .rc-web .row .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-r { font-size: 15px; color: var(--ink-soft); text-align: right; line-height: 1.3; max-width: 120px; }
.rc-dim { opacity: .5; }
.rc-bar { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.rc-bar > .btn { width: 100%; height: 50px; }
.rc-route-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 700; padding: 6px 0 2px; }
.rc-route-t small { font-size: 15px; font-weight: 400; color: var(--ink-soft); }
.rc-panel .ledger > dt, .rc-panel .ledger > dd { padding: 7px 0; font-size: 15px; }
.rc-quiet { padding: 8px 0 0; font-size: 15px; color: var(--ink-soft); }

/* website: the left panel; the picker is a popover under its chip, inside the panel, over the list */
.rc-web { width: 380px; height: 400px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.rc-web .understood { margin-top: 10px; position: relative; }
.rc-web .rc-r { font-size: 12.5px; max-width: 150px; }
.rc-pop { position: absolute; z-index: 3; top: calc(100% + 9px); left: 0; right: 0; padding: 6px; border-radius: 12px; background: var(--panel);
  border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); display: grid; gap: 4px; }
.rc-pop::before { content: ""; position: absolute; top: -6px; left: var(--ax, 40px); width: 10px; height: 10px; margin-left: -5px; background: var(--panel);
  border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); transform: rotate(45deg); }
.rc-pop .rc-seg > * { min-height: 40px; font-size: 13.5px; }
.rc-pop .rc-seg > * > small { font-size: 12px; }
.rc-pop .rc-seg > .on { background: var(--parchment-2); border-color: transparent; }
.rc-pop .rc-tg > * { min-height: 36px; font-size: 13.5px; }
.rc-pop .rc-tg > * > i { width: 18px; height: 18px; }
.rc-pop .rc-tg > * > small { font-size: 12px; }
.rc-web .chip .rc-xb { display: none; width: 16px; height: 16px; border-radius: 50%; margin: 0 -4px 0 0; place-items: center; background: var(--parchment-3); color: var(--ink); }
.rc-web .chip .rc-xb svg { width: 11px; height: 11px; }
.rc-web .chip.rc-hover { background: var(--parchment-2); border-color: var(--line-strong); color: var(--ink); }
.rc-web .chip.rc-hover .rc-xb { display: grid; }
.rc-cursor { position: absolute; z-index: 5; width: 14px; height: 18px; pointer-events: none; }
</style>
