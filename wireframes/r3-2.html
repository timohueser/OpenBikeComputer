<style>
/* P2 · Three views. Prefix p2-. A two-row navigation bar (the plan name, then Map | Profile | Days) switches three
   full-screen views. On the Map view the box is docked at the bottom edge, in thumb reach; after a search the
   answer takes its place there as a compact docked panel. Search is a full-screen state of its own. */
.p2 { --d1: #cc2a93; --d2: #2f6fb5; --d3: #3b8a3f; --d4: #5b2fb0; }   /* the app's day colours (no shared token yet) */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .p2 { --d1: #e45cb5; --d2: #6fa8e8; --d3: #6cc47a; --d4: #a070f0; } }
:root[data-theme="dark"] .p2 { --d1: #e45cb5; --d2: #6fa8e8; --d3: #6cc47a; --d4: #a070f0; }
.p2-c1 { --dc: var(--d1); } .p2-c2 { --dc: var(--d2); } .p2-c3 { --dc: var(--d3); } .p2-c4 { --dc: var(--d4); }

/* navigation bar: the name row, then the view switch */
.p2-nav { position: absolute; z-index: 6; top: 0; left: 0; right: 0; height: 150px; background: var(--panel); border-bottom: 1px solid var(--line); }
.p2-row { position: absolute; top: 59px; left: 4px; right: 4px; height: 44px; display: flex; align-items: center; }
.p2-ib { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); flex: none; }
.p2-ib svg { width: 22px; height: 22px; }
.p2-ib.off { opacity: .3; }
.p2-sp { flex: 1; }
.p2-title { position: absolute; left: 48px; right: 136px; top: 0; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.p2-seg { position: absolute; top: 107px; left: 16px; right: 16px; height: 36px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; padding: 2px; border-radius: 10px; background: var(--parchment-2); }
.p2-seg > span { display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--ink-soft); }
.p2-seg > .on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(28,27,20,.16); }

/* the map fills the view under the bar; the dock takes the bottom edge */
.p2-map { top: 150px; }
.p2-loc { position: absolute; z-index: 5; top: 162px; right: 16px; width: 44px; height: 44px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
.p2-loc svg { width: 20px; height: 20px; }
.p2-pm { font: 600 16px var(--ios); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.p2-pm.b { fill: var(--ink); font-weight: 700; }
.p2-pm.rt { fill: var(--route); }
.p2-pin text { font: 700 12px var(--ios); fill: #fff; text-anchor: middle; }

.p2-dock { z-index: 7; display: flex; flex-direction: column; padding: 0 16px 34px; overflow: hidden; }
.p2-dock > .grab { flex: none; }
.p2-rest { padding-top: 10px; gap: 8px; }
.p2-sum { font-size: 15px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p2-rest .qbox { flex: none; height: 50px; }

/* chips: neutral, 36 pt with an 8 pt gap; a chevron marks an editable chip; the open chip is ink */
.p2 .understood { gap: 8px; flex: none; }
.p2 .understood > .lbl { font-size: 13px; }
.p2 .chip { height: 36px; font-size: 15px; padding: 0 12px; border-radius: 18px; gap: 6px; background: var(--parchment-2); color: var(--ink); border-color: transparent; }
.p2 .chip svg { width: 15px; height: 15px; }
.p2 .chip .k { font-size: 14px; }
.p2 .chip svg.p2-chev { width: 12px; height: 12px; color: var(--ink-faint); margin: 0 -3px 0 -2px; }
.p2 .chip.p2-on { background: var(--ink); color: var(--panel); }
.p2 .chip.p2-on .k { color: var(--parchment-3); }
.p2 .chip.p2-on svg.p2-chev { color: var(--parchment-3); transform: rotate(180deg); }
.p2-req { margin-top: 8px; }
.p2-x { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; background: var(--parchment-2); color: var(--ink-soft); flex: none; }
.p2-x svg { width: 16px; height: 16px; }

/* the picker under its chip (round 2), the arrow at --ax */
.p2-pick { position: relative; flex: none; margin-top: 10px; padding: 8px; border-radius: 14px; background: var(--parchment-2); }
.p2-pick::before { content: ""; position: absolute; top: -6px; left: var(--ax, 40px); width: 12px; height: 12px; margin-left: -6px; background: var(--parchment-2); transform: rotate(45deg); border-radius: 2px; }
.p2-pseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.p2-pseg > * { min-height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ink); border: 1px solid transparent; white-space: nowrap; }
.p2-pseg > * > small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.p2-pseg > .on { background: var(--panel); border-color: var(--line-strong); }

/* the answer: a count line, rows, and the one action while a row is selected */
.p2-head { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 0 4px; font-size: 15px; color: var(--ink-soft); white-space: nowrap; }
.p2-head b { font-size: 17px; color: var(--ink); font-weight: 700; }
.p2-head span { overflow: hidden; text-overflow: ellipsis; }
.p2-sec { flex: none; padding: 14px 0 2px; font-size: 13px; font-weight: 600; color: var(--ink-faint); }
.p2-list { flex: none; margin: 0 -10px; padding: 0 10px; }
.p2 .row { min-height: 56px; padding: 8px 0; gap: 12px; }
.p2 .row > div { min-width: 0; }
.p2 .row .t { font-size: 17px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p2 .row .m { font-size: 15px; line-height: 1.3; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p2 .row > .ic svg { width: 17px; height: 17px; }
.p2 .row.p2-opt { grid-template-columns: 1fr; }
.p2-opt .t { display: flex; justify-content: space-between; gap: 10px; }
.p2-opt .t .p2-fig { font-size: 15px; font-weight: 500; flex: none; }
.p2-hrs { font-size: 15px; color: var(--ink-soft); white-space: nowrap; }
.p2-act { flex: none; padding-top: 8px; }
.p2-act > .btn { width: 100%; height: 50px; font-size: 17px; }

/* search: full screen, the box at the top, the keyboard low */
.p2-srch { position: absolute; inset: 0; background: var(--panel); display: flex; flex-direction: column; padding: 59px 16px 0; }
.p2-sbar { display: flex; align-items: center; gap: 4px; height: 44px; flex: none; }
.p2-sbar .qbox { flex: 1; }
.p2-cancel { height: 44px; padding: 0 4px 0 10px; font-size: 17px; color: var(--ink); flex: none; }
.p2-srch .understood { margin-top: 12px; }
.p2-kbd { position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; height: 270px; padding: 8px 3px 0; background: var(--parchment-2); display: grid; grid-auto-rows: 42px; row-gap: 11px; align-content: start; }
.p2-kbd > div { display: flex; justify-content: center; gap: 6px; }
.p2-kbd i { width: 33px; height: 42px; border-radius: 6px; background: var(--panel); box-shadow: 0 1px 0 var(--line-strong); font: 400 22px/42px var(--ios); font-style: normal; text-align: center; color: var(--ink); }
.p2-kbd i.w { width: 44px; font-size: 15px; background: var(--parchment-3); }
.p2-kbd i.sp { width: 180px; }

/* profile view: the map follows the scrubber; the whole trip in the day colours below it */
.p2-prof { position: absolute; z-index: 7; left: 0; right: 0; top: 470px; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px 0; }
.p2-read { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 600; white-space: nowrap; }
.p2-read .p2-alt { font-weight: 500; }
.p2-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--d4); margin-right: 7px; }
.p2-quiet { font-size: 15px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p2-pg { position: relative; margin-top: 12px; height: 216px; }
.p2-pg svg.prof { position: absolute; inset: 0; width: 100%; height: 100%; }
.p2-band { opacity: .4; }
.p2-pl { stroke: var(--ink); opacity: .55; stroke-width: 1.4; }
.p2-scrub { stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.p2-hend { stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.p2-sdot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 3px solid var(--ink); transform: translate(-50%, -50%); }
.p2-dn { position: absolute; bottom: 3px; font-size: 13px; font-weight: 700; }
.p2-pg .tick { bottom: 0; height: 18px; }
.p2-axis { position: relative; height: 34px; margin-top: 4px; }
.p2-hd { position: absolute; top: 0; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.p2-hd::before { content: ""; width: 8px; height: 12px; border-left: 2px solid var(--panel); border-right: 2px solid var(--panel); }
.p2-hl { position: absolute; top: 7px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }

/* days view: one list */
.p2-days { position: absolute; top: 150px; left: 0; right: 0; bottom: 0; overflow: hidden; padding: 0 16px; }
.p2-dh { padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
.p2-dh b { display: block; font-size: 17px; font-weight: 700; }
.p2-dh span { display: block; font-size: 15px; color: var(--ink-soft); margin-top: 2px; }
.p2-day { position: relative; display: grid; grid-template-columns: 32px 1fr auto; column-gap: 12px; align-items: start; min-height: 68px; padding: 10px 0 14px; border-bottom: 1px solid var(--line); }
.p2-day .n { width: 32px; height: 32px; border-radius: 50%; background: var(--dc); color: #fff; font-size: 15px; font-weight: 700; display: grid; place-items: center; }
.p2-day .n.rest { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.p2-day .t { font-size: 17px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p2-day .m { font-size: 15px; color: var(--ink-soft); line-height: 1.3; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p2-day .km { font-size: 15px; font-weight: 600; padding-top: 2px; }
.p2-day .bar { position: absolute; left: 44px; right: 0; bottom: 6px; height: 4px; }
.p2-day .bar i { display: block; height: 100%; border-radius: 2px; background: var(--dc); opacity: .7; }
</style>
