<style>
/* Query-box states in the grammar of direction D: map, then the sheet with the box on top, the
   profile strip, the answer, the one amber action at the bottom. Cropped phone panels, prefix dQ-. */
.dQ-panel { height: auto; min-height: 360px; border-radius: 22px; box-shadow: none; border: 1px solid var(--line-strong);
  display: flex; flex-direction: column; }
.dQ-panel::before { display: none; }
.dQ-panel > .map { position: relative; inset: auto; flex: none; height: 120px; }
.dQ-panel > .sheet { position: relative; margin-top: -14px; flex: 1; display: flex; flex-direction: column; padding: 0 16px 14px; }
.dQ-panel .sheet > .qbox { margin-top: 10px; }
.dQ-panel .understood { margin-top: 8px; }
.dQ-tail { font-size: 14px; color: var(--ink-faint); }                 /* words still being read: plain text, no chip */
.dQ-why { display: inline-block; text-decoration: none; }             /* the reason after a struck word stays readable */
.dQ-x { margin-left: auto; }

/* the profile strip: labels in HTML above the svg, ticks and day ends in % of km */
.dQ-strip { position: relative; margin-top: 12px; height: 56px; }
.dQ-strip.bands { height: 66px; }
.dQ-strip > svg.prof { position: absolute; left: 0; top: 16px; width: 100%; height: 40px; }
.dQ-strip > .band { position: absolute; left: 0; right: 0; bottom: 0; }
.dQ-lab { position: absolute; top: 0; font-size: 11px; line-height: 1; color: var(--ink-faint); white-space: nowrap; }
.dQ-lab.c { transform: translateX(-50%); }
.dQ-lab.r { transform: translateX(-100%); }
.dQ-lab.new { color: var(--ink); font-weight: 600; }
.dQ-strip > .tick { top: 20px; bottom: 0; margin-left: -1px; }
.dQ-strip.bands > .tick { bottom: 10px; }
.dQ-strip > .tick.sel::after { background: var(--amber); border-color: var(--ink); }
.dQ-end { position: absolute; top: 16px; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
.dQ-end::after { content: ""; position: absolute; left: -4px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.dQ-end.old { background: transparent; border-left: 2px dashed var(--ink-faint); opacity: .8; }
.dQ-end.old::after { background: var(--panel); border: 2px solid var(--ink-faint); width: 6px; height: 6px; }
.dQ-end.new { background: var(--amber); }
.dQ-end.new::after { background: var(--amber); border: 2px solid var(--ink); width: 8px; height: 8px; left: -5px; }
.dQ-strip.bands > .dQ-end { bottom: 10px; }

/* answers */
.dQ-ans { margin-top: 10px; }
.dQ-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 0 6px;
  border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
.dQ-head b { font-size: 15px; color: var(--ink); font-weight: 700; }
.dQ-r > .ic { grid-row: 1 / span 2; }
.dQ-r > .t { align-self: start; }
.dQ-hrs { grid-column: 3; grid-row: 1; max-width: 170px; text-align: right; font-size: 12.5px; line-height: 1.3; color: var(--ink-soft); align-self: start; padding-top: 2px; }
.dQ-meta { grid-column: 2 / -1; }
.dQ-dim { opacity: .5; }
.dQ-note { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 15px; color: var(--ink-soft); }
.dQ-note > svg { width: 18px; height: 18px; flex: none; color: var(--ink-faint); }
.dQ-note > .btn { margin-left: auto; }
.dQ-note.quiet { padding: 6px 0 0; font-size: 13px; }
.dQ-bar { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.dQ-bar > .primary { flex: 1; }
.dQ-bar > .ghost { padding: 0 8px; }

.dQ-place .n { font-size: 20px; font-weight: 700; line-height: 1.2; }
.dQ-place .k { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
.dQ-place .w { font-size: 15px; margin-top: 6px; }
.dQ-place .acts { display: flex; gap: 8px; margin-top: 10px; }
.dQ-place .other { margin-top: 12px; }

.dQ-route .t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 16px; font-weight: 700; }
.dQ-route .t small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.dQ-route .ledger { margin-top: 6px; }
.dQ-route .ledger > dt, .dQ-route .ledger > dd { padding: 5px 0; }

.dQ-diff { display: grid; grid-template-columns: 52px 1fr 1fr; row-gap: 8px; margin-top: 4px; font-variant-numeric: tabular-nums; align-items: baseline; }
.dQ-diff .d { font-weight: 700; }
.dQ-diff .b { color: var(--ink-faint); }
.dQ-diff .ar { color: var(--ink-faint); padding: 0 4px; }
.dQ-diff .a { font-weight: 700; }

/* the keyboard, drawn low: it shows where the box sits when the rider types */
.dQ-kbd { margin: 14px -16px -14px; padding: 8px 3px 10px; background: var(--parchment-2); display: grid; gap: 7px; }
.dQ-kbd > div { display: flex; justify-content: center; gap: 5px; }
.dQ-kbd i { width: 33px; height: 36px; border-radius: 5px; background: var(--panel); box-shadow: 0 1px 0 var(--line-strong);
  font: 400 16px/36px var(--ios); font-style: normal; text-align: center; color: var(--ink); }
.dQ-kbd i.w { width: 44px; font-size: 12px; background: var(--parchment-3); }
.dQ-kbd i.sp { width: 184px; }

/* the website's left panel: same content, actions inline for the mouse */
.dQ-web { width: 380px; height: 640px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.dQ-web .understood { margin-top: 10px; }
.dQ-web .dQ-hrs { font-size: 12.5px; }
.dQ-acts { display: none; grid-column: 2 / -1; gap: 6px; padding-top: 2px; }
.dQ-web .row.sel > .dQ-acts, .dQ-web .row.dQ-hover > .dQ-acts { display: flex; }
.dQ-web .row.dQ-hover { background: var(--parchment-2); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; border-color: transparent; }
.dQ-cursor { position: absolute; width: 14px; height: 18px; pointer-events: none; }
.dQ-web .dQ-bar { margin-top: 12px; }
.dQ-web .dQ-bar > .primary { flex: none; margin-left: auto; }
</style>
