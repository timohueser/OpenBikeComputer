<style>
/* Direction P3 · the map, a profile strip docked at the bottom, a tool bar in thumb reach. Prefix p3-.
   The bottom dock holds one thing at a time: the strip at rest, the compact answer, or the days. */
.p3 { --p3-d1: #CC2A93; --p3-d2: #2F6FB5; --p3-d3: #3B8A3F; --p3-d4: #5B2FB0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .p3 { --p3-d1: #E45CB5; --p3-d2: #6FA8E8; --p3-d3: #6CC47A; --p3-d4: #A070F0; } }
:root[data-theme="dark"] .p3 { --p3-d1: #E45CB5; --p3-d2: #6FA8E8; --p3-d3: #6CC47A; --p3-d4: #A070F0; }

/* navigation bar: Back, the plan name, Undo; nothing else */
.p3-nav { position: absolute; z-index: 6; left: 0; right: 0; top: 0; height: 98px; background: var(--panel); border-bottom: 1px solid var(--line); }
.p3-nav .p3-ttl { position: absolute; left: 84px; right: 84px; top: 54px; height: 44px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p3-nb { position: absolute; top: 54px; height: 44px; min-width: 44px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center;
  gap: 1px; font-size: 17px; color: var(--ink); }
.p3-nb svg { width: 22px; height: 22px; }

/* the map fills what the dock leaves; two small controls sit on it */
.p3-ctl { position: absolute; z-index: 5; right: 12px; top: 110px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.p3-ctl button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
.p3-ctl button + button { border-top: 1px solid var(--line); }
.p3-ctl svg { width: 20px; height: 20px; }
.p3-mt { font: 600 13px var(--ios); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.p3-mt.b { fill: var(--ink); font-weight: 700; }
.p3-de text { font: 700 20px var(--ios); fill: var(--panel); text-anchor: middle; }

/* the tool bar: three labelled 44 pt targets; a lit item names the open state */
.p3-bar { position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; height: 83px; padding: 3px 20px 34px; background: var(--panel); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr); }
.p3-bar > button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.p3-bar > button > i { width: 48px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.p3-bar svg { width: 24px; height: 24px; }
.p3-bar > .on { color: var(--ink); }
.p3-bar > .on > i { background: var(--parchment-2); }

/* the dock above the tool bar */
.p3-dock { z-index: 7; bottom: 83px; padding: 0 16px; display: flex; flex-direction: column; overflow: hidden; }
.p3-dock > .grab { flex: none; margin-top: 6px; }
.p3-fade { mask-image: linear-gradient(to bottom, black calc(100% - 48px), transparent calc(100% - 8px)); }

/* the strip: one summary line, the profile, the day numbers */
.p3-sh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.p3-sh .cap { font-size: 13px; font-weight: 400; }
.p3-prof { position: relative; margin-top: 4px; }
.p3-prof svg.prof { display: block; width: 100%; height: 46px; }
.p3-band { opacity: .16; }
.p3-closed { fill: var(--coral); opacity: .28; }
.p3-nums { position: relative; height: 18px; }
.p3-nums b { position: absolute; transform: translateX(-50%); top: 3px; font-size: 13px; line-height: 1; font-weight: 700; color: var(--p3-c, var(--ink-soft)); }

/* the full profile: a two-line header, the profile with its scrubber and handles, the bands */
.p3-ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 8px; }
.p3-ph .t { font-size: 17px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.p3-ph .m { font-size: 15px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; }
.p3-lnk { flex: none; height: 44px; margin-top: -8px; padding: 0 4px; font-size: 15px; font-weight: 600; color: var(--ink-soft); display: inline-flex; align-items: center; }
.p3-pg { display: grid; grid-template-columns: 62px 1fr; column-gap: 8px; row-gap: 6px; align-items: center; margin-top: 10px; }
.p3-pl { font-size: 13px; color: var(--ink-faint); white-space: nowrap; text-align: right; }
.p3-ax { position: relative; align-self: stretch; }
.p3-ax span { position: absolute; right: 0; transform: translateY(-50%); }
.p3-pg .p3-prof { margin: 0; }
.p3-pg .p3-prof svg.prof { height: 150px; }
.p3-pg .band { height: 10px; }
.p3-scrub { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
.p3-scrub::after { content: ""; position: absolute; left: -6px; top: var(--y); width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; box-sizing: border-box;
  background: var(--ink); border: 2.5px solid var(--panel); }
.p3-read { position: absolute; top: 6px; font-size: 13px; font-weight: 600; line-height: 1; padding: 5px 7px; border-radius: 6px; background: var(--ink); color: var(--panel); white-space: nowrap; }
.p3-dend { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: var(--p3-c, var(--ink)); border: 2.5px solid var(--panel);
  box-shadow: 0 1px 3px rgba(0,0,0,.25); display: grid; place-items: center; color: var(--panel); }
.p3-dend svg { width: 15px; height: 15px; }
.p3-dend.sm { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-width: 2px; box-shadow: none; }

/* search, full screen: the box with Cancel on top, the chips, the live answer, the keyboard */
.p3-top { position: absolute; z-index: 6; left: 0; right: 0; top: 0; height: 108px; padding: 54px 16px 0; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; }
.p3-top .qbox { flex: 1; min-width: 0; }
.p3-cancel { flex: none; height: 44px; font-size: 17px; color: var(--ink); }
.p3-full { position: absolute; left: 0; right: 0; top: 108px; bottom: 250px; padding: 0 16px; background: var(--panel); overflow: hidden; }
.p3-kbd { position: absolute; z-index: 9; left: 0; right: 0; bottom: 0; height: 250px; padding: 10px 3px 0; background: var(--parchment-2); display: grid; grid-auto-rows: 42px; align-content: start; gap: 8px; }
.p3-kbd > div { display: flex; justify-content: center; gap: 6px; }
.p3-kbd i { width: 32px; height: 42px; border-radius: 6px; background: var(--panel); box-shadow: 0 1px 0 var(--line-strong); font: 400 20px/42px var(--ios); font-style: normal; text-align: center; color: var(--ink); }
.p3-kbd i.w { width: 44px; font-size: 14px; background: var(--parchment-3); }
.p3-kbd i.sp { width: 180px; }
.p3-kbd i.go { width: 88px; font-size: 15px; background: var(--ink); color: var(--panel); }

/* the chips and their pickers, as approved in round 2 (r2-chips): neutral, 36 pt on a 44 pt pitch, a chevron marks an editable chip */
.p3 .understood { gap: 8px; margin-top: 10px; flex: none; }
.p3 .understood > .lbl { font-size: 13px; }
.p3 .chip { height: 36px; font-size: 15px; padding: 0 12px; border-radius: 18px; gap: 6px; }
.p3 .chip svg { width: 15px; height: 15px; }
.p3 .chip.what, .p3 .chip.where, .p3 .chip.filter { background: var(--parchment-2); color: var(--ink); border-color: transparent; }
.p3 .chip svg.p3-chev { width: 12px; height: 12px; color: var(--ink-faint); margin: 0 -3px 0 -2px; }
.p3 .chip.p3-on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.p3 .chip.p3-on .k { color: var(--parchment-3); }
.p3 .chip.p3-on svg.p3-chev { color: var(--parchment-3); transform: rotate(180deg); }
.p3-pick { position: relative; flex: none; margin-top: 10px; padding: 8px; border-radius: 14px; background: var(--parchment-2); display: grid; gap: 6px; }
.p3-pick::before { content: ""; position: absolute; top: -6px; left: var(--ax, 40px); width: 12px; height: 12px; margin-left: -6px; background: var(--parchment-2); transform: rotate(45deg); border-radius: 2px; }
.p3-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.p3-seg > * { min-height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ink); border: 1px solid transparent; white-space: nowrap; }
.p3-seg > * > small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.p3-seg > .on { background: var(--panel); border-color: var(--line-strong); }

/* the answer: a head line, rows of two lines, the selected row with its one compact action */
.p3-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 0 6px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); white-space: nowrap; flex: none; }
.p3-head b { font-size: 15px; color: var(--ink); font-weight: 700; }
.p3 .row { padding: 9px 0; min-height: 60px; }
.p3 .row > * { min-width: 0; }
.p3 .row .t { font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p3 .row .m { font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p3 .row > .ic { width: 32px; height: 32px; }
.p3 .row > .ic svg { width: 16px; height: 16px; }
.p3 .row .r { font-size: 15px; color: var(--ink-soft); text-align: right; }
.p3 .row .r svg { width: 20px; height: 20px; color: var(--ink-faint); }
.p3-sel { background: var(--amber-soft); border-radius: 12px; margin: 2px -10px 0; padding: 0 10px 10px; flex: none; }
.p3-sel > .row { border-bottom: 0; }
.p3-act { display: flex; padding-left: 42px; }
.p3-act .btn { height: 44px; font-size: 16px; }
.p3-opt { grid-template-columns: 32px 1fr auto; }
.p3-opt > .ic { grid-row: 1 / span 2; background: transparent; }
.p3-opt > .fig { font-size: 15px; font-weight: 600; white-space: nowrap; }
.p3-opt > .m { grid-column: 2 / 4; margin-top: -2px; }

/* the days: number disc and length bar in the day colour, two lines of text */
.p3-dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 8px; padding-bottom: 4px; flex: none; }
.p3-dh .t { font-size: 17px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.p3-dh .m { font-size: 15px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; }
.p3-ib { flex: none; width: 44px; height: 44px; margin: -8px -8px 0 0; display: grid; place-items: center; color: var(--ink-soft); }
.p3-ib svg { width: 22px; height: 22px; }
.p3-day { position: relative; display: grid; grid-template-columns: 30px 1fr auto; column-gap: 10px; align-items: start; padding: 9px 0 13px; border-bottom: 1px solid var(--line); }
.p3-day .n { grid-row: 1 / 3; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; background: var(--p3-c, var(--ink)); color: var(--panel); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.p3-day.rest .n { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.p3-day .t { font-size: 17px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.p3-day .km { font-size: 15px; color: var(--ink-soft); padding-top: 2px; }
.p3-day .m { grid-column: 2 / 4; font-size: 15px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p3-day .bar { position: absolute; left: 40px; bottom: 5px; height: 4px; border-radius: 2px; background: var(--p3-c); opacity: .75; }

/* landscape: the phone turned, the profile alone, full width */
.p3-land.mk-phone { width: 844px; height: 390px; background: var(--panel); }
.p3-land.mk-phone::before { top: 50%; left: 11px; width: 36px; height: 124px; margin: -62px 0 0 0; }

.p3-lg { position: absolute; left: 72px; right: 40px; top: 54px; bottom: 30px; display: grid; grid-template-columns: 74px 1fr; grid-template-rows: 1fr 18px 12px 12px; column-gap: 10px; row-gap: 8px; align-items: center; }
.p3-lg .p3-prof { margin: 0; align-self: stretch; height: 100%; }

</style>
