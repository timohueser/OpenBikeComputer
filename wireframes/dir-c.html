<style>
/* Direction C · query first: one box drives it. Scoped with dC-. */

/* website corners */
.dC-corner-l { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; align-items: center; z-index: 3; }
.dC-corner-r { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 3; }
.dC-rail { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; width: 172px; }
.dC-rail button { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px;
  font-size: 13px; font-weight: 500; color: var(--ink-soft); text-align: left; }
.dC-rail button svg { width: 16px; height: 16px; flex: none; }
.dC-rail hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* the box column: box card, then the answer card */
.dC-col { position: absolute; left: 360px; top: 16px; width: 560px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.dC-boxcard { padding: 10px; }
.dC-boxcard .understood { margin-top: 9px; padding: 0 2px; }
.dC-ans { padding: 12px 14px 8px; }
.dC-ans-h { display: flex; align-items: baseline; gap: 8px; padding-bottom: 4px; }
.dC-ans-h .h { font-size: 14.5px; }
.dC-ans-h .cap { flex: 1; }
.dC-ans-h .btn.icon { align-self: center; }
.dC-ans .row { padding: 8px 0; }
.dC-ans .row:last-child { border-bottom: 0; }
.dC-ans .row .m { margin-top: 1px; }
.dC-ans .row.sel { margin: 2px -10px; }
.dC-ans .ic.n { font: 700 12px var(--sans); background: var(--panel); border: 2px solid var(--route); color: var(--ink); }
.dC-ans .row.sel .ic.n { background: var(--amber); border-color: var(--ink); }
.dC-acts { display: flex; gap: 6px; margin-top: 8px; }
.dC-sub { font-size: 12px; color: var(--ink-faint); padding: 10px 0 2px; }

/* the plan bar */
.dC-planbar { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--panel); border-top: 1px solid var(--line-strong);
  display: flex; align-items: center; gap: 14px; padding: 0 8px 0 16px; z-index: 3; }
.dC-trip { width: 232px; flex: none; }
.dC-trip .h { font-size: 14px; line-height: 1.2; white-space: nowrap; }
.dC-trip .cap { white-space: nowrap; }
.dC-days { flex: 1; min-width: 0; display: flex; gap: 2px; height: 30px; }
.dC-days > i { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; overflow: hidden; border-radius: 5px;
  background: var(--parchment-2); font: 11.5px var(--sans); color: var(--ink-soft); white-space: nowrap; }
.dC-days > i b { color: var(--ink); font-weight: 700; }
.dC-days > i.sel { background: var(--amber); color: var(--on-amber); }
.dC-days > i.sel b { color: var(--on-amber); }
.dC-days > i.rest { flex: none; width: 22px; }
.dC-sum { flex: none; text-align: right; line-height: 1.25; }
.dC-sum .h { font-size: 13.5px; }
.dC-sum .cap { display: block; }
.dC-planbar .btn.ghost svg { transform: rotate(180deg); }

/* map marks (svg, map units) */
.dC-mday { fill: var(--ink); stroke: var(--panel); stroke-width: 2; }
.dC-mres { fill: var(--panel); stroke: var(--route); stroke-width: 2; }
.dC-mres.sel { fill: var(--amber); stroke: var(--ink); }
.dC-mn { font: 700 10px var(--sans); text-anchor: middle; fill: var(--ink); }
.dC-ml { font: 600 10px var(--sans); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.dC-ml.alt { font-weight: 500; fill: var(--ink-faint); }
.dC-ring { fill: none; stroke: var(--ink-faint); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .6; }
.dC-here { fill: var(--navy); stroke: var(--panel); stroke-width: 2.5; }
.dC-dest { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }

/* phone */
.dC-pill { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); height: 36px; padding: 0 12px 0 14px; border-radius: 18px;
  background: var(--panel); box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; z-index: 3; }
.dC-pill b { font-weight: 700; }
.dC-pill svg { width: 16px; height: 16px; color: var(--ink-faint); }
.dC-more { position: absolute; top: 58px; right: 14px; width: 36px; height: 36px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow);
  display: grid; place-items: center; z-index: 3; }
.dC-more svg { width: 18px; height: 18px; }
.dC-boxp { padding: 10px 12px 30px; z-index: 4; }
.dC-boxp .understood { margin-bottom: 8px; }
.dC-pcard { position: absolute; left: 12px; right: 12px; padding: 14px 14px 14px; border-radius: 16px; z-index: 4; }
.dC-pcard .dC-ans-h { padding-bottom: 6px; }
.dC-pcard .row:last-of-type { border-bottom: 0; }
.dC-pcard .row .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.dC-pcard .row .t .dC-fig { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.dC-pcard .row .t > b { font-weight: 600; white-space: nowrap; }
.dC-pcard .row .m { margin-top: 2px; }
.dC-pcard .row.sel { margin: 0 -8px; padding-left: 8px; padding-right: 8px; }
.dC-pcard .btn.primary { width: 100%; margin-top: 12px; }
.dC-pcard .ic.on { background: var(--amber); color: var(--on-amber); }
.dC-req .row { padding: 8px 0; }
.dC-req .row .t { font-weight: 600; }
.dC-req .row .t span { font-weight: 400; color: var(--ink-soft); }
.dC-sheet { padding: 0 16px 8px; z-index: 4; }
.dC-sheet .qbox { margin-top: 8px; }

/* a plain keyboard, drawn only to show what the box leaves to the map */
.dC-kbd { position: absolute; left: 0; right: 0; bottom: 0; height: 291px; background: var(--parchment-2); border-top: 1px solid var(--line); padding: 8px 3px 0; z-index: 5; font-family: var(--ios); }
.dC-kbd .r { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
.dC-kbd .r span { width: 33px; height: 42px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center;
  font-size: 20px; color: var(--ink); }
.dC-kbd .r span.w { width: 42px; background: var(--parchment-3); font-size: 14px; }
.dC-kbd .r span.f { width: 87px; background: var(--parchment-3); font-size: 15px; }
.dC-kbd .r span.sp { width: 182px; font-size: 15px; }
</style>
