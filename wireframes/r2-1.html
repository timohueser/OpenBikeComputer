<style>
/* Direction R1 · classic box, editable answer. Prefix r1-.
   The box is a plain search field. The understood chips under it are buttons: each opens a small
   picker for its part of the request. Website: the structure of direction A, nothing over the map
   but small controls; the profile panel is docked along the bottom. Phone: full-screen map, one
   sheet, the box at the top of the sheet, one amber action at the bottom. */

/* ---- website ---- */
.r1-app { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 52px 1fr; height: 770px; }
.r1-bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.r1-bar > * { white-space: nowrap; }
.r1-brand { font-weight: 800; font-size: 15px; letter-spacing: .01em; }
.r1-plan { font-weight: 600; padding-left: 14px; border-left: 1px solid var(--line-strong); }
.r1-dates { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); font-size: 13px; }
.r1-dates svg { width: 14px; height: 14px; }
.r1-tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.r1-tools .r1-sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 6px; }
.r1-tools .btn.ghost { padding: 0 7px; }

.r1-panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.r1-q { position: relative; z-index: 3; padding: 12px 16px 10px; }
.r1-q .understood { margin-top: 10px; row-gap: 8px; }

/* an editable chip: a button with a chevron; the open one carries its picker */
.r1-cw { position: relative; display: inline-flex; }
.r1-chip { cursor: pointer; }
.r1-chip .r1-cv { width: 11px; height: 11px; margin-left: 1px; color: var(--ink-faint); }
.r1-chip.open { background: var(--panel); border-color: var(--ink); color: var(--ink); }
.r1-pop { position: absolute; z-index: 6; top: calc(100% + 7px); left: 0; width: 150px; padding: 6px; border-radius: 10px;
  background: var(--panel); box-shadow: var(--shadow-lg); }
.r1-pop::before { content: ""; position: absolute; top: -5px; left: 16px; width: 10px; height: 10px; background: var(--panel); transform: rotate(45deg); }
.r1-opt { display: flex; align-items: center; width: 100%; height: 32px; padding: 0 10px; border-radius: 6px; font-size: 13.5px; text-align: left; }
.r1-opt.on { font-weight: 700; background: var(--parchment-2); }
.r1-opt svg { width: 14px; height: 14px; margin-left: auto; }

.r1-back { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 4px 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.r1-list { flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; }
.r1-sec { padding: 12px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.r1-list .row { grid-template-columns: 28px 1fr; }
.r1-m { display: flex; justify-content: space-between; gap: 10px; }
.r1-m .m { white-space: nowrap; }
.r1-acts { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.r1-foot { border-top: 1px solid var(--line); padding: 8px 16px 10px; display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 2px; }
.r1-preset { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.r1-preset svg { width: 16px; height: 16px; color: var(--ink-soft); }

.r1-mapcol { position: relative; min-width: 0; }
.r1-mapcol > .map { bottom: 158px; }
.r1-mt { font: 600 13px var(--sans); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.r1-mt.rt { fill: var(--route); }
.r1-mt.b { fill: var(--ink); font-weight: 700; }
.r1-ctl { position: absolute; right: 12px; bottom: 170px; display: flex; flex-direction: column; gap: 6px; }
.r1-ctl > div { display: flex; flex-direction: column; background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); }
.r1-ctl button { width: 34px; height: 32px; display: grid; place-items: center; color: var(--ink); }
.r1-ctl button + button { border-top: 1px solid var(--line); }
.r1-ctl svg { width: 16px; height: 16px; }

.r1-prof { position: absolute; left: 0; right: 0; bottom: 0; height: 158px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.r1-ph { display: flex; align-items: center; gap: 10px; height: 24px; }
.r1-ph .h { font-size: 13px; }
.r1-ph .r1-right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.r1-pg { display: grid; grid-template-columns: 52px 1fr; column-gap: 8px; row-gap: 4px; align-items: center; margin-top: 6px; }
.r1-pl { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.r1-days { position: relative; height: 14px; }
.r1-days b { position: absolute; transform: translateX(-50%); font: 600 11px var(--sans); color: var(--ink-soft); }
.r1-days b.sel { color: var(--ink); }
.r1-prof .tick { bottom: 0; height: 20px; }

/* ---- phone ---- */
.r1-nav { position: absolute; z-index: 20; left: 0; right: 0; top: 0; height: 98px; padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border-bottom: 1px solid var(--line); }
.r1-nb { display: inline-flex; align-items: center; gap: 2px; height: 44px; min-width: 44px; padding: 0 6px; font-size: 17px; color: var(--ink); }
.r1-nb svg { width: 22px; height: 22px; }
.r1-nb.icon { width: 44px; padding: 0; justify-content: center; }
.r1-nb.dis { opacity: .35; }
.r1-nr { display: flex; }
.r1-title { position: absolute; left: 96px; right: 96px; top: 54px; height: 44px; line-height: 44px; text-align: center; font-weight: 600; font-size: 17px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r1-attr { bottom: auto; }

.r1-sheet { padding: 0 16px; display: flex; flex-direction: column; }
.r1-sheet > .qbox { margin-top: 10px; flex: none; }
.r1-x { width: 44px; height: 44px; margin-right: -14px; display: grid; place-items: center; color: var(--ink-faint); flex: none; }
.r1-x svg { width: 18px; height: 18px; }
.r1-sheet .understood { margin-top: 10px; gap: 8px; }
.r1-sheet .understood > .lbl { flex-basis: 100%; font-size: 13px; margin: 0 0 -2px; }
.mk-phone .chip.r1-chip { height: 44px; border-radius: 22px; padding: 0 14px; font-size: 15px; gap: 6px; background: var(--parchment-2); color: var(--ink); border-color: transparent; }
.mk-phone .chip.r1-chip svg { width: 16px; height: 16px; }
.mk-phone .chip.r1-chip .r1-cv { width: 14px; height: 14px; color: var(--ink-faint); }
.mk-phone .chip.r1-chip .k { color: var(--ink-soft); }

.r1-body { flex: 1; min-height: 0; overflow: hidden; }
.r1-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink-soft); white-space: nowrap; }
.r1-note { display: flex; align-items: center; gap: 6px; padding-top: 6px; font-size: 13px; color: var(--ink-faint); }
.r1-note svg { width: 15px; height: 15px; }
.r1-head b { font-size: 17px; color: var(--ink); font-weight: 700; }
.r1-sum { margin-top: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.r1-sum b { display: block; font-size: 17px; }
.r1-sum .cap { font-size: 15px; }
.mk-phone .row.r1-prow { grid-template-columns: 32px 1fr; padding-top: 11px; padding-bottom: 11px; min-height: 66px; }
.mk-phone .row.r1-prow.sel { padding-left: 10px; padding-right: 10px; }
.mk-phone .row.r1-prow .t { font-size: 17px; font-weight: 600; }
.mk-phone .row.r1-prow .m { font-size: 15px; margin-top: 2px; }
.mk-phone .row.r1-more { grid-template-columns: 32px 1fr auto; min-height: 56px; }
.mk-phone .row.r1-more > svg { width: 20px; height: 20px; color: var(--ink-faint); }
.mk-phone .row.r1-orow { grid-template-columns: 32px 1fr auto; min-height: 62px; }
.mk-phone .row.r1-orow .ic { grid-row: 1 / 3; background: transparent; }
.mk-phone .row.r1-orow .win { font-size: 15px; font-weight: 600; white-space: nowrap; }
.mk-phone .row.r1-orow .m { grid-column: 2 / 4; margin-top: -3px; }

.r1-day { position: relative; display: grid; grid-template-columns: 32px 1fr auto; column-gap: 10px; align-items: center; padding: 10px 0 13px; min-height: 66px; border-bottom: 1px solid var(--line); }
.r1-day .n { grid-row: 1 / 3; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.r1-day .n.rest { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.r1-day .t { font-size: 17px; font-weight: 600; }
.r1-day .m { grid-column: 2 / 4; font-size: 15px; color: var(--ink-soft); }
.r1-day .km { font-size: 15px; font-weight: 600; }
.r1-day .bar { position: absolute; left: 42px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--route); opacity: .45; }

.r1-pin { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 10px 16px 34px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.r1-pin .btn { height: 50px; flex: 1; font-size: 17px; }
.r1-pin .btn.ghost { flex: none; }
</style>
