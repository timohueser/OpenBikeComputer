<style>
/* Direction A · map first. Prefix dA-. */
.dA-app { display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 52px 1fr; height: 770px; }
.dA-bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.dA-brand { font-weight: 800; font-size: 15px; letter-spacing: .01em; }
.dA-plan { font-weight: 600; padding-left: 14px; border-left: 1px solid var(--line-strong); }
.dA-dates { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); font-size: 13px; }
.dA-dates svg { width: 14px; height: 14px; }
.dA-tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.dA-tools .dA-sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 6px; }

.dA-panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.dA-q { padding: 12px 16px 10px; }
.dA-q .understood { margin-top: 10px; }
.dA-back { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 4px 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dA-list { flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; }
.dA-sec { padding: 10px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.dA-acts { grid-column: 2 / 4; display: flex; gap: 8px; padding-top: 4px; }
.dA-foot { border-top: 1px solid var(--line); padding: 8px 16px 10px; display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 2px; }
.dA-foot .dA-preset { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.dA-foot .dA-preset svg { width: 16px; height: 16px; color: var(--ink-soft); }

.dA-mapcol { position: relative; min-width: 0; }
.dA-mt { font: 600 13px var(--sans); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.dA-mt.rt { fill: var(--route); }
.dA-ctl { position: absolute; right: 12px; bottom: 174px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.dA-ctl .dA-zoom { display: flex; flex-direction: column; gap: 0; background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); }
.dA-ctl .dA-zoom button { width: 34px; height: 32px; display: grid; place-items: center; }
.dA-ctl .dA-zoom button + button { border-top: 1px solid var(--line); }
.dA-ctl .dA-zoom svg { width: 16px; height: 16px; }
.dA-layers { width: 214px; padding: 6px 12px; }
.dA-lrow { display: flex; align-items: center; gap: 8px; height: 32px; font-size: 13px; font-weight: 600; }
.dA-lrow .cap { font-weight: 400; }
.dA-sw { margin-left: auto; width: 30px; height: 18px; border-radius: 9px; background: var(--parchment-3); position: relative; flex: none; }
.dA-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); }
.dA-sw.on { background: var(--ink); }
.dA-sw.on::after { left: 14px; }

.dA-prof { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 150px; padding: 8px 12px; }
.dA-ph { display: flex; align-items: center; gap: 10px; height: 24px; }
.dA-ph .h { font-size: 13px; }
.dA-ph .dA-right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.dA-pg { display: grid; grid-template-columns: 52px 1fr; column-gap: 8px; row-gap: 4px; align-items: center; margin-top: 6px; }
.dA-pl { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.dA-days { position: relative; height: 14px; }
.dA-days b { position: absolute; transform: translateX(-50%); font: 600 11px var(--sans); color: var(--ink-soft); }
.dA-days b.sel { color: var(--ink); }
.dA-prof .tick { bottom: 0; height: 20px; }

/* phone */
.dA-top { position: absolute; z-index: 5; left: 16px; right: 16px; top: 58px; padding: 8px; }
.dA-top .understood { margin: 8px 2px 2px; }
.dA-clear { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-faint); flex: none; }
.dA-clear svg { width: 16px; height: 16px; }
.dA-sheet { padding: 0 16px; }
.dA-shead { padding: 10px 0 2px; }
.dA-shead .h { font-size: 17px; }
.dA-shead .cap { font-size: 13px; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.dA-shead .cap svg { width: 13px; height: 13px; }
.dA-more { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.dA-more .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-soft); }
.dA-more .ic svg { width: 16px; height: 16px; }
.dA-more > svg { width: 18px; height: 18px; color: var(--ink-faint); }
.dA-pts { padding: 4px 0 0; }
.dA-pt { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; height: 34px; }
.dA-pt .ic { width: 32px; height: 32px; display: grid; place-items: center; }
.dA-pt .ic svg { width: 18px; height: 18px; }
.dA-pt .t { font-weight: 600; }
.dA-pt .t .cap { font-weight: 400; font-size: 13px; margin-left: 6px; }
.dA-mode { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; height: 18px; }
.dA-mode .dA-vline { width: 2px; height: 18px; margin: 0 auto; background: var(--line-strong); border-radius: 1px; }
.dA-mode .seg > * { height: 20px; padding: 0 7px; font-size: 11.5px; }
.dA-preset { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.dA-preset svg { width: 15px; height: 15px; }
.dA-pstrip { margin: 6px 0 2px; }
.dA-pstrip .strip { border-radius: 8px; overflow: hidden; }
.dA-pstrip .band { margin-top: 4px; }
.dA-plabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
.mk-phone .dA-opt { padding: 8px 0; }
.mk-phone .dA-opt .t { font-size: 15px; white-space: nowrap; }
.dA-opt .num { font-size: 13px; font-weight: 600; }
.dA-opt .m { grid-column: 2 / 4; margin-top: -4px; }
.dA-send { margin-top: 8px; width: 100%; }
</style>
