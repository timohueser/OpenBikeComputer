<style>
/* Direction D · map and strip, point or type. Scoped with dD-. */
.dD-app{position:absolute;inset:0;display:grid;grid-template-rows:52px 1fr;grid-template-columns:380px 1fr}
.dD-bar{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:4}
.dD-bar .brand{font-weight:800;font-size:15px;margin-right:12px;letter-spacing:-.01em}
.dD-bar .plan{font-weight:600;margin-right:2px}
.dD-bar .sp{flex:1}
.dD-bar .btn.ghost{padding:0 8px}
.dD-bar .btn.primary{margin-left:6px}
.dD-panel{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);z-index:3}
.dD-panel>.top{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.dD-panel>.body{flex:1;min-height:0;overflow:hidden;padding:2px 14px 0}
.dD-panel>.foot{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line)}
.dD-panel .understood{margin-top:10px}
.dD-also{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.dD-also .lbl{font-size:12px;color:var(--ink-faint);margin-right:2px}
.dD-sum{display:flex;flex-direction:column;gap:2px;padding:10px 0 6px;border-bottom:1px solid var(--line)}
.dD-day{position:relative;display:grid;grid-template-columns:24px 1fr auto;column-gap:10px;align-items:center;padding:7px 0 9px;border-bottom:1px solid var(--line)}
.dD-day .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center}
.dD-day .n.rest{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line-strong)}
.dD-day .t{font-weight:600;font-size:13.5px}
.dD-day .m{font-size:12px;color:var(--ink-soft)}
.dD-day .km{font-weight:600;font-size:13px;align-self:start;padding-top:1px}
.dD-day .bar{position:absolute;left:34px;bottom:3px;height:3px;border-radius:2px;background:var(--route);opacity:.4}
.dD-ah{display:flex;align-items:center;gap:2px;padding:8px 0 2px;font-weight:600;font-size:13px}
.dD-ah .sp{flex:1}
.dD-sub{padding:10px 0 2px;font-weight:600;font-size:13px}
.dD-sub .cap{font-weight:400;margin-left:6px}
.dD-km{font-size:12.5px;color:var(--ink-soft);align-self:start;padding-top:2px}
.dD-acts{display:flex;gap:6px;margin-top:8px}
.dD-mapwrap{position:relative;min-height:0;overflow:hidden}
.dD-mapwrap>.map{bottom:170px}
.dD-mapnote{position:absolute;left:12px;top:12px;z-index:2;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink-soft)}
.dD-pop{position:absolute;z-index:3;padding:10px 12px;width:max-content}
.dD-pop .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dD-pop .hd b{font-size:14px}
.dD-pop .hd .x{margin-left:auto;color:var(--ink-faint);display:grid;place-items:center;align-self:center}
.dD-pop .hd .x svg{width:14px;height:14px}
.dD-pop .seg>*{gap:5px}
.dD-pop .seg svg{width:13px;height:13px}
.dD-pop .ln{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
/* marks inside the map svg, in map coordinates */
.dD-pin{color:var(--route)}
.dD-pin circle{fill:var(--panel);stroke:var(--route);stroke-width:2}
.dD-pin.sel{color:var(--on-amber)}
.dD-pin.sel circle{fill:var(--amber);stroke:var(--ink)}
.dD-pin.de{color:var(--panel)}
.dD-pin.de circle{fill:var(--ink);stroke:var(--panel)}
.dD-pin.de text{fill:var(--panel);font:700 12px var(--sans);text-anchor:middle}
.dD-pin.end circle{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
.dD-pin.end circle.d{fill:var(--ink);stroke:none}
.dD-pin.ghost circle{stroke-dasharray:3 3}
.dD-here .h{fill:var(--navy);opacity:.18}
.dD-here .c{fill:var(--navy);stroke:var(--panel);stroke-width:3}
.dD-ml{font:600 12px var(--sans);fill:var(--m-label);paint-order:stroke;stroke:var(--m-label-halo);stroke-width:3.5px;stroke-linejoin:round}
.dD-ml.ink{fill:var(--ink);font-weight:700}
.dD-ml.soft{font-weight:500;fill:var(--ink-soft)}
/* the strip: a gutter of row labels, then everything in km */
.dD-strip{position:absolute;left:0;right:0;bottom:0;height:170px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:100px 1fr;row-gap:4px;align-content:start;padding:6px 18px 0 0;z-index:2}
.dD-g{font-size:10px;color:var(--ink-faint);white-space:nowrap;align-self:center;line-height:1;height:8px;display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-right:10px}
.dD-g svg{width:11px;height:11px}
.dD-scope{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink);justify-self:end;padding-right:10px;align-self:center}
.dD-scope svg{width:13px;height:13px;color:var(--ink-faint)}
.dD-days{position:relative;height:14px;font-size:11px;color:var(--ink-faint)}
.dD-days>*{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.dD-days>b{font-weight:600}
.dD-days>b.on{color:var(--ink);font-weight:800}
.dD-days>i{font-style:normal;font-size:9.5px}
.dD-days>.end{transform:none;right:0}
.dD-prof{position:relative;height:74px;margin-bottom:5px}
.dD-prof>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dD-prof .tick{top:10px;bottom:0}
.dD-prof .tick.sel{background:var(--ink);z-index:1}
.dD-prof .tick.sel::after{width:14px;height:14px;left:-6px;top:-6px;background:var(--amber);border-color:var(--ink)}
.dD-prof .tick.ghost{background:transparent;border-left:2px dashed var(--route);width:0}
.dD-prof .tick.ghost::after{border-style:dashed;left:-5px}
.dD-de{position:absolute;bottom:-7px;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2}
.dD-de.sel{width:18px;height:18px;bottom:-9px;background:var(--amber);border-color:var(--ink)}
.dD-plab{position:absolute;font-size:10.5px;color:var(--ink-soft);white-space:nowrap;background:var(--panel);padding:1px 4px;border-radius:4px;line-height:1.2;z-index:1}
.dD-plab.win{color:var(--ink);font-weight:600}
.dD-tip{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.35;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.dD-tip .cap{display:block}
.band.dD-dots>i{width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--water);border:1.5px solid var(--panel);box-shadow:0 0 0 1px var(--water)}
/* phone */
.dD-nav{position:absolute;left:0;right:0;top:0;height:100px;padding:56px 4px 0;display:flex;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.dD-nav button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.dD-nav button svg{width:22px;height:22px}
.dD-nav .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dD-sheet{padding:0 16px;display:flex;flex-direction:column;z-index:6}
.dD-sheet .qbox{margin-top:10px}
.dD-sheet .understood{margin-top:8px}
.dD-sheet .row{padding-top:8px;padding-bottom:8px}
.dD-sheet .row .m{font-size:13px}
.dD-sheet .row .t .km{font-weight:400;color:var(--ink-soft);font-family:var(--mono);font-size:13px;margin-left:6px}
.dD-sheet .dD-ah{padding:8px 0 0;font-size:14px}
.dD-sheet .dD-sub{font-size:14px;padding:8px 0 0}
.dD-cta{margin-top:auto;padding:8px 0 28px}
.dD-cta .btn{width:100%}
.dD-pstrip{display:grid;grid-template-columns:82px 1fr;row-gap:4px;margin-top:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dD-pstrip .hd{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:2px}
.dD-pstrip .hd .dD-scope{padding-right:0;font-size:13px}
.dD-pstrip .hd .cap{margin-left:auto;font-size:12px}
.dD-pstrip .dD-prof{height:50px;margin-bottom:3px}
.dD-pstrip .dD-g{font-size:10px}
.dD-opt{display:grid;grid-template-columns:32px 1fr;column-gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dD-opt.sel{background:var(--amber-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px;border-color:transparent}
.dD-opt .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--parchment-2);color:var(--ink-soft)}
.dD-opt.sel .ic{background:var(--panel);color:var(--ink)}
.dD-opt .ic svg{width:16px;height:16px}
.dD-opt .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dD-opt .t{font-weight:600}
.dD-opt .f{font-family:var(--mono);font-size:13px;white-space:nowrap}
.dD-opt .m{font-size:13px;color:var(--ink-soft)}
.dD-prop{margin-top:12px}
.dD-prop .h{display:flex;align-items:center;gap:8px}
.dD-prop .h svg{width:18px;height:18px;color:var(--route);flex:none}
.dD-prop .fig{font-family:var(--mono);font-size:15px;font-weight:600;margin:8px 0 4px}
.dD-prop .cap{font-size:12.5px}
.dD-prop .dD-acts{margin-top:12px}
</style>
