<style>
/* Direction R3 · quick requests. Prefix r3-. Website keeps the structure of a-web. */
.r3-app { display: grid; grid-template-columns: 376px 1fr; grid-template-rows: 52px 1fr; height: 770px; }
.r3-bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.r3-brand { font-weight: 800; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.r3-plan { font-weight: 600; padding-left: 14px; border-left: 1px solid var(--line-strong); white-space: nowrap; }
.r3-dates { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
.r3-dates svg { width: 14px; height: 14px; }
.r3-tools { margin-left: auto; display: flex; align-items: center; gap: 0; }
.r3-tools .btn.ghost { padding: 0 8px; }
.r3-tools .r3-sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 6px; }

.r3-panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
.r3-q { padding: 12px 16px 10px; }

/* the scope caption and the quick row: five equal targets, icon disc plus label */
.r3-scope { margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.r3-quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.r3-quick > button { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 0 4px; border-radius: 10px;
  font-size: 12px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
.r3-quick .ic { width: 32px; height: 32px; border-radius: 50%; background: var(--parchment-2); display: grid; place-items: center; color: var(--ink); }
.r3-quick .ic svg { width: 18px; height: 18px; }
.r3-quick > button.on { color: var(--ink); }
.r3-quick > button.on .ic { background: var(--ink); color: var(--panel); }

/* the request's fields: each chip is a control (small chevron), one picker open */
.r3-und { margin-top: 10px; position: relative; }
.r3-und .chip .dd, .r3-sheet .chip .dd { width: 11px; height: 11px; opacity: .55; margin-left: -1px; }
.r3-und .chip.r3-open { border-color: var(--ink); }
.r3-pick { position: absolute; right: 0; top: 64px; z-index: 6; padding: 4px; box-shadow: var(--shadow-lg); }

.r3-back { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 4px 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.r3-list { flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; }
.r3-sec { padding: 10px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.r3-acts { grid-column: 2 / 4; display: flex; gap: 8px; padding-top: 4px; }
.r3-foot { border-top: 1px solid var(--line); padding: 8px 16px 10px; display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 2px; }
.r3-foot .r3-preset { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.r3-foot .r3-preset svg { width: 16px; height: 16px; color: var(--ink-soft); }

.r3-mapcol { position: relative; min-width: 0; }
.r3-mt { font: 600 13px var(--sans); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; }
.r3-mt.rt { fill: var(--route); }
.r3-mt.b { fill: var(--ink); font-weight: 700; }
.r3-ctl { position: absolute; right: 12px; bottom: 174px; display: flex; flex-direction: column; gap: 6px; }
.r3-ctl > div { background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.r3-ctl button { width: 34px; height: 32px; display: grid; place-items: center; }
.r3-ctl button + button { border-top: 1px solid var(--line); }
.r3-ctl svg { width: 16px; height: 16px; }

.r3-prof { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 150px; padding: 8px 12px; }
.r3-ph { display: flex; align-items: center; gap: 10px; height: 24px; }
.r3-ph .h { font-size: 13px; }
.r3-ph .r3-right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.r3-pg { display: grid; grid-template-columns: 52px 1fr; column-gap: 8px; row-gap: 4px; align-items: center; margin-top: 6px; }
.r3-pl { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.r3-days { position: relative; height: 14px; }
.r3-days b { position: absolute; transform: translateX(-50%); font: 600 11px var(--sans); color: var(--ink-soft); }
.r3-days b.sel { color: var(--ink); }
.r3-prof .tick { bottom: 0; height: 20px; }

/* phone: navigation bar over the map, one sheet, the box then the row at the top of the sheet */
.r3-nav { position: absolute; z-index: 6; left: 0; right: 0; top: 0; height: 98px; background: var(--panel); border-bottom: 1px solid var(--line); }
.r3-nav .r3-ttl { position: absolute; left: 56px; right: 104px; top: 54px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; white-space: nowrap; }
.r3-nav .r3-nb { position: absolute; top: 54px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
.r3-nav .r3-nb svg { width: 22px; height: 22px; }
.r3-sheet { z-index: 7; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden; }
.r3-sheet > .grab { flex: none; }
.r3-sheet .qbox { flex: none; margin-top: 10px; }
.r3-sheet .qbox .typed { font-size: 17px; }
.r3-sheet .qbox .r3-x { width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; color: var(--ink-faint); flex: none; }
.r3-sheet .qbox .r3-x svg { width: 18px; height: 18px; }
.r3-sheet .r3-scope { margin: 12px 0 0; font-size: 13px; }
.r3-sheet .r3-quick { margin-top: 4px; gap: 6px; flex: none; }
.r3-sheet .r3-quick > button { min-height: 60px; font-size: 13px; gap: 5px; padding-top: 6px; }
.r3-sheet .r3-quick .ic { width: 36px; height: 36px; }
.r3-sheet .r3-quick .ic svg { width: 20px; height: 20px; }
.r3-sheet .understood { margin-top: 10px; gap: 8px; flex: none; }
.r3-sheet .understood > .lbl { font-size: 13px; }
.r3-sheet .chip, .r3-sheet .chip.what, .r3-sheet .chip.where, .r3-sheet .chip.filter { height: 36px; padding: 0 12px; border-radius: 18px; font-size: 15px;
  background: var(--parchment-2); color: var(--ink); border-color: transparent; }   /* 36 pt drawn, 44 pt hit area on an 44 pt pitch */
.r3-sheet .chip svg { width: 15px; height: 15px; }
.r3-sheet .chip .k { color: var(--ink-soft); }
.r3-body { flex: 1; min-height: 0; overflow: hidden; }
.r3-body.r3-fade { mask-image: linear-gradient(to bottom, black calc(100% - 52px), transparent calc(100% - 10px)); }
.r3-act { flex: none; padding: 8px 0 28px; }
.r3-act .btn { width: 100%; height: 50px; font-size: 17px; }

.r3-sheet .row { grid-template-columns: 36px 1fr auto; column-gap: 10px; padding: 10px 0; min-height: 62px; }
.r3-sheet .row > .ic { width: 36px; height: 36px; }
.r3-sheet .row > .ic svg { width: 18px; height: 18px; }
.r3-sheet .row .t { font-size: 17px; line-height: 1.25; }
.r3-sheet .row .m { font-size: 15px; margin-top: 2px; }
.r3-sheet .row .r3-km { font-size: 15px; color: var(--ink-soft); align-self: start; padding-top: 3px; }
.r3-sheet .row.sel { margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 10px; }
.r3-more > svg { width: 20px; height: 20px; color: var(--ink-faint); }

.r3-sum { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 4px; font-size: 15px; font-weight: 600; }
.r3-sum .cap { font-size: 13px; font-weight: 400; }
.r3-day { position: relative; display: grid; grid-template-columns: 28px 1fr; column-gap: 10px; align-items: start; padding: 9px 0 13px; border-bottom: 1px solid var(--line); }
.r3-day .n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.r3-day .n.rest { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.r3-day .t { font-size: 17px; font-weight: 600; line-height: 1.25; }
.r3-day .m { font-size: 15px; color: var(--ink-soft); margin-top: 2px; }
.r3-day .bar { position: absolute; left: 38px; bottom: 5px; height: 4px; border-radius: 2px; background: var(--route); opacity: .45; }

.r3-strip { position: relative; margin-top: 12px; height: 64px; flex: none; }
.r3-strip > svg.prof { position: absolute; left: 0; top: 18px; width: 100%; height: 34px; }
.r3-strip > .band { position: absolute; left: 0; right: 0; bottom: 0; }
.r3-lab { position: absolute; top: 0; font-size: 13px; line-height: 1; color: var(--ink-soft); white-space: nowrap; }
.r3-lab.r { transform: translateX(-100%); }
.r3-opt > .ic { grid-row: 1 / span 2; background: transparent; }
.r3-opt > .r3-fig { font-size: 15px; font-weight: 600; white-space: nowrap; }
.r3-opt > .m { grid-column: 2 / 4; margin-top: -2px; }
.r3-pmt { font: 600 24px var(--ios); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 6px; stroke-linejoin: round; }
.r3-pmt.rt { fill: var(--route); }
.r3-pmt.b { fill: var(--ink); font-weight: 700; }
.r3-de text { font: 700 13px var(--ios); fill: var(--panel); text-anchor: middle; }
</style>
