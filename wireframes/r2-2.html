.r2-list { flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; }
.r2-sec { padding: 10px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }

.r2-mapcol { position: relative; min-width: 0; }

.r2-sheet { height: 488px; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden; }
