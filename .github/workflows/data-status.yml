name: Read-only Live data report
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: data-status-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Build the checked read-only worker
        run: cargo build --locked -p obc-data-steps --bin obc-data-worker -j 2
      - name: Configure the forced read-only SSH alias
        env:
          STATUS_KEY: ${{ secrets.OBC_STATUS_SSH_KEY }}
          STATUS_HOST: ${{ vars.OBC_STATUS_SSH_HOST }}
          STATUS_USER: ${{ vars.OBC_STATUS_SSH_USER }}
          STATUS_KNOWN_HOSTS: ${{ secrets.OBC_STATUS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STATUS_KEY" > ~/.ssh/status-key
          chmod 600 ~/.ssh/status-key
          printf '%s\n' "$STATUS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host status-observer\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/status-key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$STATUS_HOST" "$STATUS_USER" > ~/.ssh/config
      - name: Update the single attention issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OBC_STATUS_HOST: status-observer
          OBC_R2_BUCKET: ${{ vars.OBC_R2_BUCKET }}
          OBC_R2_ACCOUNT_ID: ${{ vars.OBC_R2_ACCOUNT_ID }}
          OBC_R2_ACCESS_KEY_ID: ${{ secrets.OBC_STATUS_R2_ACCESS_KEY_ID }}
          OBC_R2_SECRET_ACCESS_KEY: ${{ secrets.OBC_STATUS_R2_SECRET_ACCESS_KEY }}
        run: python3 tools/data_report.py --update
