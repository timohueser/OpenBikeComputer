name: rustfmt

# Guards against committed formatting drift. The firmware is split into a cargo
# workspace (firmware/Cargo.toml) and a *standalone* board crate the workspace
# `exclude`s (firmware/obc-fw-stm32f429 — its own target + .cargo/config.toml).
# A `cargo fmt` run at the workspace root silently skips the excluded crate,
# which is exactly how unformatted code once landed there, so this checks both
# manifests explicitly.

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/fmt.yml"
  push:
    branches: [main, develop]
    paths:
      - "firmware/**"
      - ".github/workflows/fmt.yml"

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt only parses source, so no build target is installed and this stays
      # fast. The repo's firmware/rustfmt.toml uses stable-only options, and rustfmt
      # discovers it by walking up from each file — so the excluded crate inherits
      # it without needing its own copy.
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Check both, reporting each even if the other drifts (don't let an early
      # failure mask the rest), then fail the job if either is unformatted. The
      # workspace manifest is virtual (no targets of its own) so it needs `--all`;
      # the excluded board crate is checked on its own.
      - name: Check formatting (host workspace + standalone board crate)
        run: |
          rc=0
          echo "::group::cargo fmt --all --check (firmware workspace)"
          cargo fmt --all --check --manifest-path firmware/Cargo.toml || rc=1
          echo "::endgroup::"
          echo "::group::cargo fmt --check (obc-fw-stm32f429, workspace-excluded)"
          cargo fmt --check --manifest-path firmware/obc-fw-stm32f429/Cargo.toml || rc=1
          echo "::endgroup::"
          exit $rc
