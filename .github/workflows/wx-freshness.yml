name: Weather freshness

# The external freshness alarm for the weather service (WX18 #1206, epic #1185 risk 6).
#
# It runs **here** and not on the VPS on purpose: a probe hosted by the thing it watches cannot
# report that thing's death. The baker is a stateless publisher — when it stops, R2 keeps serving
# the last objects and the device degrades honestly ("WEATHER UPDATE NEEDED", never "dry"), so
# this is e-mail-grade, not a pager. GitHub's own notification on an opened issue is the e-mail.
#
# Two knobs, both repository-level, no secrets:
#   vars.OBC_WX_BASE_URL   the public service origin (e.g. https://wx.openbikecomputer.com).
#                          Unset ⇒ this workflow says "skipped" and passes, because a project
#                          that has not deployed the service yet must not carry a red check
#                          about it (the same contract as bake.yml's catalog guard).
#   vars.OBC_WX_PROBE_ARGS optional extra freshness_probe.py arguments (e.g. a wider grace while
#                          an upstream is known-broken). Normally empty.
#
# Cadence caveat: GitHub's scheduled runs are best-effort and are regularly minutes late on a busy
# fleet — which is why the alarm thresholds are 30 min (manifest) and deadline+15 min (product),
# not tight. Also note that GitHub disables schedules on a repository with 60 days of no activity;
# the runbook's monthly check covers that.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Service base URL to probe (blank = the OBC_WX_BASE_URL variable)"
        required: false
        default: ""
      probe_args:
        description: "Extra freshness_probe.py arguments (drills: --now 2026-01-01T00:00:00Z)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  # One probe at a time, or two late runs could open two alert issues for one outage.
  group: wx-freshness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe the published manifest
        id: probe
        env:
          BASE_URL: ${{ inputs.url || vars.OBC_WX_BASE_URL }}
          PROBE_ARGS: ${{ inputs.probe_args || vars.OBC_WX_PROBE_ARGS }}
        run: |
          # +e deliberately: the runner's default shell is `bash -eo pipefail`, and a stale probe
          # exits nonzero *by design* — that verdict is this step's product, not its failure.
          set +e
          set -uo pipefail
          if [ -z "$BASE_URL" ]; then
            echo "OBC_WX_BASE_URL is not set — the weather service is not deployed yet; skipping."
            echo "state=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Word-splitting PROBE_ARGS is deliberate: it is a maintainer-typed argument list.
          # shellcheck disable=SC2086
          python3 ops/weather/freshness_probe.py --url "$BASE_URL" $PROBE_ARGS | tee probe.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "state=fresh" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=stale" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=unreachable" >> "$GITHUB_OUTPUT" ;;
          esac
          {
            echo '### Weather freshness'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One open issue per outage: opened on the first bad probe (that is the e-mail), commented
      # and closed on the first good one. No new issue while one is already open, so a two-day
      # outage is one notification, not two hundred.
      - name: Open, keep or close the alert issue
        if: steps.probe.outputs.state != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.probe.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNBOOK_URL: ${{ github.server_url }}/${{ github.repository }}/blob/develop/ops/weather/RUNBOOK.md
        run: |
          set -euo pipefail
          gh label create wx-freshness --color B60205 \
            --description "Automated weather-service freshness alert" 2>/dev/null || true
          existing=$(gh issue list --label wx-freshness --state open --limit 1 --json number --jq '.[0].number // ""' || echo "")

          if [ "$STATE" = "fresh" ]; then
            if [ -n "$existing" ]; then
              {
                echo "Recovered — the published manifest is fresh again."
                echo
                echo '```'
                cat probe.txt
                echo '```'
                echo
                echo "[probe run]($RUN_URL)"
              } > body.md
              gh issue comment "$existing" --body-file body.md
              gh issue close "$existing" --reason completed
              echo "closed #$existing"
            else
              echo "fresh, nothing open"
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            echo "still $STATE; alert #$existing is already open (no second notification)"
            exit 0
          fi
          {
            echo "The external freshness probe says the published weather manifest is **$STATE**."
            echo
            echo '```'
            cat probe.txt
            echo '```'
            echo
            echo "Riders are not seeing wrong weather — expired products stop being used and the device"
            echo "says WEATHER UPDATE NEEDED. What is missing is fresh rain."
            echo
            echo "First moves (full procedure: [ops/weather/RUNBOOK.md]($RUNBOOK_URL)):"
            echo
            echo '```sh'
            echo "systemctl list-timers 'obc-wx-bake@*'"
            echo "journalctl -u 'obc-wx-bake@*' -n 100 --no-pager"
            echo "systemctl start obc-wx-bake@dwd-rv.service   # one manual bake, watch it"
            echo '```'
            echo
            echo "This issue closes itself on the first fresh probe. [probe run]($RUN_URL)"
          } > body.md
          gh issue create --title "Weather service: manifest $STATE" --label wx-freshness --body-file body.md

      # The red check is the second signal, for anyone who reads the Actions tab rather than mail.
      - name: Fail the run when the service is not fresh
        if: steps.probe.outputs.state == 'stale' || steps.probe.outputs.state == 'unreachable'
        env:
          STATE: ${{ steps.probe.outputs.state }}
        run: |
          echo "::error::weather service $STATE — see the alert issue"
          exit 1
