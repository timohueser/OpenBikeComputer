name: CI

# Unified correctness gate for the firmware (host workspace + the workspace-excluded board
# crate), the wasm sim, the docs site, and the iOS companion app. Build surfaces and their
# structural gotchas:
#
#   * The firmware/ manifest is a *virtual* workspace (no targets of its own) → workspace
#     commands need `--workspace` / `--all`.
#   * obc-fw-nrf54l is the **real device target** (nRF54L15; the display is the LS021 panel driven
#     by the FLPR coprocessor). It's `exclude`d from that workspace and is its own cargo root → it
#     needs its own invocation, run from inside the crate dir so its .cargo/config.toml selects the
#     thumbv8m target (a `--manifest-path` from the root would build it for the host and fail on
#     embassy-nrf). It has its own Cargo.lock, and no test harness (no_std on bare metal), so it gets
#     `clippy`/`build` but not `--all-targets`/`test`. No `--all-features` build (the `debug-uart`
#     and `synth` source overrides are mutually exclusive, and `ble` needs `--no-default-features`),
#     so each config is linted on its own. Every leg cross-compiles a RISC-V blob (see `embedded`).
#   * nRF is the only board in the tree — optimise the shared crates for nRF freely.
#   * There is no board in CI, so every embedded target is build-only.
#   * The toolchain (channel + rustfmt/clippy + the thumbv8m / wasm32 targets) is declared once in
#     //rust-toolchain.toml and shared with local dev. It intentionally tracks floating stable.
#   * obc-boot (the 32 KB DFU bootloader, #617) is excluded + standalone the same way as the
#     board crate; its job adds a flash-size guard against the 32 KB slot.
#   * obc-web-convert (#896) is a normal workspace member (so fmt/clippy/test/deny already cover
#     it) whose *shipping* artifact is a wasm32 build the web builder imports — hence the extra
#     `wasm-convert` job, its bundle-size guard, and the artifact hand-off into `web`.
#   * obc-desktop (#906) is the third excluded + standalone crate: a Tauri app, so it brings a
#     platform webview with it (WebKitGTK on Linux) and would otherwise put those headers in
#     every renderer test's way. Its job is also the only Rust one that needs Node — the shell
#     *embeds* the built frontend, so it breaks from either side and both halves are built there.
#     It is the only **three-OS matrix** in this file (D2, #907): it is the artifact a user
#     installs, it statically links a vendored libGEOS, and a C++ dependency proved on Linux
#     alone is not proved. Deliberately the one Rust job with *no* system GEOS anywhere.
#   * `--locked` everywhere so a stale Cargo.lock (any of the four) fails CI.

on:
  pull_request:
  push:
    branches: [main, develop]

# One run per ref; a new push cancels the previous in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Per-surface path filtering: a docs-only PR shouldn't pay for the Rust matrix, and vice
  # versa. Downstream jobs gate on these outputs; the `ci` job at the bottom is the single
  # required status check, so skipped jobs never wedge branch protection.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      wasm: ${{ steps.filter.outputs.wasm }}
      ios: ${{ steps.filter.outputs.ios }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'firmware/**'
              # host/ holds the packer, the bench + its golden hashes, and the test oracles
              # (obcm-testkit, obc-vectors) that firmware crates dev-depend on.
              - 'host/**'
              # apps/ holds the four shells: the simulator, both wasm hosts, and the Tauri app.
              - 'apps/**'
              - 'builder/presets/**'
              # builder/tests/ drives the real obc-pack binary and the builder's pure API
              # endpoints, so the packer, the presets it round-trips, and the server module
              # under test all have to be able to trigger it.
              - 'builder/tests/**'
              - 'builder/server/*.py'
              - 'builder/requirements*.txt'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'
            wasm:
              - 'firmware/**'
              - 'host/**'
              - 'apps/**'
              - 'docs/**'
              # The root cargo config is gone (`MapCache::new_boxed` removed the wasm
              # shadow-stack flag it carried — PRs #661/#666), but rustflags placed there
              # reach the wasm build via cargo's config walk-up, so a re-introduced file
              # must still rebuild the demo or a stack regression lands unbuilt.
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
            ios:
              - 'companion-ios/**'
              - '.github/workflows/ci.yml'
            desktop:
              # The Tauri shell embeds the built frontend and links obc-pack, so it
              # breaks from either side.
              - 'apps/obc-desktop/**'
              - 'host/obc-pack/**'
              - 'builder/app/**'
              - 'builder/presets/**'
              # The GEOS smoke test (#907) packs this fixture with that preset and
              # pins the digest, so either one moving must re-run the three-platform
              # matrix rather than leaving a stale hash asserted.
              - 'builder/tests/corpus/**'
              - 'builder/palette.json'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            web:
              - 'builder/app/**'
              # The frontend now embeds firmware code: obc-web-convert (#896) compiles the shared
              # obc-route conversion path to wasm and the builder imports it, so any shared-crate
              # change can move those bytes. Its byte-identity guard reads specs/vectors/, and
              # the toolchain file picks the compiler that produces the module.
              - 'firmware/**'
              - 'host/**'
              - 'apps/**'
              - 'specs/vectors/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  # cargo fmt --check for all three manifests. rustfmt walks up from each file and finds the
  # shared rustfmt.toml at the repo root, so the excluded crates inherit it; the virtual workspace
  # manifest needs `--all`, the board crate + bootloader are checked on their own.
  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: cargo fmt --check (host workspace + the three standalone crates)
        run: |
          rc=0
          echo "::group::firmware workspace"
          cargo fmt --all --check || rc=1
          echo "::endgroup::"
          echo "::group::obc-fw-nrf54l (workspace-excluded)"
          cargo fmt --check --manifest-path firmware/obc-fw-nrf54l/Cargo.toml || rc=1
          echo "::endgroup::"
          echo "::group::obc-boot (workspace-excluded)"
          cargo fmt --check --manifest-path firmware/obc-boot/Cargo.toml || rc=1
          echo "::endgroup::"
          echo "::group::obc-desktop (workspace-excluded)"
          cargo fmt --check --manifest-path apps/obc-desktop/Cargo.toml || rc=1
          echo "::endgroup::"
          exit $rc

  # Blocking clippy on the host workspace: -D warnings from day one (the baseline is clean).
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: host
      # Native host build: system libGEOS (built from source — apt's is too old) + serialport/
      # eframe system libs. See .github/actions/setup-host-deps.
      - uses: ./.github/actions/setup-host-deps
      - name: cargo clippy (workspace, all targets + features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The 251-test shared render + packer suite — the real safety net.
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: host
      # Native host build: system libGEOS (built from source — apt's is too old) + serialport/
      # eframe system libs. See .github/actions/setup-host-deps.
      - uses: ./.github/actions/setup-host-deps
      - name: cargo test (workspace, all features)
        run: cargo test --workspace --all-features --locked
      - name: firmware resource/dependency tool unit tests
        run: python3 -m unittest discover -s firmware/tools/tests -v
      - name: firmware production dependency direction
        run: python3 firmware/tools/check_dependencies.py
      # Renderer pixel-hash tripwire (issue #327): re-render the 7 fixed bench scenes over the
      # deterministic testkit fixture and fail if any frame hash drifts from the committed golden
      # file. Timings are printed to the log but never gated (shared runners are noisy); an
      # intentional rendering change regenerates hashes.txt (--write-hashes) in the same PR.
      - name: obc-bench --check (render pixel-hash tripwire)
        run: cargo run -p obc-bench --release --locked -- --check host/obc-bench/hashes.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Routing-profile round-trips through the builder's pack path. These shell out to the
      # real obc-pack binary over the tiny corpus and byte-compare the §8.6 profile table
      # against independently quantized expectations — so they pin the packer's writer
      # against the spec rather than against itself — plus the pure /api/schema and
      # /api/presets endpoints via FastAPI's TestClient. The suite existed and passed but no
      # workflow ran it; requirements-dev.txt is what makes it installable.
      - name: web-builder packer tests (pytest)
        run: |
          pip install -r builder/requirements-dev.txt
          cargo build -p obc-pack --release --locked
          PYTHONPATH=. python3 -m pytest builder/tests/ -v

  # The real device board crate (nRF54L15) on its thumbv8m target: clippy each feature config + a
  # release build of the shipping default. Build-only (no board in CI). Each leg runs from the crate
  # dir so .cargo/config.toml selects thumbv8m. No `--all-features` (the `debug-uart`/`synth` source
  # overrides are mutually exclusive and `ble` needs `--no-default-features`), so each config is
  # linted on its own.
  #
  # The display is the LS021 panel via the FLPR (the VPR RISC-V coprocessor, issue #173): every leg
  # cross-compiles a `rv32emc` C blob via `build.rs`, so the RISC-V gcc is installed first for all.
  embedded:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # default = the shipping LS021/FLPR map + two-plane path (square-loop GPS, no host feed).
          # Since 2026-07-26 that includes the **USB device plane** (#889): `usb` is no longer a
          # feature, so `src/usb/` and the `src/link/` core it shares with the radio are compiled,
          # linted and resource-gated by the default legs below — no separate USB matrix leg exists
          # or is needed, and the plane can no longer rot in a profile nobody builds.
          - { name: "clippy (default = LS021/FLPR)", cmd: "cargo clippy --locked -- -D warnings" }
          # debug-uart = default + the VCOM host sensor/telemetry feed (the obc-platform debug codec).
          - { name: "clippy (debug-uart)", cmd: "cargo clippy --locked --features debug-uart -- -D warnings" }
          # The real flashed default artifact (LS021/FLPR) under fat LTO + the N3 RAM-budget assert.
          - { name: "build (default = LS021/FLPR, release)", cmd: "cargo build --release --locked" }
          # The BLE build (issue #270): the map plane cfg'd out, the nrf-sdc/MPSL/TrouBLE stack +
          # status UI in. Needs --no-default-features (MPSL provides the critical-section impl).
          - { name: "clippy (ble)", cmd: "cargo clippy --locked --no-default-features --features ble -- -D warnings" }
          - { name: "build (ble, release)", cmd: "cargo build --release --locked --no-default-features --features ble" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/obc-fw-nrf54l
          key: thumbv8m-nrf
      # The FLPR `build.rs` cross-compiles src/flpr/*.c for the VPR with an rv32emc GNU gcc;
      # build.rs auto-detects the xPack `riscv-none-elf-gcc` (+ matching objcopy).
      #
      # Deliberately NOT the apt package: the runner's azure.archive.ubuntu.com mirror kept
      # stalling on the ~51 MB `gcc-riscv64-unknown-elf` — first wedging jobs until the 6 h
      # default timeout, then (after per-request timeouts + retries) still burning the 10-minute
      # step budget on a mirror that *trickles* instead of stalling, which apt's idle timeout
      # never trips. So: a version-pinned xPack toolchain tarball from GitHub's own release CDN
      # (runner-to-GitHub, no Ubuntu mirror involved), SHA-256-verified, restored from the
      # actions cache on every run after the first. The curl retries + step timeout stay as the
      # cache-miss backstop; worst case is a fast visible failure, never a stuck run.
      - name: Cache the RISC-V GCC toolchain (xPack)
        id: riscv-gcc-cache
        uses: actions/cache@v4
        with:
          path: ~/xpack-riscv-none-elf-gcc-13.2.0-2
          key: xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64
      - name: Install RISC-V GCC for the FLPR blob
        if: steps.riscv-gcc-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz"
          sha256="52545afb900200fbf65fe05f7ce7090b8a42c64091f4f5d43cae6bb68ea2434a"
          curl -fL --retry 3 --retry-all-errors --max-time 300 -o /tmp/riscv-gcc.tar.gz "$url"
          echo "$sha256  /tmp/riscv-gcc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/riscv-gcc.tar.gz -C "$HOME"
      - name: Put the RISC-V GCC on PATH
        run: echo "$HOME/xpack-riscv-none-elf-gcc-13.2.0-2/bin" >> "$GITHUB_PATH"
      - name: "obc-fw-nrf54l: ${{ matrix.name }}"
        working-directory: firmware/obc-fw-nrf54l
        run: ${{ matrix.cmd }}
      # FAR-00's one ELF parser extends the pre-existing boot/poll guards with actual linked
      # `.bss + .data`, exact framebuffer count/size, and the report-only target `size_of` table.
      # Run against the production ELF first; the resource-report rebuild is a separate diagnostic
      # artifact and never changes what ships.
      - name: "obc-fw-nrf54l: default resource baseline"
        if: matrix.name == 'build (default = LS021/FLPR, release)'
        working-directory: firmware/obc-fw-nrf54l
        run: |
          rustup component add llvm-tools
          python3 ../tools/resource_guard.py board --profile default \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l
          cargo build --release --locked --features resource-report
          python3 ../tools/resource_guard.py report --profile default \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l
      # The BLE board guard also subsumes #677's steady-state poll-frame parser: largest single
      # `sub sp` in every `TaskStorage<F>::poll`, still capped at 12 KiB, now with stale-symbol and
      # stale-instruction diagnostics covered by unit tests.
      - name: "obc-fw-nrf54l: BLE resource + poll-frame baseline"
        if: matrix.name == 'build (ble, release)'
        working-directory: firmware/obc-fw-nrf54l
        run: |
          rustup component add llvm-tools
          python3 ../tools/resource_guard.py board --profile ble \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l
          cargo build --release --locked --no-default-features --features ble,resource-report
          python3 ../tools/resource_guard.py report --profile ble \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l

  # The obc-boot bootloader (epic #615, #617): workspace-excluded like the board crate, built
  # from its own directory so its .cargo/config.toml selects thumbv8m. No test harness and no
  # FLPR blob (no RISC-V gcc needed). The size guard is the real gate: the shipping (default,
  # no-rtt) release image's flash footprint — .vector_table + .text + .rodata + .data — must fit
  # the 32 KB slot below the app (see firmware/obc-boot/memory.x), with the measured number in
  # the failure so a regression is diagnosable from the log.
  boot:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/obc-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/obc-boot
          key: thumbv8m-boot
      - name: "obc-boot: clippy (default)"
        run: cargo clippy --locked -- -D warnings
      - name: "obc-boot: clippy (rtt)"
        run: cargo clippy --locked --features rtt -- -D warnings
      - name: "obc-boot: build (release)"
        run: cargo build --release --locked
      - name: "obc-boot: 32 KB size guard"
        run: |
          rustup component add llvm-tools
          python3 ../tools/resource_guard.py boot \
            --elf target/thumbv8m.main-none-eabihf/release/obc-boot

  # std-creep guard for the real device: the shared no_std stack (obc-app pulls in reader /
  # route / render) must still compile for the nRF54L's thumbv8m target.
  device:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: thumbv8m
      - name: cargo build -p obc-app (thumbv8m.main, nRF54L)
        run: cargo build -p obc-app --target thumbv8m.main-none-eabihf --locked
      - name: thumbv8m +strict-align backend probe
        run: python3 firmware/tools/resource_guard.py strict-align

  # Supply-chain gate: advisories + licenses + bans + sources, for both lockfiles (deny.toml).
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (firmware workspace)
        run: cargo deny --all-features --config deny.toml check
      - name: cargo-deny (obc-fw-nrf54l board crate)
        run: cargo deny --manifest-path firmware/obc-fw-nrf54l/Cargo.toml --all-features --config deny.toml check
      - name: cargo-deny (obc-boot bootloader)
        run: cargo deny --manifest-path firmware/obc-boot/Cargo.toml --all-features --config deny.toml check
      # The desktop shell is the one artifact a *user* installs, so its tree is the
      # one where a bad licence or a live advisory matters most.
      - name: cargo-deny (obc-desktop app)
        run: cargo deny --manifest-path apps/obc-desktop/Cargo.toml --all-features --config deny.toml check

  # The web demo (apps/obc-web-demo) is the firmware's own render path compiled to wasm
  # behind a thin JS-driven host; build it on PRs (not just on the deploy-to-Pages push) so a
  # wasm-only breakage — bindgen surface, embedded assets, Trunk config — is caught before merge.
  # (The `wasm` path filter's firmware/** covers apps/obc-web-demo/** and every shared crate.)
  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: trunk build (obc-web-demo → wasm)
        run: trunk build --config docs/Trunk.toml

  # The hosted builder's conversion bridge (apps/obc-web-convert, #896): the shared obc-route
  # GPX↔OBCR path compiled to wasm so route conversion runs client-side and the hosted tier needs
  # no backend at all. Two things happen here and the order matters:
  #
  #   1. wasm-pack builds the module (wasm-bindgen + wasm-opt in one step — the demo's Trunk is an
  #      app bundler and has no place here; this is a library consumed by Vite).
  #   2. The bundle-size budget gates it. This artifact is downloaded by every visitor who drops a
  #      route, so a silent size regression must fail the build, not land quietly.
  #
  # The exact bytes that pass the budget are then handed to the `web` job, which type-checks
  # against them and runs the byte-identity tests on them — the shipped module and the tested
  # module are the same file, not two builds that happen to agree.
  wasm-convert:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: wasm-convert
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: wasm-pack build (obc-web-convert → wasm)
        run: |
          wasm-pack build apps/obc-web-convert --release --target web \
            --out-dir ../../builder/app/src/lib/convert/pkg \
            --out-name obc_web_convert
      - name: bundle-size budget
        run: python3 firmware/tools/wasm_size_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: obc-web-convert-pkg
          path: builder/app/src/lib/convert/pkg
          retention-days: 1

  # Render the docs site (stdlib-only Python, no pip) and fail on error, plus the cross-page
  # anchor audit CLAUDE.md otherwise asks for by hand: every internal ../page/#anchor must
  # resolve to a real heading id.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build_docs.py --check-links
        run: python3 docs/build_docs.py --check-links

  # iOS companion, fast tier: the OBCKit package suite on the macOS host (no simulator).
  # This is what enforces the architecture rules that are otherwise only "test-enforced"
  # locally — CoreBluetoothSeamTests (CoreBluetooth stays inside OBCTransport/BLE/), the
  # protocol vector/contract tests, and every model test.
  #
  # DEVELOPER_DIR pins the Xcode toolchain (project floor is Xcode 26.x, see
  # companion-ios/CLAUDE.md) so a runner-image update can't silently move it — when the
  # image drops this version the job fails loudly and the pin gets bumped on purpose.
  ios-unit:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
      - name: swift test (OBCKit package, host)
        run: swift test --package-path companion-ios/Packages/OBCKit

  # iOS companion, app tier: xcodegen + a simulator-SDK build of the app target (build-only —
  # XCUITests on a booted sim are deliberately deferred; they'd be the slow/flaky tier).
  # The pbxproj is gitignored, so running xcodegen here also validates the fresh-clone setup
  # and catches project.yml drift. The Debug/Release pair doubles as the mock-seam gate:
  # OBCMock's build marker must be present in the Debug binary (proves the grep isn't
  # vacuous) and absent from Release (mock/dev-panel code must never ship).
  ios-app:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: xcodegen generate
        working-directory: companion-ios
        run: xcodegen generate
      - name: Build (Debug, simulator SDK)
        working-directory: companion-ios
        run: |
          xcodebuild build -project OBCCompanion.xcodeproj -scheme OBCCompanion \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      # -r -a over the whole bundle: in Debug the app code lives in the debug dylib
      # (OBCCompanion.debug.dylib), not the stub executable; -a forces byte matching in
      # binaries regardless of grep flavor.
      - name: Mock marker present in Debug
        working-directory: companion-ios
        run: grep -raq "OBCMock:DEBUG-only" DerivedData/Build/Products/Debug-iphonesimulator/OBCCompanion.app
      - name: Build (Release, simulator SDK)
        working-directory: companion-ios
        run: |
          xcodebuild build -project OBCCompanion.xcodeproj -scheme OBCCompanion \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Mock marker absent from Release
        working-directory: companion-ios
        run: |
          if grep -raq "OBCMock:DEBUG-only" DerivedData/Build/Products/Release-iphonesimulator/OBCCompanion.app; then
            echo "::error::OBCMock build marker found in the Release binary — mock code is shipping"
            exit 1
          fi

  # Single aggregate gate: make THIS the required status check on main/develop. It succeeds
  # only if no needed job failed or was cancelled; jobs skipped by the path filters are fine.
  # The web builder's Svelte frontend: type-check, unit tests, production builds.
  #
  # One source tree, three hosts (#895): `npm run build` is the local FastAPI one,
  # `build:web` the static hosted site and `build:desktop` the Tauri shell. All three
  # are built here — a host that stops compiling is otherwise invisible until someone
  # tries to ship it. The *contents* of the web bundle (no job polling, no style
  # editor) are asserted by vitest, which builds and inspects the emitted chunks.
  #
  # The conversion bridge's wasm comes from `wasm-convert` rather than being rebuilt here, so the
  # module the byte-identity tests run against is literally the one the size budget passed. It is
  # a hard dependency, not an optimisation, and it is why the download lands before `npm ci`:
  # every step below needs it — the TS wrapper imports the generated bindings, so `npm run check`
  # type-checks against them, and both vitest suites and `build:all` fail without the artifact.
  # The two jobs share one path filter so they are always skipped or run together.
  web:
    needs: [changes, wasm-convert]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obc-web-convert-pkg
          path: builder/app/src/lib/convert/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/app/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: vitest
        run: npm test
      - name: production builds (dev + web + desktop hosts)
        run: npm run build:all

  # The Tauri desktop shell (apps/obc-desktop, #906). Workspace-excluded like the
  # board crate and the bootloader, and for the same kind of reason: Tauri drags in
  # wry and a platform webview, and putting WebKitGTK's headers in the way of
  # `cargo test` for the renderer helps nobody.
  #
  # `tauri::generate_context!` *embeds* the built frontend, so a desktop build
  # genuinely fails when either half breaks — which is the point of building it here
  # rather than trusting that two green halves make a green whole. The bundle itself
  # comes from `desktop-frontend` above (built once, on Linux); the wasm bridge it
  # imports comes from `wasm-convert`, for the same reason the `web` job takes it.
  # No leg of this matrix runs Node.
  #
  # Build-only plus tests: the `#[ignore]`d ones pack a real region off the network
  # and belong on a developer's machine, not in CI.
  #
  # **Three platforms since D2 (#907)**, because a vendoring story exercised on one
  # OS is not a vendoring story. `obc-pack` links libGEOS, a C++ library; the app
  # turns on `geos/static` so a user installs nothing, and the only way to know that
  # holds for macOS, Windows MSVC and Linux is to build it on macOS, Windows MSVC
  # and Linux.
  #
  # Two properties are load-bearing and easy to lose in an edit:
  #
  #  * **No runner here has a system libGEOS**, and `setup-host-deps` — which builds
  #    one for the host workspace's jobs — is deliberately *not* used. So this job
  #    cannot accidentally pass by linking someone else's GEOS: if `vendored-geos`
  #    stopped working, `geos-sys`'s build script would fail to find any library at
  #    all and every leg would go red.
  #  * **Everything runs in `--release`.** Not for speed of the code but for count of
  #    GEOS builds: cargo keys build-script output on the profile, so a debug clippy
  #    plus a release build would compile the whole of GEOS twice per platform.
  #
  # `geos_smoke.rs` is the acceptance test — it packs the checked-in fixture through
  # the linked GEOS and pins the digest, so all three platforms assert the *same*
  # bytes. Linking is not evidence that the geometry runs.
  # The bundle the Tauri shell embeds. Built once, on Linux, and handed to all three
  # legs of `desktop` below: it is a Vite build of the same sources whatever runner
  # produces it, so building it per-platform bought nothing and cost three `npm ci`
  # runs and a Node toolchain on each. Split out rather than folded into `web`
  # because that job builds the *web* host and runs the test suite; this is one
  # `--mode desktop` bundle and nothing else.
  desktop-frontend:
    needs: [changes, wasm-convert]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obc-web-convert-pkg
          path: builder/app/src/lib/convert/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/app/package-lock.json
      - name: Build the desktop bundle
        working-directory: builder/app
        run: |
          npm ci
          npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: obc-desktop-frontend
          path: builder/app/dist/desktop
          retention-days: 1

  desktop:
    needs: [changes, desktop-frontend]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not hide another's — with a C++ dependency the
      # interesting information is *which* of the three broke.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
            exe: obc-desktop
          - os: macos-latest
            slug: macos-arm64
            exe: obc-desktop
          - os: windows-latest
            slug: windows-x86_64-msvc
            exe: obc-desktop.exe
    defaults:
      run:
        # Git Bash on the Windows runner, so the shared steps below are one script
        # rather than three. Nothing here needs a Windows-native shell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/obc-desktop
          key: desktop-${{ matrix.slug }}
      # wry's Linux backend. macOS and Windows need nothing extra — which is most of
      # why Tauri was chosen over Electron (#906) — but Linux wants WebKitGTK.
      # (CMake, which builds the vendored GEOS, is preinstalled on all three images.)
      - name: Install the Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      # The bundle the shell embeds, built once on Linux by `desktop-frontend` and
      # unpacked here. It is byte-identical on all three runners — a Vite build of the
      # same sources — so building it per-platform was three runs of `npm ci` and
      # three Node toolchains for one output. Landing it at the path tauri.conf.json's
      # `frontendDist` names is the whole integration; nothing here runs npm, and the
      # `beforeBuildCommand` in that file is never executed (there is no Tauri CLI in
      # this repo — see the note above about `custom-protocol`).
      - uses: actions/download-artifact@v4
        with:
          name: obc-desktop-frontend
          path: builder/app/dist/desktop
      # Order matters. `cargo test` never produces the plain binary — even with
      # --all-targets it builds bins as *test harnesses*, a different artifact — so the
      # `build` below is a full codegen + link either way. Running it first means the
      # normal lib it produces is already there for `test` to link against, instead of
      # `test` building one set of artifacts and `build` starting a second.
      - name: "obc-desktop: clippy"
        working-directory: apps/obc-desktop
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: "obc-desktop: build (release)"
        working-directory: apps/obc-desktop
        run: cargo build --release --locked
      # The GEOS smoke test lives here: packs the fixture through the vendored
      # library and asserts the digest. --nocapture so the log records the digest
      # and the linked GEOS version even on a green run.
      - name: "obc-desktop: test (incl. the GEOS smoke test)"
        working-directory: apps/obc-desktop
        run: cargo test --release --locked -- --nocapture
      # A dynamic reference to libGEOS here would mean the app only works on a
      # machine that already has it — the exact failure D2 exists to remove. On
      # Windows there is nothing to check: a missing DLL is a load failure, so the
      # smoke test above could not have run at all.
      - name: "obc-desktop: no dynamic libGEOS"
        if: runner.os != 'Windows'
        working-directory: apps/obc-desktop
        run: |
          bin="target/release/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = "macOS" ]; then deps=$(otool -L "$bin"); else deps=$(ldd "$bin"); fi
          if echo "$deps" | grep -i geos; then
            echo "::error::$bin links libGEOS dynamically — the vendored static build did not take"
            exit 1
          fi
          echo "no libGEOS in the dynamic dependencies"
      # Recorded so a regression is noticeable (#907's acceptance), and because the
      # +1.2 MB the static GEOS costs is the number the alternative — shipping a
      # dylib beside the app — has to beat.
      - name: "obc-desktop: record the artifact size"
        working-directory: apps/obc-desktop
        run: |
          bytes=$(wc -c < "target/release/${{ matrix.exe }}")
          echo "| ${{ matrix.slug }} | $bytes bytes |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: obc-desktop-${{ matrix.slug }}
          path: apps/obc-desktop/target/release/${{ matrix.exe }}
          retention-days: 7
      # macOS ships two architectures and this crate is built on the Apple-silicon
      # runner, so the Intel slice is proved by *cross-building* it: enough to know
      # the vendored GEOS still configures, compiles and links for x86_64, which is
      # the part that would break. It is not run — a universal `lipo`'d bundle is
      # D3's (#908) job, and this step is what keeps that option open.
      #
      # **Push events only, not pull requests.** A second target triple means a second
      # vendored GEOS and a second full dependency tree: measured at 415 s on a cold
      # cache, the largest single step in this workflow and about 40 % of the macOS
      # leg. It is build-only insurance for a future universal bundle, not a
      # correctness gate on the app anyone runs, so it belongs off the per-PR path —
      # a merge to develop still catches an x86_64 vendoring break within one commit.
      - name: "obc-desktop: the macOS Intel slice (build-only)"
        if: runner.os == 'macOS' && github.event_name == 'push'
        working-directory: apps/obc-desktop
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          file target/x86_64-apple-darwin/release/obc-desktop

  ci:
    if: always()
    needs: [changes, fmt, clippy, test, embedded, boot, device, deny, wasm, wasm-convert, docs, ios-unit, ios-app, web, desktop-frontend, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded (or were skipped)
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "all good"
