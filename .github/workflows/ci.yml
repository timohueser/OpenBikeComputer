name: CI

# Unified correctness gate for the firmware (host workspace + the workspace-excluded board
# crate), the wasm sim, the docs site, and the iOS companion app. Build surfaces and their
# structural gotchas:
#
#   * The firmware/ manifest is a *virtual* workspace (no targets of its own) → workspace
#     commands need `--workspace` / `--all`.
#   * obc-fw-nrf54l is the **real device target** (nRF54L15; the display is the LS021 panel driven
#     by the FLPR coprocessor). It's `exclude`d from that workspace and is its own cargo root → it
#     needs its own invocation, run from inside the crate dir so its .cargo/config.toml selects the
#     thumbv8m target (a `--manifest-path` from the root would build it for the host and fail on
#     embassy-nrf). It has its own Cargo.lock, and no test harness (no_std on bare metal), so it gets
#     `clippy`/`build` but not `--all-targets`/`test`. No `--all-features` build (the `debug-uart`
#     and `synth` source overrides are mutually exclusive), so each config is linted on its own. Every leg cross-compiles a RISC-V blob (see `embedded`).
#   * nRF is the only board in the tree — optimise the shared crates for nRF freely.
#   * There is no board in CI, so every embedded target is build-only.
#   * The toolchain (channel + rustfmt/clippy + the thumbv8m / wasm32 targets) is declared once in
#     //rust-toolchain.toml and shared with local dev. It intentionally tracks floating stable.
#   * obc-boot (the 32 KB DFU bootloader, #617) is excluded + standalone the same way as the
#     board crate; its job adds a flash-size guard against the 32 KB slot.
#   * obc-builder-bridge is a workspace library and the builder's shared WASM core.
#     The wasm-bridges job gates its production size and hands the same bytes to frontend jobs.
#   * obc-desktop (#906) is the third excluded + standalone crate: a Tauri app, so it brings a
#     platform webview with it (WebKitGTK on Linux) and would otherwise put those headers in
#     every renderer test's way. The shell embeds the frontend, so both halves are built there.
#     The planner artifact verifier also needs the locked Node reader dependencies.
#     It is the only **three-OS matrix** in this file because it is the artifact a user installs.
#   * `--locked` everywhere so a stale Cargo.lock (any of the four) fails CI.

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      full_release:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, develop]

# One run per ref; a new push cancels the previous in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}-${{ inputs.full_release && github.run_id || 'development' }}
  cancel-in-progress: ${{ !inputs.full_release }}

permissions:
  contents: read

# No job below performs an authenticated git operation — the only git commands are local reads
# (`merge-base`, `diff`, `ls-files`) — so every checkout sets `persist-credentials: false` and the
# token never lands in a job's .git/config.

jobs:
  # `tools/test_plan.py` is the only selector. This job runs it and publishes two outputs: the
  # per-suite plan the `ci` gate evaluates, and the list of jobs that plan requires. Every gated
  # job below reads that list — there is no second path-filter selector, and no job decides its
  # own policy. `python3 tools/test_plan.py select` is the same command `obc test affected`
  # runs locally (just is not installed on the runners), so a developer and CI answer "which
  # jobs does this change require" with one implementation.
  selection:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected suites
        id: plan
        env:
          FULL_RELEASE: ${{ inputs.full_release }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          release_args=()
          if [ "$FULL_RELEASE" = "true" ]; then
            base="HEAD^"
            release_args=(--release)
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="HEAD^"
          fi
          echo '[]' > selection-jobs.json
          set +e
          python3 tools/test_plan.py select "${release_args[@]}" --base "$base" --format json \
            --jobs-file selection-jobs.json > selection-plan.json
          rc=$?
          set -e
          cat selection-plan.json
          # A failed selection publishes nothing, so the gate fails on a missing plan instead of
          # evaluating one the selector itself rejected.
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "plan=$(cat selection-plan.json)" >> "$GITHUB_OUTPUT"
          echo "jobs=$(cat selection-jobs.json)" >> "$GITHUB_OUTPUT"
          echo "required jobs: $(cat selection-jobs.json)"

  # Every guard is a fast Python check over the source tree. They share nothing but runner
  # setup, so one job runs them all; each keeps its own step name and failure message. The
  # job is unconditional: every guard suite is required on every pull request.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Every fetched host is a declared data source
        run: python3 tools/check_data_sources.py
      - name: Prose budgets, published pages and links
        run: python3 tools/prose.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: &python-uv-version "0.8.17"
      - name: Install Python test reporter
        run: uv sync --locked --group dev --group planner-snow --group planner-sun
      - name: Test plan drift
        run: uv run --locked --group dev python tools/test_plan.py check
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.57.0"
      - name: Prepare native area-union tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version
      - name: Repository tool unit tests
        id: python-repository-tools
        run: |
          rm -rf .artifacts/python/repository-tools
          uv run --locked --group dev --group planner-snow --group planner-sun python -m xmlrunner discover -s tools/tests -v -o .artifacts/python/repository-tools
      - name: Upload repository Python test results
        if: ${{ !cancelled() && (steps.python-repository-tools.outcome == 'success' || steps.python-repository-tools.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: python-repository-tools-${{ github.run_attempt }}
          path: .artifacts/python/repository-tools/*.xml
          if-no-files-found: error
      - name: The job table and this workflow describe the same jobs
        run: uv run --locked --group dev python tools/test_plan.py validate-filters
      - name: Large fixture policy
        run: python3 tools/check_fixture_policy.py

  # cargo fmt --check for all Cargo roots. rustfmt walks up from each file and finds the
  # shared .rustfmt.toml at the repo root, so the excluded crates inherit it; the virtual workspace
  # manifest needs `--all`, the board crate + bootloader are checked on their own.
  fmt:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'fmt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: cargo fmt --check (host workspace + standalone crates)
        run: |
          rc=0
          echo "::group::firmware workspace"
          cargo fmt --all --check || rc=1
          cargo fmt --check --manifest-path firmware/obc-sensor-sim/Cargo.toml || rc=1
          echo "::endgroup::"
          echo "::group::obc-fw-nrf54l (workspace-excluded)"
          cargo fmt --check --manifest-path firmware/obc-fw-nrf54l/Cargo.toml || rc=1
          echo "::endgroup::"
          echo "::group::obc-boot (workspace-excluded)"
          cargo fmt --check --manifest-path firmware/obc-boot/Cargo.toml || rc=1
          echo "::endgroup::"
          echo "::group::obc-desktop (workspace-excluded)"
          cargo fmt --check --manifest-path apps/obc-desktop/Cargo.toml || rc=1
          echo "::endgroup::"
          exit $rc

  # Blocking clippy on the host workspace: -D warnings from day one (the baseline is clean).
  clippy:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'clippy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: host
      # Native host build: system libGEOS (built from source — apt's is too old) + serialport/
      # eframe system libs. See .github/actions/setup-host-deps.
      - uses: ./.github/actions/setup-host-deps
      - name: cargo clippy (workspace, all targets + features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The iOS portability gate: the shared stack has to keep type-checking for the phone, and
      # only a Mac can link or run it. A type-check is cheap enough to ride this Linux job.
      - name: cargo check (iOS host, aarch64-apple-ios)
        run: cargo check -p obc-ios-host --target aarch64-apple-ios --locked

  test:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      # `shared-key` (not `key`) so the three jobs that build the host workspace — this one, the
      # snapshot sweep and the builder's packer tests — restore *one* cache instead of three: they
      # run the same build, so further copies would only spend the cache budget again. This
      # job is the one that writes it, and only on a push — a cache saved during a pull-request run
      # is scoped to that pull request, so it can never warm anyone else's, and saving one costs
      # every pull request the write while buying only its own re-runs. The cache that matters is
      # the one develop's push writes, and every pull request restores that.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: host-tests
          save-if: ${{ github.event_name == 'push' }}
      # Native host build: system libGEOS (built from source — apt's is too old) + serialport/
      # eframe system libs. See .github/actions/setup-host-deps.
      - uses: ./.github/actions/setup-host-deps
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare locked planner artifact readers
        run: npm ci --omit=dev --ignore-scripts --prefix builder/app
      # The planner Python steps run under uv: obc-data-steps runs one in its tests.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: *python-uv-version
      - name: Cache content-addressed developer fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/openbikecomputer/fixtures
          key: obc-fixtures-${{ hashFiles('fixtures/catalog.toml') }}
      # Each section is one step so it keeps its own step name and result artifact; the file
      # is the same one `obc check test` runs.
      - name: cargo nextest (fast hermetic binaries)
        id: nextest
        run: bash tools/ci/test.sh nextest-fast
      - name: cargo nextest (captured fixture binaries)
        id: nextest-fixtures
        run: bash tools/ci/test.sh nextest-fixtures
      - name: cargo test --doc (workspace, all features)
        run: bash tools/ci/test.sh doctests
      - name: cargo test (obc-formats, default features = the device's shape)
        run: bash tools/ci/test.sh formats-default
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test reporter
        run: uv sync --locked --group dev --group planner-snow --group planner-sun
      - name: firmware resource/dependency tool unit tests
        id: python-firmware-tools
        run: |
          rm -rf .artifacts/python/firmware-tools
          uv run --locked --group dev --group planner-snow --group planner-sun python -m xmlrunner discover -s firmware/tools/tests -v -o .artifacts/python/firmware-tools
      - name: reference archive ingest unit tests
        id: python-dem-reference
        run: |
          rm -rf .artifacts/python/dem-reference
          uv run --locked --group terrain-reference --group dev python -m xmlrunner discover -s host/obc-dem/reference/tests -v -o .artifacts/python/dem-reference
      - name: Upload reference archive Python test results
        if: ${{ !cancelled() && (steps.python-dem-reference.outcome == 'success' || steps.python-dem-reference.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: python-dem-reference-${{ github.run_attempt }}
          path: .artifacts/python/dem-reference/*.xml
          if-no-files-found: error
      - name: firmware production dependency direction
        run: python3 firmware/tools/check_dependencies.py
      - name: obc-bench --check (render + read-counter golden gate)
        run: bash tools/ci/test.sh bench-golden
      - name: Upload firmware-tools Python test results
        if: ${{ !cancelled() && (steps.python-firmware-tools.outcome == 'success' || steps.python-firmware-tools.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: python-firmware-tools-${{ github.run_attempt }}
          path: .artifacts/python/firmware-tools/*.xml
          if-no-files-found: error
      - name: Upload Rust test results
        if: ${{ !cancelled() && (steps.nextest.outcome == 'success' || steps.nextest.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            .artifacts/rust/
          if-no-files-found: error
      - name: Upload Rust fixture test results
        if: ${{ !cancelled() && (steps.nextest-fixtures.outcome == 'success' || steps.nextest-fixtures.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-fixtures-${{ github.run_attempt }}
          path: target/nextest/fixtures/junit.xml
          if-no-files-found: error

  # Screen pixel-hash tripwire: re-render every UI screen through the headless simulator and
  # compare the frames to the committed digest manifest. The bench golden gate in `test` covers
  # the map renderer's scenes; this covers the screens drawn over them, which is what a screen
  # refactor moves. It is its own job so the sweep is off the `test` job's serial path. The debug
  # binary is deliberate: its output is byte-identical to release. `--accept` is a developer
  # command and never runs here — a self-regenerating manifest records nothing.
  #
  # The job starts for every suite that routes to it, which includes each package it compiles.
  # The sweep itself still runs only for `ci.ui-snapshots`, the suite that owns the rendering
  # input triggers, so its selection budget is exactly what it was.
  ui-snapshots:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'ui-snapshots')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: host-tests
          save-if: false
      - uses: ./.github/actions/setup-host-deps
      - name: Cache content-addressed developer fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/openbikecomputer/fixtures
          key: obc-fixtures-${{ hashFiles('fixtures/catalog.toml') }}
      - name: ui-snapshots manifest check
        id: ui-snapshots
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ci.ui-snapshots')
        env:
          PYTHONPATH: firmware/tools
        run: |
          cargo build -p obc-sim --locked
          export SIM="$PWD/target/debug/obc-sim"
          python3 -m ui_frames --all "$RUNNER_TEMP/ui-snapshots"
          python3 -m ui_frames --check "$RUNNER_TEMP/ui-snapshots"
      - name: Upload UI review frames
        if: ${{ !cancelled() && (steps.ui-snapshots.outcome == 'success' || steps.ui-snapshots.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-snapshots/*.png
          if-no-files-found: ignore

  # Routing-profile round-trips through the builder's pack path. These shell out to the real
  # obc-pack binary over the tiny corpus and byte-compare the §8.6 profile table against
  # independently quantized expectations — so they pin the packer's writer against the spec
  # rather than against itself — plus the pure /api/schema and /api/presets endpoints via
  # FastAPI's TestClient. The preflight is what stops a missing binary or corpus from turning
  # the packer half of the suite into a silent skip.
  builder-python:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'builder-python')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: host-tests
          save-if: false
      - uses: ./.github/actions/setup-host-deps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: *python-uv-version
      - name: Prepare web-builder packer tests
        run: |
          uv sync --locked --group builder-test
          cargo build -p obc-bake --bin obc-pack --release --locked
      - name: Packer binary and corpus are present
        run: |
          test -x target/release/obc-pack
          test -f builder/tests/corpus/data/tiny.osm.pbf
      - name: web-builder packer tests (pytest)
        id: python-builder
        run: |
          mkdir -p .artifacts/python
          rm -f .artifacts/python/builder.xml
          PYTHONPATH=. uv run --locked --group builder-test python -m pytest builder/tests/ -v --junitxml=.artifacts/python/builder.xml
      - name: Upload builder Python test results
        if: ${{ !cancelled() && (steps.python-builder.outcome == 'success' || steps.python-builder.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: python-builder-${{ github.run_attempt }}
          path: .artifacts/python/builder.xml
          if-no-files-found: error

  embedded:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'embedded')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # default = the shipping LS021/FLPR map + two-plane path (square-loop GPS, no host feed).
          # It is the whole device: the **USB device plane** (#889) since 2026-07-26 and the **radio**
          # (#1530) since the `ble` feature was retired are compiled, linted and resource-gated by the
          # default legs below — no separate USB or BLE matrix leg exists or is needed, and neither
          # plane can rot in a profile nobody builds.
          - { name: "clippy (default = LS021/FLPR)", cmd: "cargo clippy --locked -- -D warnings" }
          # debug-uart = default + the VCOM host sensor/telemetry feed (the obc-platform debug codec).
          - { name: "clippy (debug-uart)", cmd: "cargo clippy --locked --features debug-uart -- -D warnings" }
          # The real flashed default artifact (LS021/FLPR) under fat LTO + the N3 RAM-budget assert.
          - { name: "build (default = LS021/FLPR, release)", cmd: "set -o pipefail; cargo build --release --locked -vv 2>&1 | tee $RUNNER_TEMP/obc-fw-default-build.log" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # An exported RUSTFLAGS value overrides the board crate's target rustflags wholesale.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/obc-fw-nrf54l
          key: thumbv8m-nrf
      # The FLPR `build.rs` cross-compiles src/flpr/*.c for the VPR with an rv32emc GNU gcc.
      - uses: ./.github/actions/setup-riscv
      - uses: taiki-e/install-action@v2
        if: matrix.name == 'build (default = LS021/FLPR, release)'
        with:
          tool: cargo-nextest@0.9.143
      - name: Sensor simulator tests, lint and device build
        if: matrix.name == 'build (default = LS021/FLPR, release)'
        run: |
          bash firmware/obc-sensor-sim/check.sh
          cd firmware/obc-sensor-sim
          cargo clippy --locked --lib --tests -- -D warnings
          cargo clippy --locked --features device --bin obc-sensor-sim --target thumbv8m.main-none-eabihf -- -D warnings
      - name: "obc-fw-nrf54l: ${{ matrix.name }}"
        working-directory: firmware/obc-fw-nrf54l
        run: ${{ matrix.cmd }}
      # FAR-00's one ELF parser extends the pre-existing boot/poll guards with actual linked
      # `.bss + .data`, exact framebuffer count/size, and the report-only target `size_of` table.
      # Run against the production ELF first; the resource-report rebuild is a separate diagnostic
      # artifact and never changes what ships.
      # `board` also subsumes #677's steady-state poll-frame parser: the largest single `sub sp` in
      # every `TaskStorage<F>::poll`, capped at 12 KiB, with stale-symbol and stale-instruction
      # diagnostics covered by unit tests.
      - name: "obc-fw-nrf54l: default resource baseline"
        if: matrix.name == 'build (default = LS021/FLPR, release)'
        working-directory: firmware/obc-fw-nrf54l
        run: |
          python3 ../tools/resource_guard.py build-rustflags \
            --log "$RUNNER_TEMP/obc-fw-default-build.log" --crate obc-fw-nrf54l
          rustup component add llvm-tools
          python3 ../tools/resource_guard.py board --profile default \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l
          # The resident `App`'s own construction frame (#1446), measured on the **shipping** link —
          # hence here, before the resource-report rebuild below overwrites this same path.
          # `App::init_idle` writes each field straight into the `.bss` slot, so its frame is small
          # (1,572 B) and must stay that way: the field plan's two row forms differ by four tokens,
          # and demoting a `=> Type::init_in_place` row to a plain one silently materialises that
          # component on the boot stack. Nothing else here would notice — resident RAM, `.uninit`,
          # flash, the poll frame and the task bodies are all unchanged by a stack temporary — while
          # a by-value `App` is 50,520 B against 55,000 B of residual main stack, i.e. the MSPLIM
          # HardFault `mount_in_place` already cost us once. 4,096 is the measured figure with
          # headroom, on the same ratchet policy as the frame legs below.
          python3 ../tools/resource_guard.py frames \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l \
            --match init_idle --limit 4096
          cargo build --release --locked --features resource-report
          python3 ../tools/resource_guard.py report --profile default \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l
      - name: "obc-fw-nrf54l: flat store frame ceiling"
        if: matrix.name == 'build (default = LS021/FLPR, release)'
        working-directory: firmware/obc-fw-nrf54l
        run: |
          cargo build --release --locked --bin flat_store_bench
          python3 ../tools/resource_guard.py frames \
            --elf target/thumbv8m.main-none-eabihf/release/flat_store_bench \
            --match 'obc_storage::flat' --limit 16384
          python3 ../tools/resource_guard.py frames \
            --elf target/thumbv8m.main-none-eabihf/release/flat_store_bench \
            --match flat_store_bench --limit 36864
      # The same ceiling, on the **shipping image** — new with FS7.5-c1, because the app now links the
      # flat store and the bench gates above cannot see it there.
      #
      # Two needles, because the frames land in two crates: `obc_storage::flat` is the store, and
      # `flat_store` is the board's binding and storage task. The second one is where the largest frame
      # in this image actually is — `flat_store::serve` at 10,688 B, which is `Store::commit`'s 9,984
      # inlined into the task's out-of-line request handler — so a gate pointed only at the store would
      # measure 6,336 and miss it. That is not hypothetical: this leg exists because the first build of
      # the board mount had `FlatStore::mount` inlined into the board helper, which carried 22,656 B
      # while the store's own needle read 6,336 and passed. `mount`/`mount_in_place` are
      # `#[inline(never)]` now for exactly that reason, and these two needles are what says so.
      #
      # 16,384 is the bench's limit, deliberately: the same code, so the same ceiling — and the app has
      # far less residual stack to spend it against (56,088 B since FS7.5-c2, 37,640 at c1) than the
      # bench does.
      #
      # What keeps `mount_in_place` OUT OF LINE is not these needles — they only measure whichever
      # symbols happen to exist. It is `boot_chain_roots` in resource_baseline.json:
      # `resolve_symbol` raises a stale-root error when a baselined root stops being a symbol, which
      # is exactly what inlining it away would do. These needles measure the frames; that check is
      # what guarantees there is a frame here to measure at all.
      - name: "obc-fw-nrf54l: flat store frame ceiling (shipping image)"
        if: matrix.name == 'build (default = LS021/FLPR, release)'
        working-directory: firmware/obc-fw-nrf54l
        run: |
          python3 ../tools/resource_guard.py frames \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l \
            --match 'obc_storage::flat' --limit 16384
          python3 ../tools/resource_guard.py frames \
            --elf target/thumbv8m.main-none-eabihf/release/obc-fw-nrf54l \
            --match 'flat_store' --limit 16384

  # The obc-boot bootloader (epic #615, #617): workspace-excluded like the board crate, built
  # from its own directory so its .cargo/config.toml selects thumbv8m. No test harness and no
  # FLPR blob (no RISC-V gcc needed). The size guard is the real gate: the shipping (default,
  # no-rtt) release image's flash footprint — .vector_table + .text + .rodata + .data — must fit
  # the 32 KB slot below the app (see firmware/obc-boot/memory.x), with the measured number in
  # the failure so a regression is diagnosable from the log.
  boot:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'boot')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/obc-boot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # Preserve the boot crate's target-specific +strict-align Cargo configuration.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/obc-boot
          key: thumbv8m-boot
      - name: "obc-boot: clippy (default)"
        run: cargo clippy --locked -- -D warnings
      - name: "obc-boot: clippy (rtt)"
        run: cargo clippy --locked --features rtt -- -D warnings
      - name: "obc-boot: build (release)"
        run: set -o pipefail; cargo build --release --locked -vv 2>&1 | tee "$RUNNER_TEMP/obc-boot-build.log"
      - name: "obc-boot: 32 KB size guard"
        run: |
          python3 ../tools/resource_guard.py build-rustflags \
            --log "$RUNNER_TEMP/obc-boot-build.log" --crate obc-boot
          rustup component add llvm-tools
          python3 ../tools/resource_guard.py boot \
            --elf target/thumbv8m.main-none-eabihf/release/obc-boot

  # std-creep guard for the real device: the shared no_std stack (obc-app pulls in reader /
  # route / render) must still compile for the nRF54L's thumbv8m target.
  device:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'device')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: thumbv8m
      - name: cargo build -p obc-app (thumbv8m.main, nRF54L)
        run: cargo build -p obc-app --target thumbv8m.main-none-eabihf --locked
      # Keep the protocol-v4 engine and codec no_std; the fixture producer is host-only.
      - name: cargo build -p obc-link (thumbv8m.main, nRF54L)
        run: cargo build -p obc-link --target thumbv8m.main-none-eabihf --locked
      - name: thumbv8m +strict-align backend probe
        run: python3 firmware/tools/resource_guard.py strict-align

  # Supply-chain gate: advisories + licenses + bans + sources, for both lockfiles (deny.toml).
  deny:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'deny')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (firmware workspace)
        run: cargo deny --all-features --config tools/licenses/deny.toml check
      - name: cargo-deny (obc-fw-nrf54l board crate)
        run: cargo deny --manifest-path firmware/obc-fw-nrf54l/Cargo.toml --all-features --config tools/licenses/deny.toml check
      - name: cargo-deny (obc-boot bootloader)
        run: cargo deny --manifest-path firmware/obc-boot/Cargo.toml --all-features --config tools/licenses/deny.toml check
      - name: cargo-deny (obc-sensor-sim)
        run: cargo deny --manifest-path firmware/obc-sensor-sim/Cargo.toml --all-features --config tools/licenses/deny.toml check
      # The desktop shell is the one artifact a *user* installs, so its tree is the
      # one where a bad licence or a live advisory matters most.
      - name: cargo-deny (obc-desktop app)
        run: cargo deny --manifest-path apps/obc-desktop/Cargo.toml --all-features --config tools/licenses/deny.toml check
      # deny.toml skips the repository's own crates, so it cannot see obc-data reach one.
      - name: obc-data depends on no GPL crate
        run: python3 tools/check_obc_data_licence.py
      # deny.toml gates which licences may enter the tree; THIRD-PARTY.md is the *text* those
      # licences require us to hand over with a binary (#1149). Both belong to the same job:
      # the dependency bump that changes one changes the other, and a stale notice file is only
      # ever discovered at a release tag otherwise, where release.yml links it by tag.
      # Pinned: the committed file is a byte-for-byte diff target, so a generator that changed
      # its own formatting would fail this check with nothing wrong in the tree. Bump the pin
      # and regenerate in the same commit.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: THIRD-PARTY.md is current
        run: tools/licenses/gen-third-party.sh --check

  # The web demo (sim/web-demo) is the firmware's own render path compiled to wasm
  # behind a thin JS-driven host; build it on PRs (not just on the deploy-to-Pages push) so a
  # wasm-only breakage — bindgen surface, embedded assets, Trunk config — is caught before merge.
  # (`ci.wasm-size` owns the Trunk build, so the plan starts this job for the demo's own inputs.)
  wasm:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'wasm')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: trunk build (obc-web-demo → wasm)
        run: trunk build --config docs/Trunk.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web demo browser runner
        working-directory: sim/web-demo/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Shipping web demo browser journey
        id: browser-journey
        run: npm test --prefix sim/web-demo/tests/browser
      - name: Require browser journey execution
        if: ${{ !cancelled() }}
        env:
          JOURNEY_OUTCOME: ${{ steps.browser-journey.outcome }}
        run: test "$JOURNEY_OUTCOME" = success
      - name: Upload web demo browser evidence
        if: ${{ !cancelled() && (steps.browser-journey.outcome == 'success' || steps.browser-journey.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: web-demo-browser-${{ github.run_attempt }}
          path: .artifacts/web-demo/
          if-no-files-found: error
      # The assembly engine (#1024) has to stay browser-shippable: P4 runs *this* code in a tab, so
      # the library must carry no filesystem and no native dependency. Building it for wasm32 with
      # the `cli` feature off is the guard — the CLI is the native driver and owns every std::fs call
      # in the crate, so a stray `std::fs` in the engine fails here rather than in P4.
      - name: cargo build -p obcm-assemble --lib (wasm32, engine only)
        run: cargo build -p obcm-assemble --lib --no-default-features --locked --target wasm32-unknown-unknown

  # Build the shared core and its test-device feature variant. Gate production bytes before
  # handing the same artifact to frontend tests and builds. The test device never ships.
  wasm-bridges:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'wasm-bridges')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: wasm-bridges
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Build builder core and test device
        run: bash builder/build-wasm-bridges.sh
      - name: Builder core size budget
        run: python3 builder/wasm/wasm_size_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: obc-builder-bridge-pkg
          path: builder/app/src/lib/core/pkg
          retention-days: 1
      # The test device. No size budget: it ships to nobody and only the `web` job downloads it.
      - uses: actions/upload-artifact@v4
        with:
          name: obc-flat-device-pkg
          path: builder/app/test-support/flat-device/pkg
          retention-days: 1

  # Render the docs site (stdlib-only Python, no pip) and fail on error, plus the cross-page
  # anchor audit AGENTS.md otherwise asks for by hand: every internal ../page/#anchor must
  # resolve to a real heading id.
  docs:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.57.0"
      - name: Documentation build and link check
        run: just check-docs

  # iOS companion, fast tier: the OBCKit package suite on the macOS host (no simulator).
  # This is what enforces the architecture rules that are otherwise only "test-enforced"
  # locally — CoreBluetoothSeamTests (CoreBluetooth stays inside OBCTransport/BLE/), the
  # protocol vector/contract tests, and every model test.
  #
  # DEVELOPER_DIR pins the Xcode toolchain (project floor is Xcode 26.x, see
  # companion-ios/README.md) so a runner-image update can't silently move it — when the
  # image drops this version the job fails loudly and the pin gets bumped on purpose.
  ios-unit:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'ios-unit')
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare replay assets
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.replay-camera') || contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'swift.obckit-host')
        run: npm ci --prefix companion-ios/ReplayAssets
      - name: Test camera engine
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.replay-camera')
        run: npm test --prefix companion-ios/ReplayAssets
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'swift.obckit-host')
        with:
          cache: false
      - name: Pack the existing Rust host for package tests
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'swift.obckit-host')
        run: tools/build-ios-host.sh --mac-only
      - name: OBCKit package tests (XCTest and Swift Testing, host)
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'swift.obckit-host')
        id: swift-tests
        working-directory: companion-ios/Packages/OBCKit
        run: |
          rm -rf "$RUNNER_TEMP/ios-unit.xcresult" "$GITHUB_WORKSPACE/.artifacts/ios-unit"
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/ios-unit"
          xcodebuild -version > "$GITHUB_WORKSPACE/.artifacts/ios-unit/toolchain.txt"
          swift --version >> "$GITHUB_WORKSPACE/.artifacts/ios-unit/toolchain.txt"
          xcodebuild test -scheme OBCKit-Package -destination 'platform=macOS' -parallel-testing-enabled NO -enableCodeCoverage NO -resultBundlePath "$RUNNER_TEMP/ios-unit.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export native XCTest and Swift Testing results
        if: ${{ !cancelled() && (steps.swift-tests.outcome == 'success' || steps.swift-tests.outcome == 'failure') }}
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ios-unit.xcresult" > .artifacts/ios-unit/test-summary.json
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-unit.xcresult" > .artifacts/ios-unit/tests.json
      - name: Upload native Swift results
        if: ${{ !cancelled() && (steps.swift-tests.outcome == 'success' || steps.swift-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-coverage-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-unit.xcresult
            .artifacts/ios-unit/
          if-no-files-found: error
      - name: Planner PMTiles reader
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'planner.native-tiles')
        id: planner-tiles
        shell: bash
        run: bash companion-ios/PlannerNative/test-tiles.sh 2>&1 | tee "$RUNNER_TEMP/planner-tiles.log"
      - name: Upload planner PMTiles results
        if: ${{ !cancelled() && (steps.planner-tiles.outcome == 'success' || steps.planner-tiles.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-tiles-${{ github.run_attempt }}
          path: ${{ runner.temp }}/planner-tiles.log
          if-no-files-found: error

  # iOS app builds and companion screenshots.
  # The screenshot suite builds its UI-test bundle once, then runs test-without-building.
  # Each build and capture follows the selected suite IDs. The companion Debug build also
  # runs for screenshot-only changes because the capture needs its app and test bundle.
  ios-app:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'ios-app')
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install WebP tools
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.xcuitest')
        run: brew install webp
      # Xcode resolves the selected target's Rust framework before its script phases run.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ios-host
      - name: Start the screenshot simulator
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.xcuitest')
        run: companion-ios/scripts/capture-website-screenshots.sh --boot
      - name: Pack the iOS host (simulator slice)
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ci.ios-device-build') || contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ci.ios-app-build') || contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.xcuitest')
        run: tools/build-ios-host.sh --sim-only
      - name: xcodegen generate
        working-directory: companion-ios
        run: xcodegen generate
      # build-for-testing, not build: the same pass produces the app and the
      # OBCCompanionUITests bundle the screenshot step runs.
      - name: Build (Debug, simulator SDK)
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ci.ios-app-build') || contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.xcuitest')
        working-directory: companion-ios
        run: |
          xcodebuild build-for-testing -project OBCCompanion.xcodeproj -scheme OBCCompanion \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      # -r -a over the whole bundle: in Debug the app code lives in the debug dylib
      # (OBCCompanion.debug.dylib), not the stub executable; -a forces byte matching in
      # binaries regardless of grep flavor.
      - name: Mock marker present in Debug
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ci.ios-app-build') || contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.xcuitest')
        working-directory: companion-ios
        run: grep -raq "OBCMock:DEBUG-only" DerivedData/Build/Products/Debug-iphonesimulator/OBCCompanion.app
      - name: Build OBCDevice (Debug, simulator SDK)
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ci.ios-device-build')
        working-directory: companion-ios
        run: |
          xcodebuild build -project OBCCompanion.xcodeproj -scheme OBCDevice \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Companion website screenshots are current
        if: contains(fromJSON(needs.selection.outputs.plan).selected_suite_ids, 'ios.xcuitest')
        id: ios-screenshots
        env:
          OBC_DERIVED_DATA_PATH: ${{ github.workspace }}/companion-ios/DerivedData
          OBC_XCRESULT_PATH: ${{ runner.temp }}/ios-screenshots.xcresult
        run: companion-ios/scripts/capture-website-screenshots.sh --check
      - name: Upload native screenshot results
        if: ${{ !cancelled() && (steps.ios-screenshots.outcome == 'success' || steps.ios-screenshots.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-screenshots.xcresult
          if-no-files-found: error

  # The Release half of the mock-seam gate: mock and developer-panel code must never ship.
  # It shares no build output with `ios-app` — a different configuration writes a different
  # products directory — so it runs beside it instead of adding four minutes to the wall clock.
  ios-release:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'ios-release')
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ios
      - name: Pack the Rust store client (simulator slice)
        run: tools/build-ios-host.sh --sim-only
      - name: xcodegen generate
        working-directory: companion-ios
        run: xcodegen generate
      - name: Build (Release, simulator SDK)
        working-directory: companion-ios
        run: |
          xcodebuild build -project OBCCompanion.xcodeproj -scheme OBCCompanion \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Mock marker absent from Release
        working-directory: companion-ios
        run: |
          if grep -raq "OBCMock:DEBUG-only" DerivedData/Build/Products/Release-iphonesimulator/OBCCompanion.app; then
            echo "::error::OBCMock build marker found in the Release binary — mock code is shipping"
            exit 1
          fi

  # The web builder's Svelte frontend: type-check, unit tests, production builds.
  #
  # One source tree, three hosts (#895): `npm run build` is the local FastAPI one,
  # `build:web` the static hosted site and `build:desktop` the Tauri shell. All three
  # are built here — a host that stops compiling is otherwise invisible until someone
  # tries to ship it. The *contents* of the web bundle (no job polling, no style
  # editor) are asserted by vitest, which builds and inspects the emitted chunks.
  #
  # The three wasm bridges come from `wasm-bridges` rather than being rebuilt here, so the
  # module the byte-identity tests run against is literally the one the size budget passed. It is
  # a hard dependency, not an optimisation, and it is why the downloads land before `npm ci`:
  # every step below needs them — the TS wrappers import the generated bindings, so `npm run check`
  # type-checks against them, and the vitest suites and `build:all` fail without the artifacts.
  # The assembly bridge's suite is also the *headless smoke* for #1034: it assembles the checked-in
  # cell fixture in Node and compares the result to the bytes the native CLI wrote.
  web:
    needs: [selection, wasm-bridges]
    if: contains(fromJSON(needs.selection.outputs.jobs), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder/app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: obc-builder-bridge-pkg
          path: builder/app/src/lib/core/pkg
      # The device the USB suites run against. The desktop-frontend job does not download it: that
      # job only builds the shipped bundle, which must not contain this package at all.
      - uses: actions/download-artifact@v4
        with:
          name: obc-flat-device-pkg
          path: builder/app/test-support/flat-device/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/app/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: vitest
        id: builder-vitest
        run: |
          rm -f "$RUNNER_TEMP/web-builder-junit.xml"
          npm run test:components -- --reporter=default --reporter=junit --outputFile="$RUNNER_TEMP/web-builder-junit.xml"
      - name: production builds (dev + web + desktop hosts)
        run: npm run build:all
      - name: Upload builder test results
        if: ${{ !cancelled() && (steps.builder-vitest.outcome == 'success' || steps.builder-vitest.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: web-builder-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-builder-junit.xml
          if-no-files-found: error

  # The builder's download journey in a real browser: the shipped `dist/web` build, the real
  # assembly worker, real OPFS, and the checked-in bridge fixture served as a loopback catalog.
  #
  # Its own job rather than a step on `web`, because the registry routes a suite to the job whose
  # step executes it: sharing `web` would make the component tier and this end-to-end journey one
  # route, and neither could be selected without the other. It needs the production core and
  # deliberately not the flat test device — the shipped build must not contain it, and
  # `bundle.test.ts` is what says so.
  #
  # `npm test` builds `dist/web` itself (the package's `pretest`), so the bundle under test can
  # never be stale or built against a different catalog URL.
  web-browser:
    needs: [selection, wasm-bridges]
    if: contains(fromJSON(needs.selection.outputs.jobs), 'web-browser')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: obc-builder-bridge-pkg
          path: builder/app/src/lib/core/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: builder/app/package-lock.json
      - name: Install the builder's build dependencies
        working-directory: builder/app
        run: npm ci
      - name: Install builder browser runner
        working-directory: builder/app/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Builder assemble and download journey
        id: browser-journey
        run: npm test --prefix builder/app/tests/browser
      - name: Require browser journey execution
        if: ${{ !cancelled() }}
        env:
          JOURNEY_OUTCOME: ${{ steps.browser-journey.outcome }}
        run: test "$JOURNEY_OUTCOME" = success
      - name: Planner request budget
        run: npm run test:planner --prefix builder/app/tests/browser
      - name: Upload builder browser evidence
        if: ${{ !cancelled() && (steps.browser-journey.outcome == 'success' || steps.browser-journey.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: web-builder-browser-${{ github.run_attempt }}
          path: .artifacts/web-builder/
          if-no-files-found: error

  desktop-frontend:
    needs: [selection, wasm-bridges]
    if: contains(fromJSON(needs.selection.outputs.jobs), 'desktop-frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: obc-builder-bridge-pkg
          path: builder/app/src/lib/core/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/app/package-lock.json
      - name: Build the desktop bundle
        working-directory: builder/app
        run: |
          npm ci
          npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: obc-desktop-frontend
          path: builder/app/dist/desktop
          retention-days: 1

  desktop:
    needs: [selection, desktop-frontend]
    if: contains(fromJSON(needs.selection.outputs.jobs), 'desktop')
    runs-on: ${{ matrix.os }}
    env:
      # Baked into packaged apps; a runtime variable can still override it for a
      # maintainer testing an unpublished tree.
      OBC_CATALOG_URL: ${{ vars.OBC_CATALOG_URL }}
    strategy:
      # One platform's failure must not hide another's.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
            exe: obc-desktop
          - os: macos-latest
            slug: macos-arm64
            exe: obc-desktop
          - os: windows-latest
            slug: windows-x86_64-msvc
            exe: obc-desktop.exe
    defaults:
      run:
        # Git Bash on the Windows runner, so the shared steps below are one script
        # rather than three. Nothing here needs a Windows-native shell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/obc-desktop
          key: desktop-${{ matrix.slug }}
      # wry's Linux backend. macOS and Windows need nothing extra — which is most of
      # why Tauri was chosen over Electron (#906) — but Linux wants WebKitGTK.
      - name: Install the Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      # The bundle the shell embeds, built once on Linux by `desktop-frontend` and
      # unpacked here. It is byte-identical on all three runners — a Vite build of the
      # same sources — so building it per-platform was three runs of `npm ci` and
      # three Node toolchains for one output. Landing it at the path tauri.conf.json's
      # `frontendDist` names is the whole integration; nothing here runs npm, and the
      # `beforeBuildCommand` in that file is never executed (there is no Tauri CLI in
      # this repo — see the note above about `custom-protocol`).
      - uses: actions/download-artifact@v4
        with:
          name: obc-desktop-frontend
          path: builder/app/dist/desktop
      # Order matters. `cargo test` never produces the plain binary — even with
      # --all-targets it builds bins as *test harnesses*, a different artifact — so the
      # `build` below is a full codegen + link either way. Running it first means the
      # normal lib it produces is already there for `test` to link against, instead of
      # `test` building one set of artifacts and `build` starting a second.
      - name: "obc-desktop: clippy"
        working-directory: apps/obc-desktop
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: "obc-desktop: build (release)"
        working-directory: apps/obc-desktop
        run: cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - name: "obc-desktop: test"
        id: desktop-tests
        working-directory: apps/obc-desktop
        env:
          NEXTEST_PROFILE: ci
        run: |
          rm -f target/nextest/ci/junit.xml
          cargo nextest run --release --locked --config-file ../../.config/nextest.toml --no-tests fail
      - name: Upload native desktop test results
        if: ${{ !cancelled() && (steps.desktop-tests.outcome == 'success' || steps.desktop-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ matrix.slug }}-${{ github.run_attempt }}
          path: apps/obc-desktop/target/nextest/ci/junit.xml
          if-no-files-found: error
      # Recorded so an accidental native dependency or bundling regression is visible.
      - name: "obc-desktop: record the artifact size"
        working-directory: apps/obc-desktop
        run: |
          bytes=$(wc -c < "target/release/${{ matrix.exe }}")
          echo "| ${{ matrix.slug }} | $bytes bytes |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: obc-desktop-${{ matrix.slug }}
          path: apps/obc-desktop/target/release/${{ matrix.exe }}
          retention-days: 7
      # macOS ships two architectures and this crate is built on the Apple-silicon
      # runner, so cross-build the Intel slice to keep a future universal bundle open.
      #
      # Push events only: a second target triple is build-only insurance, not a
      # correctness gate on the app anyone runs.
      - name: "obc-desktop: the macOS Intel slice (build-only)"
        if: runner.os == 'macOS' && github.event_name == 'push'
        working-directory: apps/obc-desktop
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          file target/x86_64-apple-darwin/release/obc-desktop

  # Launch the existing Linux release artifact with its embedded frontend.
  desktop-launch:
    needs: [selection, desktop]
    if: contains(fromJSON(needs.selection.outputs.jobs), 'desktop-launch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: obc-desktop-linux-x86_64
          path: apps/obc-desktop/target/release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: *python-uv-version
      - name: Install Linux launch dependencies
        run: |
          sudo apt-get update
          webkit_version=$(apt-cache policy libwebkit2gtk-4.1-0 | awk '/Candidate:/ {print $2}')
          sudo apt-get install -y "libwebkit2gtk-4.1-0=$webkit_version" "webkit2gtk-driver=$webkit_version" xvfb imagemagick dbus-daemon
          uv sync --locked --group desktop-e2e
          cargo install tauri-driver --version 2.0.6 --locked
          chmod +x apps/obc-desktop/target/release/obc-desktop
          dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver xvfb
      - name: Launch the release frontend and select a catalog region
        id: launch
        env:
          OBC_DESKTOP_EVIDENCE: ${{ runner.temp }}/desktop-launch
        run: xvfb-run -a dbus-run-session -- uv run --locked --group desktop-e2e python apps/obc-desktop/e2e/launch.py
      - name: Upload Linux launch evidence
        if: ${{ !cancelled() && (steps.launch.outcome == 'success' || steps.launch.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-launch-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-launch
          if-no-files-found: error
          retention-days: 7

  planner-search:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'planner-search')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: planner/search/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix planner/search
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: *python-uv-version
      - run: UV_PROJECT_ENVIRONMENT="$PWD/planner/search/.venv" uv sync --locked --group search-test
      - run: npm test --prefix planner/search
      - run: npm run test:query --prefix planner/search
      - run: npm ci --prefix planner/tiles
      - run: npm test --prefix planner/tiles && npm run build --prefix planner/tiles

  verification:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'verification')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/verification/package-lock.json
      - run: npm ci --prefix tools/verification
      - run: npm run check --prefix tools/verification
      - run: npm run test:ci --prefix tools/verification
      - run: npm run build --prefix tools/verification
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-verification-${{ github.run_attempt }}
          path: tools/verification/verification-junit.xml
          if-no-files-found: error
          retention-days: 7

  # Single aggregate gate: make THIS the required status check on main/develop. It reports every
  # planned suite against the jobs the plan routed it to, so a job the plan never selected is
  # "not selected" and a selected job that was skipped is a failure. A failed `selection` job
  # publishes no plan, which fails this gate rather than silently passing.
  ci:
    if: always()
    needs: [selection, guards, fmt, clippy, test, ui-snapshots, builder-python, embedded, boot, device, deny, wasm, wasm-bridges, docs, ios-unit, ios-app, ios-release, web, web-browser, desktop-frontend, desktop, desktop-launch, verification, planner-search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify selected suites and required jobs
        env:
          OBC_SELECTION_PLAN: ${{ needs.selection.outputs.plan }}
          OBC_NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci_aggregate.py
