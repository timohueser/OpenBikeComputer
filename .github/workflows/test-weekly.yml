name: Weekly test suites

on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  ios-application:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: brew install xcodegen
      - name: Run registered weekly iOS suites
        id: test
        run: companion-ios/scripts/test-application.sh
      - name: Upload native application results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-application-${{ github.run_attempt }}
          path: .artifacts/ios-application.xcresult
          if-no-files-found: error
  trailview:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: builder/web/package-lock.json
      - name: Install the builder's build dependencies
        working-directory: builder/web
        run: npm ci
      - name: Install builder browser runner
        working-directory: builder/web/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Run registered weekly TrailView suites
        id: test
        run: npm run test:trailview --prefix builder/web/tests/browser
      - name: Upload TrailView browser results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: trailview-weekly-${{ github.run_attempt }}
          path: .artifacts/web-builder/
          if-no-files-found: error
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Run registered weekly storage suites
        id: test
        shell: bash
        run: |
          mkdir -p .artifacts
          cargo test -p obc-storage --locked 2>&1 | tee .artifacts/storage-weekly.log
      - name: Upload native storage results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-weekly-${{ github.run_attempt }}
          path: .artifacts/storage-weekly.log
          if-no-files-found: error
