name: cairn mode

# The mode gate: the pull request's diff against the rules of its `Mode:` line. It runs on every
# pull request with no test-plan selection, so a change to docs or specs only, or to the body,
# runs it too. It fails only for an approved system or a prototype.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: cairn-mode-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `issues: read` lets a `change #N` read issue N.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  mode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads the dependency graph of the base from a git worktree.
          fetch-depth: 0
          persist-credentials: false
      # The Rust adapter reads `cargo metadata`; the gate builds nothing.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: The diff against the mode
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/cairn/cairn.py check --pr --base "$BASE"
