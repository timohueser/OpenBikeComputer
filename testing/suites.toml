schema = 2

# What Cargo already knows is not written here. `cargo metadata` supplies every package,
# every dependency edge and every test binary, and `tools/test_plan.py` holds the CI job
# table. This file holds the two things neither can see: the path triggers and build
# commands of Cargo packages that other languages or tools reach, and the suites that no
# Cargo package owns.
#
# `route` says when a suite runs:
#   ordinary  selected by the change
#   required  runs whenever one of its jobs starts
#   manual    explicitly invoked only
#   live      contacts a live service, invoked by hand

# ── Cargo packages with facts Cargo cannot derive ───────────────────────────

# The vector files are a contract, not a dependency: a codec consumer never imports them.
[[package]]
name = "obc-app"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-formats"
route = "required"
triggers = ["specs/**"]

[[package]]
name = "obc-link"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-dfu"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-ble"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-vectors"
route = "required"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-web-convert"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-usb"
triggers = ["specs/FLAT_Store_Protocol.md", "specs/vectors/flat-store-v4/**"]

[[package]]
name = "obc-fixtures"
triggers = ["fixtures/catalog.toml"]

[[package]]
name = "obc-sim"
triggers = ["fixtures/catalog.toml"]

[[package]]
name = "obc-bake"
triggers = ["host/obc-bake/regions.toml"]

[[package]]
name = "obc-bench"
triggers = ["host/obc-bench/golden.txt"]

[[package]]
name = "obc-pack"
triggers = ["builder/presets/**"]

# Both read the checked-in assembly fixture, so a change under `fixtures/` reaches them.
[[package]]
name = "obcm-assemble"
fixtures = true
triggers = ["apps/obc-web-assemble/tests/fixture/**"]

[[package]]
name = "obc-web-assemble"
fixtures = true
triggers = ["apps/obc-web-assemble/tests/fixture/**"]

# The board runs the host crate's detour and ride logic; no Cargo edge carries that.
[[package]]
name = "obc-host-core"
triggers = ["firmware/obc-fw-nrf54l/src/detour.rs", "firmware/obc-fw-nrf54l/src/flat_ride.rs"]

[[package]]
name = "obc-ios-host"
triggers = [
  "apps/obc-sim/assets/grimsel-demo.obcm",
  "fixtures/sources/sim-grimsel/routes/grimsel-climb.obcr",
  "fixtures/sources/sim-grimsel/tracks/grimsel-climb.gpx",
]

# The three standalone Cargo roots are not in the workspace nextest run, so each names the
# command a local `obc test affected` uses for it.
[[package]]
name = "obc-fw-nrf54l"
command = "cargo build --manifest-path firmware/obc-fw-nrf54l/Cargo.toml --release --locked"
triggers = ["rust-toolchain.toml"]
platforms = ["linux"]

[[package]]
name = "obc-boot"
command = "cargo build --manifest-path firmware/obc-boot/Cargo.toml --release --locked"
platforms = ["linux"]

[[package]]
name = "obc-desktop"
command = "cargo test --manifest-path apps/obc-desktop/Cargo.toml --release --locked"
triggers = ["builder/app/**"]

# ── Suites no Cargo package owns ────────────────────────────────────────────

[[suite]]
id = "web.demo-browser"
route = "ordinary"
command = "npm test --prefix apps/obc-web-demo/tests/browser"
jobs = ["wasm"]
fixtures = ["embedded-demo-assets"]
platforms = ["linux", "macos"]
triggers = ["apps/obc-web-demo/**", "apps/obc-sim/assets/**", "docs/index.html", "docs/Trunk.toml"]

[[suite]]
id = "web.builder-vitest"
route = "ordinary"
command = "cd builder/app && npm test"
jobs = ["web"]
fixtures = ["checked-in-web-fixtures"]
triggers = [
  "builder/app/**/*.test.ts",
  "builder/app/src/**",
  "builder/app/test-support/**",
  "builder/app/package.json",
  "builder/app/package-lock.json",
  "builder/app/vite.config.ts",
  "specs/vectors/**",
  "host/obc-flat-device/**",
]

# The whole app is the subject, the bridge fixture is the input, and the shared catalog
# generator is what publishes it. The schema examples are not here: this catalog is cut
# from the bridge fixture, and only the desktop smoke reads the examples.
[[suite]]
id = "web.verification"
route = "ordinary"
command = "npm run verify --prefix apps/obc-verification"
jobs = ["verification"]
platforms = ["linux", "macos"]
triggers = ["apps/obc-verification/**"]

[[suite]]
id = "web.builder-browser"
route = "ordinary"
command = "npm test --prefix builder/app/tests/browser"
jobs = ["web-browser"]
fixtures = ["checked-in-web-fixtures"]
platforms = ["linux", "macos"]
triggers = ["builder/app/**", "apps/obc-web-assemble/**", "tools/fixture_catalog.py"]

# The job table is not derived from the builders it describes, so the unit tests that pin
# it against `build-wasm-bridges.sh` and the Trunk page are triggered by those files too.
# The `guards` job is unconditional, so they also run on every pull request regardless.
[[suite]]
id = "python.repository-tools"
route = "required"
command = "mkdir -p .artifacts/coverage/repository-tools && rm -rf .artifacts/python/repository-tools && python3 -m coverage run --data-file=.artifacts/coverage/repository-tools/.coverage --source=tools -m xmlrunner discover -s tools/tests -v -o .artifacts/python/repository-tools"
jobs = ["guards", "selection"]
triggers = [
  "tools/requirements-test.txt",
  "tools/*.py",
  "tools/**/*.py",
  "testing/*.toml",
  "docs/testing.md",
  ".github/workflows/**",
  "builder/build-wasm-bridges.sh",
  "docs/index.html",
  "docs/Trunk.toml",
]

# The sweep script and its manifest are inputs to this suite, not just its subjects:
# `test_ui_snapshot_manifest.py` reads both, and it is the only thing that catches an
# `--expect-screen` stripped off an existing command — the frames are unchanged, so
# `ci.ui-snapshots` still passes.
[[suite]]
id = "python.firmware-tools"
route = "ordinary"
command = "mkdir -p .artifacts/coverage/firmware-tools && rm -rf .artifacts/python/firmware-tools && python3 -m coverage run --data-file=.artifacts/coverage/firmware-tools/.coverage --source=firmware/tools -m xmlrunner discover -s firmware/tools/tests -v -o .artifacts/python/firmware-tools"
jobs = ["test"]
triggers = [
  "tools/requirements-test.txt",
  "firmware/tools/*.py",
  "firmware/tools/**/*.py",
  "firmware/ui-snapshots.sh",
  "firmware/ui-snapshots.sha256",
]

[[suite]]
id = "python.builder"
route = "ordinary"
command = "rm -f .artifacts/python/builder.xml && PYTHONPATH=. python3 -m pytest builder/tests/ -v --junitxml=.artifacts/python/builder.xml --cov=builder/server --cov-report=lcov:.artifacts/coverage/builder/lcov.info --cov-report=term"
jobs = ["builder-python"]
fixtures = ["builder-corpus"]
triggers = [
  "builder/tests/**",
  "builder/presets/**",
  "builder/server/*.py",
  "builder/server/**/*.py",
  "builder/requirements*.txt",
]

[[suite]]
id = "swift.obckit-host"
route = "ordinary"
command = "cd companion-ios/Packages/OBCKit && xcodebuild test -scheme OBCKit-Package -destination 'platform=macOS' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO"
jobs = ["ios-unit"]
fixtures = ["captured-met", "legacy-library"]
platforms = ["macos"]
triggers = [
  "companion-ios/Packages/OBCKit/Package.swift",
  "companion-ios/Packages/OBCKit/Sources/**",
  "companion-ios/Packages/OBCKit/Tests/**",
  "specs/vectors/**",
]
sleep_exception = { reason = "Condition polling has a 30-second default deadline; negative observation windows and mock/model timing assertions use bounded real time.", issue = "#1788" }

[[suite]]
id = "ios.xcuitest"
route = "ordinary"
command = "companion-ios/scripts/capture-website-screenshots.sh --check"
jobs = ["ios-app"]
platforms = ["macos"]
triggers = [
  "companion-ios/scripts/capture-website-screenshots.sh",
  "companion-ios/OBCCompanionUITests/WebsiteScreenshotTests.swift",
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/Packages/OBCKit/Sources/**",
]
budget_exception = { reason = "Simulator setup and the capture took 190 to 234 seconds across CI runs 35112589078 and 35113939232, of which 133 and 162 seconds is native test execution. The app is built once by the job, and the simulator boots beside that build.", issue = "#1788" }

# ── Required CI validations that own no test source ─────────────────────────

[[suite]]
id = "ci.rust-workspace-tests"
route = "ordinary"
command = "obc check test"
jobs = ["desktop", "test"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "tools/fixtures.py"]

[[suite]]
id = "ci.rust-fixture-tests"
route = "ordinary"
command = "bash tools/ci/test.sh nextest-fixtures"
jobs = ["test"]
fixtures = ["test"]
triggers = ["fixtures/catalog.toml", "tools/fixtures.py"]

[[suite]]
id = "ci.rust-format"
route = "required"
command = "obc check fmt"
jobs = ["fmt"]
foundation = true
triggers = ["rustfmt.toml"]

[[suite]]
id = "ci.rust-clippy"
route = "ordinary"
command = "obc check clippy"
jobs = ["boot", "clippy", "desktop", "embedded"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[suite]]
id = "ci.rust-builds"
route = "ordinary"
command = "obc check device board wasm"
jobs = ["boot", "builder-python", "desktop", "device", "embedded", "ui-snapshots", "wasm"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[suite]]
id = "ci.dependencies"
route = "ordinary"
command = "obc check deny"
jobs = ["deny", "test"]
foundation = true
triggers = ["firmware/tools/check_dependencies.py", "firmware/tools/dependency_rules.json", "deny.toml"]

[[suite]]
id = "ci.resource-contracts"
route = "ordinary"
command = "python3 firmware/tools/resource_guard.py strict-align"
jobs = ["boot", "device", "embedded"]
foundation = true
triggers = [
  "firmware/tools/resource_baseline.json",
  "firmware/tools/resource_guard.py",
  "firmware/tools/strict_align_probe.rs",
]

[[suite]]
id = "ci.ui-snapshots"
route = "ordinary"
command = "firmware/ui-snapshots.sh OUT && python3 firmware/tools/ui_snapshot_manifest.py check firmware/ui-snapshots.sha256 OUT"
jobs = ["ui-snapshots"]
fixtures = ["sim"]
triggers = [
  "firmware/ui-snapshots.sh",
  "firmware/ui-snapshots.sha256",
  "firmware/tools/ui_snapshot_manifest.py",
  "firmware/obc-app/src/**",
  "firmware/obc-render/src/**",
  "apps/obc-sim/src/**",
  "firmware/obc-app/i18n/*.toml",
  "firmware/obc-app/assets/**",
  "firmware/obc-render/fonts/**",
  "apps/obc-sim/assets/**",
  "fixtures/catalog.toml",
  "fixtures/sources/sim-*/**",
]

[[suite]]
id = "ci.wasm-size"
route = "ordinary"
command = "bash builder/build-wasm-bridges.sh"
jobs = ["wasm", "wasm-bridges"]
foundation = true
triggers = [
  "builder/app/package-lock.json",
  "builder/build-wasm-bridges.sh",
  "firmware/tools/wasm_size_guard.py",
  "host/obc-flat-device/**",
  "docs/Trunk.toml",
  "docs/index.html",
]

[[suite]]
id = "ci.web-build"
route = "ordinary"
command = "obc check frontend"
jobs = ["desktop-frontend", "web"]
triggers = ["builder/app/package.json", "builder/app/package-lock.json", "builder/app/src/**"]

[[suite]]
id = "ci.docs"
route = "required"
command = "obc check docs"
jobs = ["docs"]
# The agent on-ramps are owned here so they are not unowned paths. `build_docs.py` does not
# read them; the check that does is the unconditional `guards` job.
triggers = ["docs/**", "CLAUDE.md", "AGENTS.md"]

[[suite]]
id = "ci.licenses"
route = "ordinary"
command = "tools/licenses/gen-third-party.sh --check"
jobs = ["deny"]
foundation = true
triggers = ["Cargo.lock", "builder/app/package-lock.json", "about.toml", "THIRD-PARTY.md", "tools/licenses/**"]

[[suite]]
id = "ci.fixture-policy"
route = "required"
command = "python3 tools/check_fixture_policy.py"
jobs = ["guards"]
triggers = ["fixtures/catalog.toml", "tools/check_fixture_policy.py", "tools/fixtures.py"]

[[suite]]
id = "ci.card-scheduler-guard"
route = "required"
command = "python3 tools/check_card_scheduler.py"
jobs = ["guards"]
triggers = ["tools/check_card_scheduler.py"]

[[suite]]
id = "ci.render-key-guard"
route = "required"
command = "python3 tools/check_render_keys.py"
jobs = ["guards"]
triggers = ["tools/check_render_keys.py"]

[[suite]]
id = "ci.catalog-ownership-guard"
route = "required"
command = "python3 tools/check_catalog_ownership.py"
jobs = ["guards"]
triggers = ["tools/check_catalog_ownership.py"]

[[suite]]
id = "ci.one-home-guard"
route = "required"
command = "python3 tools/check_one_home.py"
jobs = ["guards"]
triggers = ["tools/check_one_home.py"]

[[suite]]
id = "ci.screen-vocabulary-guard"
route = "required"
command = "python3 tools/check_screen_vocabulary.py"
jobs = ["guards"]
triggers = ["tools/check_screen_vocabulary.py"]

[[suite]]
id = "ci.retired-map-stack"
route = "required"
command = "python3 tools/check_retired_map_stack.py"
jobs = ["guards"]
triggers = ["tools/check_retired_map_stack.py"]

# Only a Mac can link or run the iOS host, so Linux type-checks it instead. The host
# composes nine crates and no build graph carries the iOS target edge, so it rides every
# run of the `clippy` job rather than naming a few of them as triggers. No `obc check`
# gate runs it, so a local run never claims it.
[[suite]]
id = "ci.ios-host-portability"
route = "required"
command = "cargo check -p obc-ios-host --target aarch64-apple-ios --locked"
jobs = ["clippy"]
ci_only = true

# The app links OBCKit, and no Swift dependency graph exists to derive that edge: an
# OBCKit API change breaks `xcodebuild build` without touching a file under OBCCompanion/.
# build-for-testing, because the same pass produces the UI-test bundle `ios.xcuitest` runs.
[[suite]]
id = "ci.ios-app-build"
route = "ordinary"
command = "xcodebuild build-for-testing -project companion-ios/OBCCompanion.xcodeproj -scheme OBCCompanion"
jobs = ["ios-app"]
platforms = ["macos"]
triggers = [
  "companion-ios/scripts/generate-website-fixture.py",
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/Packages/OBCKit/Package.swift",
  "companion-ios/Packages/OBCKit/Sources/**",
]

# Mock and developer-panel code must never ship. The Debug grep rides the build above and
# proves this grep is not vacuous; the Release build is its own job because it shares no
# output with the Debug one and would otherwise extend the pull-request wall clock.
[[suite]]
id = "ci.ios-release-build"
route = "ordinary"
command = "xcodebuild build -project companion-ios/OBCCompanion.xcodeproj -scheme OBCCompanion -configuration Release"
jobs = ["ios-release"]
platforms = ["macos"]
triggers = [
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/Packages/OBCKit/Package.swift",
  "companion-ios/Packages/OBCKit/Sources/**",
]

# The shell links the Rust host through an XCFramework and no Swift dependency graph
# carries that edge: a change in the host crate, in the shared host modules under it, or
# in the script that packs the slices breaks this build without touching OBCDevice/.
[[suite]]
id = "ci.ios-device-build"
route = "ordinary"
command = "xcodebuild build -project companion-ios/OBCCompanion.xcodeproj -scheme OBCDevice"
jobs = ["ios-app"]
platforms = ["macos"]
triggers = [
  "companion-ios/OBCDevice/**",
  "companion-ios/project.yml",
  "apps/obc-ios-host/**",
  "host/obc-host-core/**",
  "tools/build-ios-host.sh",
]

[[suite]]
id = "e2e.desktop-linux-launch"
route = "ordinary"
command = "xvfb-run -a dbus-run-session -- python3 apps/obc-desktop/e2e/launch.py"
jobs = ["desktop-launch"]
platforms = ["linux"]
triggers = [
  "apps/obc-desktop/**",
  "builder/app/**",
  "host/obc-pack/schema/*.example.json",
  "tools/fixture_catalog.py",
]

# ── Explicitly invoked work ─────────────────────────────────────────────────

[[suite]]
id = "fixtures.assistant-inputs"
route = "manual"
command = "python3 fixtures/verify-assistant-inputs.py"
triggers = ["fixtures/verify-assistant-inputs.py", "fixtures/sources/ride-assistant/**"]

[[suite]]
id = "fixtures.landmark-content"
route = "manual"
command = "python3 fixtures/verify-landmark-content.py"
triggers = [
  "fixtures/verify-landmark-content.py",
  "host/obc-pack/src/landmarks/**",
  "fixtures/sources/ride-assistant/assistant-wiki.json",
]

[[suite]]
id = "fixtures.assistant-places"
route = "manual"
command = "python3 fixtures/verify-assistant-places.py"
package = "obc-pack"
targets = ["assistant_places"]
triggers = [
  "fixtures/verify-assistant-places.py",
  "host/obc-pack/tests/assistant_places.rs",
  "firmware/obc-reader/src/reader/places.rs",
]

[[suite]]
id = "fixtures.peak-content"
route = "manual"
command = "python3 fixtures/verify-peak-content.py"
triggers = [
  "fixtures/verify-peak-content.py",
  "host/obc-pack/src/landmarks/**",
  "fixtures/sources/peak-view/peak-articles-source.json",
]

[[suite]]
id = "manual.obc-link"
route = "manual"
command = "cargo run -p obc-link --features std --example flat_vectors --release --locked"
package = "obc-link"
targets = ["flat_vectors"]

[[suite]]
id = "manual.obc-vectors"
route = "manual"
command = "cargo run -p obc-vectors --example regenerate --release --locked"
package = "obc-vectors"
targets = ["regenerate"]

[[suite]]
id = "manual.obc-web-assemble"
route = "manual"
command = "cargo run -p obc-web-assemble --example fixture --release --locked"
package = "obc-web-assemble"
targets = ["fixture"]

[[suite]]
id = "manual.obc-display"
route = "manual"
command = "cargo run -p obc-display --example row_hash_timing --release --locked"
package = "obc-display"
targets = ["row_hash_timing"]

[[suite]]
id = "live.copernicus"
route = "live"
command = "cargo test -p obc-dem --locked --test decode --test real_tile -- --ignored --nocapture"
package = "obc-dem"
targets = ["decode", "real_tile"]

# `test-weekly.yml` invokes this each Monday, and a maintainer can invoke it by hand. The
# schedule belongs to that workflow; this row owns the XCUITest classes and the command.
[[suite]]
id = "ios.application-weekly"
route = "manual"
command = "companion-ios/scripts/test-application.sh"
platforms = ["macos"]
triggers = ["companion-ios/OBCCompanionUITests/**"]
