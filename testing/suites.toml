scheduled = "none"
extra_triggers = ["tools/requirements-test.txt", "tools/*.py", "tools/**/*.py", "testing/*.toml", "docs/testing.md", ".github/workflows/**"]
coverage_component = "dev-tools"
ownership = [
  { kind = "path", source = "python-test", pattern = "tools/tests/test_*.py" },
  { kind = "workflow", pattern = "python3 -m coverage run --data-file=.artifacts/coverage/repository-tools/.coverage --source=tools -m xmlrunner discover -s tools/tests -v -o .artifacts/python/repository-tools" },
  { kind = "workflow", pattern = "python3 -m coverage lcov --data-file=.artifacts/coverage/repository-tools/.coverage *" },
  { kind = "workflow", pattern = "python3 tools/coverage_report.py --scope python --lcov .artifacts/coverage/repository-tools/*" },
  { kind = "workflow", pattern = "python3 tools/suite_registry.py *" },
  { kind = "workflow", pattern = "python3 tools/ci_aggregate.py" },
]

[[suite]]
id = "python.firmware-tools"
surface = "dev-tools"
level = "contract"
command = "mkdir -p .artifacts/coverage/firmware-tools && rm -rf .artifacts/python/firmware-tools && python3 -m coverage run --data-file=.artifacts/coverage/firmware-tools/.coverage --source=firmware/tools -m xmlrunner discover -s firmware/tools/tests -v -o .artifacts/python/firmware-tools"
fixtures = []
pull_request = "affected"
scheduled = "none"
# The sweep script and its manifest are inputs to this suite, not just its subjects:
# `test_ui_snapshot_manifest.py` reads both, and it is the only thing that catches an
# `--expect-screen` stripped off an existing command — the frames are unchanged, so `ci.ui-snapshots`
# still passes.
extra_triggers = [
  "tools/requirements-test.txt",
  "firmware/tools/*.py",
  "firmware/tools/**/*.py",
  "firmware/ui-snapshots.sh",
  "firmware/ui-snapshots.sha256",
]
coverage_component = "dev-tools"
ownership = [
  { kind = "path", source = "python-test", pattern = "firmware/tools/tests/test_*.py" },
  { kind = "workflow", pattern = "python3 -m coverage run --data-file=.artifacts/coverage/firmware-tools/.coverage --source=firmware/tools -m xmlrunner discover -s firmware/tools/tests -v -o .artifacts/python/firmware-tools" },
  { kind = "workflow", pattern = "python3 -m coverage lcov --data-file=.artifacts/coverage/firmware-tools/.coverage *" },
  { kind = "workflow", pattern = "python3 tools/coverage_report.py --scope python --lcov .artifacts/coverage/firmware-tools/*" },
]

