schema = 2

# What Cargo already knows is not written here. `cargo metadata` supplies every package,
# every dependency edge and every test binary, and `tools/test_plan.py` holds the CI job
# table. This file holds the two things neither can see: the path triggers and build
# commands of Cargo packages that other languages or tools reach, and the suites that no
# Cargo package owns.
#
# `route` says when a suite runs:
#   ordinary  selected by the change
#   required  runs whenever one of its jobs starts
#   manual    explicitly invoked only
#   live      contacts a live service, invoked by hand

# ── Cargo packages with facts Cargo cannot derive ───────────────────────────

# The vector files are a contract, not a dependency: a codec consumer never imports them. The About
# credits are tested against data/sources.toml, which obc-data embeds without a Cargo edge to it.
[[package]]
name = "obc-app"
triggers = ["specs/vectors/**", "data/sources.toml"]

# The captured planner export is under `fixtures/`, which already selects every unit that declares
# fixture inputs. Its SwiftPM duplicate is not, and only this suite holds the two identical.
[[package]]
name = "obc-route"
triggers = ["companion-ios/Packages/OBCKit/Sources/OBCMock/Fixtures/sample-import.gpx"]

[[package]]
name = "obc-formats"
route = "required"
triggers = ["specs/**"]

[[package]]
name = "obc-link"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-dfu"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-ble"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-vectors"
route = "required"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-builder-bridge"
fixtures = true
triggers = ["specs/vectors/**", "builder/presets/**", "builder/wasm/tests/fixture/**"]

[[package]]
name = "obc-usb"
triggers = ["specs/FLAT_Store_Protocol.md", "specs/vectors/flat-store-v4/**"]

[[package]]
name = "obc-fixtures"
triggers = ["fixtures/catalog.toml"]

# The inspector reads the committed artefacts to prove it names them; no Cargo edge carries that.
[[package]]
name = "obc-inspect"
triggers = [
  "specs/vectors/**",
  "apps/obc-sim/assets/grimsel-demo.obcm",
  "fixtures/sources/sim-grimsel/routes/**",
]

[[package]]
name = "obc-sim"
triggers = ["fixtures/catalog.toml"]

# Both compile the shipped preset in with `include_str!` and own the guard that fails when the
# skin-preview fixture no longer matches it; obc-bake also reads data/regions/. No Cargo edge carries that.
[[package]]
name = "obc-bake"
triggers = ["builder/presets/**", "data/regions/**", "data/sources.toml"]

# Its tests load the checked-in registry and regions; no Cargo edge carries that.
[[package]]
name = "obc-data"
triggers = ["data/**", "tools/basemap_tool.py"]

# Its tests plan the checked-in live environment, and run the Python steps and read their imports.
[[package]]
name = "obc-data-steps"
triggers = [
  "data/**",
  ".python-version",
  "pyproject.toml",
  "uv.lock",
  "tools/step_request.py",
  "tools/data_registry.py",
  "tools/planner_*.py",
  "tools/planner_mvt_verify.mjs",
  "apps/planner-search/*.py",
  "apps/planner-search/*.sql",
  "apps/planner-search/web/address-terms.json",
  "apps/planner-search/query/*.py",
  "apps/planner-search/query/contract.json",
  "host/obc-search-bake/policy.py",
  "builder/app/src/lib/planner/poi-kinds.json",
]

[[package]]
name = "obc-bench"
triggers = ["host/obc-bench/golden.txt"]

# Both write credits from data/sources.toml, which obc-data embeds without a Cargo edge to it.
[[package]]
name = "obc-pack"
triggers = ["builder/presets/**", "data/sources.toml"]

[[package]]
name = "route-build"
triggers = ["data/sources.toml"]

# Both read the checked-in assembly fixture, so a change under `fixtures/` reaches them.
[[package]]
name = "obcm-assemble"
fixtures = true
triggers = ["builder/wasm/tests/fixture/**"]

# The factory ride is built from the app's bundled route.
[[package]]
name = "obc-replay"
triggers = ["companion-ios/Packages/OBCKit/Sources/OBCFormats/Resources/grimsel-pass.gpx"]

# The board runs the host crate's detour and ride logic; no Cargo edge carries that.
[[package]]
name = "obc-host-core"
triggers = ["firmware/obc-fw-nrf54l/src/detour.rs", "firmware/obc-fw-nrf54l/src/flat_ride.rs", "firmware/obc-fw-nrf54l/src/factory_demo_ride.rs"]

# The answer encoder test reads the shared route answer vector; no Cargo edge carries that.
[[package]]
name = "route-engine"
triggers = ["specs/vectors/route-answer.json"]

[[package]]
name = "obc-ios-host"
triggers = [
  "apps/obc-sim/assets/grimsel-demo.obcm",
  "fixtures/sources/sim-grimsel/routes/grimsel-climb.obcr",
  "fixtures/sources/sim-grimsel/tracks/grimsel-climb.gpx",
]

# The standalone Cargo roots are not in the workspace nextest run, so each names the
# command a local `obc test affected` uses for it.
[[package]]
name = "obc-fw-nrf54l"
command = "cargo build --manifest-path firmware/obc-fw-nrf54l/Cargo.toml --release --locked"
triggers = ["rust-toolchain.toml"]
platforms = ["linux"]

[[package]]
name = "obc-sensor-sim"
command = "bash firmware/obc-sensor-sim/check.sh"
platforms = ["linux", "macos"]

[[package]]
name = "obc-boot"
command = "cargo build --manifest-path firmware/obc-boot/Cargo.toml --release --locked"
platforms = ["linux"]

[[package]]
name = "obc-desktop"
command = "cargo test --manifest-path apps/obc-desktop/Cargo.toml --release --locked"
triggers = ["builder/app/**"]

# ── Suites no Cargo package owns ────────────────────────────────────────────

[[suite]]
id = "web.demo-browser"
route = "ordinary"
command = "npm test --prefix apps/obc-web-demo/tests/browser"
jobs = ["wasm"]
fixtures = ["embedded-demo-assets"]
platforms = ["linux", "macos"]
triggers = ["apps/obc-web-demo/**", "apps/obc-sim/assets/**", "docs/index.html", "docs/Trunk.toml", "docs/assets/**", "docs/templates/**", "docs/build_docs.py"]

[[suite]]
id = "web.builder-vitest"
route = "ordinary"
command = "cd builder/app && npm test"
jobs = ["web"]
fixtures = ["checked-in-web-fixtures"]
triggers = [
  "docs/assets/theme.css", "docs/assets/fonts/**",
  "builder/app/**/*.test.ts",
  "builder/app/src/**",
  "builder/app/test-support/**",
  "builder/app/package.json",
  "builder/app/package-lock.json",
  "tools/planner_mvt_verify.mjs",
  "builder/app/vite.config.ts",
  "specs/vectors/**",
  "host/obc-flat-device/**",
  "apps/planner-search/query/contract.json",
  # The web build embeds credits from it.
  "data/sources.toml",
]

# The whole app is the subject, the bridge fixture is the input, and the shared catalog
# generator is what publishes it. The schema examples are not here: this catalog is cut
# from the bridge fixture, and only the desktop smoke reads the examples.
[[suite]]
id = "web.verification"
route = "ordinary"
command = "npm run verify --prefix apps/obc-verification"
jobs = ["verification"]
platforms = ["linux", "macos"]
triggers = ["apps/obc-verification/**"]

[[suite]]
id = "web.builder-browser"
route = "ordinary"
command = "npm test --prefix builder/app/tests/browser"
jobs = ["web-browser"]
fixtures = ["checked-in-web-fixtures"]
platforms = ["linux", "macos"]
triggers = ["docs/assets/theme.css", "docs/assets/fonts/**", "builder/app/**", "builder/wasm/**", "tools/fixture_catalog.py"]

[[suite]]
id = "web.planner-requests"
route = "ordinary"
command = "npm run test:planner --prefix builder/app/tests/browser"
jobs = ["web-browser"]
platforms = ["linux", "macos"]
triggers = [
  "builder/app/src/components/planner/**",
  "builder/app/src/lib/planner/**",
  "builder/app/src/planner.ts",
  "builder/app/planner.html",
  "builder/app/tests/browser/planner/**",
  "builder/app/tests/browser/playwright.planner.config.js",
  "builder/app/tests/browser/package.json",
  "builder/app/package.json",
  "builder/app/vite.config.ts",
  "apps/planner-search/query/contract.json",
]

# The job table is not derived from the builders it describes, so the unit tests that pin
# it against `build-wasm-bridges.sh` and the Trunk page are triggered by those files too.
# The `guards` job is unconditional, so they also run on every pull request regardless.
[[suite]]
id = "python.repository-tools"
route = "required"
command = "rm -rf .artifacts/python/repository-tools && uv run --locked --group dev --group planner-snow --group planner-sun python -m xmlrunner discover -s tools/tests -v -o .artifacts/python/repository-tools"
jobs = ["guards", "selection"]
triggers = [
  "pyproject.toml", "uv.lock",
  "tools/*.py",
  "tools/**/*.py",
  "tools/planner-regions/**",
  # The planner tools read their credits and region boxes from them.
  "data/sources.toml",
  "data/regions/**",
  # The footers that test_data_registry.py compares with the registry.
  "docs/templates/*.html",
  "builder/app/src/App.svelte",
  "testing/*.toml",
  "docs/testing.md",
  ".github/workflows/**",
  "builder/build-wasm-bridges.sh",
  "docs/index.html",
  "docs/Trunk.toml",
]

# The frame table and its manifest are inputs to this suite, not just its subjects:
# `test_ui_frames.py` reads both, and it is the only thing that catches a frame deleted together
# with its digest row — the frames a sweep renders are unchanged, so `ci.ui-snapshots` still
# passes.
[[suite]]
id = "python.firmware-tools"
route = "ordinary"
command = "rm -rf .artifacts/python/firmware-tools && uv run --locked --group dev --group planner-snow --group planner-sun python -m xmlrunner discover -s firmware/tools/tests -v -o .artifacts/python/firmware-tools"
jobs = ["test"]
triggers = [
  "pyproject.toml", "uv.lock",
  "firmware/tools/*.py",
  "firmware/tools/**/*.py",
  "firmware/ui-frames.toml",
  "firmware/ui-snapshots.sha256",
]

# The ingest tool needs rasterio and pyproj, which no other suite wants, so the suite runs
# under the locked uv group `terrain-reference`. The tests write their own rasters: no
# service, no credential and no captured fixture.
[[suite]]
id = "python.dem-reference"
route = "ordinary"
command = "rm -rf .artifacts/python/dem-reference && uv run --locked --group terrain-reference --group dev python -m xmlrunner discover -s host/obc-dem/reference/tests -v -o .artifacts/python/dem-reference"
jobs = ["test"]
triggers = ["host/obc-dem/reference/**", ".python-version", "pyproject.toml", "uv.lock",
  "data/sources.toml", "tools/data_registry.py", "tools/step_request.py"]

[[suite]]
id = "python.builder"
route = "ordinary"
command = "rm -f .artifacts/python/builder.xml && PYTHONPATH=. uv run --locked --group builder-test python -m pytest builder/tests/ -v --junitxml=.artifacts/python/builder.xml"
jobs = ["builder-python"]
fixtures = ["builder-corpus"]
triggers = [
  "builder/tests/**",
  "builder/presets/**",
  "builder/server/*.py",
  "builder/server/**/*.py",
  "pyproject.toml", "uv.lock",
]

[[suite]]
id = "ios.replay-camera"
scoped = true
route = "ordinary"
command = "npm ci --prefix companion-ios/ReplayAssets && npm test --prefix companion-ios/ReplayAssets"
jobs = ["ios-unit"]
platforms = ["linux", "macos"]
triggers = ["companion-ios/ReplayAssets/**", "companion-ios/Packages/OBCKit/Sources/OBCUI/Resources/Replay/**",
  # The replay-assets prepare step transpiles the web map style.
  "builder/app/src/lib/planner/map-style.ts", "data/sources.toml"]

[[suite]]
id = "swift.obckit-host"
scoped = true
rust_packages = ["obc-ios-host"]
rust_excludes = ["firmware/obc-app/src/harness/**"]
route = "ordinary"
command = "tools/build-ios-host.sh --mac-only && npm ci --prefix companion-ios/ReplayAssets && cd companion-ios/Packages/OBCKit && xcodebuild test -scheme OBCKit-Package -destination 'platform=macOS' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO"
jobs = ["ios-unit"]
fixtures = ["captured-met", "legacy-library"]
platforms = ["macos"]
triggers = [
  "companion-ios/Packages/OBCKit/Package.swift",
  "tools/build-ios-host.sh",
  "companion-ios/Packages/OBCKit/Sources/**",
  "companion-ios/Packages/OBCKit/Tests/**",
  "companion-ios/ReplayAssets/prepare.mjs",
  # The replay-assets prepare step transpiles the web map style.
  "builder/app/src/lib/planner/map-style.ts",
  "data/sources.toml",
  "apps/planner-search/query/contract.json",
  "specs/vectors/**",
]
# These tests wait on real time: condition polling has a 30-second default deadline, and
# negative observation windows and mock/model timing assertions use bounded real time.

[[suite]]
id = "ios.xcuitest"
scoped = true
route = "ordinary"
command = "companion-ios/scripts/capture-website-screenshots.sh --check"
jobs = ["ios-app"]
platforms = ["macos"]
triggers = [
  "companion-ios/scripts/generate-website-fixture.py",
  "companion-ios/scripts/capture-website-screenshots.sh",
  "companion-ios/OBCCompanionUITests/WebsiteScreenshotTests.swift",
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/ReplayAssets/**",
  "companion-ios/Packages/OBCKit/Sources/**",
]

# ── Required CI validations that own no test source ─────────────────────────

[[suite]]
id = "ci.rust-workspace-tests"
route = "ordinary"
command = "obc check test"
jobs = ["desktop", "test"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "tools/fixtures.py"]

[[suite]]
id = "ci.rust-fixture-tests"
route = "ordinary"
command = "bash tools/ci/test.sh nextest-fixtures"
jobs = ["test"]
fixtures = ["test"]
triggers = ["fixtures/catalog.toml", "tools/fixtures.py"]

[[suite]]
id = "ci.rust-format"
route = "required"
command = "obc check fmt"
jobs = ["fmt"]
foundation = true
triggers = ["rustfmt.toml"]

[[suite]]
id = "ci.rust-clippy"
route = "ordinary"
command = "obc check clippy"
jobs = ["boot", "clippy", "desktop", "embedded"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[suite]]
id = "ci.rust-builds"
route = "ordinary"
command = "obc check device board wasm"
jobs = ["boot", "builder-python", "desktop", "device", "embedded", "ui-snapshots", "wasm"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "tools/install-riscv.sh"]

[[suite]]
id = "ci.dependencies"
route = "ordinary"
command = "obc check deny"
jobs = ["deny"]
foundation = true
triggers = ["deny.toml"]

# The other half of the dependency work, and a different job: the `test` job runs this script as
# one step. It reads `cargo metadata` and compiles nothing, so a plan too large to run locally
# still runs it. A new workspace crate must be classified here before CI accepts it, which is
# why the workspace manifest selects it directly and not only through the job it rides.
[[suite]]
id = "ci.dependency-direction"
route = "required"
command = "python3 firmware/tools/check_dependencies.py"
jobs = ["test"]
foundation = true
triggers = ["firmware/tools/check_dependencies.py", "firmware/tools/dependency_rules.json"]

[[suite]]
id = "ci.resource-contracts"
route = "ordinary"
command = "python3 firmware/tools/resource_guard.py strict-align"
jobs = ["boot", "device", "embedded"]
foundation = true
triggers = [
  "firmware/tools/resource_baseline.json",
  "firmware/tools/resource_guard.py",
  "firmware/tools/strict_align_probe.rs",
]

[[suite]]
id = "ci.ui-snapshots"
route = "ordinary"
command = "obc shot --check"
jobs = ["ui-snapshots"]
fixtures = ["sim"]
triggers = [
  "firmware/ui-frames.toml",
  "firmware/ui-snapshots.sha256",
  "firmware/tools/ui_frames/**",
  "firmware/obc-app/src/**",
  "firmware/obc-render/src/**",
  "apps/obc-sim/src/**",
  "firmware/obc-app/i18n/*.toml",
  "firmware/obc-render/fonts/**",
  "apps/obc-sim/assets/**",
  "fixtures/catalog.toml",
  "fixtures/sources/sim-*/**",
]

[[suite]]
id = "ci.wasm-size"
route = "ordinary"
command = "bash builder/build-wasm-bridges.sh"
jobs = ["wasm", "wasm-bridges"]
foundation = true
triggers = [
  "builder/app/package-lock.json",
  "builder/build-wasm-bridges.sh",
  "builder/wasm/wasm_size_guard.py",
  "host/obc-flat-device/**",
  "docs/Trunk.toml",
  "docs/index.html",
]

[[suite]]
id = "ci.web-build"
route = "ordinary"
command = "obc check frontend"
jobs = ["desktop-frontend", "web"]
triggers = ["docs/assets/theme.css", "docs/assets/fonts/**", "builder/app/package.json", "builder/app/package-lock.json", "builder/app/src/**"]

[[suite]]
id = "ci.docs"
route = "required"
command = "obc check docs"
jobs = ["docs"]
# The agent on-ramps are owned here so they are not unowned paths. `build_docs.py` does not
# read them; the check that does is the unconditional `guards` job.
triggers = ["docs/**", "CLAUDE.md", "AGENTS.md"]

[[suite]]
id = "ci.licenses"
route = "ordinary"
command = "tools/licenses/gen-third-party.sh --check"
jobs = ["deny"]
foundation = true
triggers = ["Cargo.lock", "apps/route-server/Cargo.toml", "host/route-engine/Cargo.toml", "builder/app/package-lock.json", "about.toml", "THIRD-PARTY.md", "tools/licenses/**", "data/sources.toml", "tools/data_registry.py"]

[[suite]]
id = "ci.obc-data-licence"
route = "ordinary"
command = "python3 tools/check_obc_data_licence.py"
jobs = ["deny"]
triggers = ["Cargo.lock", "host/obc-data/Cargo.toml", "tools/check_obc_data_licence.py"]

[[suite]]
id = "ci.data-sources-guard"
route = "required"
command = "python3 tools/check_data_sources.py"
jobs = ["guards"]
triggers = ["tools/check_data_sources.py", "data/sources.toml"]

[[suite]]
id = "ci.fixture-policy"
route = "required"
command = "python3 tools/check_fixture_policy.py"
jobs = ["guards"]
triggers = ["fixtures/catalog.toml", "tools/check_fixture_policy.py", "tools/fixtures.py"]

[[suite]]
id = "ci.prose"
route = "required"
command = "python3 tools/prose.py --check"
jobs = ["guards"]
triggers = ["tools/prose.py", "testing/prose-baseline.json"]

[[suite]]
id = "ci.ios-host-portability"
route = "required"
command = "cargo check -p obc-ios-host --target aarch64-apple-ios --locked"
jobs = ["clippy"]
ci_only = true

# The app links OBCKit, and no Swift dependency graph exists to derive that edge: an
# OBCKit API change breaks `xcodebuild build` without touching a file under OBCCompanion/.
# build-for-testing, because the same pass produces the UI-test bundle `ios.xcuitest` runs.
[[suite]]
id = "ci.ios-app-build"
scoped = true
rust_packages = ["route-server", "obc-ios-host"]
# The phone library disables the HTTP feature.
rust_excludes = ["apps/route-server/src/http.rs", "firmware/obc-app/src/harness/**"]
route = "ordinary"
command = "tools/build-ios-host.sh --sim-only && xcodebuild build-for-testing -project companion-ios/OBCCompanion.xcodeproj -scheme OBCCompanion"
jobs = ["ios-app"]
platforms = ["macos"]
triggers = [
  "companion-ios/scripts/generate-website-fixture.py",
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/ReplayAssets/**",
  "companion-ios/Packages/OBCKit/Package.swift",
  "companion-ios/Packages/OBCKit/Sources/**",
  "tools/build-planner-ios.sh",
  "tools/build-ios-host.sh",
  "companion-ios/PlannerNative/*.swift",
  "apps/planner-search/native.mjs",
  "apps/planner-search/native-build.mjs",
  "apps/planner-search/calendar-date.mjs",
  "apps/planner-search/federation.mjs",
  "apps/planner-search/hours.mjs",
  "apps/planner-search/local-query.mjs",
  "apps/planner-search/query.mjs",
  "apps/planner-search/resolver.mjs",
  "apps/planner-search/runtime.mjs",
  "apps/planner-search/validation.mjs",
  "apps/planner-search/package.json",
  "apps/planner-search/package-lock.json",
  "companion-ios/PlannerSearch/*.swift",
  "apps/planner-search/web/**",
  "apps/planner-search/query/contract.json",
  "apps/planner-search/query/lexicon/kinds.json",
  # The project step runs apps/planner-search/native-build.mjs, which loads the notice module.
  "builder/app/vite/third-party-licenses.ts",
  "data/sources.toml",
  "rust-toolchain.toml",
]

# Mock and developer-panel code must never ship. The Debug grep rides the build above and
# proves this grep is not vacuous; the Release build is its own job because it shares no
# output with the Debug one and would otherwise extend the pull-request wall clock.
[[suite]]
id = "ci.ios-release-build"
scoped = true
rust_packages = ["route-server", "obc-ios-host"]
# The phone library disables the HTTP feature.
rust_excludes = ["apps/route-server/src/http.rs", "firmware/obc-app/src/harness/**"]
route = "ordinary"
command = "tools/build-ios-host.sh --sim-only && xcodebuild build -project companion-ios/OBCCompanion.xcodeproj -scheme OBCCompanion -configuration Release"
jobs = ["ios-release"]
platforms = ["macos"]
triggers = [
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/ReplayAssets/**",
  "companion-ios/Packages/OBCKit/Package.swift",
  "companion-ios/Packages/OBCKit/Sources/**",
  "tools/build-planner-ios.sh",
  "tools/build-ios-host.sh",
  "companion-ios/PlannerNative/*.swift",
  "apps/planner-search/native.mjs",
  "apps/planner-search/native-build.mjs",
  "apps/planner-search/calendar-date.mjs",
  "apps/planner-search/federation.mjs",
  "apps/planner-search/hours.mjs",
  "apps/planner-search/local-query.mjs",
  "apps/planner-search/query.mjs",
  "apps/planner-search/resolver.mjs",
  "apps/planner-search/runtime.mjs",
  "apps/planner-search/validation.mjs",
  "apps/planner-search/package.json",
  "apps/planner-search/package-lock.json",
  "companion-ios/PlannerSearch/*.swift",
  "apps/planner-search/web/**",
  "apps/planner-search/query/contract.json",
  "apps/planner-search/query/lexicon/kinds.json",
  # The project step runs apps/planner-search/native-build.mjs, which loads the notice module.
  "builder/app/vite/third-party-licenses.ts",
  "data/sources.toml",
  "rust-toolchain.toml",
]

# The shell links the Rust host through an XCFramework and no Swift dependency graph
# carries that edge: a change in the host crate, in the shared host modules under it, or
# in the script that packs the slices breaks this build without touching OBCDevice/.
[[suite]]
id = "ci.ios-device-build"
scoped = true
rust_packages = ["obc-ios-host"]
rust_excludes = ["firmware/obc-app/src/harness/**"]
route = "ordinary"
command = "xcodebuild build -project companion-ios/OBCCompanion.xcodeproj -scheme OBCDevice"
jobs = ["ios-app"]
