id = "ci.ios-host-portability"
surface = "ios"
level = "contract"
command = "cargo check -p obc-ios-host --target aarch64-apple-ios --locked"
fixtures = []
# Only a Mac can link or run the iOS host, so Linux type-checks it instead. The host composes nine
# crates and no build graph carries the iOS target edge, so naming a few of them as triggers would
# miss the change most likely to break the port. It rides every run of the job it sits in, which
# already lints the whole workspace; the check itself is seconds of metadata work.
pull_request = "always"
scheduled = "none"
extra_triggers = []
ownership = [{ kind = "workflow", pattern = "cargo check -p obc-ios-host --target aarch64-apple-ios --locked" }]

