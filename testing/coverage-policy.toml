schema = 1

# Native reports remain unchanged. Summaries exclude test-only Rust syntax items.
# Baselines and their measurement provenance live in coverage-baseline.json.
exclude = [
  { path = "**/tests/**", evidence = "Test source; the containing production component is measured." },
  { path = "**/tests.rs", evidence = "Test source; the containing production component is measured." },
  { path = "**/*_tests.rs", evidence = "Test source; the containing production component is measured." },
  { path = "**/*.test.*", evidence = "Vitest test source; the imported production source is measured." },
  { path = "**/test_*.py", evidence = "Python test source; the imported production source is measured." },
  { path = "host/obcm-testkit/src/**", evidence = "Fixture builders; production readers and writers are measured." },
  { path = "host/obc-fixtures/src/**", evidence = "Captured fixture support; consuming production components are measured." },
  { path = "host/obc-vectors/src/**", evidence = "Test vector support; codecs are measured in format-protocol-codecs." },
  { path = "companion-ios/Packages/OBCKit/Sources/OBCMock/**", evidence = "Debug-only mock transport and developer UI. CI checks its marker is absent from the Release app; shipping domain, transport, formats and UI are measured." },
]

[[component]]
id = "format-protocol-codecs"
include = ["firmware/obc-formats/src/**", "firmware/obc-link/src/**"]
exclude = [
  { path = "firmware/obc-link/src/flat/vectors.rs", evidence = "Spec-derived fixture producer for vector tests and regeneration, enabled only for test/std. Shared wire and record codecs are measured; specs/vectors/flat-store-v4 pins their independent contract." },
]
enforcement = "ratchet"

[[component]]
id = "crc"
include = ["firmware/obc-crc/src/**"]
exclude = []
enforcement = "ratchet"

[[component]]
id = "storage"
include = ["firmware/obc-storage/src/**"]
exclude = [
  { path = "firmware/obc-storage/src/flat/model.rs", evidence = "Independent reference model used by flat-store tests; the real FlatStore is measured." },
  { path = "firmware/obc-storage/src/flat/sim.rs", evidence = "Fault-injection in-memory storage support, enabled only for host simulation/tests; actual storage code is measured." },
]
enforcement = "ratchet"

[[component]]
id = "dfu"
include = ["firmware/obc-dfu/src/**"]
exclude = []
enforcement = "ratchet"

[[component]]
id = "boot"
include = ["firmware/obc-boot/src/**", "firmware/obc-dfu/src/engine.rs", "firmware/obc-dfu/src/state.rs", "firmware/obc-dfu/src/blobstage.rs"]
exclude = [
  { path = "firmware/obc-boot/src/**", evidence = "MMIO adapters and reset entry cannot execute on the host. The boot build and resource contracts cover compilation and image limits. obc-dfu engine, state and blobstage tests exercise the actual shared boot policy (deliberate overlap with dfu). Physical install, rollback and power-cut acceptance remains in #1391 and #1166; host coverage does not prove it." },
]
enforcement = "ratchet"

[[component]]
id = "firmware-app"
include = ["firmware/obc-app/src/**", "firmware/obc-platform/src/**", "firmware/obc-ports/src/**"]
exclude = []
enforcement = "report"

[[component]]
id = "navigation-map"
include = ["firmware/obc-elevation/src/**", "firmware/obc-map-scene/src/**", "firmware/obc-reader/src/**", "firmware/obc-route/src/**", "firmware/obc-render/src/**"]
exclude = []
enforcement = "report"

[[component]]
id = "device-drivers"
include = ["firmware/obc-ble/src/**", "firmware/obc-display/src/**", "firmware/obc-sensors/src/**"]
exclude = []
enforcement = "report"

[[component]]
id = "board-image"
include = ["firmware/obc-fw-nrf54l/src/**"]
exclude = [
  { path = "firmware/obc-fw-nrf54l/src/**", evidence = "The nRF54L image does not execute in the host test runner. Required board build/clippy and resource/frame guards check compilation and static limits. Shared application/platform policy has host coverage in firmware-app. Physical scheduling, I/O, current and stack acceptance remain in #1262 and #1166; these static checks do not establish runtime coverage." },
]
enforcement = "report"

[[component]]
id = "host-tools"
include = ["host/**/src/**", "apps/obc-sim/src/**"]
exclude = [
]
enforcement = "report"

[[component]]
id = "web"
include = ["builder/app/src/**", "apps/obc-web-demo/src/**", "apps/obc-web-convert/src/**", "apps/obc-web-assemble/src/**", "apps/obc-skin-preview/src/**"]
exclude = [
  { path = "builder/app/src/lib/convert/pkg/**", evidence = "Generated bridge is covered at its Rust producer and by web byte-identity contract tests." },
  { path = "builder/app/src/lib/assemble/pkg/**", evidence = "Generated bridge is covered at its Rust producer and by web byte-identity contract tests." },
  { path = "builder/app/src/lib/skin/pkg/**", evidence = "Generated bridge is covered at its Rust producer and by web byte-identity contract tests." },
]
enforcement = "report"

[[component]]
id = "ios"
include = ["apps/obc-ios-host/src/**", "apps/obc-companion-core/src/**", "companion-ios/Packages/OBCKit/Sources/**", "companion-ios/Packages/OBCRouting/Sources/**", "companion-ios/OBCCompanion/**"]
exclude = []
enforcement = "report"

[[component]]
id = "desktop"
include = ["apps/obc-desktop/src/**"]
exclude = []
enforcement = "report"

[[component]]
id = "dev-tools"
include = ["tools/*.py", "firmware/tools/*.py", "builder/server/*.py"]
exclude = []
enforcement = "report"
