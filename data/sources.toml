# Every external dataset, asset and tool that a bake uses. specs/obc-data.md defines the format.
# A source without a licence is blocked until its licence is recorded here.

# ── OpenStreetMap ────────────────────────────────────────────────────────────

[[source]]
id = "osm-planet"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "http", url = "https://planet.openstreetmap.org/pbf/planet-{yymmdd}.osm.pbf" }
version = "date"
# The diffs of `osm-replication` bring an old planet up to date, so a new planet of about 84 GB
# is seldom worth its download.
refresh = 90
redistribute = true

# The daily diffs after the `osm-planet` pin of the environment.
[[source]]
id = "osm-replication"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "osm", url = "https://planet.openstreetmap.org/replication/day/", from = "osm-planet" }
version = "date"
refresh = 7
redistribute = true

[[source]]
id = "geofabrik-extracts"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "geofabrik", url = "https://download.geofabrik.de/{area}-{yymmdd}.osm.pbf" }
version = "date"
refresh = 7
redistribute = true

[[source]]
id = "geofabrik-poly"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "geofabrik", url = "https://download.geofabrik.de/{area}.poly" }
version = "date"
refresh = 90
redistribute = true

# The OSM paths and tracks of a box: the Overpass answer to the trail query of `tools/planner_snow.py`.
[[source]]
id = "osm-trails"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "capture", url = "https://overpass-api.de/api/interpreter" }
version = "date"
refresh = 365
redistribute = true

[[source]]
id = "land-polygons"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://osmdata.openstreetmap.de/info/license.html"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "http", url = "https://osmdata.openstreetmap.de/download/land-polygons-split-3857.zip" }
version = "date"
refresh = 90
redistribute = true
r2_copy = true

[[source]]
id = "water-polygons"
kind = "data"
licence = "ODbL-1.0"
licence_url = "https://osmdata.openstreetmap.de/info/license.html"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
