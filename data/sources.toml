fetch = { kind = "http", url = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png" }
version = "date"
redistribute = false

# The national terrain models, one per product of the reference ingest. A map leaf reads an archive
