# ── Terrain ──────────────────────────────────────────────────────────────────

[[source]]
id = "copernicus-glo-30"
kind = "data"
group = "Elevation"
used_by = ["device", "planner", "trailview"]
use = "Terrain of the world at 30 m"
licence = "LicenseRef-Copernicus-DEM"
licence_url = "https://spacedata.copernicus.eu/collections/copernicus-digital-elevation-model"
attribution = "produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
obligations = "Credit on every product derived from the dataset"
fetch = { kind = "glo30", url = "https://copernicus-dem-30m.s3.amazonaws.com/{tile}/{tile}.tif" }
version = "date"
start = "2022-05-09"
redistribute = false

# The names of the `copernicus-glo-30` tiles. A square without a tile is sea.
