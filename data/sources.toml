obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "geofabrik", url = "https://download.geofabrik.de/{area}-{yymmdd}.osm.pbf" }
version = "date"
refresh = 7
redistribute = true
r2_copy = true

