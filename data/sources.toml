# Every external dataset, asset and tool that a bake uses. specs/obc-data.md defines the format.
# A source without a licence is blocked until its licence is recorded here.

# ── OpenStreetMap ────────────────────────────────────────────────────────────

[[source]]
id = "osm-planet"
kind = "data"
group = "OpenStreetMap"
used_by = ["device", "search"]
use = "OSM subjects of the worldwide landmark and peak content"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "http", url = "https://planet.openstreetmap.org/pbf/planet-{yymmdd}.osm.pbf" }
version = "date"
refresh = 90
# A planet is about 84 GB, so a new one is seldom worth its download.
redistribute = true

[[source]]
id = "geofabrik-extracts"
kind = "data"
group = "OpenStreetMap"
used_by = ["device", "planner", "search", "trailview"]
use = "OSM data of each region: the base of maps, routes, search and features"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
attribution = "© OpenStreetMap contributors"
obligations = "Credit OpenStreetMap; offer a derived database under the ODbL"
fetch = { kind = "geofabrik", url = "https://download.geofabrik.de/{area}-{yymmdd}.osm.pbf" }
version = "date"
refresh = 7
redistribute = true

[[source]]
id = "geofabrik-index"
kind = "data"
group = "OpenStreetMap"
used_by = ["device", "planner"]
