# The options of the planner layers that are the same for each region: specs/obc-data.md, `planner`.

[terrain]
# The sun layer reads the horizon this far around the region, so the terrain covers it.
margin_m = 30000

[routing]
# The profiles of the routing package. The route catalog needs touring, road, gravel, mtb and hiking.
profiles = [
  "gravel",
  "gravel/less-climbing",
  "gravel/shorter",
  "hiking",
  "hiking/less-climbing",
  "hiking/shorter",
  "mtb",
  "mtb/less-climbing",
  "mtb/shorter",
  "road",
  "road/less-climbing",
  "road/shorter",
  "touring",
  "touring/less-climbing",
  "touring/shorter",
]

[climate]
# The first of the ten years of ERA5-Land that the climate layer reads.
first_year = 2016

[snow]
# The first and the last season of HR-WSI Snow Phenology, each from 1 September. The catalogue
# has the seasons 2016 to 2024 over Baden-Württemberg.
seasons = [2016, 2024]

[sun]
# The grid cells along each tile edge and the directions of a horizon profile: specs/planner-sun-tiles.md.
horizon_samples = 32
horizon_directions = 72
