# The options of the planner layers that are the same for each region: specs/obc-data.md, `planner`.

[osm]
# The basemap, the routing and the search of a region with a box read the OSM of the region bounds
# and this margin. The search puts an address in the town of a place node up to 15 km away
# (`fuzzy_area` of host/obc-search-bake/src/enrich.rs). The routing and the basemap need no margin
# inside the bounds: the routing clips its graph to the bounds, and a smart extract keeps each way
# and area that the bounds touch.
margin_m = 15000

[routing]
# The profiles of the routing package. The route catalog needs touring, road, gravel, mtb/technical
# and hiking/alpine.
profiles = [
  "gravel",
  "gravel/less-climbing",
  "hiking",
  "hiking/alpine",
  "mtb",
  "mtb/technical",
  "road",
  "road/less-climbing",
  "touring",
  "touring/less-climbing",
]
# The largest number of junctions in a routing cell of level 1, 2, …: at most 8 increasing values.
# The cell IDs have at most 32 bits, so a region that needs more fails, and its bake removes a level.
cell_sizes = [512, 4096, 32768, 262144, 2097152, 16777216, 134217728]

[climate]
# The first of the ten years of ERA5-Land that the climate layer reads.
first_year = 2016

[snow]
# The first and the last season of the snow layer and of a version of `snow`, each from 1 September.
# HR-WSI Snow Phenology and MODIS have each season from 2016 to 2025.
seasons = [2016, 2025]

[trailview]
# The year of `colour` that the TrailView colour and material read, and the colour variant
# of tools/trailview/colour.py: specs/trailview-tiles.md.
colour_year = 2025
colour = "webp-12"
