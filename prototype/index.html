      const km0 = i != null ? (spec.ends.find((x) => x.i === i) || {}).km : null;
      drag = { i, x0: e.clientX, y0: e.clientY, km0, id: e.pointerId, target: band || end || plot };
      if (i == null) scrubbing = true;
      try { drag.target.setPointerCapture(e.pointerId); } catch (x) {}
    });
    plot.addEventListener('pointermove', (e) => {
      if (!drag) { if (e.pointerType === 'mouse' && spec.handlers.onScrub && !e.target.closest('.pf-band, .pf-end')) spec.handlers.onScrub(kmAt(e.clientX), 'hover'); return; }
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (touch === 'pending') { if (Math.hypot(dx, dy) < 6) return; touch = Math.abs(dy) > Math.abs(dx) ? 'v' : 'h'; }
      if (touch === 'v') return;
      moved = true;
      if (drag.i != null) { const km = drag.km0 + (dx / plot.getBoundingClientRect().width) * (spec.win[1] - spec.win[0]); live = { i: drag.i, km: spec.handlers.onEnd(drag.i, km, 'move') }; update(); }
      else if (scrubbing) spec.handlers.onScrub(kmAt(e.clientX), 'drag');
    });
    const up = (e) => {
      if (!drag) return;
      const d = drag, vertical = touch === 'v'; drag = null; scrubbing = false; touch = null;
      if (vertical) return;                                            // the sheet's drag, not ours
      if (d.i != null && live) { const km = live.km; live = null; spec.handlers.onEnd(d.i, km, 'end'); }
      else if (d.i != null && !moved) spec.handlers.onEnd(d.i, d.km0, 'tap');
      else if (!moved && e.type === 'pointerup' && spec.handlers.onScrub) spec.handlers.onScrub(kmAt(e.clientX), 'tap');
    };
    plot.addEventListener('pointerup', up); plot.addEventListener('pointercancel', up);
    plot.addEventListener('click', (e) => { const t = e.target.closest('.pf-tick'); if (t && spec.handlers.onTick) spec.handlers.onTick(t.dataset.id); });
  }
  return { render, elevAt, get touch() { return touch; }, get live() { return live; } };
})();

/* The box: the input with the pointed "where" chip inside it, the understood chips under it, and
   one picker per editable chip. A chip never shows words the rider did not type: the chips are
   built from the request, the sentence stays in the field (faint once a chip was edited). */

const Box = (() => {
  const { esc, icon, count } = Answers;
  let input, pointedEl, countEl, clearEl, h = {};

  function init(handlers) {
    h = handlers;
    input = document.getElementById('qin'); pointedEl = document.getElementById('pointed'); countEl = document.getElementById('qcount'); clearEl = document.getElementById('qclear');
    input.addEventListener('input', () => h.onInput(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); h.onSubmit(); input.blur(); }
      if (e.key === 'Escape') input.blur();
      if (e.key === 'Backspace' && !input.value && pointedEl.firstChild) h.onRemovePointed();
    });
    input.addEventListener('focus', () => h.onFocus()); input.addEventListener('blur', () => h.onBlur());
    clearEl.addEventListener('click', () => h.onClear());
  }
  function sync(S) {
    if (input.value !== S.text) input.value = S.text;
    const qb = input.parentElement;
    qb.classList.toggle('edited', S.edited); qb.classList.toggle('focus', S.focused);
    countEl.textContent = S.focused ? `${S.text.length}/80` : '';
    clearEl.hidden = !(S.text || S.pointed) || S.focused;
    const p = S.pointed && Answers.whereInfo(S.pointed, S);
    const ph = p ? `<span class="chip where pointed" data-act="pickField" data-field="where">${esc(p.label)}${p.k ? ` <span class="k">${esc(p.k)}</span>` : ''}<button class="xb" data-act="removePointed" title="Remove">${icon('i-close')}</button></span>` : '';
    if (pointedEl.innerHTML !== ph) pointedEl.innerHTML = ph;
  }
  const focus = () => { input.focus(); const n = input.value.length; try { input.setSelectionRange(n, n); } catch (e) {} };

  // ---- chip specs from the request ----
  function chips(req, ans, S) {
    const out = [], K = DATA.KINDS;
    if (!req) return out;
    const chev = true;
    if (req.kind === 'places') {
      const wi = ans.wi;
      out.push({ field: 'what', cls: 'what', icon: K[req.kinds[0]].icon, label: Parser.kindsLabel(req.kinds), edit: chev });
      out.push({ field: 'where', cls: wi.need ? 'need' : 'where', icon: wi.need ? 'i-calendar' : null, label: wi.label, k: wi.need ? 'needs a date' : wi.k, edit: !wi.need, act: wi.need ? 'setDates' : null });
      if (ans.within != null) out.push({ field: 'within', cls: 'filter', label: `within ${ans.within} km`, edit: true });
      if (ans.open) out.push({ field: 'open', cls: 'filter', label: ans.open.label, edit: true, removable: true });
      else if (ans.need) out.push({ field: 'open', cls: 'need', icon: 'i-calendar', label: `Open on Day ${req.where.day || ''}`.trim(), k: 'needs a date', edit: true });
      else if (S.removed.open) out.push({ field: 'open', cls: 'off', label: `Open on ${DATA.WEEKDAYS[S.removed.open.wd] || 'the day'}`, act: 'restore', data: 'open' });
    } else if (req.kind === 'route') {
      out.push({ field: null, cls: 'what', icon: 'i-route', label: 'Route' });
      out.push({ field: null, cls: 'where', label: `To ${req.to.name}${req.to.kind === 'summit' ? ' summit' : ''}` });
      out.push({ field: null, cls: 'where', icon: 'i-here', label: 'From here', k: DATA.place(ans.from ? ans.from.id : S.here).name });
      out.push({ field: 'bike', cls: 'filter', icon: 'i-bike', label: DATA.BIKES[req.bike], edit: true });
    } else if (req.kind === 'change' && req.change.type === 'dayend') {
      out.push({ field: null, cls: 'what', icon: 'i-tent', label: `End Day ${req.change.day}` });
      out.push({ field: null, cls: 'where', label: `at ${req.change.place.name}`, k: req.change.place.km != null ? `km ${req.change.place.km}` : null });
    } else if (req.kind === 'change') {
      out.push({ field: null, cls: 'what', icon: 'i-flag', label: 'Add a visit' });
      out.push({ field: null, cls: 'where', label: req.change.place.name });
    } else if (req.kind === 'gaps') {
      out.push({ field: null, cls: 'what', icon: ans.icon, label: ans.label });
      out.push({ field: null, cls: 'where', label: 'Whole trip' });
    } else if (req.kind === 'place') {
      out.push({ field: null, cls: 'what', icon: 'i-search', label: 'Place' });
      out.push({ field: null, cls: 'where', label: req.place.name, k: req.place.region === 'Black Forest' && req.place.ambiguous ? 'near Freiburg' : null });
    } else if (req.kind === 'none' && req.place) {
      out.push({ field: null, cls: 'what', icon: 'i-search', label: 'Place' });
      out.push({ field: null, cls: 'where', label: req.place.name });
    }
    if (req.needDate && req.kind !== 'places') out.push({ field: null, cls: 'need', icon: 'i-calendar', label: req.relWord, k: 'needs a date', act: 'setDates' });
    for (const o of req.off) out.push({ field: null, cls: 'off', label: o, k: req.kind === 'places' ? '· not understood, ignored' : null });
    return out;
  }
  // One row of chips: it wraps on the website and scrolls sideways on the phone.
  function chipsHtml(specs, S) {
    if (!specs.length) return '';
    const c = specs.map((s) => {
      const tag = s.edit || s.act ? 'button' : 'span', on = s.edit && S.picker === s.field;
      const act = s.act ? `data-act="${s.act}" data-field="${s.data || s.field || ''}"` : s.edit ? `data-act="pickField" data-field="${s.field}"` : '';
      return `<${tag} class="chip ${s.cls} ${on ? 'on' : ''} ${s.removable ? 'rm' : ''}" ${act} data-chip="${s.field || ''}">${s.icon ? icon(s.icon) : ''}${esc(s.label)}${s.k ? ` <span class="k">${esc(s.k)}</span>` : ''}${s.edit ? icon('i-chev-d', 'chev') : ''}${s.removable ? `<i class="xb" data-act="removeFilter" data-field="${s.field}" title="Turn off">${icon('i-close')}</i>` : ''}</${tag}>`;
    }).join('');
    return `<div class="chips"><span class="lbl">Understood as</span>${c}</div>`;
  }
  // The "Find" row: a where is set but no what.
  const findHtml = () => `<div class="chips"><span class="lbl">Find</span>` + [['sleep', 'i-tent', 'Places to sleep'], ['water', 'i-drop', 'Water'], ['shop', 'i-cart', 'Shops'], ['bikeshop', 'i-wrench', 'Bike shops']]
    .map(([k, ic, l]) => `<button class="chip what" data-act="find" data-k="${k}">${icon(ic)}${l}</button>`).join('') + `</div>`;

  // ---- pickers ----
  const seg = (items, cls = '') => `<div class="seg2 ${cls}">${items.map((i) => `<button class="${i.on ? 'on' : ''}" data-act="${i.act}" ${i.data}>${i.label}${i.small != null ? `<small>${i.small}</small>` : ''}</button>`).join('')}</div>`;
  function pickerHtml(field, req, ans, S) {
    if (!field || !req) return '';
    let inner = '';
    if (field === 'what') {
      const fam = req.kinds.every((k) => DATA.SLEEP.includes(k)) ? DATA.SLEEP : DATA.SUPPLY;
      inner = `<div class="tg">${fam.map((k) => { const on = req.kinds.includes(k), n = count(req, S, { kinds: [k] }); return `<button class="${on ? 'on' : ''}" data-act="pickKind" data-k="${k}"><i>${on ? '<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' : ''}</i>${DATA.KINDS[k].label.replace(/s$/, '')}<small>${n}</small></button>`; }).join('')}</div>`;
    } else if (field === 'where') {
      const w = req.where || S.pointed || {};
      inner = seg([{ label: 'This map view', on: w.type === 'view', act: 'pickWhere', data: 'data-type="view"' }, { label: 'Along the route', on: w.type === 'route', act: 'pickWhere', data: 'data-type="route"' }]);
      if (S.plan().kind === 'trip') {
        inner += `<div class="seg2 days">${DATA.DAYS.filter((d) => !d.rest).map((d) => `<button class="${w.day === d.n ? 'on' : ''}" data-act="pickWhere" data-type="day" data-n="${d.n}">Day ${d.n}</button>`).join('')}</div>`;
        if (w.type === 'day') inner += seg([['start', 'Start'], ['middle', 'Middle'], ['end', 'End'], ['whole', 'Whole day']].map(([p, l]) => ({ label: l, on: w.part === p, act: 'pickWhere', data: `data-type="day" data-n="${w.day}" data-part="${p}"` })));
        inner += `<button class="prow-pick" data-act="pickOnMap">${icon('i-route')}Pick on the map or the profile${icon('i-chev-r')}</button>`;
      }
    } else if (field === 'within') {
      inner = seg(Answers.RINGS.map((r) => ({ label: `${r} km`, small: count(req, S, { within: r }), on: ans.within === r, act: 'pickWithin', data: `data-km="${r}"` })));
    } else if (field === 'open') {
      const wd = ans.open ? ans.open.wd : null;
      inner = seg(Object.entries(DATA.WEEKDAYS).map(([k, l]) => ({ label: l.slice(0, 3), on: wd === k, act: 'pickOpen', data: `data-wd="${k}"` })));
      inner += seg([{ label: 'Any day', on: false, act: 'pickOpen', data: 'data-wd="any"' }]);
      if (!S.dates) inner += `<div class="note-pick">Open on ${req.where && req.where.day ? `Day ${req.where.day}` : 'the day'} needs a date<button class="btn" data-act="setDates">Set trip dates</button></div>`;
    } else if (field === 'bike') {
      inner = seg(Object.entries(DATA.BIKES).map(([k, l]) => ({ label: l, on: (req ? req.bike : S.plan().bike) === k, act: 'pickBike', data: `data-bike="${k}"` })));
      inner += seg(['balanced', 'shortest', 'leastclimb', 'leastunpaved'].map((g) => ({ label: DATA.GOALS[g], on: (req ? req.goal : S.plan().goal) === g, act: 'pickBike', data: `data-goal="${g}"` })), 'two');
    }
    return inner ? `<div class="pick" data-pick="${field}">${inner}</div>` : '';
  }
  // Place the picker's arrow under its chip.
  function placeArrow(container) {
    const pick = container.querySelector('.pick'), chip = pick && container.querySelector(`[data-chip="${pick.dataset.pick}"]`);
    if (pick && chip) pick.style.setProperty('--ax', chip.offsetLeft - chip.parentElement.scrollLeft + chip.offsetWidth / 2 + 'px');
  }
  return { init, sync, focus, chips, chipsHtml, findHtml, pickerHtml, placeArrow, get input() { return input; } };
})();

/* The chrome and the panel: the plans page, the tool bar, the nav bar, the sheet head, the chips,
   the body (days with their points, or an answer), the action row, the menus and the map callout.
   Pure functions of the state; the app calls them in one render pass. */

const View = (() => {
  const { esc, icon, num, hm, km1 } = Answers;
  const $ = (id) => document.getElementById(id);
  const btn = (act, label, ic, cls = 'ghost', extra = '') => `<button class="btn ${cls}" data-act="${act}" ${extra}>${ic ? icon(ic) : ''}${label ? `<span>${label}</span>` : ''}</button>`;
  const dayTok = (ci) => `var(--day-${(ci % 4) + 1})`;
  const kindIcon = (k) => (DATA.POINT_KINDS[k] || DATA.POINT_KINDS.pass).icon;

  // ---- the plans page: the app's list, with a sage track sketch per plan ----
  const BAND = `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4"/><rect x="4.5" y="9.5" width="10" height="5" fill="currentColor" stroke="none"/></svg><span>82 %</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3m0 13v3M2.5 12h3m13 0h3M5.3 5.3l2.1 2.1m9.2 9.2l2.1 2.1M5.3 18.7l2.1-2.1m9.2-9.2l2.1-2.1"/></svg>`;
  function sketch(p, S) {
    let pts, paths;
    if (p.kind === 'trip') { pts = Trip.line('alps').pts; paths = DATA.DAYS.filter((d) => !d.rest).map((d) => `#route-alps-d${d.n}`); }
    else if (p.kind === 'import') { pts = Line.sample('route-bf-import', 200); paths = ['#route-bf-import']; }
    else { const m = S.muts[p.id]; if (m && m.legs.length) { pts = Route.polyline(m).pts; paths = [Line.pathD(pts)]; } else { const h = DATA.place(p.here); pts = [[h.x, h.y]]; paths = []; } }
    const ref = (s, cls) => (s[0] === '#' ? `<use href="${s}" class="${cls}"/>` : `<path d="${s}" class="${cls}"/>`);
    const b = MapView.bboxOfPts(pts), pad = Math.max(b.w, b.h, 60) * 0.14, box = { x: b.x - pad, y: b.y - pad, w: b.w + 2 * pad, h: b.h + 2 * pad };
    const r = 3.5 * Math.max(box.w / 96, box.h / 72), a = pts[0], z = pts[pts.length - 1];
    return `<svg viewBox="${box.x} ${box.y} ${box.w} ${box.h}" preserveAspectRatio="xMidYMid meet">${paths.map((s) => ref(s, 'rt-casing')).join('')}${paths.map((s) => ref(s, 'rt-line')).join('')}<circle class="sk-a" cx="${a[0]}" cy="${a[1]}" r="${r}"/>${pts.length > 1 ? `<rect class="sk-b" x="${z[0] - r}" y="${z[1] - r}" width="${2 * r}" height="${2 * r}"/>` : ''}</svg>`;
  }
  function planLine(p, S) {
    if (p.kind === 'trip') return `${Trip.days(S.muts.alps || Trip.fresh()).length} days · ${DATA.TRIP.km} km · ${num(DATA.TRIP.climb)} m`;
    if (p.kind === 'import') { const r = DATA.ROUTES.import; return `Imported · ${r.km} km · ${num(r.climb)} m`; }
    const m = S.muts[p.id];
    if (m && m.legs.length) { const f = Route.figures(m); return `Route · ${km1(f.km)} km · ${num(f.climb)} m`; }
    return `Route · from ${DATA.place(p.here).name}`;
  }
  function plans(S) {
    const el = $('plans'); el.hidden = S.page !== 'plans';
    if (el.hidden) { el.innerHTML = ''; return; }
    const rows = DATA.PLANS.map((p) => `<button class="prow2" data-act="openPlan" data-id="${p.id}"><span class="sk">${sketch(p, S)}</span><span><span class="pn">${esc(p.name)}</span><span class="pm">${esc(planLine(p, S))}</span></span>${icon('i-chev-r', 'chev')}</button>`).join('');
    el.innerHTML = `<div class="band"><span>TRAILHEAD</span><span class="st">${BAND}</span></div><div class="wrap"><div class="tt"><h1>Routes and trips</h1><button class="new" data-act="openPlan" data-id="new" title="New route">${icon('i-plus')}<span>New route</span></button></div><div class="list">${rows}</div></div>`;
  }

  // ---- the tool bar (website) and the nav bar (phone) ----
  function bar(S) {
    const p = S.plan(), trip = p.kind === 'trip', pr = S.preset();
    $('bar').innerHTML = `<button class="back" data-act="plans">${icon('i-chev-l')}Routes and trips</button><span class="plan">${esc(p.name)}</span>
      ${trip ? `<button class="dates" data-act="menu" data-menu="dates">${icon('i-calendar')}${S.dates ? DATA.TRIP.datesShort : 'No dates'}</button>` : ''}
      <button class="preset" data-act="menu" data-menu="bike" title="Bike and goal">${icon('i-bike')}${DATA.BIKES[pr.bike]} · ${DATA.GOALS[pr.goal]}${icon('i-chev-d', 'chev')}</button>
      <button class="proto" data-act="menu" data-menu="proto">Prototype · example data</button>
      <div class="tools">${btn('undo', '', 'i-undo', 'ghost icon', `title="Undo" ${S.hist.length ? '' : 'disabled'}`)}${btn('redo', '', 'i-redo', 'ghost icon', `title="Redo" ${S.future.length ? '' : 'disabled'}`)}<span class="sep"></span>
      ${btn('menu', 'Versions', 'i-versions', 'ghost', 'data-menu="versions"')}${btn('menu', 'Import', 'i-import', 'ghost', 'data-menu="import"')}${btn('menu', 'Offline areas', 'i-download', 'ghost', 'data-menu="offline"')}${btn('menu', 'Continue on phone', 'i-qr', 'ghost', 'data-menu="qr"')}${btn('quiet', 'Export GPX', 'i-route', 'ghost', 'data-text="GPX export is not part of the prototype."')}<span class="sep"></span>
      ${btn('send', 'Send to device', 'i-send', 'primary')}</div>`;
  }
  function nav(S) {
    $('nav').innerHTML = `<button class="nb" data-act="plans" title="Routes and trips">${icon('i-chev-l')}</button><span class="title">${esc(S.plan().name)}</span>
      <span class="nr"><button class="nb ${S.hist.length ? '' : 'dis'}" data-act="undo" title="Undo">${icon('i-undo')}</button><button class="nb" data-act="menu" data-menu="more" title="More">${icon('i-more')}</button></span>`;
  }
  function chips(S, phone) {
    const c = $('chips');
    let h = '';
    if (S.req && (S.text || S.routeTo || S.edits.what)) h = Box.chipsHtml(Box.chips(S.req, S.ans, S), S) + Box.pickerHtml(S.picker, S.req, S.ans, S);
    else if (S.pointed) h = Box.findHtml() + (S.picker === 'where' ? Box.pickerHtml('where', null, null, S) : '');
    if (S.pick && !phone) h += `<div class="note quiet pickhint">Tap a day end on the map or the profile.<button class="btn sm" data-act="cancelPick">Cancel</button></div>`;
    if (c.innerHTML !== h) { c.innerHTML = h; Box.placeArrow(c); }
    c.hidden = !h;
  }
  // The rest line: the plan's totals.
  function restLine(S) {
    const p = S.plan(), m = S.mut(), pr = S.preset();
    if (p.kind === 'trip') { const D = Trip.days(m); return `<b>${DATA.TRIP.facts}</b><span class="cap">${D.length} days${S.dates ? ' · ' + DATA.TRIP.dates : ''} · ${DATA.BIKES[pr.bike]}</span>`; }
    if (p.kind === 'import') return `<b>${DATA.ROUTES.import.facts}</b><span class="cap">${DATA.ROUTES.import.notes[0]}</span>`;
    if (m.route) { const o = App.routeOption(m.route); return `<b>${DATA.ROUTES[m.route.id].title} · ${o.km} km</b><span class="cap">${num(o.climb)} m · ${hm(o.time)} · ${DATA.BIKES[pr.bike]}</span>`; }
    if (m.legs.length) { const f = Route.figures(m); return `<b>Route · ${km1(f.km)} km</b><span class="cap">${num(f.climb)} m · ${hm(f.time)} estimated · ${m.pts.length} points${f.days > 1 ? ` · ${f.days} days` : ''}</span>`; }
    return `<b>New route</b><span class="cap">From here · ${esc(DATA.place(S.here).name)} · ${DATA.BIKES[pr.bike]} · ${DATA.GOALS[pr.goal]}</span>`;
  }
  // The head: the totals at rest, the answer's count, the scrubber's reading, or the tool in use.
  function head(S, phone, show) {
    const el = $('head'), trip = S.plan().kind === 'trip', hd = show ? Answers.head(S.ans) : null;
    let txt, side = '', cls = 'rest';
    if (S.drawing) { cls = 'act'; txt = `<b>Draw the leg on the map.</b>`; side = btn('cancelDraw', 'Cancel', null, 'sm'); }
    else if (S.pick && phone) { cls = 'act'; txt = `<b>Tap a day end on the map.</b>`; side = btn('cancelPick', 'Cancel', null, 'sm'); }
    else if (show) { cls = 'ans'; txt = phone ? (hd ? `<b>${esc(hd.b)}</b><span class="cap">${esc(hd.span)}</span>` : '') : `${btn('clear', trip ? 'Back to the days' : 'Back', 'i-chev-l', 'ghost sm')}<span class="cap">${hd ? esc(hd.web || hd.b + (hd.span ? ' · ' + hd.span : '')) : ''}</span>`; }
    else if (phone && S.scrub != null && trip) { const r = Trip.reading(S.mut(), S.scrub); txt = `<b>${esc(r.b)}</b><span class="cap">${esc(r.span)}</span>`; }
    else txt = restLine(S);
    if (phone && !side) side = `<button class="sbtn" data-act="search" title="Search">${icon('i-search')}</button>`;
    el.innerHTML = phone ? `<div class="txt">${txt}</div>${side}` : txt + side;
    el.className = 'head ' + cls;
  }

  // ---- the days, each with its points on request ----
  function pointRows(S, pts, legs, dayKm0) {
    let h = '';

/* The scene: the map layers (the line per day and per leg mode, the points, the day ends, the

  };

  const use = (path, cls, act) => `<use href="#${path}" class="${cls}"/>` + (act ? `<use href="#${path}" class="rt-hit" ${act}/>` : '');
  // A leg: casing, the line in its mode, and a hit path.
  const leg = (pts, color, mode, hit) => { const d = Line.pathD(pts); return `<path d="${d}" class="rt-casing ${mode}"/><path d="${d}" class="rt-line ${mode}" style="stroke:${color}"/>${hit ? `<path d="${d}" class="rt-hit" ${hit}/>` : ''}`; };

  const near = (a, b, px) => { const A = MapView.toScreen(a), B = MapView.toScreen(b); return Math.hypot(A.x - B.x, A.y - B.y) < px; };
  let wasZoomed = null;                                              // pins show under 90 km of map width

  function renderMap(S) {
    const plan = S.plan(), mut = S.mut(), map = cur(), a = S.show() ? S.ans : null, zoomed = (wasZoomed = MapView.widthKm() < 90);
    const amarks = a ? Answers.marks(a, S) : [], hot = (amarks.find((m) => m.sel) || {}).pos || (S.callout && S.callout.pos) || null;

    coVia(d) { const c = S.callout; applyEnd(c.i, c.place, d.via); },

    coKind(d) {

  // ---- render ----

        if (trip()) { const n = Line.nearest(Trip.line(pos.map), pos), m = DATA.MAPS[pos.map], far = n.dist * m.kmx > 4; if (far) return; const name = Trip.endName(n.km); S.callout = { kind: 'add', pos, km: n.km, name: name.startsWith('km') ? `Near ${name}` : `Near ${name}`, meta: `Day ${Trip.dayAt(Trip.days(S.mut()), n.km).n} · km ${Math.round(n.km - Trip.dayAt(Trip.days(S.mut()), n.km).start)}`, placeId: null }; }
        else { const nr = Route.near(pos); S.callout = { kind: 'add', pos, name: nr.d <= 2.5 ? nr.p.name : `Point ${S.mut().pts.length + 1}`, meta: nr.d > 2.5 ? `${km1(nr.d)} km from ${nr.p.name}` : `${num(nr.p.elev)} m` }; }

      change: () => render(),
      move: () => Scene.onMove(S),
      legDrag: (i, pos, phase) => {

        if (phase === 'start') { commit((m) => Route.insert(m, i, pos)); S.dragPt = i + 1; S.callout = null; Scene.renderMap(S); return; }
        Route.move(S.mut(), S.dragPt, pos);

      },
      draw: (stroke, phase) => { if (!S.drawing) return; if (phase === 'end') { endDraw(stroke); render(); } else Scene.drawPreview(stroke); },

      onSubmit: () => { S.submitted = true; run(); render(); },
