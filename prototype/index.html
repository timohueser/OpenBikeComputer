<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#A4501E">
<title>OBC Planner</title>
<link rel="icon" href="data:,">
<script>
// The theme follows the system until the header's toggle sets it; the tokens key off data-theme.
(() => { const q = matchMedia('(prefers-color-scheme: dark)'), r = document.documentElement, f = () => (r.dataset.theme = q.matches ? 'dark' : 'light'); f(); q.addEventListener('change', f); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<style>
/* One stylesheet. Tokens follow the site (docs/assets/theme.css) and the app's palette roles: rust
   = on the device, amber = the one action, magenta on an amber casing = the route, olive captions,
   sage ground. Every colour fill is solid. Website: the site header, the planner's tool bar, the
   docked panel, the map, the profile along the bottom. Phone: the app's nav bar, the map, one
   sheet with two heights and a full-screen search; landscape is the profile alone. */

:root {
  color-scheme: light;
  --parchment: #f4f2eb; --parchment-2: #e7ecdf; --parchment-3: #d6d5c8; --panel: #fff; --panel-2: #f7f5ef;
  --line: rgba(92, 90, 46, .16); --line-strong: rgba(92, 90, 46, .32);
  --ink: #1c1b14; --ink-soft: #5c5a2e; --ink-faint: #676443;
  --amber: #f4a81d; --on-amber: #1c1b14; --rust: #a4501e; --cream: #fff2d1; --coral: #ae4825; --water: #33575b;
  --route: #cc2a93; --casing: #f4a81d; --prof-fill: #e3dfc4; --here: #2f7de1;
  --day-1: #cc2a93; --day-2: #2f6fb5; --day-3: #3b8a3f; --day-4: #5b2fb0;
  --shadow: 0 1px 2px rgba(28, 27, 20, .08), 0 6px 18px rgba(28, 27, 20, .10);
  --shadow-lg: 0 2px 6px rgba(28, 27, 20, .10), 0 18px 48px rgba(28, 27, 20, .16);
  --m-land: #eef0e3; --m-plain: #f2f1e6; --m-forest: #dbe4cf; --m-forest-2: #cfdbc2; --m-contour: rgba(92, 90, 46, .13);
  --m-water: #c9dcdc; --m-water-line: #7fa2a4; --m-road: #fffdf8; --m-road-casing: rgba(92, 90, 46, .30); --m-trunk: #efd9a8;
  --m-label: #4f4d2a; --m-label-halo: rgba(244, 242, 235, .9); --m-peak: #6b6847; --m-border: rgba(92, 90, 46, .35);
  --sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --parchment: #16150f; --parchment-2: #232820; --parchment-3: #414233; --panel: #201f17; --panel-2: #1b1a13;
  --line: rgba(189, 180, 126, .15); --line-strong: rgba(189, 180, 126, .3);
  --ink: #f2efe3; --ink-soft: #bdb47e; --ink-faint: #aaa383;
  --amber: #f2a93a; --on-amber: #16150f; --rust: #93461a; --cream: #ffe9c0; --coral: #ef996f; --water: #8bb9bd;
  --route: #e45cb5; --casing: #c98a1e; --prof-fill: #34331f; --here: #6fa8e8;
  --day-1: #e45cb5; --day-2: #6fa8e8; --day-3: #6cc47a; --day-4: #a070f0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .45), 0 18px 48px rgba(0, 0, 0, .5);
  --m-land: #1d1f18; --m-plain: #1b1c16; --m-forest: #212819; --m-forest-2: #26301d; --m-contour: rgba(189, 180, 126, .10);
  --m-water: #1d3134; --m-water-line: #4f7a7d; --m-road: #34342a; --m-road-casing: rgba(0, 0, 0, .45); --m-trunk: #5a4a26;
  --m-label: #d3cba0; --m-label-halo: rgba(22, 21, 15, .85); --m-peak: #aaa383; --m-border: rgba(189, 180, 126, .3);
}

/* ---------- base ---------- */
html, body { height: 100%; margin: 0; }
body { background: var(--parchment); color: var(--ink); font: 14px/1.35 var(--sans); overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button[disabled] { color: var(--parchment-3); cursor: default; }
input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.cap { font-size: 12px; color: var(--ink-faint); }
.chev { width: 12px; height: 12px; color: var(--ink-faint); flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line-strong); font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--ink); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--amber); color: var(--on-amber); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; }
.btn.icon { width: 34px; padding: 0; }
#app.phone .btn { height: 44px; border-radius: 12px; font-size: 16px; padding: 0 16px; }
#app.phone .btn.sm { height: 34px; border-radius: 10px; font-size: 14px; padding: 0 12px; }
#app.phone .btn.icon { width: 44px; padding: 0; }

/* ---------- stage and the phone frame on a laptop ---------- */
#stage { position: fixed; inset: 0; }
#stage.framed { display: grid; place-items: center; background: var(--parchment-2); }
#frame-tools { position: fixed; top: 12px; right: 12px; z-index: 60; display: flex; gap: 6px; }
#app { position: absolute; inset: 0; overflow: hidden; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
#stage.framed #app { position: relative; inset: auto; width: 390px; height: 844px; border-radius: 54px; --sat: 54px; --sab: 34px; box-shadow: 0 0 0 10px #1c1b14, 0 0 0 11px #3a392c, var(--shadow-lg); }
#stage.framed #app::before { content: ""; position: absolute; z-index: 50; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #0b0b08; }
#stage.framed #app::after { content: ""; position: absolute; z-index: 50; bottom: 8px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: var(--ink); pointer-events: none; }
#stage.framed.rot #app { width: 844px; height: 390px; --sat: 0px; --sab: 0px; --sal: 54px; --sar: 54px; }
#stage.framed.rot #app::before { top: 50%; left: 11px; width: 36px; height: 124px; margin: -62px 0 0 0; }

/* ---------- the site header (website) ---------- */
#site { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--rust); color: var(--cream); }
#site .brand { display: flex; align-items: center; gap: 12px; flex: none; }
#site .mark { width: 32px; height: 32px; border-radius: 7px; display: block; }
#site .name { font: 700 18px var(--mono); }
#site nav { display: flex; align-items: center; gap: 20px; margin-left: auto; font-size: 14px; }
#site nav a { display: flex; align-items: center; min-height: 56px; border-block: 2px solid transparent; cursor: pointer; }
#site nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
#site nav a.on { border-bottom-color: var(--amber); font-weight: 700; }
#site .theme { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid color-mix(in srgb, var(--cream) 40%, transparent); border-radius: 6px; color: var(--cream); }
#site .theme svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
:root[data-theme="dark"] #site .moon, :root:not([data-theme="dark"]) #site .sun { display: none; }
#app.phone #site { display: none; }

/* ---------- the plans page ---------- */
#plans { position: absolute; inset: 0; z-index: 30; background: var(--parchment); overflow-y: auto; -webkit-overflow-scrolling: touch; }
#app.web #plans { top: 56px; }
#plans .band { display: none; }
#app.phone #plans .band { display: flex; align-items: center; justify-content: space-between; height: calc(var(--sat) + 44px); padding: var(--sat) 16px 0; background: var(--rust); color: var(--cream); font: 500 16px var(--mono); letter-spacing: .1em; }
#plans .band .st { display: flex; align-items: center; gap: 16px; letter-spacing: 0; }
#plans .band svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#plans .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 40px; }
#app.phone #plans .wrap { padding: 8px 16px 40px; font-family: var(--ios); letter-spacing: -.01em; }
#plans .tt { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
#plans h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
#app.phone #plans h1 { font-size: 34px; letter-spacing: -.02em; }
#plans .new { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 10px; background: var(--amber); color: var(--on-amber); font-weight: 700; font-size: 14px; flex: none; }
#plans .new svg { width: 18px; height: 18px; }
#app.phone #plans .new { width: 44px; height: 44px; padding: 0; border-radius: 50%; }
#app.phone #plans .new svg { width: 22px; height: 22px; }
#app.phone #plans .new span { display: none; }
#plans .list { background: var(--panel); border-radius: 14px; overflow: hidden; }
#plans .prow2 { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; width: 100%; padding: 12px; text-align: left; border-top: 1px solid var(--line); }
#plans .prow2:first-child { border-top: 0; }
#plans .prow2:hover { background: var(--panel-2); }
#plans .prow2 > span { min-width: 0; }
#plans .sk { width: 96px; height: 72px; border-radius: 10px; background: var(--parchment-2); overflow: hidden; display: block; }
#plans .sk svg { width: 100%; height: 100%; display: block; overflow: visible; }
#plans .sk .rt-casing { stroke-width: 8px; }
#plans .sk .rt-line { stroke-width: 4px; }
#plans .sk .sk-a { fill: var(--ink); }
#plans .sk .sk-b { fill: var(--rust); }
#plans .pn { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 17px; font-weight: 600; line-height: 1.25; }
#plans .pm { display: block; font-size: 15px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app.web #plans .pn { font-size: 16px; }
#app.web #plans .pm { font-size: 13.5px; }
#app.phone #plans .pm { font-size: 14px; }
#plans .prow2 > .chev { width: 16px; height: 16px; }
#app.phone #plans .prow2 { grid-template-columns: 96px 1fr; }
#app.phone #plans .prow2 > .chev { display: none; }

/* ---------- website ---------- */
#app.web { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 56px 48px 1fr; }
#app.web #nav, #app.web .cancel, #app.web #panel .grab, #app.web #pfslot { display: none; }
#app.web #bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; }
#bar .back { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 8px 0 4px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-soft); }
#bar .back svg { width: 16px; height: 16px; }
#bar .back:hover, #bar .dates:hover, #bar .preset:hover, #bar .proto:hover { background: var(--parchment-2); }
#bar .plan { font-weight: 700; font-size: 15px; padding-left: 12px; margin-left: 2px; border-left: 1px solid var(--line-strong); display: inline-flex; align-items: center; height: 24px; }
#bar .dates { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); font-size: 12.5px; height: 30px; padding: 0 6px; border-radius: 8px; }
#bar .dates svg { width: 14px; height: 14px; }
#bar .proto { font-size: 11.5px; color: var(--ink-faint); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
#bar .preset { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; height: 30px; padding: 0 6px; border-radius: 8px; color: var(--ink); }
#bar .preset svg { width: 15px; height: 15px; color: var(--ink-soft); }
#bar .preset svg.chev { width: 12px; height: 12px; }
#bar .tools { margin-left: auto; display: flex; align-items: center; gap: 0; }
#bar .tools .sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 4px; }
#bar .tools .btn.ghost { padding: 0 5px; font-size: 12.5px; }
@media (max-width: 1500px) { #bar .tools .btn.ghost:not(.icon) svg { display: none; } }
@media (max-width: 1360px) { #bar .tools .btn.ghost span { display: none; } #bar .tools .btn.ghost:not(.icon) svg { display: block; } }
#bar .tools .btn.primary { font-size: 13px; padding: 0 10px; }
#app.web #panel { grid-column: 1; grid-row: 3; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); position: relative; z-index: 5; }
#app.web .mapcol { grid-column: 2; grid-row: 3; position: relative; min-width: 0; --profh: 168px; }
#app.web:has(#prof.collapsed) .mapcol { --profh: 40px; }
#app.web .mapcol > .map { bottom: var(--profh); }
#app.web .q { order: -1; padding: 12px 16px 10px; position: relative; z-index: 3; }
#app.web #head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 16px 4px 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 36px; }
#app.web #head.rest { display: block; padding: 8px 16px; }
#app.web #head.rest b { display: block; font-size: 14px; }
#app.web #head.act { padding-left: 16px; }
#app.web #head .cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app.web #head > .btn.sm { margin-left: auto; }
#app.web .body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 8px; }
#app.web #pin { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
#app.web #foot { border-top: 1px solid var(--line); padding: 8px 16px 10px; }
#app.web .ctl { position: absolute; right: 12px; bottom: calc(var(--profh) + 12px); display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.ctl > div { display: flex; flex-direction: column; background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); }
.ctl button { width: 34px; height: 32px; display: grid; place-items: center; color: var(--ink); }
.ctl button + button { border-top: 1px solid var(--line); }
.ctl svg { width: 16px; height: 16px; }
#app.phone .ctl { display: none; }

/* the profile panel (website) */
#app.web #prof { position: absolute; left: 0; right: 0; bottom: 0; height: var(--profh); padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); z-index: 3; }
#prof .ph { display: flex; align-items: center; gap: 10px; height: 24px; white-space: nowrap; }
#prof .ph .h { font-weight: 700; font-size: 13px; }
#prof .ph .cap { overflow: hidden; text-overflow: ellipsis; }
#prof .ph .right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
#prof .slot { margin-top: 4px; }
#prof .pf { --pfl: 52px; --pfh: 66px; }
#prof .note { padding: 8px 0 0; }

/* ---------- the profile component ---------- */
.pf { display: grid; grid-template-columns: var(--pfl, 0px) 1fr; column-gap: 8px; row-gap: 5px; align-items: center; }
.pf .pl { font-size: 11px; color: var(--ink-faint); white-space: nowrap; text-align: right; }
.pf .pl.ax { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; line-height: 1; padding: 0 0 1px; }
.pf-nums { position: relative; height: 16px; }
.pf-nums b { position: absolute; transform: translateX(-50%); font-size: 12px; font-weight: 700; cursor: pointer; }
.pf-nums b.sel { text-decoration: underline; text-underline-offset: 3px; }
.pf-nums i { position: absolute; transform: translateX(-50%); font-size: 11px; font-style: normal; color: var(--ink-faint); }
.pf-plot { position: relative; height: var(--pfh, 120px); touch-action: none; user-select: none; -webkit-user-select: none; }
.pf-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.pf-area { cursor: pointer; fill: color-mix(in srgb, var(--dc) 24%, var(--panel)); }
.pf-area.sel { fill: color-mix(in srgb, var(--dc) 48%, var(--panel)); }
.pf-area.flat { fill: var(--prof-fill); }
.pf-line { fill: none; stroke: var(--dc, var(--ink)); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; pointer-events: none; }
.prof-grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pf-rule { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; pointer-events: none; }
.pf-closure { fill: color-mix(in srgb, var(--coral) 28%, var(--panel)); pointer-events: none; }
.pf-gap { fill: color-mix(in srgb, var(--amber) 38%, var(--panel)); pointer-events: none; }
.pf-scrub { stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.pf-over { position: absolute; inset: 0; pointer-events: none; }
.pf-band { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; pointer-events: auto; cursor: ew-resize; }
.pf-end { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); color: var(--panel); font: 700 13px var(--ios); display: grid; place-items: center; pointer-events: none; }
.pf-end.big { width: 28px; height: 28px; margin: -14px 0 0 -14px; border-width: 2.5px; }
.pf-tick { position: absolute; bottom: 0; width: 2px; height: 22px; margin-left: -1px; background: var(--ink); border-radius: 1px; pointer-events: auto; cursor: pointer; }
.pf-tick::after { content: ""; position: absolute; left: -5px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink); }
.pf-tick.sel::after { background: var(--amber); }
.pf-pt { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--panel); border: 3px solid var(--ink); pointer-events: none; }
.pf-read { position: absolute; top: 6px; margin-left: 8px; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 7px; border-radius: 6px; background: var(--ink); color: var(--panel); white-space: nowrap; pointer-events: none; z-index: 2; }
.pf .band { height: 8px; position: relative; }
.band > i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.band > i.paved { background: var(--parchment-3); }
.band > i.unpaved { background: var(--rust); }
.band > i.unknown { background: transparent; border: 1.5px solid var(--rust); }
.band > i.snow { background: color-mix(in srgb, var(--water) 55%, var(--panel)); }

/* ---------- phone ---------- */
#app.phone { background: var(--parchment); font-family: var(--ios); font-size: 15px; letter-spacing: -.01em; }
#app.phone #bar, #app.phone #foot, #app.phone #prof { display: none; }
#app.phone .mapcol { position: absolute; inset: 0; }
#app.phone.focused .mapcol { visibility: hidden; }
#app.phone #nav { position: absolute; z-index: 20; left: 0; right: 0; top: 0; height: calc(var(--sat) + 52px); padding: var(--sat) 12px 0; display: flex; align-items: center; justify-content: space-between; background: var(--parchment); border-bottom: 1px solid var(--line); }
#nav .nb { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--ink); }
#nav .nb svg { width: 22px; height: 22px; }
#nav .nb.dis { color: var(--parchment-3); }
#nav .nr { display: flex; gap: 8px; }
#nav .title { position: absolute; left: 100px; right: 100px; top: var(--sat); height: 52px; line-height: 52px; text-align: center; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app.phone #panel { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; height: 250px; background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: 0 -1px 0 var(--line), 0 -6px 24px rgba(28, 27, 20, .12); display: flex; flex-direction: column; padding: 0 16px var(--sab); transition: height .34s cubic-bezier(.2, .8, .2, 1); touch-action: none; }
#app.phone #panel.full { top: 0; height: auto; border-radius: 0; box-shadow: none; z-index: 25; padding-top: var(--sat); }
#app.phone #panel .grab { position: relative; flex: none; width: 36px; height: 5px; border-radius: 3px; background: var(--parchment-3); margin: 8px auto 0; cursor: grab; }
#app.phone #panel .grab::before { content: ""; position: absolute; inset: -10px -60px -8px; }
#app.phone #panel.full .grab, #app.phone #panel.full #head, #app.phone #panel.full #pfslot { display: none; }
#app.phone #panel[data-detent="collapsed"]:not(.full) .q, #app.phone #panel[data-detent="collapsed"]:not(.full) #body, #app.phone #panel[data-detent="collapsed"]:not(.full) #pin { display: none; }
#app.phone #head { flex: none; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 0 0; cursor: grab; }
#app.phone #head .txt { flex: 1; min-width: 0; }
#app.phone #head .txt > * { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app.phone #head b { font-size: 17px; font-weight: 600; }
#app.phone #head .cap { font-size: 15px; color: var(--ink-soft); }
#app.phone #head .sbtn { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--parchment-2); display: grid; place-items: center; color: var(--ink); }
#app.phone #head .sbtn svg { width: 20px; height: 20px; }
#app.phone #head .btn.sm { flex: none; }
#app.phone #pfslot { flex: none; margin-top: 6px; }
#app.phone #pfslot .pf { --pfh: 120px; grid-template-columns: 1fr; }
#app.phone #pfslot .pf .pl, #app.phone #pfslot .pf-nums i { display: none; }
#app.phone .pf-nums b { font-size: 13px; }
#app.phone .q { flex: none; padding-top: 12px; }
#app.phone #panel.full .q { padding-top: 8px; }
#app.phone .cancel { flex: none; height: 44px; padding: 0 6px; font-size: 17px; color: var(--ink); }
#app.phone .body { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; margin: 0 -10px; padding: 0 10px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#app.phone #pin { flex: none; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
#app.phone #pin .btn { height: 50px; flex: 1; font-size: 17px; }
#app.phone #pin .btn.ghost { flex: none; }

/* landscape: the profile alone */
#land { display: none; }
#app.land .mapcol, #app.land #nav, #app.land #panel { display: none; }
#app.land #land { display: block; position: absolute; inset: 0; background: var(--panel); padding: 14px calc(var(--sar) + 20px) 12px calc(var(--sal) + 20px); }
#land .lh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 17px; font-weight: 700; white-space: nowrap; padding-left: 82px; }
#land .lh .cap { font-size: 15px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
#land .slot { position: absolute; left: calc(var(--sal) + 20px); right: calc(var(--sar) + 20px); top: 48px; bottom: 14px; }
#land .pf { --pfl: 74px; height: 100%; grid-template-rows: 16px minmax(0, 1fr) auto auto; }
#land .pf .pl { font-size: 13px; }
#land .pf-plot { height: auto; align-self: stretch; }
#land .pf-nums b, #land .pf-read { font-size: 13px; }

/* ---------- the box ---------- */
.qrow { display: flex; align-items: center; gap: 6px; }
.qbox { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line-strong); }
.qbox > svg { width: 18px; height: 18px; flex: none; color: var(--ink-faint); }
.qbox.focus { border-color: var(--ink); }
.qbox input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 0; font-size: 16px; color: var(--ink); }
.qbox input::placeholder { color: var(--ink-faint); opacity: 1; }
.qbox.edited input { color: var(--ink-faint); }
.qbox .count { flex: none; font: 11px var(--mono); color: var(--ink-faint); }
.qbox .x { width: 34px; height: 34px; margin-right: -10px; display: grid; place-items: center; color: var(--ink-faint); flex: none; }
.qbox .x svg { width: 18px; height: 18px; }
.qbox .pointed { display: contents; }
.qbox .pointed .chip { height: 28px; padding-right: 4px; gap: 4px; flex: none; max-width: 60%; }
.qbox .pointed .chip .xb { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-faint); }
.qbox .pointed .chip .xb svg { width: 12px; height: 12px; }
#app.phone .qbox { height: 44px; border-radius: 12px; background: var(--parchment-2); border-color: transparent; }
#app.phone .qbox input { font-size: 17px; }
#app.phone .qbox .x { width: 44px; height: 44px; margin-right: -14px; }
#app.phone .qbox .pointed .chip { height: 34px; font-size: 15px; }

/* chips: neutral, editable ones carry a chevron; the open one is inverted; one scrolling row on the phone */
#chips { position: relative; }
.chips { display: flex; align-items: center; gap: 6px; }
#app.web .chips { flex-wrap: wrap; row-gap: 8px; margin-top: 10px; }
#app.phone .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 8px; margin: 10px -16px 0; padding: 0 16px; }
#app.phone .chips::-webkit-scrollbar { display: none; }
.chips > .lbl { font-size: 12px; color: var(--ink-faint); margin-right: 2px; white-space: nowrap; }
#app.phone .chips > .lbl { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--parchment-2); color: var(--ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; cursor: default; flex: none; }
button.chip { cursor: pointer; }
.chip svg { width: 13px; height: 13px; }
.chip .k { font-weight: 400; color: var(--ink-faint); }
.chip.filter { background: transparent; border-color: var(--line-strong); color: var(--ink-soft); }
.chip.off { background: transparent; color: var(--ink-faint); text-decoration: line-through; border: 1px dashed var(--line-strong); font-weight: 400; cursor: pointer; }
.chip.off .k { text-decoration: none; display: inline-block; }
.chip.need { background: transparent; border: 1px dashed var(--amber); color: var(--ink-soft); }
.chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip.on .k, .chip.on .chev { color: var(--parchment-3); }
.chip.on .chev { transform: rotate(180deg); }
.chip .xb { display: none; width: 16px; height: 16px; border-radius: 50%; margin: 0 -4px 0 0; place-items: center; background: var(--parchment-3); color: var(--ink); }
.chip .xb svg { width: 11px; height: 11px; }
#app.web .chip.rm:hover { background: var(--parchment-2); border-color: var(--line-strong); color: var(--ink); }
#app.web .chip.rm:hover .xb { display: grid; }
#app.phone .chip { height: 36px; font-size: 15px; padding: 0 12px; border-radius: 18px; gap: 6px; }
#app.phone .chip svg { width: 15px; height: 15px; }
#app.phone .chip .chev { width: 12px; height: 12px; }
#app.phone .chip.filter { background: var(--parchment-2); color: var(--ink); border-color: transparent; }

/* pickers: a block under the chips (phone), a popover under the chips (website) */
.pick { position: relative; margin-top: 10px; padding: 8px; border-radius: 14px; background: var(--parchment-2); display: grid; gap: 6px; }
.pick::before { content: ""; position: absolute; top: -6px; left: var(--ax, 40px); width: 12px; height: 12px; margin-left: -6px; background: var(--parchment-2); transform: rotate(45deg); border-radius: 2px; }
#app.web .pick { position: absolute; z-index: 6; top: calc(100% + 9px); left: 0; right: 0; margin: 0; padding: 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); gap: 4px; }
#app.web .pick::before { background: var(--panel); border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); width: 10px; height: 10px; margin-left: -5px; }
.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg2.two { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
.seg2 > button { min-height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ink); border: 1px solid transparent; white-space: nowrap; padding: 0 6px; }
.seg2 > button > small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.seg2 > .on { background: var(--panel); border-color: var(--line-strong); }
.seg2.days { display: flex; overflow-x: auto; scrollbar-width: none; }
.seg2.days::-webkit-scrollbar { display: none; }
.seg2.days > button { flex: none; width: 64px; }
#app.web .seg2 > button { min-height: 40px; font-size: 13.5px; }
#app.web .seg2 > button > small { font-size: 12px; }
#app.web .seg2 > .on { background: var(--parchment-2); border-color: transparent; }
.tg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tg > button { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
.tg > button > i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: var(--panel); }
.tg > .on > i { background: var(--ink); border-color: var(--ink); }
.tg > button > small { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
#app.web .tg > button { min-height: 36px; font-size: 13.5px; }
#app.web .tg > button > i { width: 18px; height: 18px; }
.ck { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.prow-pick { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); margin-top: 2px; width: 100%; text-align: left; }
.prow-pick > svg { width: 18px; height: 18px; color: var(--ink-soft); flex: none; }
.prow-pick > svg:last-child { margin-left: auto; color: var(--ink-faint); }
#app.web .prow-pick { font-size: 13.5px; min-height: 36px; }
.note-pick { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 6px 0; font-size: 15px; line-height: 1.3; color: var(--ink-soft); border-top: 1px solid var(--line); margin-top: 2px; }
.note-pick > .btn { margin-left: auto; flex: none; }
#app.web .note-pick { font-size: 13px; }

/* ---------- the body: rows, notes, cards ---------- */
.sec { padding: 12px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
#app.phone .sec { font-size: 13px; padding-top: 14px; }
.row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row > .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--parchment-2); color: var(--ink-soft); }
.row > .ic svg { width: 15px; height: 15px; }
.row .t { font-weight: 600; }
.row .m { font-size: 12.5px; color: var(--ink-soft); }
.row.sel { background: var(--parchment-2); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; border-color: transparent; }
.row.prow { cursor: pointer; }
.row.prow > * { min-width: 0; }
.row .t, .row .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mm { display: flex; justify-content: space-between; gap: 10px; }
.row .mm .hrs { flex: none; }
#app.web .row.prow { grid-template-columns: 28px 1fr; }
#app.phone .row { grid-template-columns: 32px 1fr auto; padding: 11px 0; }
#app.phone .row > .ic { width: 32px; height: 32px; }
#app.phone .row.prow { grid-template-columns: 32px 1fr; min-height: 66px; }
#app.phone .row.prow .t { font-size: 17px; }
#app.phone .row.prow .m { font-size: 15px; margin-top: 2px; }
.row.dim .t, .row.dim .m { color: var(--ink-faint); }
.row.more { grid-template-columns: 32px 1fr auto !important; min-height: 56px; }
.row.more > .chev { width: 20px; height: 20px; }
.row.orow { grid-template-columns: 32px 1fr auto !important; }
#app.web .row.orow { grid-template-columns: 28px 1fr auto !important; }
.row.orow .ic { grid-row: 1 / 3; background: transparent; }
.row.orow .ic.rt { color: var(--ink); }
.row.orow .win { font-size: 15px; font-weight: 600; white-space: nowrap; }
#app.web .row.orow .win { font-size: 13.5px; }
.row.orow .m { grid-column: 2 / 4; margin-top: -3px; }
.note { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 15px; color: var(--ink-soft); line-height: 1.3; }
.note > svg { width: 18px; height: 18px; flex: none; color: var(--ink-faint); }
.note > .btn { margin-left: auto; flex: none; }
.note.quiet { padding: 6px 0 0; font-size: 13px; }
#app.web .note { font-size: 13.5px; }
#app.web .note.quiet { font-size: 12.5px; }
.pickhint { margin-top: 6px; }
.body > .btn { margin-top: 6px; }
.place .n { font-size: 20px; font-weight: 700; line-height: 1.2; margin-top: 10px; }
.place .k { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
.place .w { font-size: 15px; margin-top: 6px; }
.rt-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 700; padding: 8px 0 2px; }
.rt-t small { font-size: 15px; font-weight: 400; color: var(--ink-soft); }
#app.web .rt-t { font-size: 15px; }
#app.web .rt-t small { font-size: 13px; }
.ledger { display: grid; grid-template-columns: auto 1fr; column-gap: 16px; margin-top: 4px; }
.ledger > dt { color: var(--ink-soft); font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ledger > dd { margin: 0; text-align: right; font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ledger > dd small { font-weight: 400; color: var(--ink-faint); }
#app.phone .ledger > dt, #app.phone .ledger > dd { padding: 7px 0; font-size: 15px; }
.diff { display: grid; grid-template-columns: 52px 1fr 1fr; row-gap: 8px; margin-top: 10px; align-items: baseline; }
.diff .d { font-weight: 700; }
.diff .b { color: var(--ink-faint); }
.diff .ar { color: var(--ink-faint); padding: 0 4px; }
.diff .a { font-weight: 700; }

/* the days: number, title and figures, the km, a chevron for the points; the selected day carries its actions */
.day { position: relative; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; display: grid; grid-template-columns: 32px 1fr auto 36px; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 10px 0 13px; min-height: 56px; border-bottom: 1px solid var(--line); cursor: pointer; }
.day .n { grid-row: 1 / 3; width: 26px; height: 26px; border-radius: 50%; background: var(--dc, var(--ink)); color: var(--panel); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.day .n.rest { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.day .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.day .m { grid-column: 2; grid-row: 2; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .km { grid-column: 3; grid-row: 1; font-size: 13px; font-weight: 600; white-space: nowrap; }
.day .dmore, .day .dchev { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: var(--ink-soft); }
.day .dmore { grid-column: 3; grid-row: 2; justify-self: end; margin: -6px -4px -8px 0; }
.day .dchev { grid-column: 4; grid-row: 1 / 3; }
.day .dmore svg, .day .dchev svg { width: 18px; height: 18px; }
.day .dmore:hover, .day .dchev:hover { background: var(--parchment-3); }
.day .bar { position: absolute; left: 42px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--dc, var(--route)); }
.day.sel { background: var(--parchment-2); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; border-color: transparent; }
.day.sel .bar { left: 52px; }
input.rename { font: inherit; font-weight: 600; width: 100%; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; outline: none; padding: 0; color: var(--ink); }
.dpts { padding: 0 0 4px 12px; border-bottom: 1px solid var(--line); }
.row.ptrow { min-height: 48px; padding: 6px 0; }
#app.phone .row.ptrow { min-height: 60px; padding: 8px 0; }
.legrow { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 0 0 38px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); width: 100%; text-align: left; }
.legrow > svg { width: 14px; height: 14px; }
.legrow > .chev { width: 11px; height: 11px; }
.legrow:hover { color: var(--ink); }
#app.phone .legrow { height: 44px; font-size: 15px; padding-left: 42px; }
#app.phone .day { min-height: 66px; grid-template-columns: 32px 1fr auto 44px; }
#app.phone .day .t { font-size: 17px; }
#app.phone .day .m, #app.phone .day .km { font-size: 15px; }
#app.phone .day .dmore, #app.phone .day .dchev { width: 44px; height: 44px; }
#app.phone .day .dmore { margin: -8px -6px -10px 0; }
#app.phone .day .bar { height: 4px; bottom: 6px; }

/* ---------- menus ---------- */
#menus { position: absolute; inset: 0; z-index: 40; }
#menus .scrim { position: absolute; inset: 0; }
#app.phone #menus .scrim { background: rgba(28, 27, 20, .18); }
.menu { position: absolute; min-width: 250px; max-width: 360px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; }
#app.phone .menu { left: 12px; right: 12px; max-width: none; top: calc(var(--sat) + 58px); }
#app.phone .menu.anchored { left: auto; right: 12px; width: 280px; }
.mt { font-size: 12px; font-weight: 600; color: var(--ink-faint); padding: 8px 12px 4px; }
.mc { font-size: 12.5px; color: var(--ink-faint); padding: 6px 12px 8px; line-height: 1.35; }
.mrow { display: flex; align-items: center; width: 100%; min-height: 38px; padding: 0 12px; border-radius: 8px; font-size: 14px; text-align: left; gap: 8px; }
.mrow:hover { background: var(--parchment-2); }
.mrow.on { font-weight: 700; background: var(--parchment-2); }
.mrow.dis { color: var(--parchment-3); }
.mrow.faint { color: var(--ink-faint); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 4px; }
.mrow .tg-r { margin-left: auto; color: var(--ink-soft); font-weight: 400; font-size: .92em; }
.mrow.adv { border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 4px; }
.mrow.adv svg { width: 16px; height: 16px; color: var(--ink-soft); }
#app.phone .mrow { min-height: 48px; font-size: 17px; }
#app.phone .mt, #app.phone .mc { font-size: 13px; }
.menu .pick { position: static; margin: 4px 2px; }
.menu .pick::before { display: none; }
.qr { display: grid; grid-template-columns: repeat(9, 10px); gap: 2px; margin: 8px 12px; }
.qr i { width: 10px; height: 10px; background: var(--parchment-2); border-radius: 1px; }
.qr i.on { background: var(--ink); }

/* ---------- the callout on the map ---------- */
.callout { position: absolute; z-index: 15; width: 260px; max-width: calc(100% - 16px); }
.callout .co { position: relative; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 10px 12px 12px; }
.co-arrow { position: absolute; bottom: -7px; width: 14px; height: 14px; margin-left: -7px; background: var(--panel); border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); transform: rotate(45deg); }
.callout.below .co-arrow { bottom: auto; top: -7px; border: 0; border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); }
.co-t { font-weight: 700; font-size: 14px; padding-right: 26px; line-height: 1.25; }
.co-m { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.co-x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-faint); }
.co-x svg { width: 14px; height: 14px; }
.co-acts { display: flex; gap: 8px; margin-top: 10px; }
.co-acts .btn { flex: 1; padding: 0 8px; }
.co > .btn { margin-top: 10px; width: 100%; }
.co-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin-top: 10px; background: var(--parchment-2); border-radius: 10px; padding: 3px; }
.co-seg > button { min-height: 44px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-soft); }
.co-seg > button svg { width: 16px; height: 16px; }
.co-seg > .on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.co-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 2px; border-top: 1px solid var(--line); font-size: 14px; text-align: left; }
.co-row:first-of-type { margin-top: 8px; }
.co-row > span { color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; }
#app.phone .callout { width: 290px; }
#app.phone .co-t { font-size: 17px; }
#app.phone .co-m, #app.phone .co-row > span { font-size: 15px; }
#app.phone .co-row { font-size: 17px; min-height: 48px; }
#app.phone .co-acts .btn { height: 44px; font-size: 15px; }
#app.phone .co-seg > button { font-size: 12px; min-height: 48px; }

/* ---------- the map, its lines and marks ---------- */
.map { position: absolute; inset: 0; background: var(--m-land); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.map.drawing { cursor: crosshair; }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.map svg text { font-size: calc(var(--fs, 14px) * var(--lk, 1)); stroke-width: calc(3px * var(--lk, 1)); }
.attribution { position: absolute; right: 6px; bottom: 4px; font: 10px var(--sans); color: var(--ink-faint); background: var(--m-label-halo); padding: 1px 4px; border-radius: 3px; }
.rt-casing, .rt-line, .rt-alt-casing, .rt-alt, .rt-ghost, .rt-import-casing, .rt-import, .rt-spur, .rt-draw { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.rt-casing, .rt-import-casing { stroke: var(--casing); stroke-width: 10px; }
.rt-import-casing { stroke: var(--panel); }
.rt-line, .rt-import { stroke: var(--route); stroke-width: 5px; }
.rt-alt-casing { stroke: var(--panel); stroke-width: 9px; }
.rt-alt { stroke: var(--ink-faint); stroke-width: 4.5px; }
.rt-ghost { stroke: var(--route); stroke-width: 3.5px; stroke-dasharray: 2 8; }
.rt-casing.straight, .rt-line.straight { stroke-dasharray: 10 8; stroke-linecap: butt; }
.rt-casing.drawn { stroke: var(--panel); }
.rt-spur { stroke: var(--route); stroke-width: 2.5px; stroke-dasharray: 1 6; }
.rt-draw { stroke: var(--route); stroke-width: 4px; }
#app.phone .rt-casing, #app.phone .rt-import-casing { stroke-width: 8px; }
#app.phone .rt-line, #app.phone .rt-import { stroke-width: 4px; }
.rt-hit { fill: none; stroke: transparent; stroke-width: 24px; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.rt-hit[data-leg] { cursor: move; }
.mk .hit { fill: transparent; }
.mk .ring { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.mk use { color: var(--ink); }
.mk .num { fill: var(--panel); font: 700 13px var(--sans); text-anchor: middle; }
.mk .ml { font: 600 13px var(--sans); fill: var(--m-label); paint-order: stroke; stroke: var(--m-label-halo); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.mk .ml.rt { fill: var(--ink); font-weight: 700; }
#app.phone .mk .ml { font-size: 15px; stroke-width: 4px; }
.mk[data-act] { cursor: pointer; }
.mk.start .ring { stroke-width: 3; }
.mk.dend .ring { fill: var(--ink); stroke: var(--panel); stroke-width: 2.5; }
.mk.dend use { color: var(--panel); }
.mk.dend .ml { fill: var(--ink); }
.mk.dend.pointed .ring, #app.picking .mk.dend .ring { fill: var(--amber); stroke: var(--ink); }
.mk.dend.pointed .num, #app.picking .mk.dend .num { fill: var(--on-amber); }
.mk.res.sel .ring { fill: var(--amber); stroke: var(--ink); stroke-width: 2.5; }
.mk.res.sel use { color: var(--on-amber); }
.mk.res.sel .ml, .mk.place .ml, .mk.newEnd .ml, .mk.gap .ml, .mk.dest .ml { fill: var(--ink); font-weight: 700; }
.mk.dimmed .ring { stroke: var(--ink-faint); }
.mk.dimmed use { color: var(--ink-faint); }
.mk.place .ring { fill: var(--amber); stroke: var(--ink); }
.mk.place use { color: var(--on-amber); }
.mk.dest .ring { fill: var(--ink); stroke: var(--panel); stroke-width: 3; }
.mk.dest use { color: var(--panel); }
.mk.here .ring { fill: var(--here); stroke: #fff; stroke-width: 3; }
.mk.oldEnd .ring { stroke: var(--ink-faint); stroke-dasharray: 3 2; }
.mk.oldEnd use { color: var(--ink-faint); }
.mk.oldEnd .ml { fill: var(--ink-faint); }
.mk.newEnd .ring { fill: var(--amber); stroke: var(--ink); stroke-width: 2.5; }
.mk.newEnd use { color: var(--on-amber); }
.mk.gap .ring { stroke: var(--amber); stroke-width: 2.5; }
.mk.pt .ring { stroke: var(--ink); stroke-width: 2; }
.mk.pt.pass .ring { stroke-width: 2.5; }
.mk.pt.live .ring { fill: var(--amber); }
.mk.pin .ring { stroke: var(--ink-soft); stroke-width: 1.5; }
.mk.pin use { color: var(--ink-soft); }
.mk.scrubpt { pointer-events: none; }
.mk.scrubpt .ring { stroke-width: 3; }

</style>

/* Line geometry: kit paths sampled into polylines with a km at every point, so a day end, a
   scrubber or a map window can be turned into a place on the line and back. A polyline is
   {map, pts: [[x, y, km], ...]} sorted by km. Not a routing engine: a fake "routed" leg is a
   smooth curve, a straight leg a line, a drawn leg the rider's stroke. */

const Line = (() => {
  const samples = {};
  // n points along a kit path, in its own map units.
  function sample(id, n) {
    const key = id + ':' + n;
    if (samples[key]) return samples[key];
    const p = document.getElementById(id), L = p.getTotalLength(), out = [];
    for (let i = 0; i <= n; i++) { const q = p.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
    return (samples[key] = out);
  }
  // Points of a kit path with km spread linearly from k0 to k1.
  const withKm = (pts, k0, k1) => pts.map(([x, y], i) => [x, y, k0 + ((k1 - k0) * i) / (pts.length - 1)]);
  const join = (map, parts) => ({ map, pts: parts.flat() });

  function pointAt(line, km) {
    const P = line.pts; if (km <= P[0][2]) return { map: line.map, x: P[0][0], y: P[0][1] };
    let lo = 0, hi = P.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][2] <= km) lo = m; else hi = m; }
    const a = P[lo], b = P[hi], u = b[2] > a[2] ? (km - a[2]) / (b[2] - a[2]) : 0;
    return { map: line.map, x: a[0] + (b[0] - a[0]) * Math.min(1, u), y: a[1] + (b[1] - a[1]) * Math.min(1, u) };
  }
  // The km range of the line inside a rect {x, y, w, h} in the line's map, or null.
  function kmRange(line, r) {
    let a = Infinity, b = -Infinity;
    for (const [x, y, km] of line.pts) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { a = Math.min(a, km); b = Math.max(b, km); }
    return a <= b ? [a, b] : null;
  }
  // The nearest point of the line to a position in the line's map: {km, dist} (dist in map units).
  function nearest(line, pos) {
    let best = { km: 0, dist: Infinity };
    const P = line.pts;
    for (let i = 1; i < P.length; i++) {
      const [ax, ay, ak] = P[i - 1], [bx, by, bk] = P[i], dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
      const t = l2 ? Math.max(0, Math.min(1, ((pos.x - ax) * dx + (pos.y - ay) * dy) / l2)) : 0;
      const d = Math.hypot(pos.x - (ax + dx * t), pos.y - (ay + dy * t));
      if (d < best.dist) best = { km: ak + (bk - ak) * t, dist: d };
    }
    return best;
  }
  function slice(line, a, b) {
    const out = [pointAt(line, a)].map((p) => [p.x, p.y]);
    for (const [x, y, km] of line.pts) if (km > a && km < b) out.push([x, y]);
    const e = pointAt(line, b); out.push([e.x, e.y]);
    return out;
  }
  const pathD = (pts) => (pts.length ? 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L') : '');
  const lengthKm = (map, pts) => { const m = DATA.MAPS[map]; let l = 0; for (let i = 1; i < pts.length; i++) l += Math.hypot((pts[i][0] - pts[i - 1][0]) * m.kmx, (pts[i][1] - pts[i - 1][1]) * m.kmy); return l; };
  // A fake routed leg: a cubic bend between two points, its side fixed by the endpoints.
  function curve(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, s = ((Math.round(a.x + a.y + b.x + b.y) % 7) - 3) / 3;
    const nx = (-dy / d) * d * 0.22 * s, ny = (dx / d) * d * 0.22 * s;
    const c1 = { x: a.x + dx * 0.3 + nx, y: a.y + dy * 0.3 + ny }, c2 = { x: a.x + dx * 0.7 - nx * 0.6, y: a.y + dy * 0.7 - ny * 0.6 }, out = [];
    for (let i = 0; i <= 24; i++) { const t = i / 24, u = 1 - t; out.push([u * u * u * a.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * b.x, u * u * u * a.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * b.y]); }
    return out;
  }
  // The elevation samples of a kit profile path: [[km, m], ...].
  const profiles = {};
  function profile(id) {
    if (profiles[id]) return profiles[id];
    const n = document.getElementById(id).getAttribute('d').match(/-?\d+\.?\d*/g).map(Number), out = [];
    for (let i = 0; i + 1 < n.length; i += 2) out.push([n[i], (300 - n[i + 1]) * 10]);
    return (profiles[id] = out);
  }
  function elevAt(samples, km) {
    let lo = 0, hi = samples.length - 1;
    if (km <= samples[0][0]) return samples[0][1]; if (km >= samples[hi][0]) return samples[hi][1];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (samples[m][0] <= km) lo = m; else hi = m; }
    const a = samples[lo], b = samples[hi]; return a[1] + ((b[1] - a[1]) * (km - a[0])) / (b[0] - a[0] || 1);
  }
  // Cumulative climb up to each sample, for a climb between two kms.
  function climbTable(samples) { let c = 0; return samples.map(([km, e], i) => { if (i && e > samples[i - 1][1]) c += e - samples[i - 1][1]; return [km, c]; }); }
  const climbBetween = (table, a, b) => elevAt(table, b) - elevAt(table, a);

  return { sample, withKm, join, pointAt, kmRange, nearest, slice, pathD, lengthKm, curve, profile, elevAt, climbTable, climbBetween };
})();

/* The fake parser: a keyword matcher over one table of words. It stands in for the model (#2238)
   and is deliberately not clever. Parser.parse(text, ctx) → request. */

const Parser = (() => {
  // [phrases, field, value]. Phrases are separated by |, tokens by a space; N matches a number.
  const WORDS = [
    ['campsite|campsites|camping|campground|campgrounds|zeltplatz|zeltplatze|campingplatz|campingplatze|tent|tents', 'kind', 'campsite'],

    ['places to sleep|place to sleep|sleep|somewhere to sleep|schlafen|ubernachten|ubernachtung|accommodation', 'kind', 'sleep'],
    ['shop|shops|supermarket|supermarkets|supermarkt|supermarkte|grocery|groceries|store|stores|laden|einkaufen|resupply|food|bakery|backer|backerei', 'kind', 'shop'],
    ['pharmacy|pharmacies|apotheke|apotheken|chemist|chemists', 'kind', 'pharmacy'],
    ['bike shop|bike shops|bikeshop|bikeshops|bike repair|bicycle shop|bicycle shops|fahrradladen|fahrradwerkstatt|radladen|bike mechanic', 'kind', 'bikeshop'],
    ['water|fountain|fountains|wasser|brunnen|trinkwasser|drinking water|tap', 'kind', 'water'],
    ['train|trains|train station|station|bahnhof|railway|zug', 'kind', 'train'],
    ['hut|huts|hutte|hutten|refuge|refuges', 'kind', 'hut'],
    ['shelter|shelters|schutzhutte', 'kind', 'shelter'],
    ['end of|end|ende|finish|ziel', 'part', 'end'],
    ['middle of|middle|mid|halfway|mitte|half', 'part', 'middle'],
    ['start of|start|beginning of|beginning|anfang|begin', 'part', 'start'],
    ['whole day|all day|ganzer tag|den ganzen tag', 'part', 'whole'],
    ['day N|tag N|d N|day N s', 'day', null],
    ['tomorrow|morgen', 'rel', 'tomorrow'], ['today|heute', 'rel', 'today'],
    ['along the whole route|along the route|along route|along the way|on the route|whole route|the whole route|whole trip|the whole trip|entire route|entire trip|unterwegs|entlang der route|entlang|auf der route|on the way|en route', 'where', 'route'],
    ['in this map view|this map view|map view|in this view|in view|on the map|on screen', 'where', 'view'],
    ['from here|starting here|starting from here|start here|here|hier|von hier|ab hier', 'here', true],
    ['open on|open|opened|geoffnet|offen|opening hours|hours', 'open', true],
    ['sunday|sundays|sun|sonntag|sonntags', 'wd', 'sun'], ['monday|mondays|mon|montag', 'wd', 'mon'], ['tuesday|tuesdays|tue|dienstag', 'wd', 'tue'],
    ['wednesday|wednesdays|wed|mittwoch', 'wd', 'wed'], ['thursday|thursdays|thu|donnerstag', 'wd', 'thu'], ['friday|fridays|fri|freitag', 'wd', 'fri'], ['saturday|saturdays|sat|samstag', 'wd', 'sat'],
    ['within N km|within N kilometres|within N kilometers|N km|innerhalb N km|innerhalb von N km|im umkreis von N km|N kilometres|N kilometers', 'within', null],
    ['road bike|roadbike|road|rennrad', 'bike', 'road'], ['gravel bike|gravelbike|gravel', 'bike', 'gravel'], ['mtb|mountain bike|mountainbike', 'bike', 'mtb'],
    ['touring bike|touring|trekking|tourenrad|trekkingrad', 'bike', 'touring'],
    ['shortest|kurzeste|fastest|quickest|short', 'goal', 'shortest'], ['least climbing|least climb|flattest|flat|wenig hohenmeter|flach|easy', 'goal', 'leastclimb'],
    ['least unpaved|paved|asphalt|on roads|roads only|asphaltiert|tarmac', 'goal', 'leastunpaved'], ['most climbing|most climb|hilliest|hilly', 'goal', 'mostclimb'], ['balanced|ausgewogen', 'goal', 'balanced'],
    ['route|ride|way|tour|weg|strecke|fahrt|cycle|ride to|route to|route up|way to', 'routeword', true],
    ['via|uber|through|by way of|stopping at|stop at|visit|visiting|with a stop at|passing', 'prep', 'via'],
    ['at|in|near|nearby|next to|around|close to|bei|nahe|in der nahe von|um', 'prep', 'near'],
    ['to|towards|up|nach|zum|zur|bis|up to', 'prep', 'to'],
    ['from|von|ab', 'prep', 'from'],
    ['gaps|gap|longest stretch|longest stretches|stretches without|stretch without|lucken|lucke|no water for|without water|without', 'gaps', true],
    ['bike|bicycle|fahrrad|by bike|cycling|riding|places|place|spots|spot|somewhere|anywhere|options|option|nearest|closest|list|show me|find me|is there|are there|where is|where are|gibt es|wo ist', 'noise', true],
  ];
  const GLUE = new Set('a an the of on in at for to from and me please show find search look looking i want need some any along with by'.split(' '));
  const GENERIC = new Set('hotel camping col cime saint lac de du la le les sur arc fountain im mont cenis grand petit'.split(' '));

  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss')
    .replace(/[-–/,']/g, ' ').replace(/[^a-z0-9&.\s]/g, '').replace(/\bst\.?(?=\s|$)/g, 'saint').replace(/\./g, '').trim();
  const toks = (s) => (norm(s) ? norm(s).split(/\s+/) : []);

  const rules = WORDS.flatMap(([ph, field, value]) => ph.split('|').map((p) => ({ t: p.split(' '), field, value })))
    .sort((a, b) => b.t.length - a.t.length);
  const kindWords = rules.filter((r) => r.field === 'kind' && r.t.length === 1 && r.t[0].length >= 5);

  // Optimal string alignment distance, capped at 2: enough for a typo of one letter.
  function dist1(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 2;
    const d = [];
    for (let i = 0; i <= a.length; i++) { d[i] = [i]; for (let j = 1; j <= b.length; j++) d[i][j] = i ? 0 : j; }
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
      let c = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) c = Math.min(c, d[i - 2][j - 2] + 1);
      d[i][j] = c;
    }
    return d[a.length][b.length];
  }

  function matchRule(t, i, r) {
    for (let k = 0; k < r.t.length; k++) {
      const w = t[i + k]; if (w === undefined) return 0;
      if (r.t[k] === 'N' ? !/^\d+$/.test(w) : r.t[k] !== w) return 0;
    }
    return r.t.length;
  }

  const placeNames = (p) => [p.name, ...(p.alias || [])].map(toks);
  function matchPlace(t, i, ctx) {
    let best = null;
    for (const p of DATA.PLACES) for (const nt of placeNames(p)) {
      for (let j = 0; j < nt.length; j++) {
        let L = 0; while (t[i + L] !== undefined && nt[j + L] === t[i + L]) L++;
        const whole = L === nt.length && j === 0;
        const ok = L >= 2 || (L === 1 && (whole || (t[i].length >= 5 && !GENERIC.has(t[i]))));
        if (!ok) continue;
        const score = L * 10 + (whole ? 5 : 0) + (p.region === ctx.region || p.map === ctx.map || p.map === 'd4' && ctx.map === 'alps' ? 1 : 0);
        if (!best || score > best.score) best = { p, L, score };
      }
    }
    return best;
  }

  function parse(text, ctx) {
    const t = toks(text), n = t.length, used = new Array(n).fill(false), m = [];
    // 1. places first, longest span wins over a kind word of the same length
    for (let i = 0; i < n; i++) {
      if (used[i]) continue;
      const pl = matchPlace(t, i, ctx);
      let rule = null, rl = 0;
      for (const r of rules) { const L = matchRule(t, i, r); if (L > rl) { rule = r; rl = L; } }
      if (pl && pl.L >= Math.max(2, rl) || pl && pl.L === 1 && rl === 0) { m.push({ field: 'place', value: pl.p, i, L: pl.L }); used.fill(true, i, i + pl.L); i += pl.L - 1; continue; }
      if (rule) { m.push({ field: rule.field, value: rule.value, i, L: rl, t: t.slice(i, i + rl) }); used.fill(true, i, i + rl); i += rl - 1; continue; }
      if (t[i].length >= 5 && !/^\d+$/.test(t[i])) {              // a typo of one letter in a kind word
        const kw = kindWords.find((r) => dist1(t[i], r.t[0]) <= 1);
        if (kw) { m.push({ field: 'kind', value: kw.value, i, L: 1, typo: true }); used[i] = true; }
      }
    }
    // 2. leftover runs: glue is dropped silently, anything else is an "off" chip
    const orig = text.trim().split(/\s+/).filter(Boolean), src = [], off = [];
    orig.forEach((w, k) => toks(w).forEach(() => src.push(k)));
    for (let i = 0; i < n;) {
      if (used[i]) { i++; continue; }
      let j = i; while (j < n && !used[j]) j++;
      if (!t.slice(i, j).every((w) => GLUE.has(w))) off.push(src.length === n ? orig.slice(src[i], src[j - 1] + 1).join(' ') : t.slice(i, j).join(' '));
      i = j;
    }
    // 3. assemble the request
    const get = (f) => m.filter((x) => x.field === f);
    const req = { kinds: [], off, part: null, day: null, needDate: false, within: null, open: null, bike: null, goal: null, here: false, routeword: false, gaps: false };
    for (const k of get('kind')) for (const kk of (k.value === 'sleep' ? ['campsite', 'lodging'] : [k.value])) if (!req.kinds.includes(kk)) req.kinds.push(kk);
    const day = get('day')[0]; if (day) req.day = +day.t.find((w) => /^\d+$/.test(w));
    const rel = get('rel')[0];
    if (rel && !req.day) { if (ctx.hasDates) req.day = ctx.today + (rel.value === 'tomorrow' ? 1 : 0); else { req.needDate = true; req.relWord = rel.t.join(' '); } }
    if (req.day && !ctx.days.includes(req.day)) req.day = null;
    req.part = (get('part')[0] || {}).value || null;
    const within = get('within')[0]; if (within) req.within = +within.t.find((w) => /^\d+$/.test(w));
    req.here = get('here').length > 0;
    req.routeword = get('routeword').length > 0;
    req.gaps = get('gaps').length > 0;
    req.bike = (get('bike')[0] || {}).value || null;
    req.goal = (get('goal')[0] || {}).value || null;
    const wd = get('wd')[0];
    if (get('open').length || wd) req.open = wd ? { wd: wd.value } : { onDay: true };
    const w = get('where')[0]; req.whereWord = w ? w.value : null;
    // places with their role: the preposition just before the span
    req.places = get('place').map((pm) => {
      const prev = m.find((x) => x.i + x.L === pm.i && x.field === 'prep');
      return { place: pm.value, role: prev ? prev.value : (pm.i === 0 && n === pm.L ? 'bare' : 'bare') };
    });
    const withRole = (r) => (req.places.find((p) => p.role === r) || {}).place || null;
    req.via = withRole('via'); req.to = withRole('to'); req.near = withRole('near'); req.from = withRole('from');
    req.bare = (req.places.find((p) => p.role === 'bare') || {}).place || null;
    if (!req.near && get('prep').some((p) => p.value === 'near') && !req.kinds.length && req.bare) { req.near = req.bare; req.bare = null; }
    return decide(req, ctx);
  }

  // The request kind, in a fixed order of precedence.
  function decide(req, ctx) {
    const content = req.kinds.length || req.day || req.part || req.within || req.open || req.here || req.routeword || req.gaps || req.bike || req.goal || req.whereWord || req.places.length;
    if (req.via) req.kind = 'change', req.change = { type: 'visit', place: req.via };
    else if (req.part === 'end' && req.day && (req.near || req.to) && !req.kinds.length) req.kind = 'change', req.change = { type: 'dayend', day: req.day, place: req.near || req.to };
    else if (req.gaps) req.kind = 'gaps', req.gapKind = req.kinds.includes('shop') ? 'shop' : 'water';
    else if (req.kinds.length) req.kind = 'places';
    else if (req.to || (req.routeword && (req.bare || req.near)) || (req.bare && ctx.plan.kind === 'new' && !req.bare.ambiguous && !req.off.length && !req.day))
      req.kind = 'route', req.to = req.to || req.bare || req.near;
    else if ((req.bare || req.near) && !req.off.length) req.kind = 'place', req.place = req.bare || req.near;
    else if (req.routeword && req.here && !req.off.length) req.kind = 'route';
    else { req.kind = 'none'; req.place = req.bare || req.near || null; req.partial = !!content; }
    if (req.kind === 'route') { req.bike = req.bike || ctx.plan.bike; req.goal = req.goal || ctx.plan.goal; }
    return req;
  }

  // The "where" of a places request: sentence words first, then the pointed chip, then the map view.
  function where(req, ctx) {
    if (req.near) return { type: 'near', place: req.near };
    if (req.day) return { type: 'day', day: req.day, part: req.part || 'whole' };
    if (req.whereWord) return { type: req.whereWord };
    if (req.here && ctx.plan.here) return { type: 'here' };

   day. A day's figures come from the content sheet's base days, weighted by the share of each
   base day it covers (km share for distance, profile climb share for climb, a mix for time), so
   the sheet's figures hold at rest and move smoothly with a day end. The line never changes. */

const Trip = (() => {

  let lines = null, climb = null;

  function init() {
    const riding = BASE.filter((d) => !d.rest), b4 = BASE[3];
