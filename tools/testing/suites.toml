schema = 2

# What Cargo already knows is not written here. `cargo metadata` supplies every package,
# every dependency edge and every test binary, and `tools/test_plan.py` holds the CI job
# table. This file holds the two things neither can see: the path triggers and build
# commands of Cargo packages that other languages or tools reach, and the suites that no
# Cargo package owns.
#
# `route` says when a suite runs:
#   ordinary  selected by the change
#   required  runs whenever one of its jobs starts
#   manual    explicitly invoked only
#   live      contacts a live service, invoked by hand

# ── Cargo packages with facts Cargo cannot derive ───────────────────────────

# The vector files are a contract, not a dependency: a codec consumer never imports them. The About
# credits are tested against data/sources.toml, which obc-data embeds without a Cargo edge to it.
[[package]]
name = "obc-app"
triggers = ["specs/vectors/**", "data/sources.toml"]

# The captured planner export is under `fixtures/`, which already selects every unit that declares
# fixture inputs. Its SwiftPM duplicate is not, and only this suite holds the two identical.
[[package]]
name = "obc-route"
triggers = ["companion-ios/Packages/OBCKit/Sources/OBCMock/Fixtures/sample-import.gpx"]

[[package]]
name = "obc-formats"
route = "required"
triggers = ["specs/**"]

# The bake embeds the kind table and the road classes, and its codec test reads the shared vectors.
[[package]]
name = "obc-trailview-features"
triggers = ["data/trailview/kinds.json", "data/trailview/roads.json", "specs/vectors/trailview-features.*"]

[[package]]
name = "obc-link"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-dfu"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-ble"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-vectors"
route = "required"
triggers = ["specs/vectors/**"]

[[package]]
name = "obc-builder-bridge"
fixtures = true
triggers = ["specs/vectors/**", "builder/presets/**", "builder/wasm/tests/fixture/**"]

[[package]]
name = "obc-usb"
triggers = ["specs/flat-store-protocol.md", "specs/vectors/flat-store-v4/**"]

[[package]]
name = "obc-fixtures"
triggers = ["fixtures/catalog.toml"]

# The inspector reads the committed artefacts to prove it names them; no Cargo edge carries that.
[[package]]
name = "obc-inspect"
triggers = [
  "specs/vectors/**",
  "sim/desktop/assets/grimsel-demo.obcm",
  "fixtures/sources/sim-grimsel/routes/**",
]

[[package]]
name = "obc-sim"
triggers = ["fixtures/catalog.toml"]

# Both compile the shipped preset in with `include_str!` and own the guard that fails when the
# skin-preview fixture no longer matches it; obc-bake also reads data/regions/ and the corpus
# `tiny.osm.pbf`. No Cargo edge carries that.
[[package]]
name = "obc-bake"
triggers = ["builder/presets/**", "data/regions/**", "data/sources.toml", "builder/tests/corpus/data/tiny.osm.pbf"]

# Its tests load the checked-in registry and regions; no Cargo edge carries that.
[[package]]
name = "obc-data"
# A test validates the examples of the operator page against the schemas of `--json`.
triggers = ["data/**", "tools/basemap_tool.py", "specs/obc-data.md", "builder/web/test-support/data/**"]

# Its tests plan the checked-in live environment and run the Python steps.
[[package]]
name = "obc-data-steps"
triggers = [
  "data/**",
  ".python-version",
  "pyproject.toml",
  "uv.lock",
  "tools/step_request.py",
  "tools/step_pool.py",
  "tools/data_registry.py",
  "tools/planner_*.py",
  "tools/planner_mvt_verify.mjs",
  "planner/search/*.py",
  "planner/search/*.sql",
  "planner/search/web/address-terms.json",
  "planner/search/query/*.py",
  "planner/search/query/contract.json",
  "host/obc-search-bake/policy.py",
  "planner/search/place-kinds.json",
]

[[package]]
name = "obc-bench"
triggers = ["sim/bench/golden.txt"]

# Both write credits from data/sources.toml, which obc-data embeds without a Cargo edge to it.
[[package]]
name = "obc-pack"
triggers = ["builder/presets/**", "data/sources.toml"]

# The configuration tests load the shipped presets.
[[package]]
name = "obc-map-core"
triggers = ["builder/presets/**"]

[[package]]
name = "planner-router-build"
triggers = ["data/sources.toml"]

# Both read the checked-in assembly fixture, so a change under `fixtures/` reaches them.
[[package]]
name = "obcm-assemble"
fixtures = true
triggers = ["builder/wasm/tests/fixture/**"]

# The factory ride is built from the app's bundled route.
[[package]]
name = "obc-replay"
triggers = ["companion-ios/Packages/OBCKit/Sources/OBCFormats/Resources/grimsel-pass.gpx"]

# The board runs the host crate's detour and ride logic; no Cargo edge carries that.
[[package]]
name = "obc-host-core"
triggers = ["firmware/obc-fw-nrf54l/src/detour.rs", "firmware/obc-fw-nrf54l/src/flat_ride.rs", "firmware/obc-fw-nrf54l/src/factory_demo_ride.rs"]

# The answer encoder test reads the shared route answer vector; no Cargo edge carries that.
[[package]]
name = "planner-router"
triggers = ["specs/vectors/route-answer.json"]

[[package]]
name = "obc-ios-host"
triggers = [
  "sim/desktop/assets/grimsel-demo.obcm",
  "fixtures/sources/sim-grimsel/routes/grimsel-climb.obcr",
  "fixtures/sources/sim-grimsel/tracks/grimsel-climb.gpx",
]

# The standalone Cargo roots are not in the workspace nextest run, so each names the
# command a local `obc test affected` uses for it.
[[package]]
name = "obc-fw-nrf54l"
command = "cargo build --manifest-path firmware/obc-fw-nrf54l/Cargo.toml --release --locked"
triggers = ["rust-toolchain.toml"]
platforms = ["linux"]

[[package]]
name = "obc-sensor-sim"
command = "bash firmware/obc-sensor-sim/check.sh"
platforms = ["linux", "macos"]

[[package]]
name = "obc-boot"
command = "cargo build --manifest-path firmware/obc-boot/Cargo.toml --release --locked"
platforms = ["linux"]

[[package]]
name = "obc-desktop"
command = "cargo test --manifest-path builder/desktop/Cargo.toml --release --locked"
# A web change reaches the shell only as the bundle that desktop-frontend builds and checks.
triggers = ["planner/search/place-kinds.json"]

# ── Suites no Cargo package owns ────────────────────────────────────────────

[[suite]]
id = "web.demo-browser"
route = "ordinary"
command = "npm test --prefix sim/web-demo/tests/browser"
jobs = ["wasm"]
fixtures = ["embedded-demo-assets"]
platforms = ["linux", "macos"]
triggers = ["sim/web-demo/**", "sim/desktop/assets/**", "docs/index.html", "docs/Trunk.toml", "docs/assets/**", "docs/templates/**", "docs/build_docs.py"]

[[suite]]
id = "web.builder-vitest"
route = "ordinary"
command = "cd builder/web && npm test"
jobs = ["web"]
fixtures = ["checked-in-web-fixtures"]
triggers = [
  "planner/search/place-kinds.json",
  "docs/assets/theme.css", "docs/assets/fonts/**",
  "builder/web/**/*.test.ts",
  "builder/web/src/**",
  "builder/web/test-support/**",
  "builder/web/package.json",
  "builder/web/package-lock.json",
  "tools/planner_mvt_verify.mjs",
  # bins.test.ts reads the path widths of the bake.
  "host/obc-trailview-features/src/structures.rs",
  # bins.test.ts checks the stamp profiles of the road classes.
  "data/trailview/roads.json",
  "builder/web/vite.config.ts",
  "host/obc-map-core/schema/config.schema.json",
  "specs/vectors/**",
  "sim/flat-device/**",
  "planner/search/query/contract.json",
  # The web build embeds credits from it.
  "data/sources.toml",
]

# The whole app is the subject, the bridge fixture is the input, and the shared catalog
# generator is what publishes it. The schema examples are not here: this catalog is cut
# from the bridge fixture, and only the desktop smoke reads the examples.
[[suite]]
id = "web.verification"
route = "ordinary"
command = "npm run verify --prefix tools/verification"
jobs = ["verification"]
platforms = ["linux", "macos"]
triggers = ["tools/verification/**"]

[[suite]]
id = "web.builder-browser"
route = "ordinary"
command = "npm test --prefix builder/web/tests/browser"
jobs = ["web-browser"]
fixtures = ["checked-in-web-fixtures"]
platforms = ["linux", "macos"]
triggers = ["docs/assets/theme.css", "docs/assets/fonts/**", "builder/web/**", "builder/wasm/**", "tools/fixture_catalog.py"]

[[suite]]
id = "web.planner-requests"
route = "ordinary"
command = "npm run test:planner --prefix builder/web/tests/browser"
jobs = ["web-browser"]
platforms = ["linux", "macos"]
triggers = [
  "planner/search/place-kinds.json",
  "builder/web/src/components/planner/**",
  "builder/web/src/lib/planner/**",
  "builder/web/src/planner.ts",
  "builder/web/planner.html",
  "builder/web/tests/browser/planner/**",
  "builder/web/tests/browser/playwright.planner.config.js",
  "builder/web/tests/browser/package.json",
  "builder/web/package.json",
  "builder/web/vite.config.ts",
  "planner/search/query/contract.json",
]

[[suite]]
id = "web.data-page"
route = "ordinary"
command = "npm run test:data --prefix builder/web/tests/browser"
jobs = ["web-browser"]
platforms = ["linux", "macos"]
triggers = [
  "docs/assets/theme.css", "docs/assets/fonts/**",
  "builder/web/src/components/data/**",
  "builder/web/src/lib/data/**",
  "builder/web/src/lib/map/**",
  "builder/web/src/styles/tokens.css",
  "builder/web/src/styles/data.css",
  "builder/web/src/data.ts",
  "builder/web/data.html",
  "builder/web/test-support/data/**",
  "builder/web/tests/browser/data/**",
  "builder/web/tests/browser/playwright.data.config.js",
  "builder/web/tests/browser/package.json",
  "builder/web/package.json",
  "builder/web/vite.config.ts",
]

# Every WGSL file of the TrailView engine through naga, with its includes, without a GPU.
[[suite]]
id = "web.trailview-wgsl"
route = "ordinary"
command = "npm run check:wgsl --prefix builder/web"
jobs = ["web"]
platforms = ["linux", "macos"]
triggers = ["builder/web/src/lib/trailview/**/*.wgsl", "builder/web/src/lib/trailview/gpu/include.ts", "builder/web/scripts/check-wgsl.mjs", "builder/web/package.json"]

# The TrailView page on the checked-in fixture tiles, in Chromium with SwiftShader: one page load that
# draws with no WebGPU error and whose probe gives the height of an instance shader, and the snow mark of
# the ground worker. A test that draws for minutes on SwiftShader takes the tag @gpu (the crack and
# surface audits, the invariant audits of the stamps along the roads of a village and in a lake,
# debug=mask): pull requests skip it, `web.trailview-weekly` runs it.
[[suite]]
id = "web.trailview-smoke"
route = "ordinary"
command = "npm run test:trailview --prefix builder/web/tests/browser -- --grep-invert @gpu"
jobs = ["web-browser"]
platforms = ["linux", "macos"]
triggers = [
  "builder/web/src/lib/trailview/**",
  "builder/web/src/lib/planner/config.ts",
  "builder/web/src/lib/planner/release.ts",
  "builder/web/src/lib/planner/layers/archive.ts",
  "builder/web/src/lib/planner/layers/mercator.ts",
  "builder/web/src/lib/planner/solar.ts",
  "builder/web/src/lib/planner/layers/terrain.ts",
  "builder/web/src/trailview.ts",
  "builder/web/trailview.html",
  "builder/web/tests/browser/trailview/**",
  "builder/web/tests/browser/playwright.trailview.config.js",
  "builder/web/tests/browser/package.json",
  "builder/web/package.json",
  "builder/web/vite.config.ts",
]

# Every TrailView browser test, the @gpu ones too. `test-weekly.yml` runs it each Monday.
[[suite]]
id = "web.trailview-weekly"
route = "manual"
command = "npm run test:trailview --prefix builder/web/tests/browser"
platforms = ["linux", "macos"]
triggers = ["builder/web/tests/browser/trailview/**"]

# The job table is not derived from the builders it describes, so the unit tests that pin
# it against `build-wasm-bridges.sh` and the Trunk page are triggered by those files too.
# The `guards` job is unconditional, so they also run on every pull request regardless.
[[suite]]
id = "python.repository-tools"
route = "required"
command = "rm -rf .artifacts/python/repository-tools && uv run --locked --group dev --group planner-snow --group forest-reference python -m xmlrunner discover -s tools/tests -v -o .artifacts/python/repository-tools"
jobs = ["guards", "selection"]
triggers = [
  "planner/search/place-kinds.json",
  "pyproject.toml", "uv.lock",
  "tools/*.py",
  "tools/**/*.py",
  "tools/vps/deploy-services.sh",
  "hardware/bom.py",
  "docs/build_docs.py",
  # The planner tools read their credits and region boxes from them.
  "data/sources.toml",
  "data/regions/**",
  # planner_verify.py decodes the feature tiles.
  "specs/vectors/trailview-features.*",
  # The footers that test_data_registry.py compares with the registry.
  "docs/templates/*.html",
  "builder/web/src/App.svelte",
  "tools/testing/*.toml",
  "docs/testing.md",
  ".github/workflows/**",
  "builder/build-wasm-bridges.sh",
  "docs/index.html",
  "docs/Trunk.toml",
]

# The frame table and its manifest are inputs to this suite, not just its subjects:
# `test_ui_frames.py` reads both, and it is the only thing that catches a frame deleted together
# with its digest row — the frames a sweep renders are unchanged, so `ci.ui-snapshots` still
# passes.
[[suite]]
id = "python.firmware-tools"
route = "ordinary"
command = "rm -rf .artifacts/python/firmware-tools && uv run --locked --group dev --group planner-snow --group forest-reference python -m xmlrunner discover -s firmware/tools/tests -v -o .artifacts/python/firmware-tools"
jobs = ["test"]
triggers = [
  "pyproject.toml", "uv.lock",
  "firmware/tools/*.py",
  "firmware/tools/**/*.py",
  "firmware/ui-frames.toml",
  "firmware/ui-snapshots.sha256",
]

# The ingest tool needs rasterio and pyproj, which no other suite wants, so the suite runs
# under the locked uv group `terrain-reference`. The tests write their own rasters: no
# service, no credential and no captured fixture.
[[suite]]
id = "python.dem-reference"
route = "ordinary"
command = "rm -rf .artifacts/python/dem-reference && uv run --locked --group terrain-reference --group dev python -m xmlrunner discover -s host/obc-dem/reference/tests -v -o .artifacts/python/dem-reference"
jobs = ["test"]
triggers = ["host/obc-dem/reference/**", ".python-version", "pyproject.toml", "uv.lock",
  "data/sources.toml", "tools/data_registry.py", "tools/step_request.py"]

# The TrailView tools need rasterio, pyogrio and osmium, which no other suite wants, so the suite runs
# under the locked uv group `trailview`. The tests write their own rasters, read the ruleset of
# data/trailview/, the engine's tree and plant models that a pack may name and the captured service
# answers of fixtures/sources/trailview-ground/: no service.
[[suite]]
id = "python.trailview"
route = "ordinary"
command = "rm -rf .artifacts/python/trailview && uv run --locked --group trailview --group dev python -m xmlrunner discover -s tools/trailview/tests -v -o .artifacts/python/trailview"
jobs = ["test"]
triggers = ["tools/trailview/**", "data/trailview/**", "fixtures/sources/trailview-ground/**", "tools/planner_geo.py",
  "tools/step_pool.py", "tools/step_request.py", "tools/data_registry.py", "tools/planner_runtime.py", "data/sources.toml",
  "builder/web/src/lib/trailview/models/trees/**", "builder/web/src/lib/trailview/models/plants/**", "pyproject.toml", "uv.lock"]

[[suite]]
id = "python.builder"
route = "ordinary"
command = "rm -f .artifacts/python/builder.xml && PYTHONPATH=. uv run --locked --group builder-test python -m pytest builder/tests/ -v --junitxml=.artifacts/python/builder.xml"
jobs = ["builder-python"]
fixtures = ["builder-corpus"]
triggers = [
  "builder/tests/**",
  "builder/presets/**",
  "builder/server/*.py",
  "builder/server/**/*.py",
  "host/obc-map-core/schema/config.schema.json",
  "pyproject.toml", "uv.lock",
]

[[suite]]
id = "ios.replay-camera"
scoped = true
route = "ordinary"
command = "npm ci --prefix companion-ios/ReplayAssets && npm test --prefix companion-ios/ReplayAssets"
jobs = ["ios-unit"]
platforms = ["linux", "macos"]
triggers = ["builder/web/src/lib/planner/poi-kinds.*", "planner/search/place-kinds.json", "companion-ios/ReplayAssets/**", "companion-ios/Packages/OBCKit/Sources/OBCUI/Resources/Replay/**",
  # The replay-assets prepare step transpiles the web map style.
  "builder/web/src/lib/planner/map-style.ts", "data/sources.toml"]

[[suite]]
id = "swift.obckit-host"
scoped = true
rust_packages = ["obc-ios-host"]
rust_excludes = ["firmware/obc-app/src/harness/**"]
route = "ordinary"
command = "tools/build-ios-host.sh --mac-only && npm ci --prefix companion-ios/ReplayAssets && cd companion-ios/Packages/OBCKit && xcodebuild test -scheme OBCKit-Package -destination 'platform=macOS' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO"
jobs = ["ios-unit"]
fixtures = ["captured-met", "legacy-library"]
platforms = ["macos"]
triggers = [
  "builder/web/src/lib/planner/poi-kinds.*", "planner/search/place-kinds.json",
  "companion-ios/Packages/OBCKit/Package.swift",
  "tools/build-ios-host.sh",
  "companion-ios/Packages/OBCKit/Sources/**",
  "companion-ios/Packages/OBCKit/Tests/**",
  "companion-ios/ReplayAssets/prepare.mjs",
  # The replay-assets prepare step transpiles the web map style.
  "builder/web/src/lib/planner/map-style.ts",
  "data/sources.toml",
  "planner/search/query/contract.json",
  "specs/vectors/**",
]
# These tests wait on real time: condition polling has a 30-second default deadline, and
# negative observation windows and mock/model timing assertions use bounded real time.

[[suite]]
id = "ios.xcuitest"
scoped = true
route = "ordinary"
command = "companion-ios/scripts/capture-website-screenshots.sh --check"
jobs = ["ios-app"]
platforms = ["macos"]
triggers = [
  "companion-ios/scripts/generate-website-fixture.py",
  "companion-ios/scripts/capture-website-screenshots.sh",
  "companion-ios/OBCCompanionUITests/WebsiteScreenshotTests.swift",
  "companion-ios/OBCCompanion/**",
  "companion-ios/project.yml",
  "companion-ios/ReplayAssets/**",
  "companion-ios/Packages/OBCKit/Sources/**",
]

# ── Required CI validations that own no test source ─────────────────────────

[[suite]]
id = "ci.rust-workspace-tests"
route = "ordinary"
command = "obc check test"
jobs = ["desktop", "test"]
foundation = true
triggers = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "tools/fixtures.py"]

[[suite]]
