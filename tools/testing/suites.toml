jobs = ["test"]
fixtures = ["test"]
triggers = ["fixtures/catalog.toml", "tools/fixtures.py"]

[[suite]]
id = "ci.rust-format"
route = "required"
command = "obc check fmt"
jobs = ["fmt"]
foundation = true
triggers = [".rustfmt.toml"]

[[suite]]
id = "ci.rust-clippy"
route = "ordinary"
