# Generate the Xcode project with `xcodegen generate`; the .xcodeproj is not tracked.
name: QRFountain
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Decoding a large transfer in an unoptimised build stalls the camera feed.
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.openbikecomputer.spike.qrfountain
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: Scans the animated QR code on the sender page.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
targets:
  QRFountain:
    type: application
    platform: iOS
    sources: [QRFountain]
