[scenarios.grimsel]
summary = "Ride the full Grimsel climb with terrain-backed elevation"
packages = ["sim-grimsel"]
map = "sim-grimsel:grimsel.obcm"
gpx = "sim-grimsel:tracks/grimsel-climb.gpx"
routes_dir = "sim-grimsel:routes"

[scenarios.monaco-upahead]
summary = "Exercise dense urban POIs and route up-ahead in Monaco"
packages = ["sim-monaco"]
map = "sim-monaco:monaco.obcm"
gpx = "sim-monaco:tracks/monaco-upahead.gpx"

[profiles.sim]
summary = "Every currently registered simulator scenario"
scenarios = ["grimsel", "monaco-upahead"]

[profiles.weather]
summary = "All historical source captures used by the weather baker tests"
packages = ["weather-dwd-icon", "weather-noaa"]

[profiles.test]
summary = "All external fixture packages exercised by the full repository test suite"
scenarios = ["grimsel", "monaco-upahead"]
packages = ["weather-dwd-icon", "weather-noaa"]
