[packages.peak-view-photos]
summary = "Six Engelberg photographs, the skyline read off each, and the terrain shard Peak View is measured on"
archive = "packages/7a76a73505b4f6e88e93ea3f650d5a2d8d74daf468b52c75bd700b39994f3775.tar.gz"
sha256 = "7a76a73505b4f6e88e93ea3f650d5a2d8d74daf468b52c75bd700b39994f3775"
bytes = 19704660
provenance = "Six photographs taken near Engelberg by the owner, who also gave the four positions; EXIF stripped in transit, so the lens is fitted. Each skyline was read once from its photograph through a camera registered on 2 m swissALTI3D, and only the quarter-degree columns the reference agrees with within 0.5 degrees are kept. The OBCT v3 shard is Copernicus GLO-30 tiles N46_E007, N46_E008, N47_E007 and N47_E008 on the box 46.66,7.86,47.19,8.92, with swissALTI3D crest lifts from a 24-tile reference archive ingested 2026-09-21: 83,516 samples lifted, the largest by 391 m. Method, digests and per-view caveats: package README.md and fixtures/sources/peak-view/photos/README.md."
license = "CC-BY-4.0 (photographs, © Timo Hüser); Copernicus DEM Licence (terrain base); swisstopo open data, attribution required (swissALTI3D crest lifts); GPL-3.0-only (the read skylines). See package README.md."
tracked_sources = { "photos/hahnen.json" = "sources/peak-view/photos/hahnen.json", "photos/rigidalstock-from-brunni.json" = "sources/peak-view/photos/rigidalstock-from-brunni.json", "photos/urnerstaffel.json" = "sources/peak-view/photos/urnerstaffel.json", "photos/below-titlis.json" = "sources/peak-view/photos/below-titlis.json", "photos/below-west.json" = "sources/peak-view/photos/below-west.json", "photos/top-south.json" = "sources/peak-view/photos/top-south.json" }

