schema = 1
base_url = "https://fixtures.openbikecomputer.com/v1/"

# Package ids are stable logical names. The archive path, byte count, and digest
# pin one immutable revision; changing bytes means changing all three values.
[packages.sim-grimsel]
summary = "Full Grimsel simulator map, terrain, routes, and tracks"
archive = "packages/a312858b96c89b11b2ab9ef0b59e943a4a771d942efcd55e38d0de9d3a4ce6ff.tar.gz"
sha256 = "a312858b96c89b11b2ab9ef0b59e943a4a771d942efcd55e38d0de9d3a4ce6ff"
bytes = 3417577
provenance = "OBCM v14, packed from Switzerland OSM snapshot 2026-08-17; Copernicus GLO-30 terrain; authored Grimsel test routes. See fixtures/README.md."
license = "ODbL-1.0 (map); Copernicus data terms (terrain); GPL-3.0-only (authored routes/tracks)"
tracked_sources = { "tracks/grimsel-climb.gpx" = "sources/sim-grimsel/tracks/grimsel-climb.gpx", "routes/grimsel-climb.obcr" = "sources/sim-grimsel/routes/grimsel-climb.obcr", "routes/TP1.OBT" = "sources/sim-grimsel/routes/TP1.OBT" }

[packages.sim-peak-view]
summary = "Geographic terrain for the three Peak View simulator locations"
archive = "packages/7ceebbab297dc60efbdafdb8ee0aae9aa7406513f860fc04e001cdb3f5c57d9a.tar.gz"
sha256 = "7ceebbab297dc60efbdafdb8ee0aae9aa7406513f860fc04e001cdb3f5c57d9a"
bytes = 103131711
provenance = "Terrarium elevations read 2026-09-12. Three OBCT v3 geographic files with a full height pyramid, conservative maximum-height indices, and smooth-patch height and gradient error bounds. Gornergrat, Kleine Scheidegg, and Kaiser-Franz-Josefs-Hoehe. Generated by fixtures/generate_peak_view.py and obc-dem surface. No baked viewpoints or images."
license = "Mapzen elevation provider terms (EU-DEM, Copernicus, Austria open data, USGS); ODbL-1.0 (peak catalogue). See package README.md."
tracked_sources = { "locations.json" = "sources/peak-view/locations.json" }

[packages.sim-monaco]
summary = "Monaco POI-dense simulator map and up-ahead track"
archive = "packages/97f7c05195888cf1c5b19b85f0f59293b9c1c8ac5f4e60a271bcb02f0d305f57.tar.gz"
sha256 = "97f7c05195888cf1c5b19b85f0f59293b9c1c8ac5f4e60a271bcb02f0d305f57"
bytes = 442379
provenance = "OBCM v14, packed from Monaco OSM snapshot 2026-08-17, and an authored 2.7 km up-ahead track. See fixtures/README.md."
license = "ODbL-1.0 (map); GPL-3.0-only (authored track)"
tracked_sources = { "tracks/monaco-upahead.gpx" = "sources/sim-monaco/tracks/monaco-upahead.gpx" }

[scenarios.grimsel]
summary = "Ride the full Grimsel climb with terrain-backed elevation"
packages = ["sim-grimsel"]
map = "sim-grimsel:grimsel.obcm"
gpx = "sim-grimsel:tracks/grimsel-climb.gpx"
routes_dir = "sim-grimsel:routes"

[scenarios.monaco-upahead]
summary = "Exercise dense urban POIs and route up-ahead in Monaco"
packages = ["sim-monaco"]
map = "sim-monaco:monaco.obcm"
gpx = "sim-monaco:tracks/monaco-upahead.gpx"

[profiles.sim]
summary = "Every currently registered simulator scenario"
packages = ["sim-peak-view"]
scenarios = ["grimsel", "monaco-upahead"]

[profiles.test]
summary = "All external fixture packages exercised by the full repository test suite"
scenarios = ["grimsel", "monaco-upahead"]
packages = ["sim-peak-view"]
